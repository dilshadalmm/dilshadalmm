            async createMonthlyInvoices() {
                const hostellers = this.stateManager.getAllHostellers();
                const feeSettings = this.stateManager.getFeeSettings();
                
                if (hostellers.length === 0) {
                    this.stateManager.addAlert('warning', 'No hostellers found to create invoices for.');
                    this.renderDashboard();
                    return;
                }
                
                const monthlyFee = feeSettings?.monthlyFee || 12500;
                const currentDate = new Date();
                const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                const currentMonth = monthNames[currentDate.getMonth()];
                const currentYear = currentDate.getFullYear();
                
                // Calculate due date (10th of current month)
                const dueDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 10);
                
                // Show loading
                const createBtn = document.getElementById('create-monthly-invoices');
                const originalText = createBtn.innerHTML;
                createBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating Invoices...';
                createBtn.disabled = true;
                
                try {
                    let createdCount = 0;
                    let updatedCount = 0;
                    
                    for (const hosteller of hostellers) {
                        // Check if invoice already exists for this month
                        const existingInvoice = hosteller.invoices?.find(inv => 
                            inv.month === currentMonth && inv.year === currentYear
                        );
                        
                        if (!existingInvoice) {
                            // Create new invoice
                            const invoiceId = `INV-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                            const invoiceData = {
                                id: invoiceId,
                                month: currentMonth,
                                year: currentYear,
                                totalAmount: monthlyFee,
                                paidAmount: 0,
                                status: 'unpaid',
                                dueDate: firebase.firestore.Timestamp.fromDate(dueDate),
                                createdAt: firebase.firestore.Timestamp.now(),
                                updatedAt: firebase.firestore.Timestamp.now()
                            };
                            
                            // Save to Firestore
                            const invoicePath = `${this.stateManager.getInvoicesPath(hosteller.id)}/${invoiceId}`;
                            await this.db.doc(invoicePath).set(invoiceData);
                            
                            // Update local state
                            if (!hosteller.invoices) hosteller.invoices = [];
                            hosteller.invoices.push(invoiceData);
                            
                            createdCount++;
                        } else {
                            // Update existing invoice if needed
                            if (existingInvoice.totalAmount !== monthlyFee) {
                                const invoicePath = `${this.stateManager.getInvoicesPath(hosteller.id)}/${existingInvoice.id}`;
                                await this.db.doc(invoicePath).update({
                                    totalAmount: monthlyFee,
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                
                                existingInvoice.totalAmount = monthlyFee;
                                updatedCount++;
                            }
                        }
                    }
                    
                    // Update local state
                    this.stateManager.setAllHostellers(hostellers);
                    
                    // Show success message
                    this.stateManager.addAlert('success', `Successfully created ${createdCount} new invoices and updated ${updatedCount} existing invoices for ${currentMonth}, ${currentYear}.`);
                    
                    // Refresh dashboard
                    this.renderDashboard();
                    
                } catch (error) {
                    console.error("Error creating monthly invoices:", error);
                    this.stateManager.addAlert('error', 'Failed to create monthly invoices. Please try again.');
                    this.renderDashboard();
                } finally {
                    // Reset button
                    createBtn.innerHTML = originalText;
                    createBtn.disabled = false;
                }
            }
            
            async updateHostellerStatus(hostellerId, status) {
                try {
                    // Update in Firestore
                    const hostellerPath = this.stateManager.getHostellerPath(hostellerId);
                    await this.db.doc(hostellerPath).update({
                        status: status,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Update local state
                    const hostellers = this.stateManager.getAllHostellers();
                    const hostellerIndex = hostellers.findIndex(h => h.id === hostellerId);
                    if (hostellerIndex !== -1) {
                        hostellers[hostellerIndex].status = status;
                        this.stateManager.setAllHostellers(hostellers);
                    }
                    
                    // Show success message
                    this.stateManager.addAlert('success', `Hosteller status updated to ${status}.`);
                    
                    // Refresh current view
                    if (this.stateManager.getCurrentView() === 'newRegistrations') {
                        this.renderNewRegistrations();
                    } else if (this.stateManager.getCurrentView() === 'hostellers') {
                        this.renderHostellers();
                    } else {
                        this.renderDashboard();
                    }
                    
                } catch (error) {
                    console.error("Error updating hosteller status:", error);
                    this.stateManager.addAlert('error', 'Failed to update hosteller status.');
                }
            }
            
            async saveSettings() {
                const monthlyFee = parseFloat(document.getElementById('monthly-fee').value);
                const lateFeePenalty = parseFloat(document.getElementById('late-fee-penalty').value);
                const dueDateDay = parseInt(document.getElementById('due-date-day').value);
                
                if (!monthlyFee || monthlyFee <= 0) {
                    this.stateManager.addAlert('error', 'Please enter a valid monthly fee amount.');
                    return;
                }
                
                if (dueDateDay < 1 || dueDateDay > 31) {
                    this.stateManager.addAlert('error', 'Due date day must be between 1 and 31.');
                    return;
                }
                
                try {
                    const feeSettingsData = {
                        monthlyFee: monthlyFee,
                        lateFeePenalty: lateFeePenalty || 0,
                        dueDateDay: dueDateDay,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Save to Firestore
                    const feeSettingsPath = this.stateManager.getFeeSettingsPath();
                    await this.db.doc(feeSettingsPath).set(feeSettingsData, { merge: true });
                    
                    // Update local state
                    this.stateManager.setFeeSettings(feeSettingsData);
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'Fee settings saved successfully!');
                    
                    // Refresh settings view
                    this.renderSettings();
                    
                } catch (error) {
                    console.error("Error saving settings:", error);
                    this.stateManager.addAlert('error', 'Failed to save settings. Please try again.');
                }
            }
            
            async addPayCode() {
                const codeInput = document.getElementById('new-paycode-code');
                const descriptionInput = document.getElementById('new-paycode-description');
                
                const code = codeInput.value.trim();
                const description = descriptionInput.value.trim();
                
                if (!code) {
                    this.stateManager.addAlert('error', 'Please enter a pay code.');
                    return;
                }
                
                try {
                    const payCodeData = {
                        code: code,
                        description: description || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Save to Firestore
                    const payCodesPath = this.stateManager.getPayCodesPath();
                    const newPayCodeRef = await this.db.collection(payCodesPath).add(payCodeData);
                    
                    // Update local state
                    const payCodes = this.stateManager.getPayCodes();
                    payCodes.push({
                        id: newPayCodeRef.id,
                        ...payCodeData
                    });
                    this.stateManager.setPayCodes(payCodes);
                    
                    // Clear inputs
                    codeInput.value = '';
                    descriptionInput.value = '';
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'PayCode added successfully!');
                    
                    // Refresh settings view
                    this.renderSettings();
                    
                } catch (error) {
                    console.error("Error adding pay code:", error);
                    this.stateManager.addAlert('error', 'Failed to add pay code. Please try again.');
                }
            }
            
            async deletePayCode(payCodeId) {
                if (!confirm('Are you sure you want to delete this pay code?')) {
                    return;
                }
                
                try {
                    // Delete from Firestore
                    const payCodePath = `${this.stateManager.getPayCodesPath()}/${payCodeId}`;
                    await this.db.doc(payCodePath).delete();
                    
                    // Update local state
                    const payCodes = this.stateManager.getPayCodes();
                    const updatedPayCodes = payCodes.filter(pc => pc.id !== payCodeId);
                    this.stateManager.setPayCodes(updatedPayCodes);
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'PayCode deleted successfully!');
                    
                    // Refresh settings view
                    this.renderSettings();
                    
                } catch (error) {
                    console.error("Error deleting pay code:", error);
                    this.stateManager.addAlert('error', 'Failed to delete pay code. Please try again.');
                }
            }
            
            handlePaginationClick(direction) {
                if (this.stateManager.getCurrentView() === 'hostellers') {
                    if (direction === 'prev') {
                        if (this.stateManager.currentHostellerPage > 0) {
                            this.stateManager.currentHostellerPage--;
                            this.renderHostellers();
                        }
                    } else if (direction === 'next') {
                        const hostellers = this.stateManager.getAllHostellers();
                        const filteredHostellers = this.stateManager.hostellerSearch ? 
                            hostellers.filter(h => 
                                h.name?.toLowerCase().includes(this.stateManager.hostellerSearch) || 
                                h.id?.toLowerCase().includes(this.stateManager.hostellerSearch) ||
                                h.phoneNumber?.includes(this.stateManager.hostellerSearch) ||
                                h.status?.toLowerCase().includes(this.stateManager.hostellerSearch)
                            ) : hostellers;
                        const totalPages = Math.ceil(filteredHostellers.length / this.stateManager.itemsPerPage);
                        
                        if (this.stateManager.currentHostellerPage < totalPages - 1) {
                            this.stateManager.currentHostellerPage++;
                            this.renderHostellers();
                        }
                    }
                } else if (this.stateManager.getCurrentView() === 'allPayments') {
                    if (direction === 'prev') {
                        if (this.stateManager.currentPaymentPage > 0) {
                            this.stateManager.currentPaymentPage--;
                            this.renderAllPayments();
                        }
                    } else if (direction === 'next') {
                        const payments = this.stateManager.getAllPayments();
                        const filteredPayments = this.stateManager.paymentSearch ? 
                            payments.filter(p => 
                                p.hostellerName?.toLowerCase().includes(this.stateManager.paymentSearch) || 
                                p.hostellerId?.toLowerCase().includes(this.stateManager.paymentSearch) ||
                                (p.transactionCode && p.transactionCode.toLowerCase().includes(this.stateManager.paymentSearch)) ||
                                p.paymentMethod?.toLowerCase().includes(this.stateManager.paymentSearch)
                            ) : payments;
                        const totalPages = Math.ceil(filteredPayments.length / this.stateManager.itemsPerPage);
                        
                        if (this.stateManager.currentPaymentPage < totalPages - 1) {
                            this.stateManager.currentPaymentPage++;
                            this.renderAllPayments();
                        }
                    }
                }
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new AdminApp();
        });
        
        window.app = app;
    </script>
</body>
</html>
