            renderStudentInvoices(invoices) {
                if (invoices.length === 0) {
                    return '<p class="text-gray-500">No invoices found for this student.</p>';
                }
                
                // Group invoices by month and year
                const monthOrder = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                const invoiceMap = new Map();
                
                invoices.forEach(invoice => {
                    if (invoice.month && invoice.year) {
                        const key = `${invoice.month}-${invoice.year}`;
                        if (!invoiceMap.has(key)) {
                            invoiceMap.set(key, invoice);
                        }
                    }
                });
                
                // Convert map to array and sort by year and month
                const sortedInvoices = Array.from(invoiceMap.values()).sort((a, b) => {
                    if (a.year !== b.year) return b.year - a.year;
                    return monthOrder.indexOf(b.month) - monthOrder.indexOf(a.month);
                });
                
                let html = '<div class="space-y-3">';
                
                sortedInvoices.forEach(invoice => {
                    const dueDate = invoice.dueDate?.toDate ? new Date(invoice.dueDate.toDate()) : new Date();
                    const paidAmount = invoice.paidAmount || 0;
                    const balanceDue = invoice.balanceDue || (invoice.totalAmount - paidAmount);
                    const status = invoice.status || 'unpaid';
                    const statusClass = status === 'paid' ? 'status-paid' : 
                                      status === 'partially_paid' ? 'status-partial' : 'status-unpaid';
                    const statusText = status === 'partially_paid' ? 'Partial' : status;
                    
                    html += `
                        <div class="flex justify-between items-center p-3 bg-white border border-gray-200">
                            <div>
                                <div class="font-medium">${invoice.month || 'Unknown'}, ${invoice.year || 'Unknown'}</div>
                                <div class="text-sm text-gray-500">
                                    Due: ${dueDate.toLocaleDateString()}
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold">Rs. ${(invoice.totalAmount || 0).toLocaleString()}</div>
                                <div class="text-sm">
                                    <span class="${statusClass} status-badge">${statusText}</span>
                                    ${balanceDue > 0 ? `<div class="text-red-600">Balance Due: Rs. ${balanceDue.toLocaleString()}</div>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                return html;
            }
            
            // ===== PAYMENT METHODS =====
            async updatePaymentForStudent() {
                const studentId = document.getElementById('student-id').value.trim();
                const amountInput = document.getElementById('pay-amount').value.trim();
                const paymentMethod = document.getElementById('payment-method').value;
                const transactionCode = document.getElementById('transaction-code').value.trim();
                const statusDiv = document.getElementById('payment-status');
                const payBtn = document.getElementById('pay-btn');
                
                if (!studentId) {
                    statusDiv.innerText = "Please enter a Student ID.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                if (!amountInput || parseFloat(amountInput) <= 0) {
                    statusDiv.innerText = "Please enter a valid amount.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                const amount = parseFloat(amountInput);
                
                // Find the student
                const students = this.stateManager.getAllStudents();
                const student = students.find(s => s.id === studentId);
                
                if (!student) {
                    statusDiv.innerText = "Student not found. Please check the Student ID.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                payBtn.disabled = true;
                payBtn.innerText = "Processing...";
                statusDiv.innerText = `Updating payment for ${student.fullName || student.name}...`;
                statusDiv.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-200');
                statusDiv.classList.add('bg-blue-50', 'text-blue-800', 'border-blue-200');
                statusDiv.classList.remove('hidden');
                
                try {
                    // Get current month and year
                    const currentDate = new Date();
                    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                    const currentMonth = monthNames[currentDate.getMonth()];
                    const currentYear = currentDate.getFullYear();
                    
                    // Check if invoice exists for current month
                    let invoice = student.invoices?.find(inv => 
                        inv.month === currentMonth && inv.year === currentYear
                    );
                    
                    let invoiceId;
                    
                    // Get fee settings for the class
                    const feeSettings = this.stateManager.getFeeSettings();
                    const classFee = feeSettings?.classes?.[student.classId]?.monthlyFee || 5000;
                    
                    // Calculate past due amount
                    const previousInvoices = student.invoices?.filter(inv => {
                        if (!inv.year || !inv.month) return false;
                        const invoiceDate = new Date(inv.year, monthNames.indexOf(inv.month));
                        const current = new Date(currentYear, currentDate.getMonth());
                        return invoiceDate < current;
                    }) || [];
                    
                    let totalPastDueAmount = 0;
                    previousInvoices.forEach(inv => {
                        const balanceDue = inv.balanceDue || (inv.totalAmount - (inv.paidAmount || 0));
                        if (balanceDue > 0) {
                            totalPastDueAmount += balanceDue;
                        }
                    });
                    
                    // Determine how to allocate payment
                    let remainingPayment = amount;
                    let appliedToPastDue = 0;
                    
                    // First apply to past due invoices
                    if (totalPastDueAmount > 0 && remainingPayment > 0) {
                        const sortedPreviousInvoices = [...previousInvoices].sort((a, b) => {
                            const monthOrder = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                            if (a.year !== b.year) return a.year - b.year;
                            return monthOrder.indexOf(a.month) - monthOrder.indexOf(b.month);
                        });
                        
                        for (const pastInvoice of sortedPreviousInvoices) {
                            if (remainingPayment <= 0) break;
                            
                            const balanceDue = pastInvoice.balanceDue || (pastInvoice.totalAmount - (pastInvoice.paidAmount || 0));
                            if (balanceDue > 0) {
                                const toPay = Math.min(remainingPayment, balanceDue);
                                const newPaidAmount = (pastInvoice.paidAmount || 0) + toPay;
                                const newBalanceDue = balanceDue - toPay;
                                const newStatus = newBalanceDue <= 0 ? 'paid' : 'partially_paid';
                                
                                // Update past due invoice in Firestore
                                const pastInvoicePath = `${this.stateManager.getInvoicesPath(student.classId, student.documentId)}/${pastInvoice.id}`;
                                await this.db.doc(pastInvoicePath).update({
                                    paidAmount: newPaidAmount,
                                    balanceDue: newBalanceDue,
                                    status: newStatus,
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                
                                // Create payment record for past due
                                const paymentId = `PAY-${Date.now()}-PAST-${Math.random().toString(36).substr(2, 4)}`;
                                const paymentData = {
                                    id: paymentId,
                                    amountPaid: toPay,
                                    dateTime: firebase.firestore.Timestamp.now(),
                                    invoiceId: pastInvoice.id,
                                    invoiceMonth: `${pastInvoice.month}, ${pastInvoice.year}`,
                                    paymentMethod: paymentMethod,
                                    transactionCode: transactionCode || `ADMIN-${Date.now()}`,
                                    createdAt: firebase.firestore.Timestamp.now(),
                                    studentName: student.fullName || student.name,
                                    studentId: studentId,
                                    className: student.className,
                                    isPastDuePayment: true
                                };
                                
                                const paymentDocPath = `${this.stateManager.getPaymentsPath(student.classId, student.documentId)}/${paymentId}`;
                                await this.db.doc(paymentDocPath).set(paymentData);
                                
                                // Update local state
                                const updatedPayments = this.stateManager.getAllPayments();
                                updatedPayments.unshift(paymentData);
                                this.stateManager.setAllPayments(updatedPayments);
                                
                                appliedToPastDue += toPay;
                                remainingPayment -= toPay;
                                
                                // Update local invoice
                                pastInvoice.paidAmount = newPaidAmount;
                                pastInvoice.balanceDue = newBalanceDue;
                                pastInvoice.status = newStatus;
                            }
                        }
                    }
                    
                    // Now handle current month invoice
                    if (remainingPayment > 0) {
                        if (!invoice) {
                            // Create new invoice
                            invoiceId = `INV-${Date.now()}`;
                            const balanceDue = classFee - remainingPayment;
                            const newInvoice = {
                                id: invoiceId,
                                month: currentMonth,
                                year: currentYear,
                                totalAmount: classFee,
                                paidAmount: remainingPayment,
                                balanceDue: balanceDue,
                                status: balanceDue <= 0 ? 'paid' : 'partially_paid',
                                dueDate: firebase.firestore.Timestamp.fromDate(new Date(currentDate.getFullYear(), currentDate.getMonth(), 10)),
                                createdAt: firebase.firestore.Timestamp.now(),
                                updatedAt: firebase.firestore.Timestamp.now()

                            // Save invoice to Firestore
                            const invoicePath = `${this.stateManager.getInvoicesPath(student.classId, student.documentId)}/${invoiceId}`;

                            invoice = newInvoice;
                        } else {
                            // Update existing invoice
                            invoiceId = invoice.id;
                            const newPaidAmount = (invoice.paidAmount || 0) + remainingPayment;
                            const newBalanceDue = (invoice.totalAmount || 0) - newPaidAmount;
                            const newStatus = newBalanceDue <= 0 ? 'paid' : 
                                             newPaidAmount > 0 ? 'partially_paid' : 'unpaid';
                            
                            // Update invoice in Firestore
                            const invoicePath = `${this.stateManager.getInvoicesPath(student.classId, student.documentId)}/${invoiceId}`;
                            await this.db.doc(invoicePath).update({
                                paidAmount: newPaidAmount,

                                status: newStatus,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            
                            invoice.paidAmount = newPaidAmount;
                            invoice.balanceDue = newBalanceDue;
                            invoice.status = newStatus;
                        }
                        
                        // Create payment record for current month
                        const paymentId = `PAY-${Date.now()}`;
                        const paymentData = {
                            id: paymentId,

                        // Update local state
                        const updatedPayments = this.stateManager.getAllPayments();
                        updatedPayments.unshift(paymentData);

                    }
                    
                    // Update student's invoices in local state

                    const studentIndex = updatedStudents.findIndex(s => s.id === studentId);
                    if (studentIndex !== -1) {

            makeCellEditable(cell, studentId, subjectName, field) {
                const currentValue = cell.textContent.trim();
                
                // Create input element
                const input = document.createElement('input');
                input.type = 'text';
                input.value = currentValue;
                input.className = 'editable-input';
                
                // Replace cell content with input
                cell.innerHTML = '';
                cell.appendChild(input);
                input.focus();
                
                // Save on Enter, blur on Escape
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        this.saveCellValue(cell, studentId, subjectName, field, input.value);
                    } else if (e.key === 'Escape') {
                        cell.textContent = currentValue;
                    }
                });
                
                input.addEventListener('blur', () => {
                    this.saveCellValue(cell, studentId, subjectName, field, input.value);
                });
            }
            
            saveCellValue(cell, studentId, subjectName, field, value) {
                // Store the value in state manager's editable cells
                if (!this.stateManager.editableCells[studentId]) {
                    this.stateManager.editableCells[studentId] = {};
                }
                if (!this.stateManager.editableCells[studentId][subjectName]) {
                    this.stateManager.editableCells[studentId][subjectName] = {};
                }
                
                this.stateManager.editableCells[studentId][subjectName][field] = value;
                
                // Update cell display
                cell.textContent = value;
                
                // Apply grade class if it's a grade field
                if (field === 'theory' || field === 'practical' || field === 'finalGrade') {
                    const gradeClass = this.getGradeClass(value);
                    cell.className = `grid-cell editable-cell ${gradeClass}`;
                } else {
                    cell.className = 'grid-cell editable-cell';
                }
                
                // Update data attributes
                cell.dataset.studentId = studentId;
                cell.dataset.subjectName = subjectName;
                cell.dataset.field = field;
            }
            
            async saveExamScores() {
                const examId = this.stateManager.getEditingExam();
                const classId = this.stateManager.getEditingClass();
                const editableCells = this.stateManager.editableCells;
                
                if (!examId || !classId || Object.keys(editableCells).length === 0) {
                    this.stateManager.addAlert('warning', 'No changes to save.');
                    return;
                }
                
                try {
                    // Get grade scale for GPA calculation
                    const gradeScale = this.stateManager.getGradeScale();
                    
                    // Process each student's scores
                    for (const studentId in editableCells) {
                        const studentScores = editableCells[studentId];
                        let totalGradePoints = 0;
                        let totalSubjects = 0;
                        let passed = true;
                        
                        // Process each subject
                        for (const subjectName in studentScores) {
                            const subjectScores = studentScores[subjectName];
                            const theoryGrade = subjectScores.theory || '';
                            const practicalGrade = subjectScores.practical || '';
                            
                            // Determine final grade (this is simplified - you might want more complex logic)
                            let finalGrade = theoryGrade;
                            if (practicalGrade && practicalGrade !== 'N/A') {
                                // Combine theory and practical grades
                                finalGrade = this.combineGrades(theoryGrade, practicalGrade);
                            }
                            
                            // Calculate grade point
                            const gradePoint = this.calculateGradePoint(finalGrade, gradeScale);
                            
                            if (finalGrade === 'NG') {
                                passed = false;
                            }
                            
                            if (gradePoint !== null) {
                                totalGradePoints += gradePoint;
                                totalSubjects++;
                            }
                            
                            // Prepare subject data for Firestore
                            const subjectData = {
                                sn: totalSubjects,
                                subjectName: this.getSubjectName(subjectName),
                                creditHours: 4.0, // Default value
                                obtainedGrade: {
                                    theory: theoryGrade,
                                    practical: practicalGrade
                                },
                                finalGrade: finalGrade,
                                gradePoint: gradePoint || 0,
                                remarks: ''
                            };
                            
                            // Save subject data to Firestore
                            const subjectPath = `${this.stateManager.getExamSubjectsPath(examId, studentId)}/${subjectName}`;
                            await this.db.doc(subjectPath).set(subjectData, { merge: true });
                        }
                        
                        // Calculate GPA
                        const gpa = totalSubjects > 0 ? (totalGradePoints / totalSubjects).toFixed(2) : '0.00';
                        const finalResult = passed ? 'PASS' : 'FAIL';
                        
                        // Update student exam record
                        const studentUpdate = {
                            totalSubjects: totalSubjects,
                            gpa: parseFloat(gpa),
                            finalResult: finalResult,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        
                        const studentPath = `${this.stateManager.getExamStudentsPath(examId)}/${studentId}`;
                        await this.db.doc(studentPath).update(studentUpdate);
                    }
                    
                    // Clear editable cells
                    this.stateManager.editableCells = {};
                    this.stateManager.setEditingExam(null);
                    this.stateManager.setEditingClass(null);
                    
                    this.stateManager.addAlert('success', 'Exam scores saved successfully!');
                    this.renderExamAdministration();
                    
                } catch (error) {
                    console.error("Error saving exam scores:", error);
                    this.stateManager.addAlert('error', 'Failed to save exam scores. Please try again.');
                }
            }
            
            combineGrades(theoryGrade, practicalGrade) {
                // Simple grade combination logic
                // In a real system, this would be more complex
                const grades = ['NG', 'D+', 'C', 'C+', 'B', 'B+', 'A', 'A+'];
                const theoryIndex = grades.indexOf(theoryGrade);
                const practicalIndex = grades.indexOf(practicalGrade);
                
                if (theoryIndex === -1 || practicalIndex === -1) {
                    return theoryGrade || practicalGrade;
                }
                
                // Take the higher grade
                return grades[Math.max(theoryIndex, practicalIndex)];
            }
            
            calculateGradePoint(grade, gradeScale) {
                if (!grade || !gradeScale) return null;
                
                const scaleItem = gradeScale.find(g => g.grade === grade);
                return scaleItem ? scaleItem.gradePoint : null;
            }
            
            getSubjectName(subjectId) {
                const subjectNames = {
                    'english': 'Compulsory English',
                    'nepali': 'Compulsory Nepali',
                    'math': 'Compulsory Mathematics',
                    'science': 'Compulsory Science',
                    'social': 'Social Studies',
                    'account': 'Optional I (Account)',
                    'computer': 'Optional II (Computer)'
                };
                
                return subjectNames[subjectId] || subjectId;
            }

                        dateOfAdmission: admissionDate || null,
                        fatherName: fatherName || null,
                        motherName: motherName || null,
                        guardianPhone: guardianPhone || null,
                        guardianOccupation: guardianOccupation || null,
                        emergencyContact: {
                            name: emergencyName || null,
                            phone: emergencyPhone || null,
                            relationship: emergencyRelation || null
                        },
                        status: 'approved', // Auto-approve manual registrations
                        createdAt: firebase.firestore.Timestamp.now(),
                        updatedAt: firebase.firestore.Timestamp.now()
                    };
                    
                    // Get class name
                    const classes = this.stateManager.getClasses();
                    const classObj = classes.find(c => c.id === classId);
                    const className = classObj?.name || classId;
                    
                    // Save to Firestore
                    const studentsPath = this.stateManager.getStudentsPath(classId);
                    const studentRef = await this.db.collection(studentsPath).add({
                        profile: studentData
                    });
                    
                    // Update local state
                    const newStudent = {
                        ...studentData,
                        className: className,
                        documentId: studentRef.id,
                        invoices: [],
                        payments: []
                    };
                    
                    const updatedStudents = this.stateManager.getAllStudents();
                    updatedStudents.push(newStudent);
                    this.stateManager.setAllStudents(updatedStudents);
                    
                    // Reset form
                    document.getElementById('manual-registration-form').reset();
                    
                    this.stateManager.addAlert('success', `Student "${fullName}" registered successfully with ID: ${studentId}`);
                    this.renderManualRegistration();
                    
                } catch (error) {
                    console.error("Error adding manual registration:", error);
                    this.stateManager.addAlert('error', 'Failed to register student. Please try again.');
                }
            }
            
            // ===== OTHER METHODS =====
            async createMonthlyInvoices() {
                const students = this.stateManager.getAllStudents();
                const feeSettings = this.stateManager.getFeeSettings();
                
                if (students.length === 0) {
                    this.stateManager.addAlert('warning', 'No students found to create invoices for.');
                    this.renderDashboard();
                    return;
                }
                
                const currentDate = new Date();
                const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                const currentMonth = monthNames[currentDate.getMonth()];
                const currentYear = currentDate.getFullYear();
                
                // Calculate due date (10th of current month)
                const dueDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 10);
                
                // Show loading
                const createBtn = document.getElementById('create-monthly-invoices');
                const originalText = createBtn.innerHTML;
                createBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating Invoices...';
                createBtn.disabled = true;
                
                try {
                    let createdCount = 0;
                    let updatedCount = 0;
                    
                    for (const student of students) {
                        // Get fee for student's class
                        const classFee = feeSettings?.classes?.[student.classId]?.monthlyFee || 5000;
                        
                        // Check if invoice already exists for this month
                        const existingInvoice = student.invoices?.find(inv => 
                            inv.month === currentMonth && inv.year === currentYear
                        );
                        
                        if (!existingInvoice) {
                            // Create new invoice
                            const invoiceId = `INV-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                            const invoiceData = {
                                id: invoiceId,
                                month: currentMonth,
                                year: currentYear,
                                totalAmount: classFee,
                                paidAmount: 0,
                                balanceDue: classFee,
                                status: 'unpaid',
                                dueDate: firebase.firestore.Timestamp.fromDate(dueDate),
                                createdAt: firebase.firestore.Timestamp.now(),
                                updatedAt: firebase.firestore.Timestamp.now()
                            };
                            
                            // Save to Firestore
                            const invoicePath = `${this.stateManager.getInvoicesPath(student.classId, student.documentId)}/${invoiceId}`;
                            await this.db.doc(invoicePath).set(invoiceData);
                            
                            // Update local state
                            if (!student.invoices) student.invoices = [];
                            student.invoices.push(invoiceData);
                            
                            createdCount++;
                        } else {
                            // Update existing invoice if needed
                            if (existingInvoice.totalAmount !== classFee) {
                                const newBalanceDue = classFee - (existingInvoice.paidAmount || 0);
                                const invoicePath = `${this.stateManager.getInvoicesPath(student.classId, student.documentId)}/${existingInvoice.id}`;
                                await this.db.doc(invoicePath).update({
                                    totalAmount: classFee,
                                    balanceDue: newBalanceDue,
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                
                                existingInvoice.totalAmount = classFee;
                                existingInvoice.balanceDue = newBalanceDue;
                                updatedCount++;
                            }
                        }
                    }
                    
                    // Update local state
                    this.stateManager.setAllStudents(students);
                    
                    // Show success message
                    this.stateManager.addAlert('success', `Successfully created ${createdCount} new invoices and updated ${updatedCount} existing invoices for ${currentMonth}, ${currentYear}.`);
                    
                    // Refresh dashboard
                    this.renderDashboard();
                    
                } catch (error) {
                    console.error("Error creating monthly invoices:", error);
                    this.stateManager.addAlert('error', 'Failed to create monthly invoices. Please try again.');
                    this.renderDashboard();
                } finally {
                    // Reset button
                    createBtn.innerHTML = originalText;
                    createBtn.disabled = false;
                }
            }
            
            async updateStudentStatus(studentId, status) {
                try {
                    // Find student
                    const students = this.stateManager.getAllStudents();
                    const student = students.find(s => s.id === studentId);
                    
                    if (!student) {
                        this.stateManager.addAlert('error', 'Student not found.');
                        return;
                    }
                    
                    // Update in Firestore
                    const studentProfilePath = this.stateManager.getStudentProfilePath(student.classId, student.documentId);
                    await this.db.doc(studentProfilePath).update({
                        status: status,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Update local state
                    const studentIndex = students.findIndex(s => s.id === studentId);
                    if (studentIndex !== -1) {
                        students[studentIndex].status = status;
                        this.stateManager.setAllStudents(students);
                    }
                    
                    // Show success message
                    this.stateManager.addAlert('success', `Student status updated to ${status}.`);
                    
                    // Refresh current view
                    if (this.stateManager.getCurrentView() === 'newRegistrations') {
                        this.renderNewRegistrations();
                    } else if (this.stateManager.getCurrentView() === 'students') {
                        this.renderStudents();
                    } else {
                        this.renderDashboard();
                    }
                    
                } catch (error) {
                    console.error("Error updating student status:", error);
                    this.stateManager.addAlert('error', 'Failed to update student status.');
                }
            }
            
            async saveSettings() {
                const portalTitle = document.getElementById('portal-title').value.trim();
                const profileUrl = document.getElementById('profile-url').value.trim();
                
                if (!portalTitle) {
                    this.stateManager.addAlert('error', 'Please enter a portal title.');
                    return;
                }
                
                try {
                    // Get class fees
                    const classes = this.stateManager.getClasses();
                    const classFees = {};
                    
                    classes.forEach(classObj => {
                        const feeInput = document.getElementById(`class-fee-${classObj.id}`);
                        if (feeInput && feeInput.value) {
                            classFees[classObj.id] = {
                                monthlyFee: parseFloat(feeInput.value)
                            };
                        }
                    });
                    
                    const feeSettingsData = {
                        title: portalTitle,
                        profileUrl: profileUrl,
                        classes: classFees,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Save to Firestore
                    const feeSettingsPath = this.stateManager.getFeeSettingsPath();
                    await this.db.doc(feeSettingsPath).set(feeSettingsData, { merge: true });
                    
                    // Update local state
                    this.stateManager.setFeeSettings(feeSettingsData);
                    
                    // Update UI
                    this.updateTopBarTitle();
                    this.updateProfileImage();
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'Settings saved successfully!');
                    
                    // Refresh settings view
                    this.renderSettings();
                    
                } catch (error) {
                    console.error("Error saving settings:", error);
                    this.stateManager.addAlert('error', 'Failed to save settings. Please try again.');
                }
            }
            
            async addPayCode() {
                const codeInput = document.getElementById('new-paycode-code');
                const valueInput = document.getElementById('new-paycode-value');
                
                const code = codeInput.value.trim();
                const value = parseFloat(valueInput.value);
                
                if (!code) {
                    this.stateManager.addAlert('error', 'Please enter a pay code.');
                    return;
                }
                
                if (!value || value <= 0) {
                    this.stateManager.addAlert('error', 'Please enter a valid pay code value.');
                    return;
                }
                
                try {
                    const payCodeData = {
                        code: code,
                        value: value,
                        valid: true,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Save to Firestore
                    const payCodesPath = this.stateManager.getPayCodesPath();
                    const newPayCodeRef = await this.db.collection(payCodesPath).add(payCodeData);
                    
                    // Update local state
                    const payCodes = this.stateManager.getPayCodes();
                    payCodes.push({
                        id: newPayCodeRef.id,
                        ...payCodeData
                    });
                    this.stateManager.setPayCodes(payCodes);
                    
                    // Clear inputs
                    codeInput.value = '';
                    valueInput.value = '';
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'PayCode added successfully!');
                    
                    // Refresh settings view
                    this.renderSettings();
                    
                } catch (error) {
                    console.error("Error adding pay code:", error);
                    this.stateManager.addAlert('error', 'Failed to add pay code. Please try again.');
                }
            }
            
            async deletePayCode(payCodeId) {
                if (!confirm('Are you sure you want to delete this pay code?')) {
                    return;
                }
                
                try {
                    // Delete from Firestore
                    const payCodePath = `${this.stateManager.getPayCodesPath()}/${payCodeId}`;
                    await this.db.doc(payCodePath).delete();
                    
                    // Update local state
                    const payCodes = this.stateManager.getPayCodes();
                    const updatedPayCodes = payCodes.filter(pc => pc.id !== payCodeId);
                    this.stateManager.setPayCodes(updatedPayCodes);
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'PayCode deleted successfully!');
                    
                    // Refresh settings view
                    this.renderSettings();
                    
                } catch (error) {
                    console.error("Error deleting pay code:", error);
                    this.stateManager.addAlert('error', 'Failed to delete pay code. Please try again.');
                }
            }
            
            async togglePayCodeValid(payCodeId) {
                try {
                    const payCodes = this.stateManager.getPayCodes();
                    const payCodeIndex = payCodes.findIndex(pc => pc.id === payCodeId);
                    
                    if (payCodeIndex === -1) {
                        this.stateManager.addAlert('error', 'PayCode not found.');
                        return;
                    }
                    
                    const currentPayCode = payCodes[payCodeIndex];
                    const newValidStatus = !currentPayCode.valid;
                    
                    // Update in Firestore
                    const payCodePath = `${this.stateManager.getPayCodesPath()}/${payCodeId}`;
                    await this.db.doc(payCodePath).update({
                        valid: newValidStatus,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Update local state
                    payCodes[payCodeIndex].valid = newValidStatus;
                    this.stateManager.setPayCodes(payCodes);
                    
                    // Show success message
                    this.stateManager.addAlert('success', `PayCode ${newValidStatus ? 'validated' : 'invalidated'} successfully!`);
                    
                    // Refresh settings view
                    this.renderSettings();
                    
                } catch (error) {
                    console.error("Error toggling pay code valid status:", error);
                    this.stateManager.addAlert('error', 'Failed to update pay code status. Please try again.');
                }
            }
            
            async addClass() {
                const classIdInput = document.getElementById('new-class-id');
                const classNameInput = document.getElementById('new-class-name');
                
                const classId = classIdInput.value.trim();
                const className = classNameInput.value.trim();
                
                if (!classId) {
                    this.stateManager.addAlert('error', 'Please enter a class ID.');
                    return;
                }
                
                if (!className) {
                    this.stateManager.addAlert('error', 'Please enter a class name.');
                    return;
                }
                
                try {
                    const classData = {
                        id: classId,
                        name: className,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Save to Firestore
                    const classPath = `${this.stateManager.getClassesPath()}/${classId}`;
                    await this.db.doc(classPath).set(classData);
                    
                    // Update local state
                    const classes = this.stateManager.getClasses();
                    classes.push(classData);
                    this.stateManager.setClasses(classes);
                    
                    // Clear inputs
                    classIdInput.value = '';
                    classNameInput.value = '';
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'Class added successfully!');
                    
                    // Refresh settings view
                    this.renderSettings();
                    
                } catch (error) {
                    console.error("Error adding class:", error);
                    this.stateManager.addAlert('error', 'Failed to add class. Please try again.');
                }
            }
            
            async deleteClass(classId) {
                if (!confirm('Are you sure you want to delete this class? This will also delete all students in this class.')) {
                    return;
                }
                
                try {
                    // Delete from Firestore
                    const classPath = `${this.stateManager.getClassesPath()}/${classId}`;
                    await this.db.doc(classPath).delete();
                    
                    // Update local state
                    const classes = this.stateManager.getClasses();
                    const updatedClasses = classes.filter(c => c.id !== classId);
                    this.stateManager.setClasses(updatedClasses);
                    
                    // Also remove students from this class
                    const students = this.stateManager.getAllStudents();
                    const updatedStudents = students.filter(s => s.classId !== classId);
                    this.stateManager.setAllStudents(updatedStudents);
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'Class deleted successfully!');
                    
                    // Refresh settings view
                    this.renderSettings();
                    
                } catch (error) {
                    console.error("Error deleting class:", error);
                    this.stateManager.addAlert('error', 'Failed to delete class. Please try again.');
                }
            }
            
            handlePaginationClick(direction) {
                if (this.stateManager.getCurrentView() === 'students') {
                    if (direction === 'prev') {
                        if (this.stateManager.currentStudentPage > 0) {
                            this.stateManager.currentStudentPage--;
                            this.renderStudents();
                        }
                    } else if (direction === 'next') {
                        const students = this.stateManager.getAllStudents();
                        const filteredStudents = this.stateManager.studentSearch ? 
                            students.filter(s => 
                                (s.fullName || s.name)?.toLowerCase().includes(this.stateManager.studentSearch) || 
                                s.id?.toLowerCase().includes(this.stateManager.studentSearch) ||
                                s.phoneNumber?.includes(this.stateManager.studentSearch) ||
                                s.status?.toLowerCase().includes(this.stateManager.studentSearch) ||
                                s.className?.toLowerCase().includes(this.stateManager.studentSearch)
                            ) : students;
                        const totalPages = Math.ceil(filteredStudents.length / this.stateManager.itemsPerPage);
                        
                        if (this.stateManager.currentStudentPage < totalPages - 1) {
                            this.stateManager.currentStudentPage++;
                            this.renderStudents();
                        }
                    }
                } else if (this.stateManager.getCurrentView() === 'allPayments') {
                    if (direction === 'prev') {
                        if (this.stateManager.currentPaymentPage > 0) {
                            this.stateManager.currentPaymentPage--;
                            this.renderAllPayments();
                        }
                    } else if (direction === 'next') {
                        const payments = this.stateManager.getAllPayments();
                        const filteredPayments = this.stateManager.paymentSearch ? 
                            payments.filter(p => 
                                p.studentName?.toLowerCase().includes(this.stateManager.paymentSearch) || 
                                p.studentId?.toLowerCase().includes(this.stateManager.paymentSearch) ||
                                (p.transactionCode && p.transactionCode.toLowerCase().includes(this.stateManager.paymentSearch)) ||
                                p.paymentMethod?.toLowerCase().includes(this.stateManager.paymentSearch) ||
                                p.className?.toLowerCase().includes(this.stateManager.paymentSearch)
                            ) : payments;
                        const totalPages = Math.ceil(filteredPayments.length / this.stateManager.itemsPerPage);
                        
                        if (this.stateManager.currentPaymentPage < totalPages - 1) {
                            this.stateManager.currentPaymentPage++;
                            this.renderAllPayments();
                        }
                    }
                }
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new SchoolAdminApp();
        });
        
        window.app = app;
    </script>
</body>
