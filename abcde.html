<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AI Tutor - Video Answers</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
            color: #1a2a3a;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            padding: 2rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: #0f2b3d;
        }
        .sub {
            color: #5b6f82;
            margin-bottom: 1.8rem;
            border-left: 3px solid #3b82f6;
            padding-left: 1rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1e3a5f;
        }
        textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: 1px solid #ccd7e6;
            border-radius: 16px;
            font-family: inherit;
            resize: vertical;
            transition: 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .file-label {
            display: inline-block;
            background: #eef2ff;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.2s;
        }
        .file-label:hover {
            background: #e0e7ff;
        }
        input[type="file"] {
            display: none;
        }
        .image-preview {
            margin-top: 1rem;
            max-width: 200px;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }
        .image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .video-container {
            margin-top: 2rem;
            border-radius: 20px;
            background: #f8fafc;
            padding: 1rem;
            display: none;
        }
        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            border: none;
        }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 1rem;
            border-radius: 16px;
            margin-top: 1rem;
            display: none;
        }
        .info {
            background: #e6f0ff;
            color: #1e40af;
            padding: 1rem;
            border-radius: 16px;
            margin-top: 1rem;
            display: none;
        }
        hr {
            margin: 2rem 0 1rem;
            border: none;
            border-top: 1px solid #e2e8f0;
        }
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #6c7a8e;
            margin-top: 2rem;
        }
        @media (max-width: 640px) {
            .container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 AI Tutor</h1>
    <div class="sub">Ask any academic question — get a relevant YouTube video answer</div>

    <form id="questionForm">
        <div class="form-group">
            <label for="question">Your question</label>
            <textarea id="question" rows="4" placeholder="e.g., Explain Newton's second law of motion..." required></textarea>
        </div>

        <div class="form-group">
            <label>Optional image (diagram, formula, etc.)</label>
            <div>
                <label for="imageUpload" class="file-label">📸 Choose image</label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>
            <div id="imagePreview" class="image-preview"></div>
        </div>

        <button type="submit" id="submitBtn">Find Video</button>
    </form>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Processing your question... (may take up to 30s)</div>
    </div>

    <div id="videoContainer" class="video-container">
        <h3 style="margin-top: 0;">🎥 Recommended Video</h3>
        <div id="videoFrame"></div>
    </div>

    <div id="infoMessage" class="info"></div>
    <div id="errorMessage" class="error"></div>
    <footer>Only video results are shown. Solutions are processed but not displayed.</footer>
</div>

<script>
    // Backend endpoint (your Render URL)
    const API_URL = 'https://dilshadalmm.onrender.com/api/search';

    // Helper: convert file to base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // Helper: extract YouTube video ID from various URL formats
    function extractYouTubeId(url) {
        if (!url) return null;
        // Regular expressions for common YouTube URL patterns
        const patterns = [
            /(?:youtube\.com\/watch\?v=)([^&]+)/i,
            /(?:youtube\.com\/embed\/)([^?]+)/i,
            /(?:youtu\.be\/)([^?]+)/i,
            /(?:youtube\.com\/shorts\/)([^?]+)/i
        ];
        for (let pattern of patterns) {
            const match = url.match(pattern);
            if (match && match[1]) return match[1];
        }
        return null; // no valid ID
    }

    // Build embed iframe from video URL
    function embedYouTube(videoUrl) {
        const videoId = extractYouTubeId(videoUrl);
        if (!videoId) return null;
        return `<iframe src="https://www.youtube.com/embed/${videoId}" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen></iframe>`;
    }

    // DOM elements
    const form = document.getElementById('questionForm');
    const questionInput = document.getElementById('question');
    const imageUpload = document.getElementById('imageUpload');
    const imagePreview = document.getElementById('imagePreview');
    const submitBtn = document.getElementById('submitBtn');
    const loadingDiv = document.getElementById('loading');
    const videoContainer = document.getElementById('videoContainer');
    const videoFrameDiv = document.getElementById('videoFrame');
    const infoDiv = document.getElementById('infoMessage');
    const errorDiv = document.getElementById('errorMessage');

    // Preview image when selected
    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                imagePreview.innerHTML = `<img src="${ev.target.result}" alt="Preview">`;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            imagePreview.innerHTML = '';
            imagePreview.style.display = 'none';
        }
    });

    // Hide messages helper
    function hideMessages() {
        infoDiv.style.display = 'none';
        errorDiv.style.display = 'none';
        videoContainer.style.display = 'none';
        videoFrameDiv.innerHTML = '';
    }

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        infoDiv.style.display = 'none';
        videoContainer.style.display = 'none';
    }

    function showInfo(message) {
        infoDiv.textContent = message;
        infoDiv.style.display = 'block';
        errorDiv.style.display = 'none';
        videoContainer.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessages();

        const questionText = questionInput.value.trim();
        if (!questionText) {
            showError('Please enter a question.');
            return;
        }

        // Prepare request payload
        let imageBase64 = null;
        const file = imageUpload.files[0];
        if (file) {
            try {
                // Warn if image is large (optional)
                if (file.size > 10 * 1024 * 1024) {
                    showError('Image too large (max 10MB). Please choose a smaller image.');
                    return;
                }
                imageBase64 = await fileToBase64(file);
            } catch (err) {
                showError('Failed to read image file.');
                return;
            }
        }

        // Disable button, show loading
        submitBtn.disabled = true;
        loadingDiv.style.display = 'block';

        const payload = {
            text: questionText,
            imageBase64: imageBase64 || ''
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`Server responded with ${response.status}`);
            }

            const data = await response.json();
            console.log('Backend response:', data);

            // Check if we got a video URL
            const videoUrl = data.videoUrl;
            if (videoUrl) {
                const embedHtml = embedYouTube(videoUrl);
                if (embedHtml) {
                    videoFrameDiv.innerHTML = embedHtml;
                    videoContainer.style.display = 'block';
                } else {
                    // Invalid YouTube URL
                    showInfo('Received a video URL but it could not be embedded. The URL might be invalid: ' + videoUrl);
                }
            } else {
                showInfo('No video URL was returned for this question. Please try rephrasing or adding an image.');
            }

        } catch (err) {
            console.error('Request failed:', err);
            showError('Network error or backend unavailable. Please try again later.');
        } finally {
            submitBtn.disabled = false;
            loadingDiv.style.display = 'none';
        }
    });
</script>
</body>
</html>
