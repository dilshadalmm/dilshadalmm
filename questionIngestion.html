<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StudentPlus - Question Ingestion</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 2rem 1rem;
            color: #1e293b;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            padding: 1.8rem 2rem 2.2rem;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #1e3c72, #2b4c8c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sub {
            color: #475569;
            margin-bottom: 1.8rem;
            border-left: 3px solid #3b82f6;
            padding-left: 0.75rem;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.3rem;
        }
        label {
            font-weight: 500;
            display: block;
            margin-bottom: 0.4rem;
            color: #0f172a;
        }
        input, textarea, .file-label {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 18px;
            font-size: 1rem;
            transition: 0.2s;
            background: #fff;
            font-family: inherit;
        }
        input:focus, .file-label:focus-within {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .file-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .file-label {
            background: #f1f5f9;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            color: #1e40af;
            display: inline-block;
            width: auto;
            padding: 0.6rem 1.2rem;
            margin-bottom: 0;
        }
        #file-name {
            color: #334155;
            font-size: 0.9rem;
            word-break: break-all;
        }
        input[type="file"] {
            display: none;
        }
        .preview-img {
            margin-top: 12px;
            max-width: 100%;
            max-height: 180px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            object-fit: contain;
        }
        button {
            background: #0f2b3d;
            color: white;
            border: none;
            padding: 0.85rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        button:hover {
            background: #1e4a76;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .result-card {
            margin-top: 2rem;
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.2rem 1.5rem;
            border-left: 5px solid #3b82f6;
            transition: 0.2s;
        }
        .result-card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.2rem;
        }
        .result-success {
            border-left-color: #10b981;
        }
        .result-error {
            border-left-color: #ef4444;
        }
        .result-meta {
            font-family: monospace;
            font-size: 0.85rem;
            background: #eef2ff;
            padding: 0.6rem;
            border-radius: 14px;
            margin-top: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #5b6e8c;
        }
        hr {
            margin: 1rem 0;
            border: 0;
            height: 1px;
            background: #e2e8f0;
        }
        @media (max-width: 550px) {
            .container { padding: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 StudentPlus</h1>
    <div class="sub">AI‑powered question ingestion from textbook images</div>

    <form id="ingestForm">
        <div class="form-group">
            <label>📘 Class</label>
            <input type="text" id="class" placeholder="e.g., Class 9, 10, Grade 8" required>
        </div>
        <div class="form-group">
            <label>📚 Subject</label>
            <input type="text" id="subject" placeholder="e.g., Science, Mathematics" required>
        </div>
        <div class="form-group">
            <label>📖 Chapter</label>
            <input type="text" id="chapter" placeholder="e.g., Matter in Our Surroundings" required>
        </div>
        <div class="form-group">
            <label>🖼️ Upload image (page with MCQs)</label>
            <div class="file-input-wrapper">
                <label for="imageFile" class="file-label">📁 Choose image</label>
                <input type="file" id="imageFile" accept="image/*" capture="environment">
                <span id="file-name">No file chosen</span>
            </div>
            <img id="preview" class="preview-img" style="display: none;" alt="Preview">
        </div>

        <button type="submit" id="submitBtn">🚀 Process & Ingest Questions</button>
    </form>

    <div id="resultArea" style="display: none;"></div>
    <footer>
        ⚡ The server extracts multiple‑choice questions, saves them with auto‑incremented IDs.<br>
        📌 Ensure the image is clear and contains at least one MCQ.
    </footer>
</div>

<script>
    const API_ENDPOINT = "https://dilshadalmm.onrender.com/api/ingest";

    // DOM elements
    const form = document.getElementById('ingestForm');
    const classInput = document.getElementById('class');
    const subjectInput = document.getElementById('subject');
    const chapterInput = document.getElementById('chapter');
    const fileInput = document.getElementById('imageFile');
    const fileNameSpan = document.getElementById('file-name');
    const previewImg = document.getElementById('preview');
    const submitBtn = document.getElementById('submitBtn');
    const resultArea = document.getElementById('resultArea');

    // Helper: show preview
    fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            fileNameSpan.textContent = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewImg.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            fileNameSpan.textContent = 'No file chosen';
            previewImg.style.display = 'none';
            previewImg.src = '';
        }
    });

    // Convert file to base64 string (without data:image prefix)
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                // result looks like "data:image/jpeg;base64,/9j/4AAQ..."
                const base64WithPrefix = reader.result;
                // keep full base64 including prefix? The backend handles stripping the prefix
                resolve(base64WithPrefix);
            };
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    // Show result with status
    function displayResult(success, message, details = null) {
        resultArea.style.display = 'block';
        const resultClass = success ? 'result-success' : 'result-error';
        let html = `<div class="result-card ${resultClass}">
                        <h3>${success ? '✅ Ingestion completed' : '❌ Processing failed'}</h3>
                        <p>${escapeHtml(message)}</p>`;
        if (details) {
            html += `<div class="result-meta">${escapeHtml(JSON.stringify(details, null, 2))}</div>`;
        }
        html += `</div>`;
        resultArea.innerHTML = html;
    }

    // basic escape to avoid XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // Submit handler
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // validate fields
        const classValue = classInput.value.trim();
        const subjectValue = subjectInput.value.trim();
        const chapterValue = chapterInput.value.trim();
        const imageFile = fileInput.files[0];

        if (!classValue || !subjectValue || !chapterValue) {
            displayResult(false, 'Please fill in Class, Subject, and Chapter.', null);
            return;
        }
        if (!imageFile) {
            displayResult(false, 'Please select an image.', null);
            return;
        }

        // UI loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Sending to server...';
        resultArea.style.display = 'none';

        try {
            // Convert image to base64
            const base64Image = await fileToBase64(imageFile);

            // Build payload
            const payload = {
                imageBase64: base64Image,
                class: classValue,
                subject: subjectValue,
                chapter: chapterValue
            };

            // Send request
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload),
                // timeout handling can be done with AbortController if needed
            });

            const data = await response.json();

            if (response.ok) {
                // expected format: { status, message, questionsProcessed }
                if (data.status === 'success') {
                    displayResult(true, data.message || `Successfully processed ${data.questionsProcessed} questions.`, {
                        questionsProcessed: data.questionsProcessed
                    });
                } else {
                    // server returned error status
                    displayResult(false, data.message || 'Server reported an error.', data);
                }
            } else {
                // HTTP error status (4xx,5xx)
                displayResult(false, `Server error (${response.status}): ${data.message || 'Please try again later.'}`, data);
            }
        } catch (error) {
            console.error('Request failed:', error);
            let errorMsg = 'Network or CORS error. Make sure the server is reachable.';
            if (error.message.includes('Failed to fetch')) {
                errorMsg = 'Cannot connect to the server. The backend might be down (503) or unreachable. Please verify the server status.';
            }
            displayResult(false, errorMsg, { error: error.message });
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '🚀 Process & Ingest Questions';
        }
    });
</script>
</body>
</html>
