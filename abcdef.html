<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimum-scale=1.0, viewport-fit=cover">
    <title>StudentPlus · AI Study Assistant</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX for LaTeX Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/mhchem.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-y: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #app-wrapper {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }
        
        #question-input, .file-input-hidden {
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }

        .katex {
            font-size: 1.1em !important;
            text-align: left !important;
        }
        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
        }

        #chat-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #chat-container::-webkit-scrollbar {
            display: none;
        }

        @media (min-width: 768px) {
            #app-wrapper {
                position: relative;
                margin: 0 auto;
                max-width: 600px;
                height: 90vh;
                max-height: 800px;
                border-radius: 0.5rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                top: 50%;
                transform: translateY(-50%);
            }
        }

        /* Image preview chip */
        .image-badge {
            transition: all 0.2s ease;
        }
        .loading-dots::after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
            display: inline-block;
            width: 24px;
        }
        @keyframes dots {
            0%, 20% { content: ""; }
            40% { content: "."; }
            60% { content: ".."; }
            80%, 100% { content: "..."; }
        }
    </style>
</head>

<body class="h-full bg-gray-100 dark:bg-gray-900 flex items-center justify-center overflow-hidden">

    <div id="app-wrapper" class="bg-white dark:bg-gray-800 flex flex-col overflow-hidden rounded-none md:rounded-lg">

        <!-- Header -->
        <header class="sticky top-0 z-10 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 shadow-sm flex items-center justify-between flex-shrink-0">
            <h1 class="text-xl font-bold">
                <span class="bg-yellow-300 dark:bg-yellow-400 text-black dark:text-gray-900 px-3 py-1 rounded-md">StudentPlus</span>
            </h1>
            <svg class="w-6 h-6 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
            </svg>
        </header>

        <!-- Chat Container -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
            <!-- Welcome Message -->
            <div class="flex">
                <div class="bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100 p-3 rounded-lg">
                    <p class="font-medium">Hello! 👋</p>
                    <p id="welcome-message">
                        I'm your AI study assistant. Ask any academic question (text or image).<br>
                        💡 <strong>Video code #56788</strong> plays a study mix.<br>
                        📸 Tap the <span class="inline-flex items-center">📷</span> icon to upload a math/chem diagram.<br>
                        ✨ LaTeX is supported: $$E = mc^2$$
                    </p>
                </div>
            </div>
        </main>

        <!-- Input Footer with Image Upload -->
        <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-4 flex-shrink-0">
            <div class="flex items-center space-x-2">
                <!-- Image Upload Icon & Hidden Input -->
                <label class="cursor-pointer p-2 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gray-700 dark:text-gray-200">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>
                    <input type="file" id="image-upload" accept="image/*" class="hidden file-input-hidden" />
                </label>
                <!-- Image Preview Badge (optional) -->
                <div id="image-preview-badge" class="hidden items-center bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 text-sm px-2 py-1 rounded-full gap-1">
                    <span id="preview-filename" class="truncate max-w-[100px]"></span>
                    <button id="clear-image" type="button" class="ml-1 font-bold text-blue-600 dark:text-blue-400 hover:text-blue-800">✕</button>
                </div>
                <!-- Text Input -->
                <form id="solver-form" class="flex-1 flex items-center space-x-3">
                    <input 
                        type="text" 
                        id="question-input"
                        placeholder="Type a question or video code #56788..."
                        class="flex-1 w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400"
                        autocomplete="off"
                    >
                    <button 
                        type="submit"
                        id="send-button"
                        class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 disabled:opacity-50 disabled:cursor-not-allowed"
                        aria-label="Send message"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                            <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.98.75.75 0 0 0 0-1.212A60.517 60.517 0 0 0 3.478 2.404Z" />
                        </svg>
                    </button>
                </form>
            </div>
        </footer>

        <!-- Error Modal -->
        <div id="error-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 max-w-sm w-full">
                <h3 class="text-lg font-medium text-red-600 dark:text-red-400">Error</h3>
                <p id="error-message" class="mt-2 text-sm text-gray-700 dark:text-gray-300"></p>
                <button id="close-error-modal" class="mt-4 w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700">Close</button>
            </div>
        </div>

    </div>

    <script>
        (function() {
            // DOM elements
            const form = document.getElementById('solver-form');
            const input = document.getElementById('question-input');
            const chatContainer = document.getElementById('chat-container');
            const sendButton = document.getElementById('send-button');
            const errorModal = document.getElementById('error-modal');
            const errorMessageSpan = document.getElementById('error-message');
            const closeErrorBtn = document.getElementById('close-error-modal');
            const imageUploadInput = document.getElementById('image-upload');
            const imagePreviewBadge = document.getElementById('image-preview-badge');
            const previewFilenameSpan = document.getElementById('preview-filename');
            const clearImageBtn = document.getElementById('clear-image');

            // ---- Constants ----
            const BACKEND_URL = 'https://dilshadalmm.onrender.com/api/search';
            const VIDEO_CODE = '#56788';
            const LEGACY_VIDEO_ID = 'bLlJCeziBVg';
            const LEGACY_VIDEO_URL = `https://www.youtube.com/embed/${LEGACY_VIDEO_ID}`;

            // State
            let pendingImageBase64 = null;       // stores full dataURL (with prefix)
            let pendingImageName = null;
            let isRequestInProgress = false;
            let currentLoadingMessageDiv = null;   // reference to "Processing..." message

            // ---- Disable context menu & copy (keep existing) ----
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            document.addEventListener('copy', (e) => e.preventDefault());

            // ---- KaTeX render helper ----
            function renderKaTeX(element) {
                if (typeof renderMathInElement === 'undefined') return;
                try {
                    renderMathInElement(element, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false },
                            { left: '\\[', right: '\\]', display: true },
                            { left: "\\ce{", right: "}", display: false, mhchem: true }
                        ],
                        throwOnError: false
                    });
                } catch (err) { console.warn("KaTeX error", err); }
            }

            // ---- Add message to chat (sender = 'user' or 'ai') ----
            function addMessage(content, sender) {
                const wrapper = document.createElement('div');
                wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
                
                const bubble = document.createElement('div');
                bubble.className = `p-3 rounded-lg max-w-sm md:max-w-md ${
                    sender === 'user' 
                        ? 'bg-blue-600 text-white' 
                        : 'bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100 break-words'
                }`;

                if (sender === 'ai') {
                    // Format: bold, italic, line breaks
                    let html = content
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/\n/g, '<br>');
                    bubble.innerHTML = html;
                } else {
                    bubble.textContent = content;
                }
                
                wrapper.appendChild(bubble);
                chatContainer.appendChild(wrapper);
                
                // Render LaTeX only for AI messages (since they may contain formulas)
                if (sender === 'ai') {
                    renderKaTeX(bubble);
                }
                
                // Auto-scroll
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return wrapper;
            }

            // ---- Show loading indicator (AI typing) ----
            function showLoadingMessage() {
                if (currentLoadingMessageDiv) return currentLoadingMessageDiv;
                const wrapper = document.createElement('div');
                wrapper.className = 'flex justify-start';
                wrapper.id = 'loading-ai-msg';
                const bubble = document.createElement('div');
                bubble.className = 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 p-3 rounded-lg flex items-center space-x-2';
                bubble.innerHTML = '<span>Thinking</span><span class="loading-dots"></span>';
                wrapper.appendChild(bubble);
                chatContainer.appendChild(wrapper);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                currentLoadingMessageDiv = wrapper;
                return wrapper;
            }

            function hideLoadingMessage() {
                if (currentLoadingMessageDiv) {
                    currentLoadingMessageDiv.remove();
                    currentLoadingMessageDiv = null;
                }
            }

            // ---- Add video player directly in chat ----
            function addVideoPlayerInChat(videoUrl, title = "Study Video") {
                const videoWrapper = document.createElement('div');
                videoWrapper.className = 'w-full my-4 rounded-xl overflow-hidden shadow-lg';
                const iframeHtml = `
                    <div class="aspect-video w-full bg-gray-900">
                        <iframe 
                            width="100%" 
                            height="100%" 
                            src="${videoUrl}?autoplay=1" 
                            title="${title}"
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            referrerpolicy="strict-origin-when-cross-origin"
                            allowfullscreen
                            class="w-full h-full"
                        ></iframe>
                    </div>
                `;
                videoWrapper.innerHTML = iframeHtml;
                chatContainer.appendChild(videoWrapper);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            // ---- Show error modal ----
            function showError(message) {
                errorMessageSpan.textContent = message;
                errorModal.classList.remove('hidden');
            }

            // ---- Reset image upload state ----
            function resetImageAttachment() {
                pendingImageBase64 = null;
                pendingImageName = null;
                imageUploadInput.value = '';
                imagePreviewBadge.classList.add('hidden');
                previewFilenameSpan.textContent = '';
            }

            // ---- Handle image selection ----
            imageUploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showError('Only image files are allowed (PNG, JPG, etc.)');
                    resetImageAttachment();
                    return;
                }
                // Limit size ~5MB
                if (file.size > 5 * 1024 * 1024) {
                    showError('Image too large, max 5MB.');
                    resetImageAttachment();
                    return;
                }
                pendingImageName = file.name;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    pendingImageBase64 = ev.target.result; // data:image/png;base64,...
                    previewFilenameSpan.textContent = pendingImageName.length > 20 ? pendingImageName.slice(0, 18)+'...' : pendingImageName;
                    imagePreviewBadge.classList.remove('hidden');
                };
                reader.onerror = () => {
                    showError('Failed to read image');
                    resetImageAttachment();
                };
                reader.readAsDataURL(file);
            });

            clearImageBtn.addEventListener('click', () => {
                resetImageAttachment();
            });

            // ---- Call backend with text + optional image ----
            async function sendToBackend(text, imageBase64) {
                const payload = {
                    text: text || '',
                    imageBase64: imageBase64 || null
                };
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 45000); // 45s timeout
                
                try {
                    const response = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        throw new Error(`Server responded with ${response.status}`);
                    }
                    const data = await response.json();
                    return data;
                } catch (err) {
                    if (err.name === 'AbortError') {
                        throw new Error('Request timed out. Please try again.');
                    }
                    throw new Error(`Network error: ${err.message}`);
                }
            }

            // ---- Process AI response: only show normalized question (data.question) and video if exists ----
            function processAiResponse(data) {
                // data structure expected: { question, solution, videoUrl, imageUrl }
                const normalizedQuestion = data.question || "No question text returned.";
                const videoUrl = data.videoUrl ? data.videoUrl.trim() : null;
                
                // 1) Always display normalized question as AI message
                if (normalizedQuestion) {
                    addMessage(normalizedQuestion, 'ai');
                } else {
                    addMessage("Sorry, I couldn't process that question.", 'ai');
                }
                
                // 2) If videoUrl is provided and not empty, embed the video player
                if (videoUrl && videoUrl !== "") {
                    // ensure youtube embed or any URL is embeddable (we embed directly)
                    let embedVideo = videoUrl;
                    // Convert regular youtube watch URL to embed if needed
                    if (videoUrl.includes('youtube.com/watch?v=')) {
                        const videoId = new URL(videoUrl).searchParams.get('v');
                        if (videoId) embedVideo = `https://www.youtube.com/embed/${videoId}`;
                    } else if (videoUrl.includes('youtu.be/')) {
                        const videoId = videoUrl.split('/').pop().split('?')[0];
                        embedVideo = `https://www.youtube.com/embed/${videoId}`;
                    }
                    addVideoPlayerInChat(embedVideo, "Video solution");
                }
            }

            // ---- Main submission handler ----
            async function onSubmit(e) {
                e.preventDefault();
                
                // Prevent double-submit while processing
                if (isRequestInProgress) return;
                
                const rawText = input.value.trim();
                const hasImage = !!pendingImageBase64;
                if (!rawText && !hasImage) return;
                
                // 1) Client-side legacy video code detection (#56788)
                if (rawText === VIDEO_CODE) {
                    // add user message
                    addMessage(rawText, 'user');
                    input.value = '';
                    resetImageAttachment();
                    // Play the static video and show confirmation
                    addVideoPlayerInChat(LEGACY_VIDEO_URL, "Study Music: Lofi Hiphop Beats");
                    addMessage(`Video code **${VIDEO_CODE}** recognized. Playing "The Best Study Music: Lofi Hiphop Beats" for you!`, 'ai');
                    input.blur();
                    return;
                }
                
                // 2) Normal backend flow
                // Disable send button while request runs
                isRequestInProgress = true;
                sendButton.disabled = true;
                
                // Save user message
                let userDisplayText = rawText;
                if (hasImage) {
                    userDisplayText = rawText ? `${rawText} 📷 + image` : `📷 Image uploaded: ${pendingImageName || 'image'}`;
                }
                addMessage(userDisplayText, 'user');
                
                // Clear input & reset image preview immediately after sending
                input.value = '';
                const imagePayload = pendingImageBase64;
                resetImageAttachment();
                input.blur();
                
                // Show loading animation
                showLoadingMessage();
                
                try {
                    // Call backend with text and image (if any)
                    const backendData = await sendToBackend(rawText, imagePayload);
                    hideLoadingMessage();
                    
                    // Process response: display normalized question & video if available
                    processAiResponse(backendData);
                } catch (err) {
                    hideLoadingMessage();
                    console.error("Backend error:", err);
                    showError(err.message || "Failed to reach the AI service. Please try again.");
                    // Optionally show fallback message
                    addMessage("⚠️ Sorry, the AI assistant is temporarily unavailable. Please check your connection or try again later.", 'ai');
                } finally {
                    isRequestInProgress = false;
                    sendButton.disabled = false;
                    // focus back to input? on mobile we avoid auto-focus to keep keyboard closed.
                }
            }
            
            // ---- Attach event ----
            form.addEventListener('submit', onSubmit);
            
            // ---- Mobile keyboard handling: scroll to bottom on focus ----
            input.addEventListener('focus', () => {
                setTimeout(() => {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }, 300);
            });
            input.addEventListener('blur', () => {
                setTimeout(() => {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }, 100);
            });
            
            // ---- Close error modal ----
            closeErrorBtn.addEventListener('click', () => {
                errorModal.classList.add('hidden');
            });
            
            // ---- Initial KaTeX for welcome message ----
            const welcomeDiv = document.getElementById('welcome-message');
            if (welcomeDiv) {
                renderKaTeX(welcomeDiv);
            }
            
            // ---- Dark mode detection ----
            function checkDarkMode() {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
            checkDarkMode();
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', checkDarkMode);
            
            // Additional: zoom prevention via viewport meta already set, and user-scalable=no
        })();
    </script>
</body>
</html>
