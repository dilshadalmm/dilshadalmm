<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Roboto+Condensed:wght@700&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CRITICAL: Ensure HTML and BODY are full height and non-scrollable */
        html {
            height: 100%;
            overflow: hidden !important;
        }

        /* Use the Oswald font family as default */
        body {
            font-family: 'Oswald', sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            
            /* White background */
            background-color: #ffffff !important;
            color: #000000;
            
            /* CRITICAL: Prevent the main body from scrolling at all */
            overflow: hidden !important; 
            
            user-select: none;
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none; 
            
            /* Prevents elastic scrolling on iOS */
            overscroll-behavior: none;
            
            /* Make body a fixed container occupying full screen */
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* App wrapper - uses dynamic viewport height for mobile keyboard stability */
        #app-wrapper {
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dynamic viewport height (best for mobile keyboard) */
            width: 100%;
            position: absolute; /* Relative to fixed body */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden; /* Ensures only the chat container can scroll */
            background: white !important;
        }
        
        /* Strict No-Oval/No-Round Policy */
        * {
            border-radius: 0 !important;
        }
        
        /* Hide Scrollbar */
        #chat-container {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        #chat-container::-webkit-scrollbar {
            display: none;
        }
        
        /* Top bar */
        .top-bar {
            width: 100%;
            background: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            height: 48px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            transition: transform 0.3s ease;
        }
        
        .top-bar.hidden {
            transform: translateY(-100%);
        }
        
        /* Back button */
        .back-button {
            width: 32px;
            height: 32px;
            background: #000000 !important;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: white;
            padding: 0;
            margin: 0;
        }
        
        /* Portal Title */
        .portal-title-container {
            flex: 1;
            max-width: 600px;
            margin: 0 16px;
            position: relative;
        }
        
        .portal-title-button {
            width: 100%;
            height: 32px;
            padding: 0 16px;
            background: #000000 !important;
            color: white;
            border: none;
            font-family: 'Oswald', sans-serif !important;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .portal-title-button:hover {
            background: #333333 !important;
        }
        
        .portal-title-button:active {
            background: #666666 !important;
        }
        
        /* Profile image container */
        .profile-container {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 0 !important;
            overflow: hidden;
            background: #f3f4f6;
            border: none;
            padding: 0;
            margin: 0;
        }
        
        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Main container */
        .main-container {
            padding-top: 48px;
            height: calc(100% - 48px);
            overflow-y: auto;
            background: #f9fafb;
        }
        
        /* Card styles */
        .card {
            background: white;
            border: 1px solid #e5e7eb;
            margin: 1rem;
            padding: 1.5rem;
        }
        
        .card-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-header i {
            color: #3b82f6;
        }
        
        /* Button styles */
        .btn {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Oswald', sans-serif;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        
        .btn-warning:hover {
            background: #d97706;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* Form styles */
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            font-family: 'Oswald', sans-serif;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        /* Progress bar */
        .progress-container {
            margin: 1rem 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #10b981;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #6b7280;
        }
        
        /* Log container */
        .log-container {
            background: #1f2937;
            color: #f3f4f6;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 1rem;
        }
        
        .log-entry {
            padding: 0.25rem 0;
            border-bottom: 1px solid #374151;
        }
        
        .log-success {
            color: #10b981;
        }
        
        .log-error {
            color: #ef4444;
        }
        
        .log-warning {
            color: #f59e0b;
        }
        
        .log-info {
            color: #3b82f6;
        }
        
        /* Collection list */
        .collection-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .collection-item {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .collection-name {
            font-weight: 600;
            color: #374151;
        }
        
        .collection-count {
            background: #3b82f6;
            color: white;
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
        }
        
        /* Status indicators */
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }
        
        .status-active {
            background: #10b981;
        }
        
        .status-inactive {
            background: #6b7280;
        }
        
        .status-error {
            background: #ef4444;
        }
        
        /* Alert messages */
        .alert {
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid transparent;
        }
        
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-color: #10b981;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #7f1d1d;
            border-color: #ef4444;
        }
        
        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border-color: #f59e0b;
        }
        
        .alert-info {
            background: #e0e7ff;
            color: #3730a3;
            border-color: #6366f1;
        }
        
        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f4f6;
            border-top: 2px solid #3b82f6;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Toggle switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
        }
        
        input:checked + .toggle-slider {
            background-color: #10b981;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(30px);
        }
    </style>
</head>

<body class="h-full">
    <!-- Mobile App Container (Flex Column) -->
    <div id="app-wrapper" class="flex flex-col overflow-hidden">
        <!-- Top bar (common for all pages) -->
        <div class="top-bar hidden">
            <!-- Left button -->
            <div id="left-button-container">
                <button class="back-button" id="hamburger-menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <!-- Portal Title -->
            <div class="portal-title-container">
                <button class="portal-title-button" id="portal-title-button">
                    School Management Initializer
                </button>
            </div>
            
            <!-- Profile image -->
            <div class="profile-container">
                <div id="profile-image-container">
                    <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#6b7280;font-weight:600;">A</div>
                </div>
            </div>

        <!-- Main content area -->
        <main id="chat-container" class="flex-1 overflow-y-auto">

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBJ_G5o4otg7riemfJDMOcPoHoIVH7emsc",
            authDomain: "geobazarr.firebaseapp.com",
            databaseURL: "https://geobazarr-default-rtdb.firebaseio.com",
            projectId: "geobazarr",
            storageBucket: "geobazarr.firebasestorage.app",
            messagingSenderId: "679949247383",
            appId: "1:679949247383:web:036d4f32038422ebb89ad2"
        };

        // School Management Initializer App
        class SchoolManagementInitializer {
            constructor() {
                this.db = null;
                this.auth = null;
                this.currentUser = null;
                this.isInitialized = false;
                
                this.appWrapper = document.getElementById('app-wrapper');
                this.chatContainer = document.getElementById('chat-container');
                this.topBar = document.querySelector('.top-bar');
                this.portalTitleButton = document.getElementById('portal-title-button');
                this.profileImageContainer = document.getElementById('profile-image-container');
                
                // School ID
                this.schoolId = 'school_001';
                
                // Sample data
                this.sampleData = {
                    school: null,
                    academicYears: [],
                    classes: [],
                    sections: [],
                    students: [],
                    enrollments: [],
                    subjects: [],
                    classSubjects: [],
                    teachers: [],
                    teacherAssignments: [],
                    attendance: [],
                    exams: [],
                    results: [],
                    feeStructures: [],
                    discounts: [],
                    invoices: [],
                    payments: [],
                    announcements: [],
                    userRoles: [],
                    auditLogs: [],
                    settings: []
                };
                
                // Initialization progress
                this.progress = {
                    totalSteps: 20,
                    completedSteps: 0,
                    currentStep: ''
                };
                
                this.initialize();
            }
            
            initialize() {
                if (this.isInitialized) return;
                
                try {
                    firebase.initializeApp(firebaseConfig);
                    this.db = firebase.firestore();
                    this.auth = firebase.auth();
                    
                    this.db.settings({
                        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
                    });
                    
                    console.log("Firebase initialized successfully");
                    this.isInitialized = true;
                    
                    this.setupAuthListener();
                    
                } catch (error) {
                    console.error("Firebase initialization error:", error);
                    this.showError("Firebase initialization failed. Please refresh the page.");
                }
            }
            
            setupAuthListener() {
                this.auth.onAuthStateChanged(async (user) => {
                    console.log("Auth state changed:", user ? `User ${user.uid} logged in` : "No user");
                    
                    if (user) {
                        this.currentUser = user;
                        this.updateTopBar();
                        this.renderMainPage();
                    } else {
                        this.currentUser = null;
                        this.showSignInPrompt();
                    }
                });
            }
            
            updateTopBar() {
                this.topBar.classList.remove('hidden');
                
                if (this.currentUser) {
                    const initial = this.currentUser.email ? this.currentUser.email[0].toUpperCase() : 'U';
                    this.profileImageContainer.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#3b82f6;font-weight:600;font-size:16px;">${initial}</div>`;
                }
            }
            
            showError(message) {
                console.error(message);
                
                this.topBar.classList.add('hidden');
                
                const html = `
                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-exclamation-triangle"></i>
                            Error
                        </div>
                        <div class="alert alert-error">
                            ${message}
                        </div>
                        <button id="retry-button" class="btn btn-primary" style="margin-top: 1rem;">
                            Retry
                        </button>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                this.chatContainer.scrollTop = 0;
                
                document.getElementById('retry-button')?.addEventListener('click', () => {
                    window.location.reload();
                });
            }
            
            showSignInPrompt() {
                this.topBar.classList.add('hidden');
                
                const html = `
                    <div class="card" style="margin: 2rem; text-align: center;">
                        <div class="card-header">
                            <i class="fas fa-lock"></i>
                            Authentication Required
                        </div>
                        <div class="alert alert-warning">
                            You need to sign in to initialize the school management system.
                        </div>
                        <button id="sign-in-prompt-button" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Sign In to Continue
                        </button>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                this.chatContainer.scrollTop = 0;
                
                document.getElementById('sign-in-prompt-button')?.addEventListener('click', () => {
                    this.showAuthModal();
                });
            }
            
            showAuthModal() {
                const authModal = document.createElement('div');
                authModal.className = 'auth-modal-overlay';
                authModal.innerHTML = `
                    <div class="auth-modal">
                        <div class="auth-header">
                            <div class="auth-title">Sign In to School Management</div>
                        </div>
                        <div class="auth-body">
                            <div class="auth-field">
                                <label class="auth-label">Email</label>
                                <input type="email" id="auth-email" class="auth-input" placeholder="admin@example.com">
                                <div id="email-error" class="auth-error"></div>
                            </div>
                            
                            <div class="auth-field">
                                <label class="auth-label">Password</label>
                                <input type="password" id="auth-password" class="auth-input" placeholder="••••••••">
                                <div id="password-error" class="auth-error"></div>
                            </div>
                            
                            <button id="sign-in-button" class="auth-button">Sign In</button>
                        </div>
                        <div class="auth-footer">
                            <span>Use any email/password to create a new account</span>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(authModal);
                this.setupAuthModalEvents(authModal);
            }
            
            setupAuthModalEvents(authModal) {
                const signInButton = document.getElementById('sign-in-button');
                const emailInput = document.getElementById('auth-email');
                const passwordInput = document.getElementById('auth-password');
                
                signInButton.addEventListener('click', async () => {
                    await this.signInWithEmail(emailInput, passwordInput, authModal);
                });
                
                emailInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        passwordInput.focus();
                    }
                });
                
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.signInWithEmail(emailInput, passwordInput, authModal);
                    }
                });
                
                authModal.addEventListener('click', (e) => {
                    if (e.target === authModal) {
                        authModal.remove();
                    }
                });
            }
            
            async signInWithEmail(emailInput, passwordInput, authModal) {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const signInButton = document.getElementById('sign-in-button');
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.textContent = '';
                emailError.classList.remove('show');
                passwordError.textContent = '';
                passwordError.classList.remove('show');
                
                if (!email) {
                    emailError.textContent = 'Please enter your email';
                    emailError.classList.add('show');
                    return;
                }
                
                if (!password) {
                    passwordError.textContent = 'Please enter your password';
                    passwordError.classList.add('show');
                    return;
                }
                
                signInButton.textContent = 'Signing In...';
                signInButton.classList.add('loading');
                
                try {
                    await this.auth.signInWithEmailAndPassword(email, password);
                    authModal.remove();
                    
                } catch (error) {
                    console.error("Sign in error:", error);
                    
                    signInButton.textContent = 'Sign In';
                    signInButton.classList.remove('loading');
                    
                    // Try to create account if user doesn't exist
                    if (error.code === 'auth/user-not-found') {
                        try {
                            await this.auth.createUserWithEmailAndPassword(email, password);
                            authModal.remove();
                        } catch (createError) {
                            passwordError.textContent = 'Failed to create account. Please try a different email/password';
                            passwordError.classList.add('show');
                        }
                    } else {
                        passwordError.textContent = 'Failed to sign in. Please check your credentials';
                        passwordError.classList.add('show');
                    }
                }
            }
            
            renderMainPage() {
                const html = `
                    <div class="main-container">
                        <div class="card">
                            <div class="card-header">
                                <i class="fas fa-school"></i>
                                School Management System Initializer
                            </div>
                            
                            <div class="alert alert-info">
                                <strong>Welcome!</strong> This tool will help you initialize a complete school management system structure in Firebase.
                                It will create sample data for all the required collections and documents.
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">School ID</label>
                                <input type="text" id="school-id" class="form-input" value="${this.schoolId}" placeholder="Enter unique school ID">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">School Name</label>
                                <input type="text" id="school-name" class="form-input" value="Dilshad Institute Of Science" placeholder="Enter school name">
                            </div>
                            
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progress-fill" style="width: ${(this.progress.completedSteps / this.progress.totalSteps) * 100}%"></div>
                                </div>
                                <div class="progress-text">
                                    <span id="progress-text">${this.progress.completedSteps}/${this.progress.totalSteps} steps completed</span>
                                    <span id="current-step">${this.progress.currentStep || 'Ready to start'}</span>
                                </div>
                            </div>
                            
                            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                                <button id="generate-data-btn" class="btn btn-primary">
                                    <i class="fas fa-database"></i> Generate Sample Data
                                </button>
                                <button id="initialize-btn" class="btn btn-success">
                                    <i class="fas fa-rocket"></i> Initialize Firebase
                                </button>
                                <button id="logout-btn" class="btn btn-danger">
                                    <i class="fas fa-sign-out-alt"></i> Logout
                                </button>
                            </div>
                        </div>
                        
                        <div class="card">
                            <div class="card-header">
                                <i class="fas fa-list"></i>
                                Collections to be Created
                            </div>
                            <div class="collection-list" id="collections-list">
                                <!-- Collections will be dynamically added here -->
                            </div>
                        </div>
                        
                        <div class="card">
                            <div class="card-header">
                                <i class="fas fa-terminal"></i>
                                Initialization Log
                            </div>
                            <div class="log-container" id="log-container">
                                <div class="log-entry log-info">Ready to initialize school management system...</div>
                            </div>
                        </div>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                this.updateCollectionsList();
                this.setupEventListeners();
            }
            
            updateCollectionsList() {
                const collectionsList = document.getElementById('collections-list');
                if (!collectionsList) return;
                
                const collections = [

            async initializeFirebase() {
                if (!this.currentUser) {
                    this.log('Please sign in first!', 'error');
                    return;
                }
                
                if (!this.sampleData.school) {
                    this.log('Please generate sample data first!', 'warning');
                    return;
                }
                
                try {
                    this.log('Starting Firebase initialization...', 'info');
                    
                    // Disable buttons during initialization
                    const initBtn = document.getElementById('initialize-btn');
                    const genBtn = document.getElementById('generate-data-btn');
                    if (initBtn) initBtn.disabled = true;
                    if (genBtn) genBtn.disabled = true;
                    
                    // Reset progress
                    this.progress.completedSteps = 0;
                    this.updateProgress(0, 'Starting initialization...');
                    
                    // 1. Create school document
                    await this.createSchool();
                    
                    // 2. Create academic years
                    await this.createAcademicYears();
                    
                    // 3. Create classes
                    await this.createClasses();
                    
                    // 4. Create sections
                    await this.createSections();
                    
                    // 5. Create students
                    await this.createStudents();
                    
                    // 6. Create enrollments
                    await this.createEnrollments();
                    
                    // 7. Create subjects
                    await this.createSubjects();
                    
                    // 8. Create class subjects
                    await this.createClassSubjects();
                    
                    // 9. Create teachers
                    await this.createTeachers();
                    
                    // 10. Create teacher assignments
                    await this.createTeacherAssignments();
                    
                    // 11. Create attendance records
                    await this.createAttendance();
                    
                    // 12. Create exams
                    await this.createExams();
                    
                    // 13. Create results
                    await this.createResults();
                    
                    // 14. Create fee structures
                    await this.createFeeStructures();
                    
                    // 15. Create discounts
                    await this.createDiscounts();
                    
                    // 16. Create invoices
                    await this.createInvoices();
                    
                    // 17. Create payments
                    await this.createPayments();
                    
                    // 18. Create announcements
                    await this.createAnnouncements();
                    
                    // 19. Create user roles
                    await this.createUserRoles();
                    
                    // 20. Create audit logs
                    await this.createAuditLogs();
                    
                    // 21. Create settings
                    await this.createSettings();
                    
                    this.log('Firebase initialization completed successfully!', 'success');
                    this.updateProgress(this.progress.totalSteps, 'Initialization complete!');
                    
                    // Re-enable buttons
                    if (initBtn) initBtn.disabled = false;
                    if (genBtn) genBtn.disabled = false;
                    
                } catch (error) {
                    console.error('Initialization error:', error);
                    this.log(`Error: ${error.message}`, 'error');
                    
                    // Re-enable buttons on error
                    const initBtn = document.getElementById('initialize-btn');
                    const genBtn = document.getElementById('generate-data-btn');
                    if (initBtn) initBtn.disabled = false;
                    if (genBtn) genBtn.disabled = false;
                }
            }
            
            async createSchool() {
                this.updateProgress(this.progress.completedSteps + 1, 'Creating school...');
                await this.db.collection('schools').doc(this.schoolId).set(this.sampleData.school);
                this.log('School created successfully', 'success');
            }
            
            async createAcademicYears() {
                this.updateProgress(this.progress.completedSteps + 1, 'Creating academic years...');
                for (const year of this.sampleData.academicYears) {
                    await this.db.collection('schools').doc(this.schoolId).collection('academicYears').doc(year.id).set(year);
                }
                this.log(`${this.sampleData.academicYears.length} academic years created`, 'success');
            }
            
            async createClasses() {
                this.updateProgress(this.progress.completedSteps + 1, 'Creating classes...');
                for (const cls of this.sampleData.classes) {
                    await this.db.collection('schools').doc(this.schoolId).collection('classes').doc(cls.id).set(cls);
                }
                this.log(`${this.sampleData.classes.length} classes created`, 'success');
            }
            
            async createSections() {
                this.updateProgress(this.progress.completedSteps + 1, 'Creating sections...');
                for (const section of this.sampleData.sections) {
                    await this.db.collection('schools').doc(this.schoolId).collection('sections').doc(section.id).set(section);
                }
                this.log(`${this.sampleData.sections.length} sections created`, 'success');
            }
            
            async createStudents() {
                this.updateProgress(this.progress.completedSteps + 1, 'Creating students...');
                for (const student of this.sampleData.students) {
                    await this.db.collection('schools').doc(this.schoolId).collection('students').doc(student.id).set(student);
                }
                this.log(`${this.sampleData.students.length} students created`, 'success');
            }
            
            async createEnrollments() {

            updateProgress(completedSteps, currentStep) {
                this.progress.completedSteps = completedSteps;
                this.progress.currentStep = currentStep;
                
                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                const currentStepEl = document.getElementById('current-step');
                
                if (progressFill) {
                    const percentage = (completedSteps / this.progress.totalSteps) * 100;
                    progressFill.style.width = `${percentage}%`;
                }
                
                if (progressText) {
                    progressText.textContent = `${completedSteps}/${this.progress.totalSteps} steps completed`;
                }
                
                if (currentStepEl) {
                    currentStepEl.textContent = currentStep;
                }
            }
            
            log(message, type = 'info') {
                const logContainer = document.getElementById('log-container');
                if (!logContainer) return;
                
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry log-${type}`;
                logEntry.innerHTML = `<span>[${timestamp}]</span> ${message}`;
                
                logContainer.appendChild(logEntry);
                logContainer.scrollTop = logContainer.scrollHeight;
                
                console.log(`[${type.toUpperCase()}] ${message}`);
            }
