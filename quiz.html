<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>StudentPlus - MCQ Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* GLOBAL RESET & BOX SIZING */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* DISABLE TEXT SELECTION & COPY GLOBALLY */
        html, body, div, span, p, h1, h2, h3, h4, h5, h6, label, button, select, input, .option-container, .question-text, .q-tag {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Allow input fields to remain functional (typing), but selection/copy still prevented via JS+CSS */
        input, select, textarea, button {
            -webkit-user-select: none;
            user-select: none;
        }

        /* HIDE SCROLLBAR (keep scrolling functional) */
        html {
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            background-color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px 0 60px 0;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-y;          /* Disables pinch-zoom while preserving vertical scroll */
            position: relative;
        }

        /* Webkit browsers (Chrome, Safari, Edge) - hide scrollbar */
        body::-webkit-scrollbar {
            display: none;
            width: 0;
            background: transparent;
        }

        /* Firefox */
        body {
            scrollbar-width: none;
        }

        /* Main container: no overflow issues */
        .main-container {
            width: 97%;
            margin: 0 auto;
            background: white;
            border-radius: 4px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 20px 8px;
            max-width: 100%;
            overflow-x: visible;
        }

        /* Logo and Header */
        .logo-text {
            font-family: 'Creepster', system-ui;
            font-size: 2.5rem;
            text-decoration: underline;
            text-align: center;
            margin-bottom: 24px;
            color: #000000;
        }

        /* Form Styles with 4px corners */
        .setup-form {
            max-width: 500px;
            margin: 20px auto 40px auto;
            padding: 24px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            background: #ffffff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-color: #fff;
        }

        .form-input:focus {
            border-color: #000000;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.05);
        }

        .start-btn {
            width: 100%;
            background-color: #000000;
            color: white;
            padding: 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 0.025em;
            border: none;
        }

        .start-btn:hover {
            background-color: #262626;
        }

        /* Header Container with 4px corners */
        .quiz-header {
            background-color: #000000;
            border-radius: 4px;
            padding: 12px 16px;
            margin: 0 4px 24px 4px;
            color: white;
        }

        .header-line {
            padding: 8px 0;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .header-line:not(:last-child) {
            border-bottom: 1px solid #334155;
        }

        .inline-divider {
            width: 1px;
            height: 14px;
            background-color: #475569;
            margin: 0 12px;
        }

        /* Question Styles - Reduced side margins */
        .question-item {
            background-color: #f1f5f9; 
            padding: 16px 12px;
            border-radius: 4px;
            margin: 20px 4px;
        }

        /* QUESTION TAG - BLACK BACKGROUND as requested */
        .q-tag {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .question-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .option-container {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            margin: 6px 0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #ffffff;
        }

        .option-container:hover {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }

        .option-container input {
            margin-right: 12px;
            accent-color: #000000;
            pointer-events: auto;
        }

        .view-solution-btn {
            background-color: #334155;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 12px;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .view-solution-btn:hover {
            opacity: 0.9;
        }

        .solution-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background-color: #ecfdf5;
            border-left: 4px solid #10b981;
            font-size: 0.85rem;
            color: #065f46;
            border-radius: 4px;
        }

        .solution-box.visible {
            display: block;
        }

        #quizSection {
            display: none;
            padding-top: 20px;
        }

        /* Loading and error states */
        .loader {
            text-align: center;
            padding: 40px;
            font-size: 1rem;
            color: #4b5563;
        }

        .error-message {
            background-color: #fee2e2;
            border-left: 4px solid #ef4444;
            padding: 12px;
            margin: 20px 4px;
            border-radius: 4px;
            color: #991b1b;
        }

        /* Ensure no accidental horizontal overflow */
        img, svg, iframe {
            max-width: 100%;
        }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false" onselectstart="return false">

    <div class="main-container">
        <!-- Form Section -->
        <div id="setupSection" class="setup-form">
            <h1 class="logo-text">StudentPlus</h1>
            
            <div class="form-group">
                <label class="form-label">Select Course</label>
                <select id="courseSelect" class="form-input">
                    <option value="CEE">CEE</option>
                    <option value="NEB">NEB</option>
                    <option value="IOE">IOE</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Select Subject</label>
                <select id="subjectSelect" class="form-input">
                    <option value="Zoology">Zoology</option>
                    <option value="Botany">Botany</option>
                    <option value="Physics">Physics</option>
                    <option value="Chemistry">Chemistry</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Select Chapter</label>
                <select id="chapterSelect" class="form-input">
                    <option value="Gymnosperm">Gymnosperm</option>
                    <option value="Cell Biology">Cell Biology</option>
                    <option value="Genetics">Genetics</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">No. of questions</label>
                <input type="number" id="qCount" class="form-input" value="14" min="1" max="100">
            </div>
            <button class="start-btn" onclick="startQuiz()">Proceed</button>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection">
            <div class="quiz-header" id="quizHeader">
                <div class="header-line">
                    <span id="displayCourse"></span>
                    <div class="inline-divider"></div>
                    <span id="displaySubject"></span>
                </div>
                <div id="displayChapter" class="header-line"></div>
                <div id="displayTotal" class="header-line"></div>
            </div>
            
            <div id="questionsContainer">
                <!-- Questions will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script>
        // ---------- DISABLE ZOOM & COPY PROTECTION (same as before) ----------
        function disableZoomShortcuts(e) {
            if (e.ctrlKey || e.metaKey) {
                if (e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 48 || e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0') {
                    e.preventDefault();
                    return false;
                }
            }
        }
        window.addEventListener('wheel', function(e) {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                return false;
            }
        }, { passive: false });
        document.addEventListener('keydown', disableZoomShortcuts);
        let lastTouchEnd = 0;
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) event.preventDefault();
        }, { passive: false });
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) event.preventDefault();
            lastTouchEnd = now;
        }, false);
        
        function blockCopyEvent(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        document.addEventListener('copy', blockCopyEvent);
        document.addEventListener('cut', blockCopyEvent);
        document.addEventListener('paste', blockCopyEvent);
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });
        document.body.style.webkitTouchCallout = 'none';
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });
        const allInteractive = document.querySelectorAll('input, select, button, .option-container');
        allInteractive.forEach(el => {
            el.addEventListener('selectstart', (e) => e.preventDefault());
            el.addEventListener('drag', (e) => e.preventDefault());
        });
        
        // ---------- BACKEND API URL ----------
        const API_BASE = 'https://dilshadalmm.onrender.com';
        
        // Helper to show/hide loading indicator
        function showLoading(show) {
            let loader = document.getElementById('loadingIndicator');
            if (!loader && show) {
                loader = document.createElement('div');
                loader.id = 'loadingIndicator';
                loader.className = 'loader';
                loader.textContent = 'Loading questions...';
                const container = document.getElementById('questionsContainer');
                container.innerHTML = '';
                container.appendChild(loader);
            } else if (loader && !show) {
                loader.remove();
            }
        }
        
        // Toggle solution visibility
        function toggleSolution(questionIndex) {
            const solutionDiv = document.getElementById(`solution-${questionIndex}`);
            const btn = document.getElementById(`toggleBtn-${questionIndex}`);
            if (solutionDiv.classList.contains('visible')) {
                solutionDiv.classList.remove('visible');
                btn.textContent = 'View Solution';
            } else {
                solutionDiv.classList.add('visible');
                btn.textContent = 'Hide Solution';
            }
        }
        
        // Render questions dynamically
        function renderQuestions(questions) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            
            if (!questions || questions.length === 0) {
                container.innerHTML = '<div class="error-message">No questions found for the selected criteria. Please try different options.</div>';
                return;
            }
            
            questions.forEach((q, idx) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-item';
                
                // Question tag and text
                const qTag = document.createElement('div');
                qTag.className = 'q-tag';
                qTag.textContent = `Question ${idx + 1}`;
                
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.textContent = q.questionText || '';
                
                // Options container
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options-list';
                
                // If there's a question image, display it
                if (q.questionImageUrl) {
                    const img = document.createElement('img');
                    img.src = q.questionImageUrl;
                    img.alt = 'Question illustration';
                    img.style.maxWidth = '100%';
                    img.style.marginBottom = '12px';
                    img.style.borderRadius = '4px';
                    optionsDiv.appendChild(img);
                }
                
                // Create radio options
                const options = q.options || [];
                options.forEach((opt, optIdx) => {
                    const label = document.createElement('label');
                    label.className = 'option-container';
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q_${idx}`;
                    radio.value = optIdx;
                    const span = document.createElement('span');
                    span.textContent = ` ${String.fromCharCode(97 + optIdx)}. ${opt}`; // a., b., c., d.
                    label.appendChild(radio);
                    label.appendChild(span);
                    optionsDiv.appendChild(label);
                });
                
                // Solution button and box
                const solutionBtn = document.createElement('button');
                solutionBtn.className = 'view-solution-btn';
                solutionBtn.id = `toggleBtn-${idx}`;
                solutionBtn.textContent = 'View Solution';
                solutionBtn.onclick = () => toggleSolution(idx);
                
                const solutionDiv = document.createElement('div');
                solutionDiv.id = `solution-${idx}`;
                solutionDiv.className = 'solution-box';
                
                // Build solution content
                let solutionHtml = '';
                if (q.solutionText) {
                    solutionHtml += `<p><strong>Explanation:</strong> ${q.solutionText}</p>`;
                }
                // Optionally show correct answer index (if desired)
                if (q.correctIndex !== undefined && options[q.correctIndex]) {
                    solutionHtml += `<p><strong>Correct Answer:</strong> ${String.fromCharCode(65 + q.correctIndex)}. ${options[q.correctIndex]}</p>`;
                }
                if (q.solutionImageUrl) {
                    solutionHtml += `<img src="${q.solutionImageUrl}" alt="Solution illustration" style="max-width:100%; margin-top:10px; border-radius:4px;">`;
                }
                solutionDiv.innerHTML = solutionHtml;
                
                // Assemble question
                questionDiv.appendChild(qTag);
                questionDiv.appendChild(qText);
                questionDiv.appendChild(optionsDiv);
                questionDiv.appendChild(solutionBtn);
                questionDiv.appendChild(solutionDiv);
                
                container.appendChild(questionDiv);
            });
        }
        
        // Main quiz start: fetch from backend
        async function startQuiz() {
            // Get form values
            const course = document.getElementById('courseSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const chapter = document.getElementById('chapterSelect').value;
            const limit = document.getElementById('qCount').value;
            
            // Validate
            if (!course || !subject || !chapter) {
                alert('Please fill all fields');
                return;
            }
            const limitNum = parseInt(limit, 10);
            if (isNaN(limitNum) || limitNum < 1) {
                alert('Please enter a valid number of questions (minimum 1)');
                return;
            }
            
            // Show loading in quiz section
            const quizSection = document.getElementById('quizSection');
            quizSection.style.display = 'block';
            document.getElementById('displayCourse').textContent = course;
            document.getElementById('displaySubject').textContent = subject;
            document.getElementById('displayChapter').textContent = chapter;
            document.getElementById('displayTotal').textContent = `Total ${limitNum} questions`;
            
            // Clear previous content and show loader
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '<div class="loader">Loading questions...</div>';
            
            // Scroll to quiz section
            setTimeout(() => quizSection.scrollIntoView({ behavior: 'smooth', block: 'start' }), 10);
            
            try {
                // Build query parameters
                const params = new URLSearchParams({
                    className: course,
                    subject: subject,
                    chapter: chapter,
                    limit: limitNum
                });
                const url = `${API_BASE}/api/quiz?${params.toString()}`;
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('No questions found for the selected criteria.');
                    } else {
                        throw new Error(`Server error: ${response.status}`);
                    }
                }
                
                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Failed to load questions');
                }
                
                const questions = data.questions || [];
                if (questions.length === 0) {
                    throw new Error('No questions available.');
                }
                
                // Render the questions
                renderQuestions(questions);
                
            } catch (error) {
                console.error('Quiz fetch error:', error);
                container.innerHTML = `<div class="error-message">${error.message}</div>`;
            }
        }
        
        // Additional safety: remove any leftover hardcoded questions from the container (none initially)
        // Ensure that the quiz section starts hidden
        document.getElementById('quizSection').style.display = 'none';
    </script>
</body>
</html>
