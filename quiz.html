<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>StudentPlus • Terminal Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- KaTeX CSS and JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
    
    <style>
        /* ---------- GLOBAL NO-SCROLLBAR + NO SELECT + PROTECTION ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        input, select, textarea, button {
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        html, body {
            scrollbar-width: none;          /* Firefox */
            -ms-overflow-style: none;       /* IE/Edge */
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }
        body::-webkit-scrollbar {
            display: none;                  /* Chrome/Safari/Opera */
            width: 0;
            background: transparent;
        }
        body {
            background-color: #020617;
            font-family: 'Inter', system-ui, sans-serif;
            touch-action: pan-y;
        }
        /* custom scrollbar hidden for any internal containers */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
        
        /* animated card / modal */
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-modal { animation: modalFadeIn 0.2s ease-out forwards; }
        .mode-btn-active {
            background-color: black !important;
            color: white !important;
            border-color: black !important;
        }
        .preview-box {
            width: 100%;
            max-height: 100px;
            object-fit: contain;
            border-radius: 12px;
            margin-top: 4px;
            border: 1.5px solid #000;
        }
        /* quiz container custom styling */
        .quiz-card {
            background-color: #fefce8;
            border: 2px solid black;
            border-radius: 1rem;
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
            padding: 20px 12px;
            margin-top: 24px;
        }
        .question-item {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 18px 16px;
            margin: 24px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .option-container {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 60px;
            font-size: 0.85rem;
            cursor: pointer;
            background-color: #ffffff;
            transition: all 0.2s;
        }
        .option-container:hover { background-color: #f8fafc; border-color: #000; }
        .option-container input { margin-right: 12px; accent-color: #000000; }
        .option-container.correct-bg { background-color: #d1fae5; border-color: #10b981; }
        .option-container.wrong-bg { background-color: #fee2e2; border-color: #ef4444; }
        .action-btn {
            background-color: #334155;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .submit-btn { background-color: #059669; }
        .text-solution-btn, .video-solution-btn { background-color: #4b5563; }
        .solution-box {
            padding: 14px;
            background-color: #ecfdf5;
            border-left: 4px solid #10b981;
            border-radius: 16px;
        }
        .correct-answer-box {
            padding: 12px 14px;
            background-color: #fef9c3;
            border-left: 4px solid #eab308;
            border-radius: 16px;
            margin-top: 10px;
        }
        .video-container iframe, .video-container video {
            width: 100%;
            border-radius: 16px;
            aspect-ratio: 16/9;
        }
        .katex { font-size: 1.05em; }
        .quiz-header {
            background-color: #000000;
            border-radius: 60px;
            padding: 12px 20px;
            margin-bottom: 24px;
            color: white;
        }
        .form-input {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid black;
            border-radius: 60px;
            background: white;
            font-weight: 600;
        }
        /* overlay dropdown for dummy modes */
        #dropdown-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false" onselectstart="return false">

    <!-- TOP DECORATIVE SECTION -->
    <section class="bg-[#0f172a] h-24 flex items-end justify-center pb-4">
        <div class="flex gap-4 opacity-20">
            <div class="w-12 h-1 bg-white rounded-full"></div>
            <div class="w-12 h-1 bg-white rounded-full"></div>
            <div class="w-12 h-1 bg-white rounded-full"></div>
        </div>
    </section>

    <!-- MAIN DYNAMIC AREA -->
    <main class="flex-grow flex items-center justify-center p-4 bg-[#020617] relative">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_#1e3a8a20,_transparent)]"></div>
        
        <div id="app" class="w-full max-w-[700px] z-10">
            <!-- MODE SELECTION CARD (always visible until quiz starts) -->
            <div id="form-card" class="bg-zinc-50 rounded-xl border-[2px] border-black p-6 sm:p-8 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all">
                <!-- Branding -->
                <div class="flex flex-col items-center gap-2 mb-6">
                    <div class="h-12 w-12 flex items-center justify-center bg-white border-[1.5px] border-black rounded-lg overflow-hidden p-1.5">
                        <img src="https://i.postimg.cc/y88hFhh3/20260311-205800-0000.png" alt="Logo" class="h-full w-full object-contain">
                    </div>
                    <h1 class="creepster text-black text-3xl tracking-wide">StudentPlus</h1>
                    <div class="w-20 h-[2px] bg-black"></div>
                </div>

                <!-- MODE BUTTONS (6 modes) -->
                <div class="flex flex-col gap-3 mb-6">
                    <div class="flex items-center gap-3">
                        <button onclick="setActiveMode('Lecture')" id="mode-Lecture" class="flex-1 py-1.5 border-[1.5px] border-black text-[10px] font-black uppercase tracking-widest rounded-full bg-transparent text-black transition-all">Lecture</button>
                        <button onclick="setActiveMode('Module')" id="mode-Module" class="flex-1 py-1.5 border-[1.5px] border-black text-[10px] font-black uppercase tracking-widest rounded-full bg-transparent text-black transition-all">Module</button>
                        <button onclick="setActiveMode('Question')" id="mode-Question" class="flex-1 py-1.5 border-[1.5px] border-black text-[10px] font-black uppercase tracking-widest rounded-full bg-transparent text-black transition-all">Question</button>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="setActiveMode('Solution')" id="mode-Solution" class="flex-1 py-1.5 border-[1.5px] border-black text-[10px] font-black uppercase tracking-widest rounded-full bg-transparent text-black transition-all">Solution</button>
                        <button onclick="setActiveMode('Live Class')" id="mode-Live Class" class="flex-1 py-1.5 border-[1.5px] border-black text-[10px] font-black uppercase tracking-widest rounded-full bg-transparent text-black transition-all">Live Class</button>
                        <button onclick="setActiveMode('Exam')" id="mode-Exam" class="flex-1 py-1.5 border-[1.5px] border-black text-[10px] font-black uppercase tracking-widest rounded-full bg-transparent text-black transition-all">Exam</button>
                    </div>
                </div>

                <!-- DYNAMIC FORM CONTAINER (changes based on mode) -->
                <div id="form-container" class="flex flex-col"></div>

                <!-- PROCEED BUTTON -->
                <div class="pt-4 flex justify-center">
                    <button id="proceed-btn" disabled class="w-full py-3.5 rounded-full text-[11px] font-black uppercase tracking-[0.4em] transition-all border-[2px] bg-white text-zinc-300 border-zinc-200 cursor-not-allowed">
                        Proceed
                    </button>
                </div>
            </div>

            <!-- QUIZ SECTION (hidden by default, shows after Question mode proceed) -->
            <div id="quizSection" style="display: none;">
                <div class="quiz-card">
                    <div class="quiz-header" id="quizHeader">
                        <div class="header-line flex items-center gap-3 text-sm">
                            <span id="displayCourse" class="font-bold"></span>
                            <div class="w-1 h-1 bg-white rounded-full"></div>
                            <span id="displaySubject"></span>
                        </div>
                        <div id="displayChapter" class="header-line text-sm mt-1"></div>
                        <div id="displayTotal" class="header-line text-sm mt-1"></div>
                    </div>
                    <div id="questionsContainer">
                        <!-- questions injected here -->
                    </div>
                    <!-- reset button inside quiz -->
                    <div class="flex justify-center mt-8">
                        <button id="quiz-reset-btn" class="bg-black text-white px-8 py-2 rounded-full text-xs font-black uppercase tracking-wider hover:bg-zinc-800 transition">⟳ Reset Terminal</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- BOTTOM DECORATION -->
    <section class="bg-[#1e1b4b] h-32 flex items-start justify-center pt-6">
        <div class="flex flex-col items-center gap-2 opacity-30">
            <div class="h-2 w-32 border border-white/50 rounded-full"></div>
            <div class="h-2 w-24 border border-white/30 rounded-full"></div>
        </div>
    </section>

    <!-- GLOBAL DROPDOWN MODAL (for dummy modes only) -->
    <div id="dropdown-overlay" class="hidden" onclick="closeDummyDropdown()">
        <div id="dropdown-modal" class="w-full max-w-[320px] bg-white border-[2px] border-black rounded-[4px] overflow-hidden animate-modal" onclick="event.stopPropagation()">
            <div id="dropdown-list" class="flex flex-col max-h-[60vh] overflow-y-auto no-scrollbar"></div>
        </div>
    </div>

    <script>
        // ======================== SECURITY / COPY PROTECTION ========================
        function disableZoomShortcuts(e) {
            if (e.ctrlKey || e.metaKey) {
                if (e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 48 || e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')
                    e.preventDefault();
            }
        }
        window.addEventListener('wheel', function(e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
        document.addEventListener('keydown', disableZoomShortcuts);
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('paste', e => e.preventDefault());
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        document.addEventListener('keydown', e => { if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'u')) e.preventDefault(); });
        
        // ======================== BACKEND API ========================
        const API_BASE = 'https://dilshadalmm.onrender.com';
        
        // Helper: newlines to <br>
        function replaceNewlinesWithBr(text) {
            if (!text) return text;
            return text.replace(/\r?\n/g, '<br>');
        }
        
        // KaTeX rendering
        function renderMathInElementWithDelay(element) {
            if (typeof renderMathInElement === 'function') {
                try {
                    renderMathInElement(element, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                } catch(e) { console.warn(e); }
            } else {
                setTimeout(() => renderMathInElementWithDelay(element), 200);
            }
        }
        
        // ---------- QUIZ RENDER LOGIC (fully preserved) ----------
        function renderQuestions(questions) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            if (!questions || questions.length === 0) {
                container.innerHTML = '<div class="error-message p-4 bg-red-100 border-l-4 border-red-600">No questions found.</div>';
                return;
            }
            questions.forEach((q, idx) => {
                const formattedQuestionText = replaceNewlinesWithBr(q.questionText);
                const formattedOptions = q.options.map(opt => replaceNewlinesWithBr(opt));
                const formattedSolutionText = q.solutionText ? replaceNewlinesWithBr(q.solutionText) : null;
                
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-item';
                
                const qTag = document.createElement('div');
                qTag.className = 'q-tag inline-block bg-black text-white text-[0.65rem] font-black px-3 py-1 rounded-full mb-2';
                qTag.textContent = `Q${idx+1}`;
                
                const qText = document.createElement('div');
                qText.className = 'question-text font-semibold text-gray-800 mb-3 text-base';
                qText.innerHTML = formattedQuestionText;
                
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options-list';
                if (q.questionImageUrl) {
                    const img = document.createElement('img');
                    img.src = q.questionImageUrl;
                    img.style.maxWidth = '100%';
                    img.style.borderRadius = '12px';
                    img.style.marginBottom = '12px';
                    optionsDiv.appendChild(img);
                }
                
                const optionContainers = [];
                formattedOptions.forEach((opt, optIdx) => {
                    const label = document.createElement('label');
                    label.className = 'option-container';
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q_${idx}`;
                    radio.value = optIdx;
                    const span = document.createElement('span');
                    span.innerHTML = opt;
                    label.appendChild(radio);
                    label.appendChild(span);
                    optionsDiv.appendChild(label);
                    optionContainers.push(label);
                });
                
                const actionRow = document.createElement('div');
                actionRow.className = 'action-buttons flex gap-2 mt-3';
                const submitBtn = document.createElement('button');
                submitBtn.textContent = '✓ SUBMIT';
                submitBtn.className = 'action-btn submit-btn';
                const textSolutionBtn = document.createElement('button');
                textSolutionBtn.textContent = '📖 TEXT SOLUTION';
                textSolutionBtn.className = 'action-btn text-solution-btn';
                textSolutionBtn.disabled = true;
                const videoSolutionBtn = document.createElement('button');
                videoSolutionBtn.textContent = '▶ VIDEO SOLUTION';
                videoSolutionBtn.className = 'action-btn video-solution-btn';
                videoSolutionBtn.disabled = true;
                actionRow.appendChild(submitBtn);
                actionRow.appendChild(textSolutionBtn);
                actionRow.appendChild(videoSolutionBtn);
                
                const correctAnswerBox = document.createElement('div');
                correctAnswerBox.className = 'correct-answer-box';
                correctAnswerBox.innerHTML = `<span class="font-bold">Correct Answer:</span> <span>${formattedOptions[q.correctIndex] || 'N/A'}</span>`;
                correctAnswerBox.style.display = 'none';
                
                const textSolutionContainer = document.createElement('div');
                textSolutionContainer.className = 'solution-container mt-3';
                textSolutionContainer.style.display = 'none';
                if (formattedSolutionText) {
                    const textBox = document.createElement('div');
                    textBox.className = 'solution-box';
                    textBox.innerHTML = `<p>${formattedSolutionText}</p>`;
                    if (q.solutionImageUrl) {
                        const img = document.createElement('img');
                        img.src = q.solutionImageUrl;
                        img.className = 'mt-2 rounded-lg max-w-full';
                        textBox.appendChild(img);
                    }
                    textSolutionContainer.appendChild(textBox);
                }
                
                const videoSolutionContainer = document.createElement('div');
                videoSolutionContainer.className = 'solution-container mt-3';
                videoSolutionContainer.style.display = 'none';
                if (q.solutionVideoUrl) {
                    const videoElem = document.createElement('div');
                    videoElem.className = 'video-container';
                    const youtubeEmbed = (url) => {
                        const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?#]+)/);
                        if (match) return `https://www.youtube.com/embed/${match[1]}`;
                        return null;
                    };
                    const embed = youtubeEmbed(q.solutionVideoUrl);
                    if (embed) {
                        const iframe = document.createElement('iframe');
                        iframe.src = embed;
                        iframe.allowFullscreen = true;
                        iframe.style.width = '100%';
                        iframe.style.aspectRatio = '16/9';
                        videoElem.appendChild(iframe);
                    } else {
                        const vid = document.createElement('video');
                        vid.controls = true;
                        vid.src = q.solutionVideoUrl;
                        vid.style.width = '100%';
                        videoElem.appendChild(vid);
                    }
                    videoSolutionContainer.appendChild(videoElem);
                }
                
                let submitted = false;
                submitBtn.onclick = () => {
                    if (submitted) return;
                    const selectedRadio = document.querySelector(`input[name="q_${idx}"]:checked`);
                    if (!selectedRadio) { alert('Select an answer'); return; }
                    const selectedIndex = parseInt(selectedRadio.value);
                    const isCorrect = (selectedIndex === q.correctIndex);
                    optionContainers.forEach((container, i) => {
                        if (i === q.correctIndex) container.classList.add('correct-bg');
                        else if (i === selectedIndex && !isCorrect) container.classList.add('wrong-bg');
                    });
                    correctAnswerBox.style.display = 'flex';
                    if (formattedSolutionText) textSolutionBtn.disabled = false;
                    if (q.solutionVideoUrl) videoSolutionBtn.disabled = false;
                    submitted = true;
                    submitBtn.disabled = true;
                    renderMathInElementWithDelay(correctAnswerBox);
                };
                textSolutionBtn.onclick = () => {
                    if (!submitted) return;
                    const visible = textSolutionContainer.style.display === 'block';
                    textSolutionContainer.style.display = visible ? 'none' : 'block';
                    if (visible === false) videoSolutionContainer.style.display = 'none';
                    renderMathInElementWithDelay(textSolutionContainer);
                };
                videoSolutionBtn.onclick = () => {
                    if (!submitted) return;
                    const visible = videoSolutionContainer.style.display === 'block';
                    videoSolutionContainer.style.display = visible ? 'none' : 'block';
                    if (visible === false) textSolutionContainer.style.display = 'none';
                    renderMathInElementWithDelay(videoSolutionContainer);
                };
                
                questionDiv.appendChild(qTag);
                questionDiv.appendChild(qText);
                questionDiv.appendChild(optionsDiv);
                questionDiv.appendChild(actionRow);
                questionDiv.appendChild(correctAnswerBox);
                questionDiv.appendChild(textSolutionContainer);
                questionDiv.appendChild(videoSolutionContainer);
                container.appendChild(questionDiv);
            });
            renderMathInElementWithDelay(container);
        }
        
        // ---------- QUESTION MODE QUIZ FETCH ----------
        async function executeQuizFetch() {
            const course = document.getElementById('courseSelectQ')?.value;
            const subject = document.getElementById('subjectSelectQ')?.value;
            const chapter = document.getElementById('chapterSelectQ')?.value;
            const limit = document.getElementById('qCountInputQ')?.value;
            if (!course || !subject || !chapter) { alert('Please select course, subject and chapter'); return false; }
            const limitNum = parseInt(limit, 10);
            if (isNaN(limitNum) || limitNum < 1) { alert('Valid question count required'); return false; }
            
            document.getElementById('displayCourse').textContent = course;
            document.getElementById('displaySubject').textContent = subject;
            document.getElementById('displayChapter').textContent = chapter;
            document.getElementById('displayTotal').textContent = `Total ${limitNum} questions`;
            
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '<div class="loader text-center py-10">⚡ Loading questions...</div>';
            try {
                const params = new URLSearchParams({ className: course, subject, chapter, limit: limitNum });
                const response = await fetch(`${API_BASE}/api/quiz?${params.toString()}`);
                if (!response.ok) throw new Error('No questions / server error');
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Failed');
                renderQuestions(data.questions || []);
                return true;
            } catch (err) {
                container.innerHTML = `<div class="error-message bg-red-100 p-4 rounded-2xl">❌ ${err.message}</div>`;
                return false;
            }
        }
        
        // ---------- MODE MANAGEMENT & UI (modern terminal) ----------
        let currentMode = 'Question';   // default
        let dummyImageData = null;
        let dummyQuestionText = '';
        
        // dummy data for non-question modes (UI only)
        const dummyEducationalData = {
            "Computer Science": { "Data Structures": ["Arrays", "Trees"], "Web": ["HTML", "React"] },
            "Engineering": { "Math": ["Calculus", "Linear"], "Physics": ["Mechanics"] },
            "Medical": { "Anatomy": ["Skeletal"], "Genetics": ["DNA"] }
        };
        let dummyState = { course: '', subject: '', chapter: '' };
        
        function setActiveMode(mode) {
            currentMode = mode;
            // update active button style
            const modesList = ["Lecture", "Module", "Question", "Solution", "Live Class", "Exam"];
            modesList.forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (btn) {
                    if (m === mode) btn.classList.add('mode-btn-active');
                    else btn.classList.remove('mode-btn-active');
                }
            });
            // reset dummy data when mode changes
            dummyImageData = null;
            dummyQuestionText = '';
            dummyState = { course: '', subject: '', chapter: '' };
            renderDynamicForm();
            validateProceedButton();
        }
        
        function renderDynamicForm() {
            const container = document.getElementById('form-container');
            container.innerHTML = '';
            if (currentMode === 'Question') {
                // REAL QUIZ FORM: native selects with backend data
                const html = `
                    <div class="mb-4">
                        <label class="block text-[10px] font-black uppercase tracking-wider mb-1">Course</label>
                        <select id="courseSelectQ" class="form-input text-sm"> <option>Loading courses...</option> </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-[10px] font-black uppercase tracking-wider mb-1">Subject</label>
                        <select id="subjectSelectQ" class="form-input text-sm" disabled> <option>Select course first</option> </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-[10px] font-black uppercase tracking-wider mb-1">Chapter</label>
                        <select id="chapterSelectQ" class="form-input text-sm" disabled> <option>Select subject first</option> </select>
                    </div>
                    <div class="mb-2">
                        <label class="block text-[10px] font-black uppercase tracking-wider mb-1">No. of questions</label>
                        <input type="number" id="qCountInputQ" class="form-input text-sm" value="10" min="1" max="50">
                    </div>
                `;
                container.innerHTML = html;
                // attach backend logic to these selects
                const courseSelect = document.getElementById('courseSelectQ');
                const subjectSelect = document.getElementById('subjectSelectQ');
                const chapterSelect = document.getElementById('chapterSelectQ');
                
                async function loadCourses() {
                    try {
                        const res = await fetch(`${API_BASE}/api/classes`);
                        const data = await res.json();
                        if (data.success && data.classes) {
                            courseSelect.innerHTML = '<option value="">Select course</option>';
                            data.classes.forEach(c => { courseSelect.innerHTML += `<option value="${c}">${c}</option>`; });
                        } else throw new Error();
                    } catch(e) { courseSelect.innerHTML = '<option>Error loading</option>'; }
                }
                async function loadSubjects(course) {
                    subjectSelect.disabled = true;
                    subjectSelect.innerHTML = '<option>Loading...</option>';
                    chapterSelect.innerHTML = '<option>Select subject first</option>';
                    chapterSelect.disabled = true;
                    try {
                        const res = await fetch(`${API_BASE}/api/subjects?class=${encodeURIComponent(course)}`);
                        const data = await res.json();
                        if (data.success && data.subjects) {
                            subjectSelect.innerHTML = '<option value="">Select subject</option>';
                            data.subjects.forEach(s => { subjectSelect.innerHTML += `<option value="${s}">${s}</option>`; });
                            subjectSelect.disabled = false;
                        } else throw new Error();
                    } catch(e) { subjectSelect.innerHTML = '<option>Error</option>'; }
                }
                async function loadChapters(course, subject) {
                    chapterSelect.disabled = true;
                    chapterSelect.innerHTML = '<option>Loading...</option>';
                    try {
                        const res = await fetch(`${API_BASE}/api/chapters?class=${encodeURIComponent(course)}&subject=${encodeURIComponent(subject)}`);
                        const data = await res.json();
                        if (data.success && data.chapters) {
                            chapterSelect.innerHTML = '<option value="">Select chapter</option>';
                            data.chapters.forEach(ch => { chapterSelect.innerHTML += `<option value="${ch}">${ch}</option>`; });
                            chapterSelect.disabled = false;
                        } else throw new Error();
                    } catch(e) { chapterSelect.innerHTML = '<option>Error</option>'; }
                }
                courseSelect.onchange = () => { if(courseSelect.value) loadSubjects(courseSelect.value); else { subjectSelect.disabled=true; subjectSelect.innerHTML='<option>Select course first</option>'; chapterSelect.disabled=true; } validateProceedButton(); };
                subjectSelect.onchange = () => { if(courseSelect.value && subjectSelect.value) loadChapters(courseSelect.value, subjectSelect.value); validateProceedButton(); };
                chapterSelect.onchange = () => validateProceedButton();
                document.getElementById('qCountInputQ').oninput = () => validateProceedButton();
                loadCourses();
            } 
            else {
                // dummy UI for other modes (Lecture, Module, Solution, Live Class, Exam) – no backend, only clickable transitions
                if (currentMode === 'Solution') {
                    container.innerHTML = `
                        <div class="mb-4"><label class="text-[10px] font-black uppercase">Upload Image</label>
                        <div class="border-2 border-dashed border-black rounded-2xl p-4 text-center cursor-pointer" id="dummyImageUploader">
                            ${dummyImageData ? `<img src="${dummyImageData}" class="preview-box">` : '<span class="text-zinc-400 text-sm">---</span>'}
                        </div>
                        <input type="file" id="dummyFileInput" class="hidden" accept="image/*">
                        </div>
                        <div><label class="text-[10px] font-black uppercase">Enter Question</label>
                        <input type="text" id="dummyQuestionText" class="w-full border-2 border-black rounded-full px-5 py-2.5 text-sm font-black text-center" placeholder="---" value="${dummyQuestionText}">
                        </div>
                    `;
                    const uploadDiv = document.getElementById('dummyImageUploader');
                    const fileInput = document.getElementById('dummyFileInput');
                    const textInput = document.getElementById('dummyQuestionText');
                    uploadDiv.onclick = () => fileInput.click();
                    fileInput.onchange = (e) => {
                        if(e.target.files[0]) {
                            const reader = new FileReader();
                            reader.onload = (ev) => { dummyImageData = ev.target.result; renderDynamicForm(); };
                            reader.readAsDataURL(e.target.files[0]);
                        }
                    };
                    textInput.oninput = (e) => { dummyQuestionText = e.target.value; validateProceedButton(); };
                } 
                else if (currentMode === 'Live Class' || currentMode === 'Exam') {
                    container.innerHTML = `<div class="mb-4"><label class="text-[10px] font-black uppercase">Select Course</label>
                    <div id="dummyCourseBox" class="w-full border-2 border-black rounded-full px-5 py-2.5 text-center text-sm font-black cursor-pointer bg-white">${dummyState.course || '---'}</div></div>`;
                    document.getElementById('dummyCourseBox')?.addEventListener('click', () => {
                        const options = Object.keys(dummyEducationalData);
                        showDummyDropdown(options, (val) => { dummyState.course = val; renderDynamicForm(); validateProceedButton(); });
                    });
                }
                else { // Lecture / Module
                    container.innerHTML = `
                        <div class="mb-3"><label class="text-[10px] font-black uppercase">Course</label><div id="dummyCourse" class="border-2 border-black rounded-full px-5 py-2.5 text-center cursor-pointer bg-white">${dummyState.course || '---'}</div></div>
                        <div class="mb-3"><label class="text-[10px] font-black uppercase">Subject</label><div id="dummySubject" class="border-2 border-black rounded-full px-5 py-2.5 text-center cursor-pointer bg-white ${!dummyState.course ? 'opacity-40' : ''}">${dummyState.subject || '---'}</div></div>
                        <div><label class="text-[10px] font-black uppercase">Chapter</label><div id="dummyChapter" class="border-2 border-black rounded-full px-5 py-2.5 text-center cursor-pointer bg-white ${!dummyState.subject ? 'opacity-40' : ''}">${dummyState.chapter || '---'}</div></div>
                    `;
                    const courseDiv = document.getElementById('dummyCourse');
                    const subjectDiv = document.getElementById('dummySubject');
                    const chapterDiv = document.getElementById('dummyChapter');
                    courseDiv?.addEventListener('click', () => {
                        showDummyDropdown(Object.keys(dummyEducationalData), (val) => { dummyState.course = val; dummyState.subject = ''; dummyState.chapter = ''; renderDynamicForm(); validateProceedButton(); });
                    });
                    subjectDiv?.addEventListener('click', () => {
                        if(!dummyState.course) return;
                        const subs = Object.keys(dummyEducationalData[dummyState.course] || {});
                        showDummyDropdown(subs, (val) => { dummyState.subject = val; dummyState.chapter = ''; renderDynamicForm(); validateProceedButton(); });
                    });
                    chapterDiv?.addEventListener('click', () => {
                        if(!dummyState.subject || !dummyState.course) return;
                        const chaps = dummyEducationalData[dummyState.course]?.[dummyState.subject] || [];
                        showDummyDropdown(chaps, (val) => { dummyState.chapter = val; renderDynamicForm(); validateProceedButton(); });
                    });
                }
            }
        }
        
        function showDummyDropdown(options, onSelect) {
            const overlay = document.getElementById('dropdown-overlay');
            const list = document.getElementById('dropdown-list');
            list.innerHTML = '';
            options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = `px-6 py-1.5 text-sm font-bold text-left text-black hover:bg-black hover:text-white cursor-pointer transition-colors ${idx !== options.length-1 ? 'border-b border-black/10' : ''}`;
                div.innerText = opt;
                div.onclick = () => { onSelect(opt); closeDummyDropdown(); };
                list.appendChild(div);
            });
            overlay.classList.remove('hidden');
        }
        function closeDummyDropdown() { document.getElementById('dropdown-overlay').classList.add('hidden'); }
        
        function validateProceedButton() {
            const btn = document.getElementById('proceed-btn');
            let isValid = false;
            if (currentMode === 'Question') {
                const course = document.getElementById('courseSelectQ')?.value;
                const subject = document.getElementById('subjectSelectQ')?.value;
                const chapter = document.getElementById('chapterSelectQ')?.value;
                isValid = !!(course && subject && chapter);
            } 
            else if (currentMode === 'Solution') isValid = !!(dummyImageData && dummyQuestionText.trim());
            else if (currentMode === 'Live Class' || currentMode === 'Exam') isValid = !!dummyState.course;
            else isValid = !!(dummyState.course && dummyState.subject && dummyState.chapter);
            
            btn.disabled = !isValid;
            if (isValid) {
                btn.className = "w-full py-3.5 rounded-full text-[11px] font-black uppercase tracking-[0.4em] transition-all border-[2px] bg-black text-white border-black hover:bg-zinc-900 cursor-pointer shadow-sm active:scale-95";
            } else {
                btn.className = "w-full py-3.5 rounded-full text-[11px] font-black uppercase tracking-[0.4em] transition-all border-[2px] bg-white text-zinc-300 border-zinc-200 cursor-not-allowed";
            }
        }
        
        // proceed action: Question mode -> start real quiz, others -> demo alert
        document.getElementById('proceed-btn').onclick = async () => {
            if (currentMode === 'Question') {
                // hide form-card, show quiz section, fetch & render
                document.getElementById('form-card').style.display = 'none';
                document.getElementById('quizSection').style.display = 'block';
                await executeQuizFetch();
            } else {
                alert(`✨ "${currentMode}" mode is in preview — full functionality coming soon. ✨`);
            }
        };
        
        // reset button inside quiz & reset whole terminal
        function resetToForm() {
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('form-card').style.display = 'block';
            // reset mode to Question
            setActiveMode('Question');
            renderDynamicForm();
            validateProceedButton();
        }
        document.getElementById('quiz-reset-btn')?.addEventListener('click', resetToForm);
        // also expose reset globally
        window.resetTerminal = resetToForm;
        
        // initial load
        setActiveMode('Question');
        lucide.createIcons();
    </script>
</body>
</html>
