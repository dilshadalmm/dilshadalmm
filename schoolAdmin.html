            renderStudentInvoices(invoices) {
                if (invoices.length === 0) {
                    return '<p class="text-gray-500">No fee invoices found for this student.</p>';
                }
                
                // Sort invoices by billing year and month (newest first)
                const nepaliMonthOrder = ["Baisakh", "Jestha", "Ashad", "Shrawan", "Bhadra", "Ashwin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];
                
                const sortedInvoices = [...invoices].sort((a, b) => {
                    if (a.billingYear !== b.billingYear) return b.billingYear - a.billingYear;
                    return nepaliMonthOrder.indexOf(b.billingMonth) - nepaliMonthOrder.indexOf(a.billingMonth);
                });
                
                let html = '<div class="space-y-3">';
                
                sortedInvoices.forEach(invoice => {
                    const dueDate = invoice.dueDate?.toDate ? new Date(invoice.dueDate.toDate()) : new Date();
                    const paidAmount = invoice.amountPaid || 0;
                    const balanceDue = invoice.dueAmount || (invoice.totalAmount - paidAmount);
                    const status = invoice.status || 'UNPAID';
                    const statusClass = status === 'PAID' ? 'status-paid' : 
                                      status === 'PARTIALLY_PAID' ? 'status-partial' : 'status-unpaid';
                    const statusText = status === 'PARTIALLY_PAID' ? 'Partial' : status;
                    
                    html += `
                        <div class="flex justify-between items-center p-3 bg-white border border-gray-200">
                            <div>
                                <div class="font-medium">${invoice.invoiceType || 'Fee'} - ${invoice.billingMonth || 'Unknown'}, ${invoice.billingYear || 'Unknown'}</div>
                                <div class="text-sm text-gray-500">
                                    Invoice: ${invoice.invoiceNumber || 'N/A'} | Due: ${dueDate.toLocaleDateString()}
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold">Rs. ${(invoice.totalAmount || 0).toLocaleString()}</div>
                                <div class="text-sm">
                                    <span class="${statusClass} status-badge">${statusText}</span>
                                    ${balanceDue > 0 ? `<div class="text-red-600">Balance Due: Rs. ${balanceDue.toLocaleString()}</div>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                return html;
            }
            
            async updatePaymentForStudent() {
                const studentRegistration = document.getElementById('student-registration').value.trim();
                const amountInput = document.getElementById('pay-amount').value.trim();
                const paymentMethod = document.getElementById('payment-method').value;
                const transactionCode = document.getElementById('transaction-code').value.trim();
                const invoiceType = document.getElementById('invoice-type').value;
                const statusDiv = document.getElementById('payment-status');
                const payBtn = document.getElementById('pay-btn');
                
                if (!studentRegistration) {
                    statusDiv.innerText = "Please enter a Student Registration Number.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                if (!amountInput || parseFloat(amountInput) <= 0) {
                    statusDiv.innerText = "Please enter a valid amount.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                const amount = parseFloat(amountInput);
                
                // Find the student
                const students = this.stateManager.getAllStudents();
                const student = students.find(s => 
                    s.registrationNumber === studentRegistration || s.id === studentRegistration
                );
                
                if (!student) {
                    statusDiv.innerText = "Student not found. Please check the Registration Number.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                payBtn.disabled = true;
                payBtn.innerText = "Processing...";
                statusDiv.innerText = `Updating fee payment for ${student.studentName}...`;
                statusDiv.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-200');
                statusDiv.classList.add('bg-blue-50', 'text-blue-800', 'border-blue-200');
                statusDiv.classList.remove('hidden');
                
                try {
                    // Get current Nepali month and year
                    const currentDate = new Date();
                    const nepaliMonths = ["Baisakh", "Jestha", "Ashad", "Shrawan", "Bhadra", "Ashwin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];
                    const currentMonth = nepaliMonths[currentDate.getMonth()];
                    const currentYear = this.stateManager.currentAcademicYear;
                    
                    // Check if invoice exists for current month and type
                    let invoice = student.invoices?.find(inv => 
                        inv.billingMonth === currentMonth && 
                        inv.billingYear === currentYear &&
                        inv.invoiceType === invoiceType
                    );
                    
                    let invoiceId;
                    
                    // Get class fee structure
                    const classes = this.stateManager.getAllClasses();
                    const studentClass = classes.find(c => c.id === student.classId);
                    const classFeeDescription = studentClass?.classFeeDescription || {};
                    
                    // Calculate appropriate fee amount based on invoice type
                    let invoiceAmount = amount;
                    if (invoiceType === 'Monthly') {
                        invoiceAmount = classFeeDescription['Monthly Tuition Fee'] || 1500;
                    } else if (invoiceType === 'Annual') {
                        invoiceAmount = classFeeDescription['Annual Fee'] || 5000;
                    } else if (invoiceType === 'Exam') {
                        invoiceAmount = classFeeDescription['Exam Fee'] || 1000;
                    } else if (invoiceType === 'Admission') {
                        invoiceAmount = classFeeDescription['Admission Fee'] || 2500;
                    }
                    
                    if (!invoice) {
                        // Create new invoice
                        invoiceId = `INV-${Date.now()}`;
                        const dueAmount = invoiceAmount - amount;
                        const newInvoice = {
                            id: invoiceId,
                            invoiceNumber: `INV-${currentYear}-${String(Date.now()).slice(-6)}`,
                            invoiceType: invoiceType,
                            billingMonth: currentMonth,
                            billingYear: currentYear,
                            items: Object.entries(classFeeDescription)
                                .filter(([key, value]) => {
                                    if (invoiceType === 'Monthly' && key.includes('Monthly')) return true;
                                    if (invoiceType === 'Annual' && key.includes('Annual')) return true;
                                    if (invoiceType === 'Exam' && key.includes('Exam')) return true;
                                    if (invoiceType === 'Admission' && key.includes('Admission')) return true;
                                    return false;
                                })
                                .map(([title, amount]) => ({ title, amount })),
                            subtotal: invoiceAmount,
                            discount: 0,
                            fine: 0,
                            totalAmount: invoiceAmount,
                            amountPaid: amount,
                            dueAmount: dueAmount,
                            status: dueAmount <= 0 ? 'PAID' : (amount > 0 ? 'PARTIALLY_PAID' : 'UNPAID'),
                            dueDate: firebase.firestore.Timestamp.fromDate(new Date(currentDate.getFullYear(), currentDate.getMonth(), 25)),
                            issuedAt: firebase.firestore.Timestamp.now(),
                            createdBy: this.authManager.currentUser?.uid || 'ADMIN',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        
                        // Save invoice to Firestore
                        const invoicePath = this.stateManager.getInvoicesPath(student.classId, student.documentId);
                        await this.db.doc(invoicePath).doc(invoiceId).set(newInvoice);
                        
                        invoice = newInvoice;
                    } else {
                        // Update existing invoice
                        invoiceId = invoice.id;
                        const newPaidAmount = (invoice.amountPaid || 0) + amount;
                        const newDueAmount = (invoice.totalAmount || 0) - newPaidAmount;
                        const newStatus = newDueAmount <= 0 ? 'PAID' : 
                                         newPaidAmount > 0 ? 'PARTIALLY_PAID' : 'UNPAID';
                        
                        // Update invoice in Firestore
                        const invoicePath = this.stateManager.getInvoicesPath(student.classId, student.documentId);
                        await this.db.doc(invoicePath).doc(invoiceId).update({
                            amountPaid: newPaidAmount,
                            dueAmount: newDueAmount,
                            status: newStatus,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        
                        invoice.amountPaid = newPaidAmount;
                        invoice.dueAmount = newDueAmount;
                        invoice.status = newStatus;
                    }
                    
                    // Create payment record
                    const paymentId = `PAY-${Date.now()}`;
                    const paymentData = {
                        id: paymentId,
                        paymentRef: `PAY-${currentYear}-${String(Date.now()).slice(-6)}`,
                        paymentDate: firebase.firestore.Timestamp.now(),
                        paymentMethod: paymentMethod,
                        paidAmount: amount,
                        receivedBy: this.authManager.currentUser?.uid || 'ADMIN',
                        remarks: `${invoiceType} fee payment`,
                        transactionId: transactionCode || `TRX${Date.now()}`,
                        invoiceId: invoiceId,
                        invoiceType: invoiceType,
                        invoiceMonth: currentMonth,
                        invoiceYear: currentYear,
                        recordedAt: firebase.firestore.Timestamp.now()
                    };
                    
                    // Save payment to Firestore
                    const paymentDocPath = this.stateManager.getPaymentsPath(student.classId, student.documentId);
                    await this.db.doc(paymentDocPath).doc(paymentId).set(paymentData);
                    
                    // Update local state
                    const updatedPayments = this.stateManager.getAllPayments();
                    updatedPayments.unshift({
                        ...paymentData,
                        studentId: student.id,
                        studentName: student.studentName,
                        className: student.className,
                        classId: student.classId
                    });
                    this.stateManager.setAllPayments(updatedPayments);
                    
                    // Update student's invoices in local state
                    const updatedStudents = this.stateManager.getAllStudents();
                    const studentIndex = updatedStudents.findIndex(s => s.id === student.id);
                    if (studentIndex !== -1) {
                        // Update existing invoice or add new one if doesn't exist
                        const invoiceIndex = updatedStudents[studentIndex].invoices.findIndex(inv => inv.id === invoiceId);
                        if (invoiceIndex !== -1) {
                            updatedStudents[studentIndex].invoices[invoiceIndex] = invoice;
                        } else {
                            updatedStudents[studentIndex].invoices.push(invoice);
                        }
                        this.stateManager.setAllStudents(updatedStudents);
                    }
                    
                    // Show success message
                    statusDiv.innerHTML = `
                        <div class="flex items-center justify-center gap-2">
                            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>

            async createMonthlyInvoices() {
                const students = this.stateManager.getAllStudents();
                const classes = this.stateManager.getAllClasses();
                
                if (students.length === 0) {
                    this.stateManager.addAlert('warning', 'No students found to create invoices for.');
                    this.renderDashboard();
                    return;
                }
                
                // Get current Nepali month and year
                const currentDate = new Date();
                const nepaliMonths = ["Baisakh", "Jestha", "Ashad", "Shrawan", "Bhadra", "Ashwin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];
                const currentMonth = nepaliMonths[currentDate.getMonth()];
                const currentYear = this.stateManager.currentAcademicYear;
                
                // Calculate due date (25th of current month)
                const dueDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 25);
                
                // Show loading
                const createBtn = document.getElementById('create-monthly-invoices');
                const originalText = createBtn.innerHTML;
                createBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating Fee Invoices...';
                createBtn.disabled = true;
                
                try {
                    let createdCount = 0;
                    let updatedCount = 0;
                    
                    for (const student of students) {
                        // Only create invoices for active students
                        if (student.status !== 'approved') continue;
                        
                        // Get student's class fee structure
                        const studentClass = classes.find(c => c.id === student.classId);
                        const classFeeDescription = studentClass?.classFeeDescription || {};
                        const monthlyFee = classFeeDescription['Monthly Tuition Fee'] || 1500;
                        
                        // Check if invoice already exists for this month
                        const existingInvoice = student.invoices?.find(inv => 
                            inv.billingMonth === currentMonth && 
                            inv.billingYear === currentYear &&
                            inv.invoiceType === 'Monthly'
                        );
                        
                        if (!existingInvoice) {
                            // Create new invoice
                            const invoiceId = `INV-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                            const invoiceData = {
                                id: invoiceId,
                                invoiceNumber: `INV-${currentYear}-${String(createdCount + 1).padStart(4, '0')}`,
                                invoiceType: 'Monthly',
                                billingMonth: currentMonth,
                                billingYear: currentYear,
                                items: Object.entries(classFeeDescription)
                                    .filter(([key]) => key.includes('Monthly'))
                                    .map(([title, amount]) => ({ title, amount })),
                                subtotal: monthlyFee,
                                discount: 0,
                                fine: 0,
                                totalAmount: monthlyFee,
                                amountPaid: 0,
                                dueAmount: monthlyFee,
                                status: 'UNPAID',
                                dueDate: firebase.firestore.Timestamp.fromDate(dueDate),
                                issuedAt: firebase.firestore.Timestamp.now(),
                                createdBy: this.authManager.currentUser?.uid || 'ADMIN',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            };
                            
                            // Save to Firestore
                            const invoicePath = this.stateManager.getInvoicesPath(student.classId, student.documentId);
                            await this.db.doc(invoicePath).doc(invoiceId).set(invoiceData);
                            
                            // Update local state
                            if (!student.invoices) student.invoices = [];
                            student.invoices.push(invoiceData);
                            
                            createdCount++;
                        } else {
                            // Update existing invoice if needed
                            if (existingInvoice.totalAmount !== monthlyFee) {
                                const newDueAmount = monthlyFee - (existingInvoice.amountPaid || 0);
                                const newStatus = newDueAmount <= 0 ? 'PAID' : 
                                                existingInvoice.amountPaid > 0 ? 'PARTIALLY_PAID' : 'UNPAID';
                                
                                const invoicePath = this.stateManager.getInvoicesPath(student.classId, student.documentId);
                                await this.db.doc(invoicePath).doc(existingInvoice.id).update({
                                    totalAmount: monthlyFee,
                                    dueAmount: newDueAmount,
                                    status: newStatus,
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                
                                existingInvoice.totalAmount = monthlyFee;
                                existingInvoice.dueAmount = newDueAmount;
                                existingInvoice.status = newStatus;
                                updatedCount++;
                            }
                        }
                    }
                    
                    // Update local state
                    this.stateManager.setAllStudents(students);
                    
                    // Show success message
                    this.stateManager.addAlert('success', `Successfully created ${createdCount} new monthly fee invoices and updated ${updatedCount} existing invoices for ${currentMonth}, ${currentYear}.`);
                    
                    // Refresh dashboard
                    this.renderDashboard();
                    
                } catch (error) {
                    console.error("Error creating monthly fee invoices:", error);
                    this.stateManager.addAlert('error', 'Failed to create monthly fee invoices. Please try again.');
                    this.renderDashboard();
                } finally {
                    // Reset button
                    createBtn.innerHTML = originalText;
                    createBtn.disabled = false;
                }
            }
            
            async updateStudentStatus(studentId, status) {
                try {
                    // Find student document ID
                    const students = this.stateManager.getAllStudents();
                    const student = students.find(s => s.id === studentId);
                    
                    if (!student) {
                        this.stateManager.addAlert('error', 'Student not found.');
                        return;
                    }
                    
                    // Update in Firestore
                    const studentPath = this.stateManager.getStudentPath(student.classId, student.documentId);
                    await this.db.doc(studentPath).update({
                        status: status,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Update local state
                    const studentIndex = students.findIndex(s => s.id === studentId);
                    if (studentIndex !== -1) {
                        students[studentIndex].status = status;
                        this.stateManager.setAllStudents(students);
                    }
                    
                    // Show success message
                    this.stateManager.addAlert('success', `Student status updated to ${status}.`);
                    
                    // Refresh current view
                    if (this.stateManager.getCurrentView() === 'newRegistrations') {
                        this.renderNewRegistrations();
                    } else if (this.stateManager.getCurrentView() === 'students') {
                        this.renderStudents();
                    } else {

                    }
                    
                } catch (error) {
                    console.error("Error updating student status:", error);
                    this.stateManager.addAlert('error', 'Failed to update student status.');

                const feeInputs = document.querySelectorAll(`.class-fee-input[data-class-id="${classId}"]`);
                const feeStructure = {};
                
                feeInputs.forEach(input => {
                    const feeType = input.dataset.feeType;
                    const value = parseFloat(input.value);
                    if (!isNaN(value) && value >= 0) {
                        feeStructure[feeType] = value;
                    }
                });
                
                try {
                    // Update class document in Firestore
                    const classPath = this.stateManager.getClassPath(classId);
                    await this.db.doc(classPath).update({
                        classFeeDescription: feeStructure,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Update local state
                    const classes = this.stateManager.getAllClasses();
                    const classIndex = classes.findIndex(c => c.id === classId);
                    if (classIndex !== -1) {
                        classes[classIndex].classFeeDescription = feeStructure;
                        this.stateManager.setAllClasses(classes);
                    }
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'Class fee structure saved successfully!');
                    
                } catch (error) {
                    console.error("Error saving class fee settings:", error);
                    this.stateManager.addAlert('error', 'Failed to save class fee structure. Please try again.');
                }
            }

                    const classObj = classes.find(c => c.id === classId);
                    
                    const reportData = {

                        students: classStudents.map(student => ({

                            status: student.status,
                            phone: student.phoneNumber,
                            parentPhone: student.fatherPhone || student.motherPhone
                        }))
                    };
                    
                    const jsonStr = JSON.stringify(reportData, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });

                    a.download = `class-report-${classId}-${new Date().toISOString().split('T')[0]}.json`;

                    document.body.removeChild(a);

                    this.stateManager.addAlert('success', 'Class report exported successfully!');
                    
                } catch (error) {

                    this.stateManager.addAlert('error', 'Failed to export class report.');

            async generateClassFeeReport(classId) {
                try {
                    const students = this.stateManager.getAllStudents();
                    const classStudents = students.filter(s => s.classId === classId);
                    const classes = this.stateManager.getAllClasses();
                    const classObj = classes.find(c => c.id === classId);
                    
                    let totalDue = 0;
                    let totalPaid = 0;
                    
                    const feeReport = classStudents.map(student => {
                        const studentTotalDue = student.invoices?.reduce((sum, inv) => sum + (inv.dueAmount || 0), 0) || 0;
                        const studentTotalPaid = student.invoices?.reduce((sum, inv) => sum + (inv.amountPaid || 0), 0) || 0;
                        
                        totalDue += studentTotalDue;
                        totalPaid += studentTotalPaid;
                        
                        return {
                            student: student.studentName,
                            registration: student.registrationNumber || student.id,
                            totalDue: studentTotalDue,
                            totalPaid: studentTotalPaid,
                            balance: studentTotalDue - studentTotalPaid,
                            status: studentTotalDue <= 0 ? 'PAID' : (studentTotalPaid > 0 ? 'PARTIAL' : 'UNPAID')
                        };
                    });
                    
                    const reportData = {
                        className: classObj?.className || classId,
                        reportDate: new Date().toISOString(),
                        totalStudents: classStudents.length,
                        totalDueAmount: totalDue,
                        totalPaidAmount: totalPaid,
                        netBalance: totalDue - totalPaid,
                        feeStructure: classObj?.classFeeDescription || {},
                        studentFeeDetails: feeReport
                    };
                    
                    const jsonStr = JSON.stringify(reportData, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `fee-report-${classId}-${new Date().toISOString().split('T')[0]}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    this.stateManager.addAlert('success', 'Fee report generated successfully!');
                    
                } catch (error) {
                    console.error("Error generating fee report:", error);
                    this.stateManager.addAlert('error', 'Failed to generate fee report.');
                }
            }
            
            handlePaginationClick(direction) {
                if (this.stateManager.getCurrentView() === 'students') {
                    if (direction === 'prev') {
                        if (this.stateManager.currentStudentPage > 0) {
                            this.stateManager.currentStudentPage--;
                            this.renderStudents();
                        }
                    } else if (direction === 'next') {
                        const students = this.stateManager.getAllStudents();
                        const filteredStudents = this.stateManager.studentSearch ? 
                            students.filter(s => 
                                s.studentName?.toLowerCase().includes(this.stateManager.studentSearch) || 
                                (s.registrationNumber && s.registrationNumber.toString().includes(this.stateManager.studentSearch)) ||
                                s.phoneNumber?.toString().includes(this.stateManager.studentSearch) ||
                                s.className?.toLowerCase().includes(this.stateManager.studentSearch) ||
                                s.status?.toLowerCase().includes(this.stateManager.studentSearch)
                            ) : students;
                        const totalPages = Math.ceil(filteredStudents.length / this.stateManager.itemsPerPage);
                        
                        if (this.stateManager.currentStudentPage < totalPages - 1) {
                            this.stateManager.currentStudentPage++;
                            this.renderStudents();
                        }
                    }
                } else if (this.stateManager.getCurrentView() === 'allPayments') {
                    if (direction === 'prev') {
                        if (this.stateManager.currentPaymentPage > 0) {
                            this.stateManager.currentPaymentPage--;
                            this.renderAllPayments();
                        }
                    } else if (direction === 'next') {
                        const payments = this.stateManager.getAllPayments();
                        const filteredPayments = this.stateManager.paymentSearch ? 
                            payments.filter(p => 
                                p.studentName?.toLowerCase().includes(this.stateManager.paymentSearch) || 
                                (p.studentId && p.studentId.toLowerCase().includes(this.stateManager.paymentSearch)) ||
                                (p.transactionId && p.transactionId.toLowerCase().includes(this.stateManager.paymentSearch)) ||
                                p.paymentMethod?.toLowerCase().includes(this.stateManager.paymentSearch) ||
                                p.className?.toLowerCase().includes(this.stateManager.paymentSearch)
                            ) : payments;
                        const totalPages = Math.ceil(filteredPayments.length / this.stateManager.itemsPerPage);
                        
                        if (this.stateManager.currentPaymentPage < totalPages - 1) {
                            this.stateManager.currentPaymentPage++;
                            this.renderAllPayments();
                        }
                    }
                }
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new SchoolAdminApp();
        });
        
        window.app = app;
    </script>
</body>
</html>
