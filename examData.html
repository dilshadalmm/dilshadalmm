            background: white;
            overflow: hidden;

        .skeleton-section {
            width: 100%;
            padding: 1.5rem 1rem;
            border-bottom: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        .skeleton-header {
            background: black;
            height: 45px;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        .skeleton-title-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e5e7eb;
            height: 30px;
            width: 200px;
        }

        .skeleton-content {
            background: #e5e7eb;
            height: 200px;
            margin-bottom: 1rem;
            width: 100%;
        }

        /* Skeleton animation */
        .skeleton-shimmer {
            position: relative;
            overflow: hidden;
        }

        .skeleton-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.4) 50%, 
                transparent 100%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
    </style>
</head>

            async signInWithEmail(emailInput, passwordInput, authModal) {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const signInButton = document.getElementById('sign-in-button');
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.textContent = '';
                emailError.classList.remove('show');
                passwordError.textContent = '';
                passwordError.classList.remove('show');
                
                if (!email) {
                    emailError.textContent = 'Please enter your email';
                    emailError.classList.add('show');
                    return;
                }
                
                if (!password) {
                    passwordError.textContent = 'Please enter your password';
                    passwordError.classList.add('show');
                    return;
                }
                
                signInButton.textContent = 'Signing In...';
                signInButton.classList.add('loading');
                
                try {
                    await this.auth.signInWithEmailAndPassword(email, password);
                    authModal.remove();
                    
                } catch (error) {
                    console.error("Sign in error:", error);
                    
                    signInButton.textContent = 'Sign In';
                    signInButton.classList.remove('loading');
                    
                    switch (error.code) {
                        case 'auth/invalid-email':
                            emailError.textContent = 'Invalid email address';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-disabled':
                            emailError.textContent = 'This account has been disabled';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-not-found':
                            emailError.textContent = 'No account found with this email';
                            emailError.classList.add('show');
                            break;
                        case 'auth/wrong-password':
                            passwordError.textContent = 'Incorrect password';
                            passwordError.classList.add('show');
                            break;
                        case 'auth/too-many-requests':
                            passwordError.textContent = 'Too many failed attempts. Try again later';
                            passwordError.classList.add('show');
                            break;
                        default:
                            passwordError.textContent = 'Failed to sign in. Please try again';
                            passwordError.classList.add('show');
                    }
                }
            }

            async populateExamData() {
                if (this.isPopulating) return;
                
                this.isPopulating = true;
                this.populationStatus = [];
                
                // Disable buttons
                document.getElementById('populate-data-button').disabled = true;
                document.getElementById('check-data-button').disabled = true;
                
                // Show status area
                const statusArea = document.getElementById('status-area');
                const statusItems = document.getElementById('status-items');
                const progressBar = document.getElementById('progress-bar');
                const resultAlert = document.getElementById('result-alert');
                
                statusArea.style.display = 'block';
                statusItems.innerHTML = '';
                resultAlert.style.display = 'none';
                progressBar.style.width = '0%';
                
                // Add timestamp
                const timestamp = firebase.firestore.FieldValue.serverTimestamp();
                
                // Update status function
                const updateStatus = (title, description, type = 'pending') => {
                    const statusId = Date.now() + Math.random();
                    this.populationStatus.push({ id: statusId, title, description, type });
                    
                    const icon = type === 'success' ? 'fa-check-circle' : 
                                 type === 'error' ? 'fa-times-circle' : 
                                 type === 'pending' ? 'fa-circle' : 'fa-info-circle';
                    
                    const statusItem = document.createElement('div');
                    statusItem.className = 'status-item';
                    statusItem.id = `status-${statusId}`;
                    statusItem.innerHTML = `
                        <div class="status-icon ${type}">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="status-text">
                            <div class="status-title">${title}</div>
                            <div class="status-description">${description}</div>
                        </div>
                    `;
                    
                    statusItems.appendChild(statusItem);
                    
                    // Update progress
                    const totalSteps = 11; // 1 school + 1 class + 1 exam + 1 student + 7 subjects
                    const completedSteps = this.populationStatus.filter(s => s.type === 'success').length;
                    const progress = Math.min(100, (completedSteps / totalSteps) * 100);
                    progressBar.style.width = `${progress}%`;
                    
                    return statusId;
                };
                
                // Update a specific status
                const updateStatusItem = (statusId, type, description = '') => {
                    const statusItem = document.getElementById(`status-${statusId}`);
                    if (statusItem) {
                        const icon = type === 'success' ? 'fa-check-circle' : 
                                     type === 'error' ? 'fa-times-circle' : 
                                     type === 'pending' ? 'fa-circle' : 'fa-info-circle';
                        
                        statusItem.querySelector('.status-icon').className = `status-icon ${type}`;
                        statusItem.querySelector('.status-icon i').className = `fas ${icon}`;
                        
                        if (description) {
                            statusItem.querySelector('.status-description').textContent = description;
                        }
                        
                        // Update in array
                        const statusIndex = this.populationStatus.findIndex(s => s.id === statusId);
                        if (statusIndex !== -1) {
                            this.populationStatus[statusIndex].type = type;
                            if (description) {
                                this.populationStatus[statusIndex].description = description;
                            }
                        }
                        
                        // Update progress
                        const totalSteps = 11;
                        const completedSteps = this.populationStatus.filter(s => s.type === 'success').length;
                        const progress = Math.min(100, (completedSteps / totalSteps) * 100);
                        progressBar.style.width = `${progress}%`;
                    }
                };
                
                try {
                    // Step 1: Create School Document
                    const schoolStatusId = updateStatus(
                        'Creating School Document',
                        `Creating school document: schools/${EXAM_DATA.schoolId}`
                    );
                    
                    try {
                        await this.db.doc(`schools/${EXAM_DATA.schoolId}`).set({
                            schoolName: "Dilshad Institute of Science",
                            schoolCode: "DIS",
                            address: "Kathmandu, Nepal",
                            createdAt: timestamp,
                            updatedAt: timestamp
                        }, { merge: true });
                        
                        updateStatusItem(schoolStatusId, 'success', `School document created: schools/${EXAM_DATA.schoolId}`);
                    } catch (error) {
                        updateStatusItem(schoolStatusId, 'error', `Error: ${error.message}`);
                        throw error;
                    }
                    
                    // Step 2: Create Class Document
                    const classStatusId = updateStatus(
                        'Creating Class Document',
                        `Creating class document: schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}`
                    );
                    
                    try {
                        await this.db.doc(`schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}`).set({
                            className: "Class 10",
                            grade: 10,
                            academicYear: "2081 B.S.",
                            createdAt: timestamp,
                            updatedAt: timestamp
                        }, { merge: true });
                        
                        updateStatusItem(classStatusId, 'success', `Class document created: schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}`);
                    } catch (error) {
                        updateStatusItem(classStatusId, 'error', `Error: ${error.message}`);
                        throw error;
                    }
                    
                    // Step 3: Create Exam Document
                    const examStatusId = updateStatus(
                        'Creating Exam Document',
                        `Creating exam document: schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}/exams/${EXAM_DATA.examName}`
                    );
                    
                    try {
                        const examDataWithTimestamp = {
                            ...EXAM_DATA.examData,
                            createdAt: timestamp,
                            updatedAt: timestamp
                        };
                        
                        await this.db.doc(`schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}/exams/${EXAM_DATA.examName}`).set(examDataWithTimestamp, { merge: true });
                        
                        updateStatusItem(examStatusId, 'success', `Exam document created: schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}/exams/${EXAM_DATA.examName}`);
                    } catch (error) {
                        updateStatusItem(examStatusId, 'error', `Error: ${error.message}`);
                        throw error;
                    }
                    
                    // Step 4: Create Student Document
                    const studentStatusId = updateStatus(
                        'Creating Student Document',
                        `Creating student document: schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}/exams/${EXAM_DATA.examName}/students/${EXAM_DATA.studentData.studentUID}`
                    );
                    
                    try {
                        const studentDataWithTimestamp = {
                            ...EXAM_DATA.studentData,
                            createdAt: timestamp,
                            updatedAt: timestamp
                        };
                        
                        await this.db.doc(`schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}/exams/${EXAM_DATA.examName}/students/${EXAM_DATA.studentData.studentUID}`).set(studentDataWithTimestamp, { merge: true });
                        
                        updateStatusItem(studentStatusId, 'success', `Student document created with UID: ${EXAM_DATA.studentData.studentUID}`);
                    } catch (error) {
                        updateStatusItem(studentStatusId, 'error', `Error: ${error.message}`);
                        throw error;
                    }
                    
                    // Step 5: Create Subject Documents
                    const subjectStatusId = updateStatus(
                        'Creating Subject Documents',
                        `Creating ${EXAM_DATA.subjectsData.length} subject documents`
                    );
                    
                    try {
                        let subjectsCreated = 0;
                        let subjectErrors = 0;
                        
                        for (const subject of EXAM_DATA.subjectsData) {
                            try {
                                const subjectDataWithTimestamp = {
                                    ...subject.data,
                                    createdAt: timestamp,
                                    updatedAt: timestamp
                                };
                                
                                await this.db.doc(`schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}/exams/${EXAM_DATA.examName}/students/${EXAM_DATA.studentData.studentUID}/subjects/${subject.id}`).set(subjectDataWithTimestamp, { merge: true });
                                subjectsCreated++;
                            } catch (error) {
                                console.error(`Error creating subject ${subject.id}:`, error);
                                subjectErrors++;
                            }
                        }
                        
                        if (subjectErrors === 0) {
                            updateStatusItem(subjectStatusId, 'success', `Successfully created all ${subjectsCreated} subject documents`);
                        } else {
                            updateStatusItem(subjectStatusId, 'error', `Created ${subjectsCreated} subjects, ${subjectErrors} errors`);
                        }
                    } catch (error) {
                        updateStatusItem(subjectStatusId, 'error', `Error: ${error.message}`);
                        throw error;
                    }
                    
                    // Final Success
                    progressBar.style.width = '100%';
                    
                    resultAlert.className = 'alert alert-success';
                    resultAlert.innerHTML = `
                        <i class="fas fa-check-circle mr-2"></i>
                        <strong>Success!</strong> Exam data structure has been auto-populated in Firestore.
                        <br><small>Created: 1 school, 1 class, 1 exam, 1 student with ${EXAM_DATA.subjectsData.length} subjects.</small>
                    `;
                    resultAlert.style.display = 'block';
                    
                    // Re-enable buttons after a delay
                    setTimeout(() => {
                        document.getElementById('populate-data-button').disabled = false;
                        document.getElementById('check-data-button').disabled = false;
                        this.isPopulating = false;
                    }, 1000);
                    
                } catch (error) {
                    console.error("Population error:", error);
                    
                    resultAlert.className = 'alert alert-error';
                    resultAlert.innerHTML = `
                        <i class="fas fa-times-circle mr-2"></i>
                        <strong>Error!</strong> Failed to populate exam data: ${error.message}
                    `;
                    resultAlert.style.display = 'block';
                    
                    // Re-enable buttons
                    document.getElementById('populate-data-button').disabled = false;
                    document.getElementById('check-data-button').disabled = false;
                    this.isPopulating = false;
                }
            }
            
            async checkExistingData() {
                try {
                    // Check school
                    const schoolDoc = await this.db.doc(`schools/${EXAM_DATA.schoolId}`).get();
                    const schoolExists = schoolDoc.exists;
                    
                    // Check class
                    const classDoc = await this.db.doc(`schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}`).get();
                    const classExists = classDoc.exists;
                    
                    // Check exam
                    const examDoc = await this.db.doc(`schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}/exams/${EXAM_DATA.examName}`).get();
                    const examExists = examDoc.exists;
                    
                    // Check student
                    const studentDoc = await this.db.doc(`schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}/exams/${EXAM_DATA.examName}/students/${EXAM_DATA.studentData.studentUID}`).get();
                    const studentExists = studentDoc.exists;
                    
                    // Check subjects count
                    let subjectCount = 0;
                    if (studentExists) {
                        const subjectsSnapshot = await this.db.collection(`schools/${EXAM_DATA.schoolId}/classes/${EXAM_DATA.className}/exams/${EXAM_DATA.examName}/students/${EXAM_DATA.studentData.studentUID}/subjects`).get();
                        subjectCount = subjectsSnapshot.size;
                    }
                    
                    // Show result
                    const resultAlert = document.getElementById('result-alert');
                    const statusArea = document.getElementById('status-area');
                    
                    statusArea.style.display = 'block';
                    
                    let message = '<i class="fas fa-search mr-2"></i> <strong>Data Check Results:</strong><br>';
                    message += `<small>School (${EXAM_DATA.schoolId}): ${schoolExists ? '✅ Exists' : '❌ Missing'}<br>`;
                    message += `Class (${EXAM_DATA.className}): ${classExists ? '✅ Exists' : '❌ Missing'}<br>`;
                    message += `Exam (${EXAM_DATA.examName}): ${examExists ? '✅ Exists' : '❌ Missing'}<br>`;
                    message += `Student (${EXAM_DATA.studentData.studentUID}): ${studentExists ? '✅ Exists' : '❌ Missing'}<br>`;
                    message += `Subjects: ${subjectCount} found (expected: ${EXAM_DATA.subjectsData.length})</small>`;
                    
                    resultAlert.className = schoolExists && classExists && examExists && studentExists && subjectCount === EXAM_DATA.subjectsData.length ? 
                        'alert alert-success' : 'alert alert-warning';
                    resultAlert.innerHTML = message;
                    resultAlert.style.display = 'block';
                    
                } catch (error) {
                    console.error("Error checking data:", error);
                    
                    const resultAlert = document.getElementById('result-alert');
                    const statusArea = document.getElementById('status-area');
                    
                    statusArea.style.display = 'block';
                    resultAlert.className = 'alert alert-error';
                    resultAlert.innerHTML = `
                        <i class="fas fa-times-circle mr-2"></i>
                        <strong>Error!</strong> Failed to check existing data: ${error.message}
                    `;
                    resultAlert.style.display = 'block';
                }
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new ExamDataPopulator();
        });
        
        // Make app available globally for debugging
        window.app = app;
    </script>
</body>
</html>
