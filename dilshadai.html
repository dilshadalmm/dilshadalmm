<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilshad · AI tutor with Firebase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Lucide for auth icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Material symbols (one icon) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send" />
    
    <!-- Google Fonts: Acme (main), Creepster (logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Creepster&display=swap" rel="stylesheet">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Firebase SDK (modular) -->
    <script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>

    <style>
        * {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        input, .auth-container input, .auth-container button, .auth-container div, .auth-container span {
            -webkit-user-select: text;
            -ms-user-select: text;
            user-select: text;
            touch-action: manipulation;
            font-family: 'Acme', sans-serif !important;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a14;
            color: #fff;
            font-family: "Acme", sans-serif;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .creepster-font {
            font-family: "Creepster", system-ui;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .chat-container::-webkit-scrollbar {
            display: none;
        }
        .message-pair {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1a1a2e;
            width: 100%;
        }
        .auth-message-pair {
            border-bottom: none !important;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .user-bubble {
            align-self: flex-end;
            background: #a87ff3;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            max-width: 85%;
            box-shadow: 0 4px 15px rgba(168, 127, 243, 0.3);
            word-wrap: break-word;
        }
        .ai-message {
            align-self: flex-start;
            max-width: 90%;
            line-height: 1.6;
            word-wrap: break-word;
            background: #1a1a2e;
            padding: 0.75rem 1rem;
            border-radius: 4px;
        }
        .ai-message p {
            margin: 0;
        }
        .ai-message p + p {
            margin-top: 0.5rem;
        }
        /* Stripe action stripe */
        .stripe-action {
            align-self: flex-start;
            margin-top: 8px;
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }
        .stripe-button {
            background: #635bff; /* Stripe brand purple */
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(99, 91, 255, 0.3);
            font-family: 'Acme', sans-serif;
        }
        .stripe-button:hover {
            background: #4f46e5;
        }
        .stripe-button i {
            font-size: 0.9rem;
        }
        .input-area {
            padding: 1.5rem;
            background: #0a0a14;
            border-top: 1px solid #1a1a2e;
            flex-shrink: 0;
        }
        .input-wrapper {
            background: #151525;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border: 1px solid #252535;
        }
        input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            padding: 0.75rem;
            outline: none;
            font-size: 1rem;
            font-family: 'Acme', sans-serif;
        }
        .send-btn {
            background: #a87ff3;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #9066e0;
        }
        .send-btn:active {
            transform: scale(0.95);
        }
        .header {
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a2e;
            flex-shrink: 0;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: #2d2d45;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px;
            align-self: flex-start;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #a87ff3;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(2) { animation-delay: -0.32s; }
        .dot:nth-child(3) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        /* Visual formatting classes */
        .highlight {
            background: #7c3aed;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .underline {
            border-bottom: 3px solid #a87ff3;
            padding-bottom: 2px;
        }
        .formula-box {
            display: inline-block;
            border: 2px solid #a87ff3;
            padding: 6px 10px;
            border-radius: 6px;
            background: #111122;
            font-weight: bold;
            margin: 4px 0;
        }

        /* ----- AUTH CONTAINER STYLES ----- */
        .bg-navy {
            background-color: #0a192f;
        }
        .neo-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
        .input-border {
            border-bottom: 1.5px solid white;
        }
        .hidden-mode {
            display: none !important;
        }
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: black;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .bubble-tail {
            display: none;
        }
        #auth-message-pair input, #auth-message-pair button, #auth-message-pair span, #auth-message-pair div {
            font-family: 'Acme', sans-serif !important;
            font-size: 0.75rem;
        }
        #auth-message-pair .text-xs {
            font-size: 0.75rem !important;
        }
        #auth-message-pair input::placeholder {
            font-size: 0.75rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="main-wrapper">
        <!-- Header -->
        <div class="header">
            <div class="flex items-center" id="logoContainer">
                <div class="avatar">
                    <i class="fa-solid fa-robot text-purple-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight creepster-font text-purple-400">DILSHAD</h1>
                    <p class="text-xs text-gray-400">Middle School Teacher</p>
                </div>
            </div>
            <div class="flex items-center justify-end h-full w-36 space-x-3" id="headerRight">
                <i class="fa-regular fa-circle-user text-2xl text-gray-300" id="profileIcon"></i>
                <button id="authToggleBtn" class="bg-purple-600 hover:bg-purple-700 px-3 py-1.5 rounded text-sm flex items-center gap-1 transition">
                    <i class="fa-regular fa-right-to-bracket" id="authToggleIcon"></i>
                    <span id="authToggleText">Login</span>
                </button>
            </div>
        </div>

        <!-- Chat container -->
        <div class="chat-container" id="chatContainer">
            <div class="message-pair" id="initialGreeting">
                <div class="ai-message">
                    <p>Greetings! I am <b>Dilshad</b>. I provide technical, scientific explanations for middle school scholars. How may I assist your inquiry today?</p>
                </div>
                <!-- Stripe action for initial greeting (optional) – we'll add via code consistently -->
            </div>
        </div>

        <!-- Input area -->
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask anything...." autocomplete="off" spellcheck="false">
                <button class="send-btn" id="sendBtn">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        // ---------- Firebase config ----------
        const firebaseConfig = {
            apiKey: "AIzaSyC6NRjkwiazA-aYF4okvnLW4qpCyMg8O9E",
            authDomain: "fir-f3d53.firebaseapp.com",
            projectId: "fir-f3d53",
            storageBucket: "fir-f3d53.firebasestorage.app",
            messagingSenderId: "683707045028",
            appId: "1:683707045028:web:93990fa0de8767dda90231"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ---------- DOM elements ----------
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const authToggleBtn = document.getElementById('authToggleBtn');
        const authToggleIcon = document.getElementById('authToggleIcon');
        const authToggleText = document.getElementById('authToggleText');
        const profileIcon = document.getElementById('profileIcon');

        // ---------- Global state ----------
        let isLoggedIn = false;
        let currentUser = null;
        let authMessagePair = null;
        let isWaiting = false;
        let currentPair = null;      // for new messages

        // Stripe link (replace with your actual payment link)
        const STRIPE_LINK = "https://buy.stripe.com/test_9AQ4j17oG9Vx4Mk7ss"; // example test link

        // ---------- Helper: add stripe action button below AI message (inside message-pair) ----------
        function addStripeAction(parentPair) {
            // Avoid duplicate if already present
            if (parentPair.querySelector('.stripe-action')) return;

            const stripeDiv = document.createElement('div');
            stripeDiv.className = 'stripe-action';
            stripeDiv.innerHTML = `
                <a href="${STRIPE_LINK}" target="_blank" rel="noopener noreferrer" class="stripe-button no-underline">
                    <i class="fa-brands fa-stripe-s"></i> Support on Stripe
                </a>
            `;
            parentPair.appendChild(stripeDiv);
        }

        // ---------- Helper functions ----------
        function updateHeaderUI() {
            if (isLoggedIn && currentUser) {
                authToggleIcon.className = 'fa-regular fa-arrow-right-from-bracket';
                authToggleText.innerText = 'Logout';
                profileIcon.className = 'fa-regular fa-circle-user text-2xl text-purple-300';
            } else {
                authToggleIcon.className = 'fa-regular fa-right-to-bracket';
                authToggleText.innerText = 'Login';
                profileIcon.className = 'fa-regular fa-circle-user text-2xl text-gray-300';
            }
        }

        function removeAuthMessage() {
            if (authMessagePair && authMessagePair.parentNode) {
                authMessagePair.remove();
                authMessagePair = null;
            } else {
                const existing = document.getElementById('auth-message-pair');
                if (existing) {
                    existing.remove();
                    authMessagePair = null;
                }
            }
        }

        // Load chat history from Firestore and render with stripe
        async function loadChatHistory() {
            if (!currentUser) return;

            chatContainer.innerHTML = ''; 

            const messagesRef = collection(db, 'users', currentUser.uid, 'messages');
            const q = query(messagesRef, orderBy('timestamp', 'asc'));
            const snapshot = await getDocs(q);

            let lastUserMessage = null;
            snapshot.forEach(doc => {
                const msg = doc.data();
                if (msg.role === 'user') {
                    const pair = document.createElement('div');
                    pair.className = 'message-pair';
                    const userDiv = document.createElement('div');
                    userDiv.className = 'user-bubble';
                    userDiv.textContent = msg.content;
                    pair.appendChild(userDiv);
                    chatContainer.appendChild(pair);
                    lastUserMessage = pair;
                } else if (msg.role === 'assistant' && lastUserMessage) {
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'ai-message';
                    aiDiv.innerHTML = formatAIMessage(msg.content);
                    lastUserMessage.appendChild(aiDiv);
                    renderMathInElement(aiDiv, katexOptions);
                    // Add stripe action after AI message
                    addStripeAction(lastUserMessage);
                    lastUserMessage = null;
                } else {
                    // orphan AI (should not happen, but handle)
                    const pair = document.createElement('div');
                    pair.className = 'message-pair';
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'ai-message';
                    aiDiv.innerHTML = formatAIMessage(msg.content);
                    pair.appendChild(aiDiv);
                    chatContainer.appendChild(pair);
                    addStripeAction(pair);
                    renderMathInElement(aiDiv, katexOptions);
                }
            });

            if (snapshot.empty) {
                chatContainer.innerHTML = `
                    <div class="message-pair" id="initialGreeting">
                        <div class="ai-message">
                            <p>Greetings! I am <b>Dilshad</b>. I provide technical, scientific explanations for middle school scholars. How may I assist your inquiry today?</p>
                        </div>
                    </div>
                `;
                // Add stripe to initial greeting as well (optional)
                const greetingPair = chatContainer.querySelector('.message-pair');
                if (greetingPair) addStripeAction(greetingPair);
            }

            setTimeout(() => chatContainer.scrollTop = chatContainer.scrollHeight, 50);
        }

        // Save message to Firestore
        async function saveMessage(role, content) {
            if (!currentUser) return;
            try {
                const messagesRef = collection(db, 'users', currentUser.uid, 'messages');
                await addDoc(messagesRef, {
                    role: role,
                    content: content,
                    timestamp: new Date()
                });
            } catch (e) {
                console.error("Error saving message:", e);
            }
        }

        // ---------- Auth UI (unchanged, but ensure font consistency) ----------
        function showAuthModal() {
            if (document.getElementById('auth-message-pair')) return;

            const pair = document.createElement('div');
            pair.id = 'auth-message-pair';
            pair.className = 'message-pair auth-message-pair';

            pair.innerHTML = `
                <div class="relative w-full max-w-[300px] transition-all duration-200 mx-auto">
                    <div class="bg-navy border-[1.5px] border-black rounded-sm neo-shadow overflow-hidden">
                        <div class="bg-black p-3 text-white flex justify-between items-center">
                            <span id="portalTitle" class="text-[10px] uppercase font-bold tracking-widest text-zinc-300">Authentication</span>
                            <button id="closeAuthBtn" class="hover:text-white transition-colors">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="p-5">
                            <div id="authMessage" class="mb-2 text-xs text-yellow-300 text-center"></div>
                            <form id="authForm" class="space-y-4">
                                <div id="nameField" class="relative input-border hidden-mode">
                                    <i data-lucide="user" class="absolute left-0 top-2.5 w-3.5 h-3.5 text-zinc-400"></i>
                                    <input type="text" id="nameInput" class="w-full pl-6 pr-2 py-2 text-xs bg-transparent text-white outline-none placeholder:text-zinc-500 uppercase" placeholder="FULL NAME">
                                </div>
                                <div class="relative input-border">
                                    <i data-lucide="mail" class="absolute left-0 top-2.5 w-3.5 h-3.5 text-zinc-400"></i>
                                    <input type="email" id="emailInput" required class="w-full pl-6 pr-2 py-2 text-xs bg-transparent text-white outline-none placeholder:text-zinc-500 uppercase" placeholder="EMAIL ADDRESS">
                                </div>
                                <div class="relative input-border">
                                    <i data-lucide="lock" class="absolute left-0 top-2.5 w-3.5 h-3.5 text-zinc-400"></i>
                                    <input type="password" id="passwordInput" required class="w-full pl-6 pr-8 py-2 text-xs bg-transparent text-white outline-none placeholder:text-zinc-500 uppercase" placeholder="PASSWORD">
                                    <button type="button" id="togglePassword" class="absolute right-0 top-2 text-zinc-400 hover:text-white">
                                        <i data-lucide="eye" class="w-3.5 h-3.5" id="eyeIcon"></i>
                                    </button>
                                </div>
                                <div id="urlField" class="relative input-border hidden-mode">
                                    <i data-lucide="link" class="absolute left-0 top-2.5 w-3.5 h-3.5 text-zinc-400"></i>
                                    <input type="url" id="urlInput" class="w-full pl-6 pr-2 py-2 text-xs bg-transparent text-white outline-none placeholder:text-zinc-500 uppercase" placeholder="PROFILE IMAGE URL">
                                </div>
                                <button type="submit" id="submitBtn" class="w-full mt-2 bg-white text-black text-[10px] font-bold py-3 uppercase tracking-tighter flex items-center justify-center gap-2 hover:bg-zinc-200 transition-all active:translate-x-[2px] active:translate-y-[2px] active:shadow-none">
                                    <span id="btnText">Sign In</span>
                                    <i data-lucide="arrow-right" class="w-3 h-3" id="btnIcon"></i>
                                </button>
                            </form>
                            <div class="mt-5 pt-4 border-t border-white/10 text-center">
                                <button id="toggleModeBtn" class="text-[9px] font-bold uppercase tracking-tight text-zinc-400 hover:text-white hover:underline transition-colors">
                                    [ New? Create Account ]
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="hidden bubble-tail"></div>
                </div>
            `;

            chatContainer.appendChild(pair);
            authMessagePair = pair;

            if (window.lucide) lucide.createIcons({ root: pair });

            let isSignIn = true;
            let showPassword = false;
            const nameField = pair.querySelector('#nameField');
            const urlField = pair.querySelector('#urlField');
            const btnText = pair.querySelector('#btnText');
            const toggleModeBtn = pair.querySelector('#toggleModeBtn');
            const togglePassword = pair.querySelector('#togglePassword');
            const passwordInput = pair.querySelector('#passwordInput');
            const eyeIcon = pair.querySelector('#eyeIcon');
            const emailInput = pair.querySelector('#emailInput');
            const nameInput = pair.querySelector('#nameInput');
            const closeBtn = pair.querySelector('#closeAuthBtn');
            const authForm = pair.querySelector('#authForm');
            const authMessageDiv = pair.querySelector('#authMessage');

            function updateMode() {
                if (isSignIn) {
                    nameField.classList.add('hidden-mode');
                    urlField.classList.add('hidden-mode');
                    btnText.innerText = 'Sign In';
                    toggleModeBtn.innerText = '[ New? Create Account ]';
                    nameInput.required = false;
                } else {
                    nameField.classList.remove('hidden-mode');
                    urlField.classList.remove('hidden-mode');
                    btnText.innerText = 'Sign Up';
                    toggleModeBtn.innerText = '[ Have account? Sign In ]';
                    nameInput.required = true;
                }
                if (window.lucide) lucide.createIcons({ root: pair });
            }

            toggleModeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                isSignIn = !isSignIn;
                updateMode();
            });

            togglePassword.addEventListener('click', (e) => {
                e.preventDefault();
                showPassword = !showPassword;
                passwordInput.type = showPassword ? 'text' : 'password';
                eyeIcon.setAttribute('data-lucide', showPassword ? 'eye-off' : 'eye');
                if (window.lucide) lucide.createIcons({ root: pair });
            });

            closeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                removeAuthMessage();
            });

            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const displayName = nameInput.value.trim();

                if (!email || !password) return;
                if (!isSignIn && !displayName) {
                    authMessageDiv.innerText = 'Full name required';
                    return;
                }

                const submitBtn = pair.querySelector('#submitBtn');
                const originalContent = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<div class="spinner"></div>';
                authMessageDiv.innerText = '';

                try {
                    if (isSignIn) {
                        await signInWithEmailAndPassword(auth, email, password);
                        authMessageDiv.innerText = '✅ Login successful!';
                    } else {
                        const userCred = await createUserWithEmailAndPassword(auth, email, password);
                        authMessageDiv.innerText = '✅ Account created!';
                    }
                    setTimeout(() => {
                        removeAuthMessage();
                    }, 1200);
                } catch (error) {
                    authMessageDiv.innerText = `❌ ${error.message}`;
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalContent;
                }
            });

            pair.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ---------- AI chat functions ----------
        const PROXY_URL = "https://dilshadalmm.onrender.com/gemini";
        const katexOptions = { delimiters: [ { left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false } ], throwOnError: false };

        function formatAIMessage(text) {
            const paragraphs = text.split(/\n\s*\n/);
            return paragraphs.map(para => {
                if (!para.trim()) return '<p></p>';
                let formatted = para
                    .replace(/\*\*(.*?)\*\*/g, '<span class="highlight">$1</span>')
                    .replace(/__(.*?)__/g, '<span class="underline">$1</span>')
                    .replace(/\[\[(.*?)\]\]/g, '<span class="formula-box">$1</span>');
                formatted = formatted.replace(/\n/g, '<br>');
                return `<p>${formatted}</p>`;
            }).join('');
        }

        async function fetchAIResponse(prompt) {
            const systemPrompt = "You are Dilshad, a technical Middle School Teacher. Use English only. Keep responses concise. Use LaTeX for math (e.g., $x^2$). Format important content as follows: **important term** (highlighted), __definition__ (underlined), [[formula or equation]] (boxed). The user's request is top priority.";
            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: `${systemPrompt}\n\nUSER PROMPT: ${prompt}` }] }] })
                });
                const data = await response.json();
                if (!response.ok) return `Proxy Error ${response.status}: ${data.error?.message || "Unknown error"}`;
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "⚠️ No response.";
            } catch (error) {
                return "❌ Network error – check connection.";
            }
        }

        async function sendMessage() {
            if (isWaiting) return;
            const text = userInput.value.trim();
            if (!text) return;

            isWaiting = true;
            sendBtn.style.pointerEvents = 'none';
            userInput.disabled = true;

            // Create message pair
            currentPair = document.createElement('div');
            currentPair.className = 'message-pair';
            chatContainer.appendChild(currentPair);

            const userDiv = document.createElement('div');
            userDiv.className = 'user-bubble';
            userDiv.textContent = text;
            currentPair.appendChild(userDiv);

            userInput.value = '';

            if (currentUser) await saveMessage('user', text);

            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            currentPair.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const response = await fetchAIResponse(text);
            typingDiv.remove();

            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai-message';
            aiDiv.innerHTML = formatAIMessage(response);
            currentPair.appendChild(aiDiv);
            if (window.renderMathInElement) renderMathInElement(aiDiv, katexOptions);

            // Add stripe action after AI message
            addStripeAction(currentPair);

            if (currentUser) await saveMessage('assistant', response);

            isWaiting = false;
            sendBtn.style.pointerEvents = 'auto';
            userInput.disabled = false;
            userInput.focus();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ---------- Auth state observer ----------
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                isLoggedIn = true;
                updateHeaderUI();
                removeAuthMessage();
                await loadChatHistory();
            } else {
                currentUser = null;
                isLoggedIn = false;
                updateHeaderUI();
                chatContainer.innerHTML = `
                    <div class="message-pair">
                        <div class="ai-message">
                            <p>Greetings! I am <b>Dilshad</b>. I provide technical, scientific explanations for middle school scholars. How may I assist your inquiry today?</p>
                        </div>
                    </div>
                `;
                // Add stripe to initial greeting
                const greetingPair = chatContainer.querySelector('.message-pair');
                if (greetingPair) addStripeAction(greetingPair);
                if (window.renderMathInElement) renderMathInElement(chatContainer, katexOptions);
            }
        });

        // ---------- Header button click ----------
        authToggleBtn.addEventListener('click', () => {
            if (isLoggedIn) {
                signOut(auth);
            } else {
                showAuthModal();
            }
        });

        // ---------- Input handlers ----------
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
        sendBtn.addEventListener('click', sendMessage);

        // Clear chat function (UI only)
        window.clearChat = () => {
            if (!currentUser) {
                chatContainer.innerHTML = `
                    <div class="message-pair">
                        <div class="ai-message">
                            <p>Greetings! I am <b>Dilshad</b>. I provide technical, scientific explanations for middle school scholars. How may I assist your inquiry today?</p>
                        </div>
                    </div>
                `;
                const greetingPair = chatContainer.querySelector('.message-pair');
                if (greetingPair) addStripeAction(greetingPair);
            } else {
                loadChatHistory();
            }
        };

        window.onload = () => {
            if (window.renderMathInElement) {
                renderMathInElement(chatContainer, katexOptions);
                // Add stripe to initial greeting if it exists
                const greetingPair = document.querySelector('.message-pair');
                if (greetingPair && !greetingPair.querySelector('.stripe-action')) {
                    addStripeAction(greetingPair);
                }
            }
        };

        // Prevent zoom
        document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => { const now = Date.now(); if (now - lastTouchEnd <= 300) e.preventDefault(); lastTouchEnd = now; }, false);
    </script>
</body>
</html>
