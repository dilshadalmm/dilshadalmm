<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilshad · AI tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Lucide for auth icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Material symbols (one icon) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Creepster&display=swap" rel="stylesheet">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        * {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        input, .auth-container input, .auth-container button {
            -webkit-user-select: text;
            -ms-user-select: text;
            user-select: text;
            touch-action: manipulation;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a14;
            color: #fff;
            font-family: "Acme", sans-serif;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .creepster-font {
            font-family: "Creepster", system-ui;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .chat-container::-webkit-scrollbar {
            display: none;
        }
        .message-pair {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1a1a2e;
            width: 100%;
        }
        .auth-message-pair {
            border-bottom: none !important;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .user-bubble {
            align-self: flex-end;
            background: #a87ff3;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            max-width: 85%;
            box-shadow: 0 4px 15px rgba(168, 127, 243, 0.3);
            word-wrap: break-word;
        }
        .ai-message {
            align-self: flex-start;
            max-width: 90%;
            line-height: 1.6;
            word-wrap: break-word;
            background: #1a1a2e;
            padding: 0.75rem 1rem;
            border-radius: 4px;
        }
        .ai-message p {
            margin: 0;
        }
        .ai-message p + p {
            margin-top: 0.5rem;
        }
        .input-area {
            padding: 1.5rem;
            background: #0a0a14;
            border-top: 1px solid #1a1a2e;
            flex-shrink: 0;
        }
        .input-wrapper {
            background: #151525;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border: 1px solid #252535;
        }
        input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            padding: 0.75rem;
            outline: none;
            font-size: 1rem;
            font-family: inherit;
        }
        .send-btn {
            background: #a87ff3;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #9066e0;
        }
        .send-btn:active {
            transform: scale(0.95);
        }
        .header {
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a2e;
            flex-shrink: 0;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: #2d2d45;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px;
            align-self: flex-start;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #a87ff3;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(2) { animation-delay: -0.32s; }
        .dot:nth-child(3) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        /* Visual formatting classes */
        .highlight {
            background: #7c3aed;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .underline {
            border-bottom: 3px solid #a87ff3;
            padding-bottom: 2px;
        }
        .formula-box {
            display: inline-block;
            border: 2px solid #a87ff3;
            padding: 6px 10px;
            border-radius: 6px;
            background: #111122;
            font-weight: bold;
            margin: 4px 0;
        }

        /* ----- AUTH CONTAINER STYLES (integrated) ----- */
        .bg-navy {
            background-color: #0a192f;
        }
        .neo-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
        .input-border {
            border-bottom: 1.5px solid white;
        }
        .hidden-mode {
            display: none !important;
        }
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: black;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* remove bubble tail inside chat */
        .bubble-tail {
            display: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="main-wrapper">
        <!-- Header with left logo and right user controls -->
        <div class="header">
            <!-- left logo area (original) -->
            <div class="flex items-center" id="logoContainer">
                <div class="avatar">
                    <i class="fa-solid fa-robot text-purple-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight creepster-font text-purple-400">DILSHAD</h1>
                    <p class="text-xs text-gray-400">Middle School Teacher</p>
                </div>
            </div>

            <!-- RIGHT CONTAINER: same height, approx double width of logo container (w-36) -->
            <div class="flex items-center justify-end h-full w-36 space-x-3" id="headerRight">
                <!-- profile icon (font-awesome) -->
                <i class="fa-regular fa-circle-user text-2xl text-gray-300" id="profileIcon"></i>
                <!-- login/logout toggle button -->
                <button id="authToggleBtn" class="bg-purple-600 hover:bg-purple-700 px-3 py-1.5 rounded text-sm flex items-center gap-1 transition">
                    <i class="fa-regular fa-right-to-bracket" id="authToggleIcon"></i>
                    <span id="authToggleText">Login</span>
                </button>
            </div>
        </div>

        <!-- Chat container (messages + auth modal appears here) -->
        <div class="chat-container" id="chatContainer">
            <div class="message-pair">
                <div class="ai-message">
                    <p>Greetings! I am <b>Dilshad</b>. I provide technical, scientific explanations for middle school scholars. How may I assist your inquiry today?</p>
                </div>
            </div>
            <!-- auth UI will be injected dynamically as a message-pair -->
        </div>

        <!-- Input area (unchanged) -->
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask anything...." autocomplete="off" spellcheck="false">
                <button class="send-btn" id="sendBtn">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ---------- existing globals ----------
        const PROXY_URL = "https://dilshadalmm.onrender.com/gemini";
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // ---------- new state for auth ----------
        let isLoggedIn = false;              // false = logged out, true = logged in
        let authMessagePair = null;           // DOM element of current auth message

        // header elements
        const authToggleBtn = document.getElementById('authToggleBtn');
        const authToggleIcon = document.getElementById('authToggleIcon');
        const authToggleText = document.getElementById('authToggleText');
        const profileIcon = document.getElementById('profileIcon');

        // Update header UI based on login state
        function updateHeaderUI() {
            if (isLoggedIn) {
                authToggleIcon.className = 'fa-regular fa-arrow-right-from-bracket'; // logout icon
                authToggleText.innerText = 'Logout';
                profileIcon.className = 'fa-regular fa-circle-user text-2xl text-purple-300'; // maybe highlighted
            } else {
                authToggleIcon.className = 'fa-regular fa-right-to-bracket'; // login icon
                authToggleText.innerText = 'Login';
                profileIcon.className = 'fa-regular fa-circle-user text-2xl text-gray-300';
            }
        }

        // ---------- helper: remove auth message if exists ----------
        function removeAuthMessage() {
            if (authMessagePair && authMessagePair.parentNode) {
                authMessagePair.remove();
                authMessagePair = null;
            } else {
                // fallback: search by id
                const existing = document.getElementById('auth-message-pair');
                if (existing) {
                    existing.remove();
                    authMessagePair = null;
                }
            }
        }

        // ---------- show authentication UI as a message pair (centered) ----------
        function showAuthModal() {
            // avoid duplicate
            if (document.getElementById('auth-message-pair')) {
                return;
            }

            // create a special message-pair with centered content
            const pair = document.createElement('div');
            pair.id = 'auth-message-pair';
            pair.className = 'message-pair auth-message-pair'; // extra class to remove border and center items

            // Auth HTML (adapted from provided, without trigger button and bubble tail)
            pair.innerHTML = `
                <div class="relative w-full max-w-[300px] transition-all duration-200 mx-auto">
                    <!-- Main Bubble (Navy) -->
                    <div class="bg-navy border-[1.5px] border-black rounded-sm neo-shadow overflow-hidden">
                        <!-- Header (Black) -->
                        <div class="bg-black p-3 text-white flex justify-between items-center">
                            <span id="portalTitle" class="text-[10px] uppercase font-bold tracking-widest text-zinc-300">Authentication</span>
                            <button id="closeAuthBtn" class="hover:text-white transition-colors">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="p-5">
                            <form id="authForm" class="space-y-4">
                                <!-- Name Field (Sign Up only) -->
                                <div id="nameField" class="relative input-border hidden-mode">
                                    <i data-lucide="user" class="absolute left-0 top-2.5 w-3.5 h-3.5 text-zinc-400"></i>
                                    <input type="text" id="nameInput" class="w-full pl-6 pr-2 py-2 text-xs bg-transparent text-white outline-none placeholder:text-zinc-500 uppercase" placeholder="FULL NAME">
                                </div>
                                <!-- Email Field -->
                                <div class="relative input-border">
                                    <i data-lucide="mail" class="absolute left-0 top-2.5 w-3.5 h-3.5 text-zinc-400"></i>
                                    <input type="email" id="emailInput" required class="w-full pl-6 pr-2 py-2 text-xs bg-transparent text-white outline-none placeholder:text-zinc-500 uppercase" placeholder="EMAIL ADDRESS">
                                </div>
                                <!-- Password Field -->
                                <div class="relative input-border">
                                    <i data-lucide="lock" class="absolute left-0 top-2.5 w-3.5 h-3.5 text-zinc-400"></i>
                                    <input type="password" id="passwordInput" required class="w-full pl-6 pr-8 py-2 text-xs bg-transparent text-white outline-none placeholder:text-zinc-500 uppercase" placeholder="PASSWORD">
                                    <button type="button" id="togglePassword" class="absolute right-0 top-2 text-zinc-400 hover:text-white">
                                        <i data-lucide="eye" class="w-3.5 h-3.5" id="eyeIcon"></i>
                                    </button>
                                </div>
                                <!-- Profile URL Field (Sign Up only) -->
                                <div id="urlField" class="relative input-border hidden-mode">
                                    <i data-lucide="link" class="absolute left-0 top-2.5 w-3.5 h-3.5 text-zinc-400"></i>
                                    <input type="url" id="urlInput" class="w-full pl-6 pr-2 py-2 text-xs bg-transparent text-white outline-none placeholder:text-zinc-500 uppercase" placeholder="PROFILE IMAGE URL">
                                </div>
                                <!-- Submit Button -->
                                <button type="submit" id="submitBtn" class="w-full mt-2 bg-white text-black text-[10px] font-bold py-3 uppercase tracking-tighter flex items-center justify-center gap-2 hover:bg-zinc-200 transition-all active:translate-x-[2px] active:translate-y-[2px] active:shadow-none">
                                    <span id="btnText">Sign In</span>
                                    <i data-lucide="arrow-right" class="w-3 h-3" id="btnIcon"></i>
                                </button>
                            </form>
                            <!-- Toggle Mode Button -->
                            <div class="mt-5 pt-4 border-t border-white/10 text-center">
                                <button id="toggleModeBtn" class="text-[9px] font-bold uppercase tracking-tight text-zinc-400 hover:text-white hover:underline transition-colors">
                                    [ New? Create Account ]
                                </button>
                            </div>
                        </div>
                    </div>
                    <!-- hidden bubble tail (useless inside chat, but kept for structure) -->
                    <div class="hidden bubble-tail"></div>
                </div>
            `;

            // Append to chat container
            chatContainer.appendChild(pair);
            authMessagePair = pair;

            // Initialize lucide icons inside the new block
            if (window.lucide) {
                lucide.createIcons({ root: pair });
            }

            // ---------- attach event listeners for auth UI ----------
            const closeBtn = pair.querySelector('#closeAuthBtn');
            const authForm = pair.querySelector('#authForm');
            const toggleModeBtn = pair.querySelector('#toggleModeBtn');
            const togglePassword = pair.querySelector('#togglePassword');
            const passwordInput = pair.querySelector('#passwordInput');
            const nameField = pair.querySelector('#nameField');
            const urlField = pair.querySelector('#urlField');
            const btnText = pair.querySelector('#btnText');
            const eyeIcon = pair.querySelector('#eyeIcon');

            let isSignIn = true;   // mode within auth
            let showPassword = false;

            function updateAuthUImode() {
                if (isSignIn) {
                    nameField.classList.add('hidden-mode');
                    urlField.classList.add('hidden-mode');
                    btnText.innerText = 'Sign In';
                    toggleModeBtn.innerText = '[ New? Create Account ]';
                    pair.querySelector('#nameInput').required = false;
                } else {
                    nameField.classList.remove('hidden-mode');
                    urlField.classList.remove('hidden-mode');
                    btnText.innerText = 'Sign Up';
                    toggleModeBtn.innerText = '[ Have account? Sign In ]';
                    pair.querySelector('#nameInput').required = true;
                }
                // re-create icons in case they changed (like eye)
                if (window.lucide) lucide.createIcons({ root: pair });
            }

            toggleModeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                isSignIn = !isSignIn;
                updateAuthUImode();
            });

            togglePassword.addEventListener('click', (e) => {
                e.preventDefault();
                showPassword = !showPassword;
                passwordInput.type = showPassword ? 'text' : 'password';
                eyeIcon.setAttribute('data-lucide', showPassword ? 'eye-off' : 'eye');
                if (window.lucide) lucide.createIcons({ root: pair });
            });

            // close button -> remove auth message
            closeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                removeAuthMessage();
            });

            // form submit (mock auth)
            authForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const submitBtn = pair.querySelector('#submitBtn');
                const originalContent = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<div class="spinner"></div>';

                // simulate auth delay
                setTimeout(() => {
                    // mock successful login
                    isLoggedIn = true;
                    updateHeaderUI();

                    // restore button (optional)
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalContent;

                    // close auth message
                    removeAuthMessage();

                    // optionally show a short system message
                    const successDiv = document.createElement('div');
                    successDiv.className = 'message-pair';
                    successDiv.innerHTML = `<div class="ai-message"><p>✅ Welcome! You are now signed in.</p></div>`;
                    chatContainer.appendChild(successDiv);
                    setTimeout(() => chatContainer.scrollTop = chatContainer.scrollHeight, 50);
                }, 1200);
            });

            // scroll to show the auth panel
            setTimeout(() => {
                pair.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        }

        // ---------- header button click (login/logout) ----------
        authToggleBtn.addEventListener('click', () => {
            if (isLoggedIn) {
                // logout action
                isLoggedIn = false;
                updateHeaderUI();
                // optional: close auth if open
                removeAuthMessage();
                // maybe add a system message
                const logoutMsg = document.createElement('div');
                logoutMsg.className = 'message-pair';
                logoutMsg.innerHTML = `<div class="ai-message"><p>👋 You have been logged out.</p></div>`;
                chatContainer.appendChild(logoutMsg);
                setTimeout(() => chatContainer.scrollTop = chatContainer.scrollHeight, 50);
            } else {
                // login: show auth modal
                showAuthModal();
            }
        });

        // ---------- original chat functions (unchanged) ----------
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

        const katexOptions = {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false }
            ],
            throwOnError: false
        };

        let currentPair = null;
        let isWaiting = false;

        async function fetchAIResponse(prompt) {
            const systemPrompt = "You are Dilshad, a technical Middle School Teacher. Use English only. Keep responses concise. Use LaTeX for math (e.g., $x^2$). Format important content as follows: **important term** (highlighted), __definition__ (underlined), [[formula or equation]] (boxed). The user's request is top priority.";
            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: `${systemPrompt}\n\nUSER PROMPT: ${prompt}` }] }]
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    console.error("Proxy Error:", data);
                    return `Proxy Error ${response.status}: ${data.error?.message || "Unknown error"}`;
                }
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                return text || "⚠️ No response content.";
            } catch (error) {
                console.error("Network or fetch error:", error);
                return "❌ Network error – please check your connection and proxy.";
            }
        }

        function formatAIMessage(text) {
            const paragraphs = text.split(/\n\s*\n/);
            const processed = paragraphs.map(para => {
                if (!para.trim()) return '<p></p>';
                let formattedPara = para
                    .replace(/\*\*(.*?)\*\*/g, '<span class="highlight">$1</span>')
                    .replace(/__(.*?)__/g, '<span class="underline">$1</span>')
                    .replace(/\[\[(.*?)\]\]/g, '<span class="formula-box">$1</span>');
                formattedPara = formattedPara.replace(/\n/g, '<br>');
                return `<p>${formattedPara}</p>`;
            });
            return processed.join('');
        }

        function appendMessage(text, isUser = false) {
            if (isUser) {
                currentPair = document.createElement('div');
                currentPair.className = 'message-pair';
                chatContainer.appendChild(currentPair);
            }
            const div = document.createElement('div');
            div.className = isUser ? 'user-bubble' : 'ai-message';
            if (isUser) {
                div.textContent = text;
            } else {
                div.innerHTML = formatAIMessage(text);
            }
            if (currentPair) {
                currentPair.appendChild(div);
            } else {
                chatContainer.appendChild(div);
            }
            if (window.renderMathInElement) {
                renderMathInElement(div, katexOptions);
            }
            setTimeout(() => {
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typing';
            div.className = 'typing-indicator';
            div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            if (currentPair) {
                currentPair.appendChild(div);
            } else {
                chatContainer.appendChild(div);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        async function sendMessage() {
            if (isWaiting) return;
            const text = userInput.value.trim();
            if (!text) return;
            isWaiting = true;
            sendBtn.style.pointerEvents = 'none';
            userInput.disabled = true;
            appendMessage(text, true);
            userInput.value = '';
            const typing = showTyping();
            const response = await fetchAIResponse(text);
            typing.remove();
            appendMessage(response, false);
            isWaiting = false;
            sendBtn.style.pointerEvents = 'auto';
            userInput.disabled = false;
            userInput.focus();
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
        sendBtn.addEventListener('click', sendMessage);

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="message-pair">
                    <div class="ai-message">
                        <p>Greetings! I am <b>Dilshad</b>. I provide technical, scientific explanations for middle school scholars. How may I assist your inquiry today?</p>
                    </div>
                </div>
            `;
            currentPair = null;
            authMessagePair = null;   // auth removed as well
            if (window.renderMathInElement) {
                renderMathInElement(chatContainer, katexOptions);
            }
        }

        window.onload = () => {
            if (window.renderMathInElement) {
                renderMathInElement(chatContainer, katexOptions);
            }
            updateHeaderUI();
        };

        // make removeAuthMessage globally accessible for clearChat integration (optional)
        window.removeAuthMessage = removeAuthMessage;
    </script>
</body>
</html>
