<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StudentPlus · AI Study Assistant</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Font (Inter) for chat + Lucide icons + Creepster for header -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- KaTeX for LaTeX Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/mhchem.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-y: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0a0a14; /* Match header background */
        }

        #app-wrapper {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background-color: #0a0a14;
        }
        
        #question-input, .file-input-hidden {
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }

        .katex {
            font-size: 1.1em !important;
            text-align: left !important;
        }
        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
        }

        #chat-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #chat-container::-webkit-scrollbar {
            display: none;
        }

        @media (min-width: 768px) {
            #app-wrapper {
                position: relative;
                margin: 0 auto;
                max-width: 600px;
                height: 90vh;
                max-height: 800px;
                border-radius: 0.5rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                top: 50%;
                transform: translateY(-50%);
            }
        }

        .loading-dots::after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
            display: inline-block;
            width: 24px;
        }
        @keyframes dots {
            0%, 20% { content: ""; }
            40% { content: "."; }
            60% { content: ".."; }
            80%, 100% { content: "..."; }
        }

        .btn-active:active {
            transform: scale(0.95);
        }
        .transition-custom {
            transition: all 0.15s ease-in-out;
        }
        .creepster {
            font-family: 'Creepster', system-ui;
        }
        /* divider line style */
        .message-pair-divider {
            opacity: 0.6;
            margin: 1rem 0;
        }
    </style>
</head>

<body class="h-full flex flex-col overflow-hidden">

    <div id="app-wrapper" class="flex flex-col overflow-hidden rounded-none md:rounded-lg">

        <!-- ========== NEW HEADER (exactly as provided) ========== -->
        <header style="background-color: #0a0a14; height: 56px;" class="w-full flex items-center justify-between px-3 sticky top-0 z-50 flex-shrink-0">
            
            <!-- Left Section: Brand Logo + Brand Name -->
            <div class="flex items-center gap-2">
                <div class="h-8 w-8 flex items-center justify-center bg-black border-[1px] border-white/60 rounded-md overflow-hidden p-1 shadow-sm">
                    <img 
                        src="https://i.postimg.cc/y88hFhh3/20260311-205800-0000.png" 
                        alt="Logo" 
                        class="h-full w-full object-contain"
                    >
                </div>
                
                <div class="flex flex-col items-center justify-center">
                    <h1 class="creepster text-white text-2xl tracking-wide leading-[0.9]">
                        StudentPlus
                    </h1>
                    <div class="w-full h-[1.5px] mt-1 bg-white"></div>
                </div>
            </div>

            <!-- Right Section: Action Capsule + Profile -->
            <div class="flex items-center gap-2">
                <div class="h-8 flex items-center bg-black border-[1px] border-white/80 rounded-full px-0.5 shadow-sm">
                    <button class="h-full px-1.5 flex items-center justify-center text-white hover:text-gray-400 btn-active transition-custom">
                        <i data-lucide="menu" stroke-width="3" size="14"></i>
                    </button>
                    <button class="h-full px-1.5 flex items-center justify-center text-white hover:text-gray-400 btn-active transition-custom">
                        <i data-lucide="calendar" stroke-width="3" size="14"></i>
                    </button>
                    <button class="h-full px-1.5 flex items-center justify-center text-white hover:text-gray-400 btn-active transition-custom">
                        <i data-lucide="log-in" stroke-width="3" size="14"></i>
                    </button>
                </div>

                <div class="h-8 w-8 flex-shrink-0 flex items-center justify-center bg-black border-[1px] border-white/80 rounded-full overflow-hidden p-0.5 shadow-sm transition-custom hover:scale-105 active:scale-90 cursor-pointer">
                    <img 
                        src="https://i.postimg.cc/y88hFhh3/20260311-205800-0000.png" 
                        alt="Profile" 
                        class="h-full w-full object-cover rounded-full"
                        onerror="this.src='https://via.placeholder.com/32x32?text=S'"
                    >
                </div>
            </div>
        </header>
        <div class="w-full h-[1px] bg-white/20 flex-shrink-0"></div>
        <!-- ========== END HEADER ========== -->

        <!-- Chat Container (Scrollable) -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 bg-[#0a0a14]">
            <!-- Initial Welcome Message (dark themed) -->
            <div class="flex">
                <div class="bg-gray-800/80 text-gray-100 p-3 rounded-lg max-w-sm md:max-w-md">
                    <p class="font-medium">Hello! 👋</p>
                    <p id="welcome-message">
                        I'm your AI study assistant. Ask any academic question (text or image).<br>
                        💡 <strong>Video code #56788</strong> plays a study mix.<br>
                        📸 Tap the <span class="inline-flex items-center">📷</span> icon to upload a math/chem diagram.<br>
                        ✨ LaTeX is supported: $$E = mc^2$$
                    </p>
                </div>
            </div>
        </main>

        <!-- Image Preview Container (above input) -->
        <div id="image-preview-container" class="hidden mx-4 mb-2 bg-gray-800/60 rounded-xl p-2 flex items-center gap-3 border border-white/10 flex-shrink-0">
            <img id="preview-img" class="w-12 h-12 object-cover rounded-md border border-white/20" alt="preview">
            <div class="flex-1">
                <p id="preview-filename-text" class="text-white text-xs truncate"></p>
                <button id="remove-image-btn" class="text-red-400 text-xs font-medium mt-1 hover:text-red-300">Remove</button>
            </div>
        </div>

        <!-- Input Footer with Image Upload (send button and upload icon same diameter) -->
        <footer class="bg-[#0a0a14] border-t border-white/10 p-4 flex-shrink-0">
            <div class="flex items-center space-x-3">
                <!-- Image Upload Icon (same size as send button: p-3 = 48px diameter) -->
                <label class="cursor-pointer p-3 rounded-full bg-gray-800 hover:bg-gray-700 transition-colors flex items-center justify-center shadow-md border border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-white">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>
                    <input type="file" id="image-upload" accept="image/*" class="hidden file-input-hidden" />
                </label>

                <!-- Text Input Form -->
                <form id="solver-form" class="flex-1 flex items-center space-x-3">
                    <input 
                        type="text" 
                        id="question-input"
                        placeholder="Type a question or video code #56788..."
                        class="flex-1 w-full px-4 py-3 border border-gray-600 rounded-full bg-gray-800 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        autocomplete="off"
                    >
                    <button 
                        type="submit"
                        id="send-button"
                        class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
                        aria-label="Send message"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                            <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.98.75.75 0 0 0 0-1.212A60.517 60.517 0 0 0 3.478 2.404Z" />
                        </svg>
                    </button>
                </form>
            </div>
        </footer>

        <!-- Error Modal -->
        <div id="error-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50">
            <div class="bg-gray-800 rounded-lg shadow-xl p-6 max-w-sm w-full border border-white/20">
                <h3 class="text-lg font-medium text-red-400">Error</h3>
                <p id="error-message" class="mt-2 text-sm text-gray-300"></p>
                <button id="close-error-modal" class="mt-4 w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700">Close</button>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Initialize Lucide icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            // DOM elements
            const form = document.getElementById('solver-form');
            const input = document.getElementById('question-input');
            const chatContainer = document.getElementById('chat-container');
            const sendButton = document.getElementById('send-button');
            const errorModal = document.getElementById('error-modal');
            const errorMessageSpan = document.getElementById('error-message');
            const closeErrorBtn = document.getElementById('close-error-modal');
            const imageUploadInput = document.getElementById('image-upload');
            const imagePreviewContainer = document.getElementById('image-preview-container');
            const previewImg = document.getElementById('preview-img');
            const previewFilenameText = document.getElementById('preview-filename-text');
            const removeImageBtn = document.getElementById('remove-image-btn');

            // ---- Constants ----
            const BACKEND_URL = 'https://dilshadalmm.onrender.com/api/search';
            const VIDEO_CODE = '#56788';
            const LEGACY_VIDEO_ID = 'bLlJCeziBVg';
            const LEGACY_VIDEO_URL = `https://www.youtube.com/embed/${LEGACY_VIDEO_ID}`;

            // State
            let pendingImageBase64 = null;       // full dataURL
            let pendingImageName = null;
            let isRequestInProgress = false;
            let currentLoadingMessageDiv = null;

            // ========== NEW HELPER: Pause all YouTube videos ==========
            function pauseAllVideos() {
                const iframes = document.querySelectorAll('#chat-container iframe');
                iframes.forEach(iframe => {
                    try {
                        if (iframe.src && iframe.src.includes('youtube.com/embed')) {
                            // YouTube iframe API pause command
                            iframe.contentWindow.postMessage(
                                JSON.stringify({ event: 'command', func: 'pauseVideo', args: '' }),
                                '*'
                            );
                        }
                    } catch (e) { /* silent fail */ }
                });
            }

            // ========== Helper: Add divider line between Q&A pairs ==========
            function addDividerBetweenPairs() {
                const lastChild = chatContainer.lastElementChild;
                // avoid duplicate dividers
                if (lastChild && lastChild.classList && lastChild.classList.contains('message-pair-divider')) {
                    return;
                }
                // also avoid adding divider directly after welcome message (if only welcome exists)
                const allMsgs = chatContainer.children;
                if (allMsgs.length === 1 && allMsgs[0].innerText.includes("Hello!")) {
                    return;
                }
                const divider = document.createElement('div');
                divider.className = 'message-pair-divider border-t border-white/20 my-4';
                chatContainer.appendChild(divider);
            }

            // ---- Helper: render KaTeX ----
            function renderKaTeX(element) {
                if (typeof renderMathInElement === 'undefined') return;
                try {
                    renderMathInElement(element, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false },
                            { left: '\\[', right: '\\]', display: true },
                            { left: "\\ce{", right: "}", display: false, mhchem: true }
                        ],
                        throwOnError: false
                    });
                } catch (err) { console.warn("KaTeX error", err); }
            }

            // ---- Add message to chat (supports optional image) ----
            // RETURNS the outer wrapper element (for scrolling)
            function addMessage(content, sender, imageSrc = null) {
                const wrapper = document.createElement('div');
                wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
                
                const bubble = document.createElement('div');
                bubble.className = `p-3 rounded-lg max-w-sm md:max-w-md ${
                    sender === 'user' 
                        ? 'bg-blue-600 text-white' 
                        : 'bg-gray-700 text-gray-100'
                }`;

                // For user messages, possibly include image preview
                if (sender === 'user' && imageSrc) {
                    const imgElement = document.createElement('img');
                    imgElement.src = imageSrc;
                    imgElement.className = 'max-w-[150px] max-h-[150px] rounded-md mb-2 object-contain border border-white/20';
                    bubble.appendChild(imgElement);
                }
                
                // Add text content
                const textSpan = document.createElement('div');
                if (sender === 'ai') {
                    let html = content
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/\n/g, '<br>');
                    textSpan.innerHTML = html;
                } else {
                    textSpan.textContent = content;
                }
                bubble.appendChild(textSpan);
                wrapper.appendChild(bubble);
                chatContainer.appendChild(wrapper);
                
                // LaTeX rendering for both user and AI messages (new requirement)
                renderKaTeX(bubble);
                
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return wrapper; // return outer wrapper for scroll reference
            }

            // ---- Loading indicator ----
            function showLoadingMessage() {
                if (currentLoadingMessageDiv) return;
                const wrapper = document.createElement('div');
                wrapper.className = 'flex justify-start';
                wrapper.id = 'loading-ai-msg';
                const bubble = document.createElement('div');
                bubble.className = 'bg-gray-700 text-gray-300 p-3 rounded-lg flex items-center space-x-2';
                bubble.innerHTML = '<span>Thinking</span><span class="loading-dots"></span>';
                wrapper.appendChild(bubble);
                chatContainer.appendChild(wrapper);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                currentLoadingMessageDiv = wrapper;
            }

            function hideLoadingMessage() {
                if (currentLoadingMessageDiv) {
                    currentLoadingMessageDiv.remove();
                    currentLoadingMessageDiv = null;
                }
            }

            // ---- Video player with auto-pause previous ----
            function addVideoPlayerInChat(videoUrl, title = "Video solution") {
                // pause all existing videos before adding new one
                pauseAllVideos();
                
                const videoWrapper = document.createElement('div');
                videoWrapper.className = 'w-full my-4 rounded-xl overflow-hidden shadow-lg';
                const iframeHtml = `
                    <div class="aspect-video w-full bg-gray-900">
                        <iframe 
                            width="100%" 
                            height="100%" 
                            src="${videoUrl}?autoplay=1" 
                            title="${title}"
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            referrerpolicy="strict-origin-when-cross-origin"
                            allowfullscreen
                            class="w-full h-full"
                        ></iframe>
                    </div>
                `;
                videoWrapper.innerHTML = iframeHtml;
                chatContainer.appendChild(videoWrapper);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return videoWrapper;
            }

            // ---- Error modal ----
            function showError(message) {
                errorMessageSpan.textContent = message;
                errorModal.classList.remove('hidden');
            }

            // ---- Image preview handling ----
            function showImagePreview(dataUrl, fileName) {
                previewImg.src = dataUrl;
                previewFilenameText.textContent = fileName.length > 30 ? fileName.slice(0, 27)+'...' : fileName;
                imagePreviewContainer.classList.remove('hidden');
            }

            function hideImagePreview() {
                imagePreviewContainer.classList.add('hidden');
                previewImg.src = '';
                previewFilenameText.textContent = '';
            }

            function resetImageAttachment() {
                pendingImageBase64 = null;
                pendingImageName = null;
                imageUploadInput.value = '';
                hideImagePreview();
            }

            // Handle image selection
            imageUploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showError('Only image files are allowed (PNG, JPG, etc.)');
                    resetImageAttachment();
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    showError('Image too large, max 5MB.');
                    resetImageAttachment();
                    return;
                }
                pendingImageName = file.name;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    pendingImageBase64 = ev.target.result;
                    showImagePreview(pendingImageBase64, pendingImageName);
                };
                reader.onerror = () => {
                    showError('Failed to read image');
                    resetImageAttachment();
                };
                reader.readAsDataURL(file);
            });

            removeImageBtn.addEventListener('click', () => {
                resetImageAttachment();
            });

            // ---- Backend call ----
            async function sendToBackend(text, imageBase64) {
                const payload = {
                    text: text || '',
                    imageBase64: imageBase64 || null
                };
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 45000);
                
                try {
                    const response = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    if (!response.ok) throw new Error(`Server responded with ${response.status}`);
                    return await response.json();
                } catch (err) {
                    if (err.name === 'AbortError') throw new Error('Request timed out. Please try again.');
                    throw new Error(`Network error: ${err.message}`);
                }
            }

            // ---- Process AI response: show normalized question & video if present ----
            async function processAiResponse(data, userRawText, hadImage) {
                const normalizedQuestion = data.question || "No question text returned.";
                const videoUrl = data.videoUrl ? data.videoUrl.trim() : null;
                
                let aiWrapper = null;
                if (normalizedQuestion) {
                    aiWrapper = addMessage(normalizedQuestion, 'ai');
                } else {
                    aiWrapper = addMessage("Sorry, I couldn't process that question.", 'ai');
                }
                
                if (videoUrl && videoUrl !== "") {
                    let embedVideo = videoUrl;
                    if (videoUrl.includes('youtube.com/watch?v=')) {
                        const videoId = new URL(videoUrl).searchParams.get('v');
                        if (videoId) embedVideo = `https://www.youtube.com/embed/${videoId}`;
                    } else if (videoUrl.includes('youtu.be/')) {
                        const videoId = videoUrl.split('/').pop().split('?')[0];
                        embedVideo = `https://www.youtube.com/embed/${videoId}`;
                    }
                    addVideoPlayerInChat(embedVideo, "Video solution");
                }
                
                // Add divider line to separate this Q&A pair from next
                addDividerBetweenPairs();
                
                // Scroll the AI response into view (smooth)
                if (aiWrapper) {
                    aiWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                }
            }

            // ---- Main submit handler ----
            async function onSubmit(e) {
                e.preventDefault();
                if (isRequestInProgress) return;
                
                const rawText = input.value.trim();
                const hasImage = !!pendingImageBase64;
                if (!rawText && !hasImage) return;
                
                // Video code detection (client-side)
                if (rawText === VIDEO_CODE) {
                    // user message first
                    addMessage(rawText, 'user');
                    input.value = '';
                    resetImageAttachment();
                    
                    // pause any existing video before adding new one
                    pauseAllVideos();
                    addVideoPlayerInChat(LEGACY_VIDEO_URL, "Study Music: Lofi Hiphop Beats");
                    const aiMsgWrapper = addMessage(`Video code **${VIDEO_CODE}** recognized. Playing "The Best Study Music: Lofi Hiphop Beats" for you!`, 'ai');
                    
                    // add divider for this pair
                    addDividerBetweenPairs();
                    
                    // scroll AI response into view
                    if (aiMsgWrapper) {
                        aiMsgWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                    input.blur();
                    return;
                }
                
                isRequestInProgress = true;
                sendButton.disabled = true;
                
                // Build user message with optional image preview
                const userDisplayText = rawText ? rawText : (hasImage ? "📷 Image uploaded" : "");
                const userImageCopy = hasImage ? pendingImageBase64 : null;
                addMessage(userDisplayText, 'user', userImageCopy);
                
                // Store image payload and clear UI
                const imagePayload = pendingImageBase64;
                const textPayload = rawText;
                input.value = '';
                resetImageAttachment();
                input.blur();
                
                showLoadingMessage();
                
                try {
                    const backendData = await sendToBackend(textPayload, imagePayload);
                    hideLoadingMessage();
                    await processAiResponse(backendData, textPayload, !!imagePayload);
                } catch (err) {
                    hideLoadingMessage();
                    console.error("Backend error:", err);
                    showError(err.message || "Failed to reach the AI service. Please try again.");
                    const errorWrapper = addMessage("⚠️ Sorry, the AI assistant is temporarily unavailable. Please check your connection or try again later.", 'ai');
                    addDividerBetweenPairs();
                    if (errorWrapper) {
                        errorWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                } finally {
                    isRequestInProgress = false;
                    sendButton.disabled = false;
                }
            }
            
            form.addEventListener('submit', onSubmit);
            
            // Keyboard handling: scroll to bottom on focus
            input.addEventListener('focus', () => setTimeout(() => chatContainer.scrollTop = chatContainer.scrollHeight, 300));
            input.addEventListener('blur', () => setTimeout(() => chatContainer.scrollTop = chatContainer.scrollHeight, 100));
            
            closeErrorBtn.addEventListener('click', () => errorModal.classList.add('hidden'));
            
            // Initial KaTeX render for welcome message
            const welcomeDiv = document.getElementById('welcome-message');
            if (welcomeDiv) renderKaTeX(welcomeDiv);
            
            // Disable context menu & copy globally (security)
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            document.addEventListener('copy', (e) => e.preventDefault());
        });
    </script>
</body>
</html>
