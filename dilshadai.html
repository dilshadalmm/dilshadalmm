<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilshad - AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Creepster&display=swap" rel="stylesheet">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        * {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        input {
            -webkit-user-select: text;
            -ms-user-select: text;
            user-select: text;
            touch-action: manipulation;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a14;
            color: #fff;
            font-family: "Acme", sans-serif;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .creepster-font {
            font-family: "Creepster", system-ui;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .chat-container::-webkit-scrollbar {
            display: none;
        }
        .message-pair {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1a1a2e;
            width: 100%;
        }
        .user-bubble {
            align-self: flex-end;
            background: #a87ff3;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            max-width: 85%;
            box-shadow: 0 4px 15px rgba(168, 127, 243, 0.3);
            word-wrap: break-word;
        }
        .ai-message {
            align-self: flex-start;
            max-width: 90%;
            line-height: 1.6;
            word-wrap: break-word;
            background: #1a1a2e;
            padding: 0.75rem 1rem;
            border-radius: 4px;
        }
        .ai-message p {
            margin: 0;
        }
        .ai-message p + p {
            margin-top: 0.5rem;
        }
        .input-area {
            padding: 1.5rem;
            background: #0a0a14;
            border-top: 1px solid #1a1a2e;
            flex-shrink: 0;
        }
        .input-wrapper {
            background: #151525;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border: 1px solid #252535;
        }
        input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            padding: 0.75rem;
            outline: none;
            font-size: 1rem;
            font-family: inherit;
        }
        .send-btn {
            background: #a87ff3;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #9066e0;
        }
        .send-btn:active {
            transform: scale(0.95);
        }
        .header {
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a2e;
            flex-shrink: 0;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: #2d2d45;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px;
            align-self: flex-start;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #a87ff3;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(2) { animation-delay: -0.32s; }
        .dot:nth-child(3) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        /* Visual formatting classes */
        .highlight {
            background: #7c3aed;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .underline {
            border-bottom: 3px solid #a87ff3;
            padding-bottom: 2px;
        }
        .formula-box {
            display: inline-block;
            border: 2px solid #a87ff3;
            padding: 6px 10px;
            border-radius: 6px;
            background: #111122;
            font-weight: bold;
            margin: 4px 0;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="main-wrapper">
        <div class="header">
            <div class="flex items-center">
                <div class="avatar">
                    <i class="fa-solid fa-robot text-purple-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight creepster-font text-purple-400">DILSHAD</h1>
                    <p class="text-xs text-gray-400">Middle School Teacher</p>
                </div>
            </div>
            <button onclick="clearChat()" class="text-xs text-gray-400 hover:text-white">
                <i class="fa-regular fa-trash-can"></i> Clear
            </button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message-pair">
                <div class="ai-message">
                    <p>Greetings! I am <b>Dilshad</b>. I provide technical, scientific explanations for middle school scholars. How may I assist your inquiry today?</p>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask anything...." autocomplete="off" spellcheck="false">
                <button class="send-btn" id="sendBtn">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 🔐 Proxy endpoint – no API key exposed in frontend
        const PROXY_URL = "https://ozrrdgnrntfuaifskyoj.supabase.co/functions/v1/gemini-proxy";

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Prevent zoom
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

        const katexOptions = {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false }
            ],
            throwOnError: false
        };

        let currentPair = null;
        let isWaiting = false;

        // System prompt with formatting instructions
        async function fetchAIResponse(prompt) {
            const systemPrompt = "You are Dilshad, a technical Middle School Teacher. Use English only. Keep responses concise. Use LaTeX for math (e.g., $x^2$). Format important content as follows: **important term** (highlighted), __definition__ (underlined), [[formula or equation]] (boxed). The user's request is top priority.";

            try {
                // Use the fixed proxy instead of direct Gemini API
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: `${systemPrompt}\n\nUSER PROMPT: ${prompt}` }] }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    console.error("Proxy Error:", data);
                    return `Proxy Error ${response.status}: ${data.error?.message || "Unknown error"}`;
                }

                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                return text || "⚠️ No response content.";

            } catch (error) {
                console.error("Network or fetch error:", error);
                return "❌ Network error – please check your connection and proxy.";
            }
        }

        // Paragraph‑safe formatter
        function formatAIMessage(text) {
            // Split into paragraphs by double newline (preserve empty paragraphs)
            const paragraphs = text.split(/\n\s*\n/);
            
            const processed = paragraphs.map(para => {
                if (!para.trim()) return '<p></p>'; // keep empty paragraphs if needed
                
                // Apply formatting inside the paragraph
                let formattedPara = para
                    .replace(/\*\*(.*?)\*\*/g, '<span class="highlight">$1</span>')
                    .replace(/__(.*?)__/g, '<span class="underline">$1</span>')
                    .replace(/\[\[(.*?)\]\]/g, '<span class="formula-box">$1</span>');
                
                // Replace single newlines with <br>
                formattedPara = formattedPara.replace(/\n/g, '<br>');
                
                return `<p>${formattedPara}</p>`;
            });
            
            return processed.join('');
        }

        function appendMessage(text, isUser = false) {
            if (isUser) {
                currentPair = document.createElement('div');
                currentPair.className = 'message-pair';
                chatContainer.appendChild(currentPair);
            }

            const div = document.createElement('div');
            div.className = isUser ? 'user-bubble' : 'ai-message';

            if (isUser) {
                div.textContent = text;
            } else {
                // Use the new formatter
                div.innerHTML = formatAIMessage(text);
            }

            if (currentPair) {
                currentPair.appendChild(div);
            } else {
                chatContainer.appendChild(div);
            }

            if (window.renderMathInElement) {
                renderMathInElement(div, katexOptions);
            }

            setTimeout(() => {
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typing';
            div.className = 'typing-indicator';
            div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            if (currentPair) {
                currentPair.appendChild(div);
            } else {
                chatContainer.appendChild(div);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        async function sendMessage() {
            if (isWaiting) return;
            const text = userInput.value.trim();
            if (!text) return;

            isWaiting = true;
            sendBtn.style.pointerEvents = 'none';
            userInput.disabled = true;

            appendMessage(text, true);
            userInput.value = '';

            const typing = showTyping();
            const response = await fetchAIResponse(text);
            typing.remove();
            appendMessage(response, false);

            isWaiting = false;
            sendBtn.style.pointerEvents = 'auto';
            userInput.disabled = false;
            userInput.focus();
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
        sendBtn.addEventListener('click', sendMessage);

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="message-pair">
                    <div class="ai-message">
                        <p>Greetings! I am <b>Dilshad</b>. I provide technical, scientific explanations for middle school scholars. How may I assist your inquiry today?</p>
                    </div>
                </div>
            `;
            currentPair = null;
            if (window.renderMathInElement) {
                renderMathInElement(chatContainer, katexOptions);
            }
        }

        window.onload = () => {
            if (window.renderMathInElement) {
                renderMathInElement(chatContainer, katexOptions);
            }
        };
    </script>
</body>
</html>
