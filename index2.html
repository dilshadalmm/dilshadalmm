    <script>
        // ===== CACHE MANAGER =====
        class CacheManager {
            constructor() {
                this.allStudentsCache = new Map();
                this.allInvoicesCache = new Map();
                this.allPaymentsCache = new Map();
                this.feeSettingsCache = new Map();
                this.allClassesCache = new Map();
                this.examResultsCache = new Map();
                this.examsCache = new Map(); // New cache for exams
            }
            
            getAllStudentsKey(schoolId) {
                return `${schoolId}`;
            }
            
            getAllInvoicesKey(schoolId) {
                return `${schoolId}`;
            }
            
            getAllPaymentsKey(schoolId) {
                return `${schoolId}`;
            }
            
            getFeeSettingsKey(schoolId) {
                return `${schoolId}`;
            }
            
            getAllClassesKey(schoolId) {
                return `${schoolId}`;
            }
            
            getExamResultsKey(schoolId, classId) {
                return `${schoolId}/${classId}`;
            }
            
            getExamsKey(schoolId, classId) {
                return `${schoolId}/${classId}/exams`;
            }
            
            // Students cache methods
            getAllStudents(schoolId) {
                const key = this.getAllStudentsKey(schoolId);
                return this.allStudentsCache.get(key);
            }
            
            setAllStudents(schoolId, students) {
                const key = this.getAllStudentsKey(schoolId);
                this.allStudentsCache.set(key, students);
            }
            
            clearAllStudents(schoolId) {
                const key = this.getAllStudentsKey(schoolId);
                this.allStudentsCache.delete(key);
            }
            
            // Classes cache methods
            getAllClasses(schoolId) {
                const key = this.getAllClassesKey(schoolId);
                return this.allClassesCache.get(key);
            }
            
            setAllClasses(schoolId, classes) {
                const key = this.getAllClassesKey(schoolId);
                this.allClassesCache.set(key, classes);
            }
            
            // Exams cache methods
            getExams(schoolId, classId) {
                const key = this.getExamsKey(schoolId, classId);
                return this.examsCache.get(key);
            }
            
            setExams(schoolId, classId, exams) {
                const key = this.getExamsKey(schoolId, classId);
                this.examsCache.set(key, exams);
            }
            
            clearExams(schoolId, classId) {
                const key = this.getExamsKey(schoolId, classId);
                this.examsCache.delete(key);
            }
            
            // Invoices cache methods
            getAllInvoices(schoolId) {
                const key = this.getAllInvoicesKey(schoolId);
                return this.allInvoicesCache.get(key);
            }
            
            setAllInvoices(schoolId, invoices) {
                const key = this.getAllInvoicesKey(schoolId);
                this.allInvoicesCache.set(key, invoices);
            }
            
            clearAllInvoices(schoolId) {
                const key = this.getAllInvoicesKey(schoolId);
                this.allInvoicesCache.delete(key);
            }
            
            // Payments cache methods
            getAllPayments(schoolId) {
                const key = this.getAllPaymentsKey(schoolId);
                return this.allPaymentsCache.get(key);
            }
            
            setAllPayments(schoolId, payments) {
                const key = this.getAllPaymentsKey(schoolId);
                this.allPaymentsCache.set(key, payments);
            }
            
            clearAllPayments(schoolId) {
                const key = this.getAllPaymentsKey(schoolId);
                this.allPaymentsCache.delete(key);
            }
            
            // Fee settings cache methods
            getFeeSettings(schoolId) {
                const key = this.getFeeSettingsKey(schoolId);
                return this.feeSettingsCache.get(key);
            }
            
            setFeeSettings(schoolId, feeSettings) {
                const key = this.getFeeSettingsKey(schoolId);
                this.feeSettingsCache.set(key, feeSettings);
            }
            
            // Exam results cache methods
            getExamResults(schoolId, classId) {
                const key = this.getExamResultsKey(schoolId, classId);
                return this.examResultsCache.get(key);
            }
            
            setExamResults(schoolId, classId, examResults) {
                const key = this.getExamResultsKey(schoolId, classId);
                this.examResultsCache.set(key, examResults);
            }
            
            // Clear all caches
            clearAll() {
                this.allStudentsCache.clear();
                this.allInvoicesCache.clear();
                this.allPaymentsCache.clear();
                this.feeSettingsCache.clear();
                this.allClassesCache.clear();
                this.examResultsCache.clear();
                this.examsCache.clear();
            }
        }

        // ===== SESSION MANAGER =====
        class SessionManager {
            constructor(app) {
                this.app = app;
                this.db = null;
                this.localSessionId = null;
                this.sessionListener = null;
                this.isInitialized = false;
                this.listenerActive = false;
                this.isOnline = navigator.onLine;
                
                this.setupNetworkListeners();
            }

            setupNetworkListeners() {
                window.addEventListener('online', () => {
                    this.isOnline = true;
                    console.log("Device came online, performing server-side session verification...");
                    this.verifySessionImmediately();
                });
                
                window.addEventListener('offline', () => {
                    this.isOnline = false;
                    console.log("Device went offline");
                });
                
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        console.log("Page became visible, performing server-side session verification...");
                        this.verifySessionImmediately();
                    }
                });
            }

            initialize() {
                if (this.isInitialized) return;
                
                try {
                    this.db = firebase.firestore();
                    this.isInitialized = true;
                    console.log("SessionManager initialized");
                    
                } catch (error) {
                    console.error("SessionManager initialization error:", error);
                }
            }

            generateSessionId() {
                const array = new Uint32Array(8);
                window.crypto.getRandomValues(array);
                return Array.from(array, dec => ('0' + dec.toString(16)).substr(-2)).join('');
            }

            async createSession(userUid) {
                if (!this.db || !userUid) {
                    console.error("Cannot create session: missing db or userUid");
                    return null;
                }

                try {
                    const sessionId = this.generateSessionId();
                    this.localSessionId = sessionId;
                    
                    localStorage.setItem(`session_${userUid}`, sessionId);
                    
                    await this.db.collection('sessions').doc(userUid).set({
                        sessionId: sessionId,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastActive: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    
                    console.log("New session created for user:", userUid);
                    return sessionId;
                } catch (error) {
                    console.error("Error creating session:", error);
                    return null;
                }
            }

            async resumeSession(userUid) {
                if (!this.db || !userUid) {
                    console.error("Cannot resume session: missing db or userUid");
                    return false;
                }

                try {
                    const sessionId = localStorage.getItem(`session_${userUid}`);
                    
                    if (!sessionId) {
                        console.log("No local session found in localStorage, forcing logout");
                        this.forceLogout(userUid);
                        return false;
                    }
                    
                    this.localSessionId = sessionId;
                    console.log("Resuming existing session for user:", userUid);
                    
                    this.setupSessionListener(userUid);
                    await this.verifySessionImmediately();
                    
                    return true;
                } catch (error) {
                    console.error("Error resuming session:", error);
                    return false;
                }
            }

            getLocalSessionId(userUid) {
                return localStorage.getItem(`session_${userUid}`);
            }

            clearLocalSession(userUid) {
                if (userUid) {
                    localStorage.removeItem(`session_${userUid}`);
                }
                this.localSessionId = null;
            }

            async verifySessionImmediately() {
                const auth = firebase.auth();
                const user = auth.currentUser;
                
                if (!user || !this.db) {
                    return;
                }
                
                const userUid = user.uid;
                const localSessionId = this.localSessionId || this.getLocalSessionId(userUid);
                
                if (!localSessionId) {
                    console.log("No local session found in localStorage, forcing logout");
                    this.forceLogout(userUid);
                    return;
                }
                
                try {
                    const sessionDoc = await this.db.collection('sessions').doc(userUid).get({
                        source: 'server'
                    });
                    
                    if (!sessionDoc.exists) {
                        console.log("Session document doesn't exist in Firestore, forcing logout");
                        this.forceLogout(userUid);
                    }
                    
                    const sessionData = sessionDoc.data();
                    const firestoreSessionId = sessionData.sessionId;
                    
                    console.log("Session verification:", {
                        local: localSessionId,
                        firestore: firestoreSessionId,
                        match: firestoreSessionId === localSessionId
                    });
                    
                    if (firestoreSessionId !== localSessionId) {
                        console.log("Session mismatch detected! Forcing logout...");
                        this.forceLogout(userUid);
                    } else {
                        console.log("Session verification successful");
                    }
                } catch (error) {
                    console.error("Error verifying session:", error);
                    if (this.isOnline) {
                        setTimeout(() => this.verifySessionImmediately(), 5000);
                    }
                }
            }

            setupSessionListener(userUid) {
                if (!this.db || !userUid) {
                    console.error("Cannot setup session listener: missing db or userUid");
                    return;
                }

                this.removeSessionListener();

                const localSessionId = this.localSessionId || this.getLocalSessionId(userUid);
                this.localSessionId = localSessionId;

                if (!localSessionId) {
                    console.error("No local session ID found for user:", userUid);
                    this.forceLogout(userUid);
                    return;
                }

                console.log("Setting up real-time session listener for user:", userUid);
                console.log("Local session ID:", localSessionId);

                this.verifySessionImmediately();

                this.sessionListener = this.db.collection('sessions').doc(userUid)
                    .onSnapshot((doc) => {
                        this.handleSessionSnapshot(doc, localSessionId, userUid);
                    }, (error) => {
                        console.error("Session listener error:", error);
                        this.retrySessionListener(userUid);
                    });
                
                this.listenerActive = true;
            }

            handleSessionSnapshot(doc, localSessionId, userUid) {
                if (!doc.exists) {
                    console.log("Session document doesn't exist in Firestore, forcing logout");
                    this.forceLogout(userUid);
                    return;
                }

                const sessionData = doc.data();
                const firestoreSessionId = sessionData.sessionId;

                console.log("Firestore session update:", firestoreSessionId);

                if (localSessionId && firestoreSessionId !== localSessionId) {
                    console.log("Session mismatch detected via real-time listener! Logging out...");
                    this.forceLogout(userUid);
                }
            }

            async forceLogout(userUid) {
                console.log("CRITICAL: Forcing logout due to session violation");
                
                this.removeSessionListener();
                this.clearLocalSession(userUid);
                
                try {
                    await firebase.auth().signOut();
                    console.log("Auto-logout completed due to session violation");
                    
                    if (this.app && this.app.cacheManager) {
                        this.app.cacheManager.clearAll();
                    }
                    
                    window.location.reload();
                    
                } catch (signOutError) {
                    console.error("Error during auto-logout:", signOutError);
                    window.location.reload();
                }
            }

            retrySessionListener(userUid) {
                if (this.listenerActive) return;
                
                setTimeout(() => {
                    const auth = firebase.auth();
                    const user = auth.currentUser;
                    if (user && user.uid === userUid) {
                        this.setupSessionListener(userUid);
                    }
                }, 5000);
            }

            removeSessionListener() {
                if (this.sessionListener) {
                    this.sessionListener();
                    this.sessionListener = null;
                    this.listenerActive = false;
                    console.log("Session listener removed");
                }
            }

            async onUserLogin(userUid) {
                const sessionId = await this.createSession(userUid);
                if (sessionId) {
                    this.setupSessionListener(userUid);
                }
                return sessionId;
            }

            onUserLogout(userUid) {
                this.removeSessionListener();
                this.clearLocalSession(userUid);
            }
        }

        // ===== AUTH MANAGER =====
        class AuthManager {
            constructor(app) {
                this.app = app;
                this.auth = null;
                this.currentUser = null;
                this.isInitialized = false;
                this.authModal = null;
                this.db = null;
                this.sessionManager = new SessionManager(app);
                this.authReady = false;
                this.authReadyPromise = null;
                this.isSigningIn = false;
                this.isPageReload = true;
            }
            
            initialize() {
                if (this.isInitialized) return;
                
                try {
                    this.auth = firebase.auth();
                    this.db = firebase.firestore();
                    
                    this.authReadyPromise = new Promise((resolve) => {
                        this.setupAuthListeners(resolve);
                    });
                    
                    this.sessionManager.initialize();
                    this.isInitialized = true;
                    console.log("Auth initialized successfully");
                    
                } catch (error) {
                    console.error("Auth initialization error:", error);
                }
            }
            
            setupAuthListeners(onAuthReady) {
                let authStateChanged = false;
                
                this.auth.onAuthStateChanged(async (user) => {
                    console.log("Auth state changed:", user ? `User ${user.uid} logged in` : "No user");
                    
                    if (user) {
                        this.currentUser = user;
                        
                        if (this.isPageReload) {
                            console.log("Page reload detected, resuming existing session...");
                            await this.sessionManager.resumeSession(user.uid);
                        } else {
                            console.log("Manual sign-in detected, session creation will be handled by signInWithEmail");
                        }
                        
                        this.isPageReload = false;
                        this.closeAllModals();
                        this.authReady = true;
                        
                        if (this.app && this.app.handleAuthStateChange) {
                            this.app.handleAuthStateChange(user, true);
                        }
                    } else {
                        if (this.currentUser?.uid) {
                            this.sessionManager.onUserLogout(this.currentUser.uid);
                        }
                        this.currentUser = null;
                        this.isSigningIn = false;
                        this.isPageReload = true;
                        
                        this.authReady = true;
                        
                        if (this.app && this.app.handleAuthStateChange) {
                            this.app.handleAuthStateChange(null, false);
                        }
                    }
                    
                    if (!authStateChanged && onAuthReady) {
                        authStateChanged = true;
                        onAuthReady();
                    }
                });
            }
            
            async waitForAuthReady() {
                if (this.authReady) {
                    return true;
                }
                
                if (this.authReadyPromise) {
                    await this.authReadyPromise;
                    return true;
                }
                
                return new Promise((resolve) => {
                    const checkInterval = setInterval(() => {
                        if (this.authReady) {
                            clearInterval(checkInterval);
                            resolve(true);
                        }
                    }, 100);
                    
                    setTimeout(() => {
                        clearInterval(checkInterval);
                        resolve(false);
                    }, 5000);
                });
            }
            
            closeAllModals() {
                this.hideAuthModal();
            }
            
            showAuthModal() {
                this.authModal = document.createElement('div');
                this.authModal.className = 'auth-modal-overlay';
                this.authModal.innerHTML = `
                    <div class="auth-modal">
                        <div class="auth-header">
                            <div class="auth-title">Sign In to School Admin</div>
                        </div>
                        <div class="auth-body">
                            <div class="auth-field">
                                <label class="auth-label">Enter Email</label>

                                <div id="email-error" class="auth-error"></div>
                            </div>
                            
                            <div class="auth-field">
                                <label class="auth-label">Enter Password</label>
                                <input type="password" id="auth-password" class="auth-input" placeholder="••••••••">
                                <div id="password-error" class="auth-error"></div>
                            </div>
                            
                            <button id="sign-in-button" class="auth-button">Sign In</button>
                        </div>
                        <div class="auth-footer">
                            Student portal? <span class="signup-link" id="student-portal-link">Go to Student Portal</span>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(this.authModal);
                this.setupAuthModalEvents();
            }
            
            setupAuthModalEvents() {
                const signInButton = document.getElementById('sign-in-button');
                const emailInput = document.getElementById('auth-email');
                const passwordInput = document.getElementById('auth-password');
                const studentPortalLink = document.getElementById('student-portal-link');
                
                signInButton.addEventListener('click', () => {
                    this.signInWithEmail();
                });
                
                emailInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        passwordInput.focus();
                    }
                });
                
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.signInWithEmail();
                    }
                });
                
                studentPortalLink.addEventListener('click', () => {
                    window.location.href = 'students.html';
                });
                
                this.authModal.addEventListener('click', (e) => {
                    if (e.target === this.authModal) {
                        this.hideAuthModal();
                    }
                });
            }
            
            hideAuthModal() {
                if (this.authModal && this.authModal.parentNode) {
                    this.authModal.parentNode.removeChild(this.authModal);
                    this.authModal = null;
                }
            }
            
            async signInWithEmail() {
                const email = document.getElementById('auth-email').value.trim();
                const password = document.getElementById('auth-password').value.trim();
                const signInButton = document.getElementById('sign-in-button');
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.textContent = '';
                emailError.classList.remove('show');
                passwordError.textContent = '';
                passwordError.classList.remove('show');
                
                if (!email) {
                    emailError.textContent = 'Please enter your email';
                    emailError.classList.add('show');
                    return;
                }
                
                if (!password) {
                    passwordError.textContent = 'Please enter your password';
                    passwordError.classList.add('show');
                    return;
                }
                
                signInButton.textContent = 'Signing In...';
                signInButton.classList.add('loading');
                
                try {
                    this.isSigningIn = true;
                    this.isPageReload = false;
                    
                    await this.auth.signInWithEmailAndPassword(email, password);
                    
                    const user = this.auth.currentUser;
                    if (user) {
                        await this.sessionManager.onUserLogin(user.uid);
                        console.log("Session created for manual sign-in");
                    }
                    
                } catch (error) {
                    console.error("Sign in error:", error);
                    
                    this.isSigningIn = false;
                    this.isPageReload = true;
                    
                    signInButton.textContent = 'Sign In';
                    signInButton.classList.remove('loading');
                    
                    switch (error.code) {
                        case 'auth/invalid-email':
                            emailError.textContent = 'Invalid email address';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-disabled':
                            emailError.textContent = 'This account has been disabled';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-not-found':
                            emailError.textContent = 'No account found with this email';
                            emailError.classList.add('show');
                            break;
                        case 'auth/wrong-password':
                            passwordError.textContent = 'Incorrect password';
                            passwordError.classList.add('show');
                            break;
                        case 'auth/too-many-requests':
                            passwordError.textContent = 'Too many failed attempts. Try again later';
                            passwordError.classList.add('show');
                            break;
                        default:
                            passwordError.textContent = 'Failed to sign in. Please try again';
                            passwordError.classList.add('show');
                    }
                }
            }
            
            isUserLoggedIn() {
                return this.currentUser !== null && this.authReady;
            }
            
            isSigningInState() {
                return this.isSigningIn;
            }
            
            async signOut() {
                try {
                    if (this.currentUser?.uid) {
                        this.sessionManager.onUserLogout(this.currentUser.uid);
                        this.app.cacheManager.clearAll();
                    }
                    
                    await this.auth.signOut();
                    this.authReady = false;
                    this.isSigningIn = false;
                    this.isPageReload = true;
                    console.log("User signed out successfully");
                } catch (error) {
                    console.error("Sign out error:", error);
                    throw error;
                }
            }
        }

                return this.allStudents.filter(s => s.status === 'approved');
            }
            
            // Calculate GPA from grades
            calculateGPA(subjects) {
                if (!subjects || subjects.length === 0) return 0;
                
                let totalPoints = 0;
                let totalCredits = 0;
                
                subjects.forEach(subject => {
                    if (subject.grade && subject.grade !== '-' && subject.creditHours) {
                        const gradePoint = this.gradeMap[subject.grade]?.point || 0;
                        totalPoints += gradePoint * subject.creditHours;
                        totalCredits += subject.creditHours;
                    }
                });
                
                return totalCredits > 0 ? totalPoints / totalCredits : 0;
            }
            
            // Get grade point for a grade
            getGradePoint(grade) {
                return this.gradeMap[grade]?.point || 0;
            }
        }

                    if (!user) {

                    // First, check if user is admin in any school
                    const schoolsSnapshot = await this.db.collection('schools').get();
                    
                    let userSchoolId = null;
                    for (const schoolDoc of schoolsSnapshot.docs) {
                        const schoolData = schoolDoc.data();
                        
                        // Check if user is in admins subcollection
                        const adminDoc = await this.db
                            .collection('schools')
                            .doc(schoolDoc.id)
                            .collection('admins')
                            .doc(user.uid)
                            .get();
                            
                        if (adminDoc.exists && adminDoc.data().approved) {
                            userSchoolId = schoolDoc.id;
                            break;
                        }
                        
                        // Also check if user is in admin field of school document
                        if (schoolData.admin && schoolData.admin.adminId === user.uid && schoolData.admin.approved) {
                            userSchoolId = schoolDoc.id;
                            break;
                        }
                    }
                    
                    if (!userSchoolId) {

            async loadAllClasses() {
                try {
                    const classesPath = this.stateManager.getClassesPath();
                    const classesSnapshot = await this.db.collection(classesPath).get();
                    const classes = [];
                    
                    classesSnapshot.forEach(doc => {
                        classes.push({ 
                            id: doc.id, 
                            ...doc.data()
                        });
                    });
                    
                    this.stateManager.setAllClasses(classes);
                    
                } catch (error) {
                    console.error("Error loading all classes:", error);
                }
            }
            
            async loadAllStudents() {
                try {
                    const classes = this.stateManager.getAllClasses();
                    const allStudents = [];
                    
                    // Load students from each class
                    for (const classObj of classes) {
                        const studentsPath = this.stateManager.getStudentsPath(classObj.id);
                        const studentsSnapshot = await this.db.collection(studentsPath).get();
                        
                        studentsSnapshot.forEach(doc => {
                            const data = doc.data();
                            allStudents.push({ 
                                id: doc.id, 
                                ...data,
                                className: classObj.className || classObj.id,
                                classId: classObj.id,
                                documentId: doc.id,
                                invoices: []
                            });
                        });
                    }
                    
                    // Load invoices for each student
                    for (const student of allStudents) {
                        const invoicesPath = this.stateManager.getInvoicesPath(student.classId, student.documentId);
                        const invoicesSnapshot = await this.db.collection(invoicesPath).get();
                        student.invoices = [];
                        invoicesSnapshot.forEach(doc => {
                            const invoiceData = doc.data();
                            // Calculate balanceDue if not present
                            if (invoiceData.dueAmount === undefined) {
                                invoiceData.dueAmount = (invoiceData.totalAmount || 0) - (invoiceData.amountPaid || 0);
                            }
                            student.invoices.push({ 
                                id: doc.id, 
                                ...invoiceData
                            });
                        });
                    }
                    
                    this.stateManager.setAllStudents(allStudents);
                    
                } catch (error) {
                    console.error("Error loading all students:", error);
                }
            }
            
            async loadAllPayments() {
                try {
                    // Get all students first
                    const students = this.stateManager.getAllStudents();
                    const allPayments = [];
                    
                    // Collect payments from all students
                    for (const student of students) {
                        const paymentsPath = this.stateManager.getPaymentsPath(student.classId, student.documentId);
                        const paymentsSnapshot = await this.db.collection(paymentsPath).orderBy('paymentDate', 'desc').get();
                        
                        paymentsSnapshot.forEach(doc => {
                            allPayments.push({ 
                                id: doc.id, 
                                ...doc.data(),
                                studentId: student.id,
                                studentName: student.studentName,
                                className: student.className,
                                classId: student.classId,
                                studentDocumentId: student.documentId
                            });
                        });
                    }
                    
                    // Sort by paymentDate (most recent first)
                    allPayments.sort((a, b) => {
                        const dateA = a.paymentDate?.toDate ? a.paymentDate.toDate() : new Date(0);
                        const dateB = b.paymentDate?.toDate ? b.paymentDate.toDate() : new Date(0);
                        return dateB - dateA;
                    });
                    
                    this.stateManager.setAllPayments(allPayments);
                    
                } catch (error) {
                    console.error("Error loading all payments:", error);
                }
            }
            
            async loadPayCodes() {
                try {
                    const payCodesPath = this.stateManager.getPayCodesPath();
                    const payCodesSnapshot = await this.db.collection(payCodesPath).get();
                    const payCodes = [];
                    
                    payCodesSnapshot.forEach(doc => {
                        const data = doc.data();
                        // Ensure valid field is boolean and value is number
                        payCodes.push({ 
                            id: doc.id, 
                            code: data.code || '',
                            value: typeof data.value === 'number' ? data.value : 0,
                            valid: typeof data.valid === 'boolean' ? data.valid : true,
                            createdAt: data.createdAt
                        });
                    });
                    
                    this.stateManager.setPayCodes(payCodes);

                    console.error("Error loading pay codes:", error);
                }
            }

            setupEventDelegation() {
                document.addEventListener('click', (e) => {
                    const target = e.target;
                    
                    if (target.closest('#hamburger-menu')) {
                        this.togglePageNumbers();
                    }
                    
                    if (target.closest('#sign-in-prompt-button')) {
                        this.handleSignInClick();
                    }
                    
                    if (target.closest('#logout-button')) {
                        this.handleLogout();
                    }
                    
                    // Dashboard card clicks
                    if (target.closest('.dashboard-card')) {
                        const card = target.closest('.dashboard-card');
                        const view = card.dataset.view;
                        if (view) {
                            this.showView(view);
                        }
                    }
                    
                    // Update payment button - FIXED: Check both registrationNumber and id
                    if (target.closest('#pay-btn')) {
                        e.preventDefault();
                        e.stopPropagation();
                        this.updatePaymentForStudent();
                    }
                    
                    // Create monthly invoices button
                    if (target.closest('#create-monthly-invoices')) {
                        this.createMonthlyInvoices();
                    }
                    
                    // Search input changes
                    if (target.closest('#student-search')) {
                        this.stateManager.studentSearch = target.value;
                        this.renderStudents();
                    }
                    
                    if (target.closest('#payment-search')) {
                        this.stateManager.paymentSearch = target.value;
                        this.renderAllPayments();
                    }
                    
                    // Pagination button click
                    if (target.closest('.page-button')) {
                        const button = target.closest('.page-button');
                        if (button.classList.contains('prev-button')) {
                            this.handlePaginationClick('prev');
                        } else if (button.classList.contains('next-button')) {
                            this.handlePaginationClick('next');
                        }
                    }
                    
                    // Back to dashboard button
                    if (target.closest('#back-to-dashboard')) {
                        this.renderDashboard();
                    }
                    
                    // View student details
                    if (target.closest('.view-student-button')) {
                        const button = target.closest('.view-student-button');
                        const studentId = button.dataset.studentId;
                        this.showStudentDetails(studentId);
                    }
                    
                    // Add pay code button
                    if (target.closest('#add-paycode')) {
                        this.addPayCode();
                    }
                    
                    // Delete pay code button
                    if (target.closest('.delete-paycode')) {
                        const button = target.closest('.delete-paycode');
                        const payCodeId = button.dataset.paycodeId;
                        this.deletePayCode(payCodeId);
                    }
                    
                    // Toggle pay code valid status
                    if (target.closest('.toggle-paycode-valid')) {
                        const button = target.closest('.toggle-paycode-valid');
                        const payCodeId = button.dataset.paycodeId;
                        this.togglePayCodeValid(payCodeId);
                    }
                    
                    // Save settings button
                    if (target.closest('#save-settings')) {
                        this.saveSettings();
                    }
                    
                    // Class tab click
                    if (target.closest('.class-tab')) {
                        const tab = target.closest('.class-tab');
                        const classId = tab.dataset.classId;
                        this.showClassDetails(classId);
                    }
                    
                    // Add Exam button in class details
                    if (target.closest('#add-exam-btn')) {
                        this.showAddExamModal();
                    }
                    
                    // Edit Results button in exam list
                    if (target.closest('.edit-results-btn')) {
                        const button = target.closest('.edit-results-btn');
                        const examId = button.dataset.examId;
                        this.showExamResults(examId);
                    }
                    
                    // View Marksheet button
                    if (target.closest('.view-marksheet-btn')) {
                        const button = target.closest('.view-marksheet-btn');
                        const studentId = button.dataset.studentId;
                        const examId = button.dataset.examId;
                        this.generateMarksheet(studentId, examId);
                    }
                    
                    // Save exam results button
                    if (target.closest('#save-exam-results')) {
                        this.saveExamResults();
                    }
                    
                    // Close modal buttons
                    if (target.closest('.close-exam-modal')) {
                        this.closeExamModal();
                    }
                    
                    if (target.closest('.close-marksheet-modal')) {
                        this.closeMarksheetModal();
                    }
                });
                
                // Prevent default form submission
                document.addEventListener('submit', (e) => {
                    if (e.target.closest('#payment-form')) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    
                    if (e.target.closest('#exam-form')) {
                        e.preventDefault();
                        e.stopPropagation();
                        this.saveExam();
                    }
                });
            }

            async handleAuthStateChange(user, isLoggedIn) {
                console.log("Auth state change handling:", { user: user?.uid, isLoggedIn });
                
                if (this.authCheckInProgress) {
                    console.log("Auth check already in progress, skipping...");
                    return;
                }
                
                this.authCheckInProgress = true;
                
                try {
                    if (isLoggedIn && user) {
                        console.log("User logged in, checking admin permissions...");
                        this.showSkeletonLoading();
                        this.cacheManager.clearAll();
                        await new Promise(resolve => setTimeout(resolve, 300));
                        await this.checkAdminPermission();
                    } else {
                        console.log("User logged out, showing sign in prompt...");
                        this.hideSkeletonLoading();
                        this.showSignInPrompt();
                    }
                } catch (error) {
                    console.error("Error in handleAuthStateChange:", error);
                    this.hideSkeletonLoading();
                    this.showError("Authentication error occurred. Please try again.");
                } finally {
                    this.authCheckInProgress = false;
                }
            }

            // FIXED: Update payment function to properly find students
            async updatePaymentForStudent() {
                const studentRegistration = document.getElementById('student-registration').value.trim();
                const amountInput = document.getElementById('pay-amount').value.trim();
                const paymentMethod = document.getElementById('payment-method').value;
                const transactionCode = document.getElementById('transaction-code').value.trim();
                const invoiceType = document.getElementById('invoice-type').value;
                const statusDiv = document.getElementById('payment-status');
                const payBtn = document.getElementById('pay-btn');
                
                if (!studentRegistration) {
                    statusDiv.innerText = "Please enter a Student Registration Number.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                if (!amountInput || parseFloat(amountInput) <= 0) {
                    statusDiv.innerText = "Please enter a valid amount.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                const amount = parseFloat(amountInput);
                
                // FIXED: Better student finding logic
                const students = this.stateManager.getAllStudents();
                let student = null;
                
                // Try to find by registration number (exact match first)
                student = students.find(s => 
                    s.registrationNumber && s.registrationNumber.toString() === studentRegistration
                );
                
                // If not found, try case-insensitive search
                if (!student) {
                    student = students.find(s => 
                        s.registrationNumber && 
                        s.registrationNumber.toString().toLowerCase() === studentRegistration.toLowerCase()
                    );
                }
                
                // If still not found, try partial match
                if (!student) {
                    student = students.find(s => 
                        s.registrationNumber && 
                        s.registrationNumber.toString().includes(studentRegistration)
                    );
                }
                
                // Try by student ID as fallback
                if (!student) {
                    student = students.find(s => s.id === studentRegistration);
                }
                
                if (!student) {
                    statusDiv.innerText = "Student not found. Please check the Registration Number.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                payBtn.disabled = true;
                payBtn.innerText = "Processing...";
                statusDiv.innerText = `Updating fee payment for ${student.studentName}...`;
                statusDiv.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-200');
                statusDiv.classList.add('bg-blue-50', 'text-blue-800', 'border-blue-200');
                statusDiv.classList.remove('hidden');
                
                try {
                    // Get current Nepali month and year
                    const currentDate = new Date();
                    const nepaliMonths = ["Baisakh", "Jestha", "Ashad", "Shrawan", "Bhadra", "Ashwin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];
                    const currentMonth = nepaliMonths[currentDate.getMonth()];
                    const currentYear = this.stateManager.currentAcademicYear;
                    
                    // Check if invoice exists for current month and type
                    let invoice = student.invoices?.find(inv => 
                        inv.billingMonth === currentMonth && 
                        inv.billingYear === currentYear &&
                        inv.invoiceType === invoiceType
                    );
                    
                    let invoiceId;
                    
                    // Get class fee structure
                    const classes = this.stateManager.getAllClasses();
                    const studentClass = classes.find(c => c.id === student.classId);
                    const classFeeDescription = studentClass?.classFeeDescription || {};
                    
                    // Calculate appropriate fee amount based on invoice type
                    let invoiceAmount = amount;
                    if (invoiceType === 'Monthly') {
                        invoiceAmount = classFeeDescription['Monthly Tuition Fee'] || 1500;
                    } else if (invoiceType === 'Annual') {
                        invoiceAmount = classFeeDescription['Annual Fee'] || 5000;
                    } else if (invoiceType === 'Exam') {
                        invoiceAmount = classFeeDescription['Exam Fee'] || 1000;
                    } else if (invoiceType === 'Admission') {
                        invoiceAmount = classFeeDescription['Admission Fee'] || 2500;
                    }
                    
                    if (!invoice) {
                        // Create new invoice
                        invoiceId = `INV-${Date.now()}`;
                        const dueAmount = invoiceAmount - amount;
                        const newInvoice = {
                            id: invoiceId,
                            invoiceNumber: `INV-${currentYear}-${String(Date.now()).slice(-6)}`,
                            invoiceType: invoiceType,
                            billingMonth: currentMonth,
                            billingYear: currentYear,
                            items: Object.entries(classFeeDescription)
                                .filter(([key, value]) => {
                                    if (invoiceType === 'Monthly' && key.includes('Monthly')) return true;
                                    if (invoiceType === 'Annual' && key.includes('Annual')) return true;
                                    if (invoiceType === 'Exam' && key.includes('Exam')) return true;
                                    if (invoiceType === 'Admission' && key.includes('Admission')) return true;
                                    return false;
                                })
                                .map(([title, amount]) => ({ title, amount })),
                            subtotal: invoiceAmount,
                            discount: 0,
                            fine: 0,
                            totalAmount: invoiceAmount,
                            amountPaid: amount,
                            dueAmount: dueAmount,
                            status: dueAmount <= 0 ? 'PAID' : (amount > 0 ? 'PARTIALLY_PAID' : 'UNPAID'),
                            dueDate: firebase.firestore.Timestamp.fromDate(new Date(currentDate.getFullYear(), currentDate.getMonth(), 25)),
                            issuedAt: firebase.firestore.Timestamp.now(),
                            createdBy: this.authManager.currentUser?.uid || 'ADMIN',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        
                        // Save invoice to Firestore
                        const invoicePath = this.stateManager.getInvoicesPath(student.classId, student.documentId);
                        await this.db.collection(invoicePath).doc(invoiceId).set(newInvoice);
                        
                        invoice = newInvoice;
                    } else {
                        // Update existing invoice
                        invoiceId = invoice.id;
                        const newPaidAmount = (invoice.amountPaid || 0) + amount;
                        const newDueAmount = (invoice.totalAmount || 0) - newPaidAmount;
                        const newStatus = newDueAmount <= 0 ? 'PAID' : 
                                         newPaidAmount > 0 ? 'PARTIALLY_PAID' : 'UNPAID';
                        
                        // Update invoice in Firestore
                        const invoicePath = this.stateManager.getInvoicesPath(student.classId, student.documentId);
                        await this.db.collection(invoicePath).doc(invoiceId).update({
                            amountPaid: newPaidAmount,
                            dueAmount: newDueAmount,
                            status: newStatus,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        
                        invoice.amountPaid = newPaidAmount;
                        invoice.dueAmount = newDueAmount;
                        invoice.status = newStatus;
                    }
                    
                    // Create payment record
                    const paymentId = `PAY-${Date.now()}`;
                    const paymentData = {
                        id: paymentId,
                        paymentRef: `PAY-${currentYear}-${String(Date.now()).slice(-6)}`,
                        paymentDate: firebase.firestore.Timestamp.now(),
                        paymentMethod: paymentMethod,
                        paidAmount: amount,
                        receivedBy: this.authManager.currentUser?.uid || 'ADMIN',
                        remarks: `${invoiceType} fee payment`,
                        transactionId: transactionCode || `TRX${Date.now()}`,
                        invoiceId: invoiceId,
                        invoiceType: invoiceType,
                        invoiceMonth: currentMonth,
                        invoiceYear: currentYear,
                        recordedAt: firebase.firestore.Timestamp.now()
                    };
                    
                    // Save payment to Firestore
                    const paymentDocPath = this.stateManager.getPaymentsPath(student.classId, student.documentId);
                    await this.db.collection(paymentDocPath).doc(paymentId).set(paymentData);
                    
                    // Update local state
                    const updatedPayments = this.stateManager.getAllPayments();
                    updatedPayments.unshift({
                        ...paymentData,
                        studentId: student.id,
                        studentName: student.studentName,
                        className: student.className,
                        classId: student.classId
                    });
                    this.stateManager.setAllPayments(updatedPayments);
                    
                    // Update student's invoices in local state
                    const updatedStudents = this.stateManager.getAllStudents();
                    const studentIndex = updatedStudents.findIndex(s => s.id === student.id);
                    if (studentIndex !== -1) {
                        // Update existing invoice or add new one if doesn't exist
                        const invoiceIndex = updatedStudents[studentIndex].invoices.findIndex(inv => inv.id === invoiceId);
                        if (invoiceIndex !== -1) {
                            updatedStudents[studentIndex].invoices[invoiceIndex] = invoice;
                        } else {
                            updatedStudents[studentIndex].invoices.push(invoice);
                        }
                        this.stateManager.setAllStudents(updatedStudents);
                    }
                    
                    // Show success message
                    statusDiv.innerHTML = `
                        <div class="flex items-center justify-center gap-2">
                            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                            <span>Fee payment of Rs. ${amount.toLocaleString()} successfully recorded for ${student.studentName}!</span>
                        </div>
                    `;
                    statusDiv.classList.remove('bg-blue-50', 'text-blue-800', 'border-blue-200');
                    statusDiv.classList.add('bg-green-50', 'text-green-800', 'border-green-200');
                    
                    // Show invoice
                    this.renderInvoiceAfterPayment(student, invoice, amount);
                    
                    // Reset form after delay
                    setTimeout(() => {
                        document.getElementById('pay-amount').value = '';
                        document.getElementById('transaction-code').value = '';
                        payBtn.disabled = false;
                        payBtn.innerText = "Update Fee Payment";
                    }, 3000);
                    
                } catch (error) {
                    console.error("Error updating fee payment:", error);
                    statusDiv.innerText = "Fee payment update failed. Please try again.";
                    statusDiv.classList.remove('bg-blue-50', 'text-blue-800', 'border-blue-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    payBtn.disabled = false;
                    payBtn.innerText = "Update Fee Payment";
                }
            }

            async saveExamResults() {
                const selectedClass = this.stateManager.getSelectedClass();
                const selectedExam = this.stateManager.getSelectedExam();
                const students = this.stateManager.getAllStudents().filter(s => s.classId === selectedClass.id);
                
                if (!selectedClass || !selectedExam) {
                    this.stateManager.addAlert('error', 'No exam selected.');
                    return;
                }
                
                try {
                    const gradeInputs = document.querySelectorAll('.grade-input');
                    const resultsByStudent = {};
                    
                    // Group grades by student
                    gradeInputs.forEach(input => {
                        const studentIndex = parseInt(input.dataset.studentIndex);
                        const subjectIndex = parseInt(input.dataset.subjectIndex);
                        const student = students[studentIndex];
                        const grade = input.value.trim().toUpperCase();
                        
                        if (!student) return;
                        
                        if (!resultsByStudent[student.id]) {
                            resultsByStudent[student.id] = {
                                studentId: student.id,
                                studentName: student.studentName,
                                registrationNumber: student.registrationNumber || student.id,
                                subjects: {},
                                examId: selectedExam.id,
                                examName: selectedExam.name,
                                classId: selectedClass.id,
                                className: selectedClass.className,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            };
                        }
                        
                        const subjectKey = `subject_${subjectIndex}`;
                        const subject = selectedExam.subjects?.[subjectIndex];
                        
                        resultsByStudent[student.id].subjects[subjectKey] = {
                            name: subject?.name || `Subject ${subjectIndex + 1}`,
                            creditHours: subject?.creditHours || 1,
                            grade: grade,
                            gradePoint: this.stateManager.getGradePoint(grade)
                        };
                    });
                    
                    // Calculate GPA for each student and save to Firestore
                    const savePromises = Object.values(resultsByStudent).map(async (result) => {
                        const subjectArray = Object.values(result.subjects);
                        const gpa = this.stateManager.calculateGPA(subjectArray);
                        result.gpa = gpa;
                        
                        // Save to Firestore
                        const examResultsPath = this.stateManager.getExamResultsPath(selectedClass.id, selectedExam.id);
                        const docRef = this.db.collection(examResultsPath).doc(result.studentId);
                        
                        await docRef.set(result, { merge: true });
                    });
                    
                    // Update exam status to completed
                    const examPath = this.stateManager.getExamsPath(selectedClass.id);
                    await this.db.collection(examPath).doc(selectedExam.id).update({
                        status: 'completed',
                        resultsCount: Object.keys(resultsByStudent).length,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    await Promise.all(savePromises);
                    
                    this.stateManager.addAlert('success', 'Exam results saved successfully!');
                    
                    // Reload the exam results
                    await this.loadExamResults(selectedClass.id, selectedExam.id);
                    
                } catch (error) {
                    console.error("Error saving exam results:", error);
                    this.stateManager.addAlert('error', 'Failed to save exam results. Please try again.');
                }
            }

            async saveExam() {
                const selectedClass = this.stateManager.getSelectedClass();
                const examName = document.getElementById('exam-name').value.trim();
                const examType = document.getElementById('exam-type').value;
                const examDate = document.getElementById('exam-date').value;
                const totalMarks = document.getElementById('total-marks').value;
                const description = document.getElementById('exam-description').value.trim();
                
                if (!examName) {
                    this.stateManager.addAlert('error', 'Please enter exam name.');
                    return;
                }
                
                if (!examDate) {
                    this.stateManager.addAlert('error', 'Please select exam date.');
                    return;
                }
                
                // Collect subjects
                const subjects = [];
                const subjectRows = document.querySelectorAll('.subject-row');
                
                if (subjectRows.length === 0) {
                    this.stateManager.addAlert('error', 'Please add at least one subject.');
                    return;
                }
                
                subjectRows.forEach(row => {
                    const name = row.querySelector('.subject-name').value.trim();
                    const creditHours = parseFloat(row.querySelector('.subject-credit').value);
                    const type = row.querySelector('.subject-type').value;
                    
                    if (name && creditHours > 0) {
                        subjects.push({
                            name: name,
                            creditHours: creditHours,
                            type: type,
                            maxMarks: type === 'theory_practical' ? 100 : (type === 'theory' ? 75 : 25)
                        });
                    }
                });
                
                if (subjects.length === 0) {
                    this.stateManager.addAlert('error', 'Please add valid subjects.');
                    return;
                }
                
                try {
                    const examData = {
                        name: examName,
                        type: examType,
                        examDate: firebase.firestore.Timestamp.fromDate(new Date(examDate)),
                        totalMarks: parseInt(totalMarks),
                        description: description,
                        subjects: subjects,
                        classId: selectedClass.id,
                        className: selectedClass.className,
                        status: 'pending',
                        totalStudents: this.stateManager.getAllStudents().filter(s => s.classId === selectedClass.id).length,
                        createdBy: this.authManager.currentUser?.uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Save to Firestore
                    const examsPath = this.stateManager.getExamsPath(selectedClass.id);
                    const examRef = await this.db.collection(examsPath).add(examData);
                    
                    // Update local state
                    const exams = this.stateManager.getExams();
                    exams.unshift({
                        id: examRef.id,
                        ...examData
                    });
                    this.stateManager.setExams(exams);
                    
                    // Close modal
                    this.closeExamModal();
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'Exam created successfully!');
                    
                    // Refresh exam results view
                    await this.renderExamResults();
                    
                } catch (error) {
                    console.error("Error saving exam:", error);
                    this.stateManager.addAlert('error', 'Failed to create exam. Please try again.');
                }
            }

                let totalGradePoints = 0;
                const subjectsWithGrades = [];
                
                exam.subjects?.forEach((subject, index) => {
                    const resultKey = `subject_${index}`;
                    const gradeInfo = result?.subjects?.[resultKey];
                    const grade = gradeInfo?.grade || '-';
                    const gradePoint = this.stateManager.getGradePoint(grade);

                        grade: grade,
                        gradePoint: gradePoint,
                        theoryGrade: subject.type === 'theory_practical' ? grade : grade,
                        practicalGrade: subject.type === 'theory_practical' ? grade : '-'
                    });
                    
                    if (grade !== '-') {
                        totalCredits += subject.creditHours;
                        totalGradePoints += gradePoint * subject.creditHours;
                    }
                });
                
                const gpa = totalCredits > 0 ? (totalGradePoints / totalCredits) : 0;

                                    <span class="neb-label" style="margin-left: 15px;">DISTRICT</span>

                                            <th rowspan="2" style="width: 8%;">S.N.</th>
                                            <th rowspan="2" style="width: 40%;">SUBJECTS</th>

                                        }
                                        ${classObj.classFeeDescription ? 
                                            `<div class="flex justify-between py-2 font-bold text-lg border-t border-gray-300 mt-2">
                                                <span>Total Monthly Fee:</span>
                                                <span>Rs. ${Object.values(classObj.classFeeDescription).reduce((a, b) => a + b, 0)}</span>
                                            </div>` 
                                            : ''
                                        }
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Action Buttons -->
                            <div class="mt-6 flex flex-wrap gap-4">
                                <button onclick="app.exportClassReport('${classObj.id}')" class="page-button" style="background: #10b981;">
                                    <i class="fas fa-file-export mr-2"></i> Export Class Report
                                </button>
                                <button onclick="app.generateClassFeeReport('${classObj.id}')" class="page-button" style="background: #8b5cf6;">
                                    <i class="fas fa-file-invoice-dollar mr-2"></i> Generate Fee Report
                                </button>
                                <!-- NEW: Add Exam Button -->
                                <button id="add-exam-btn" class="page-button" style="background: #f59e0b;">
                                    <i class="fas fa-plus-circle mr-2"></i> Add Exam
                                </button>
                                <button onclick="app.showView('examResults')" class="page-button">
                                    <i class="fas fa-graduation-cap mr-2"></i> View Exam Results
                                </button>
                            </div>
                        </div>
                        
                        <!-- Students in this Class -->
                        <div class="mb-8">
                            <h3 class="text-xl font-bold text-gray-900 mb-4">Students in this Class (${classStudents.length})</h3>
                            
                            ${classStudents.length === 0 ? 
                                '<div class="text-center py-8 text-gray-500">No students in this class.</div>' :
                                `
                                <div class="overflow-x-auto">
                                    <table class="min-w-full bg-white border border-gray-200">
                                        <thead>
                                            <tr class="bg-gray-50">
                                                <th class="py-3 px-4 border-b text-left font-semibold text-gray-700">Student Name</th>
                                                <th class="py-3 px-4 border-b text-left font-semibold text-gray-700">Reg. No.</th>
                                                <th class="py-3 px-4 border-b text-left font-semibold text-gray-700">Status</th>
                                                <th class="py-3 px-4 border-b text-left font-semibold text-gray-700">Phone</th>
                                                <th class="py-3 px-4 border-b text-left font-semibold text-gray-700">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${classStudents.map(student => {
                                                const statusClass = student.status === 'approved' ? 'status-active' : 
                                                                  student.status === 'pending' ? 'status-pending' : 'status-inactive';
                                                const statusText = student.status === 'approved' ? 'Active' : 
                                                                 student.status === 'pending' ? 'Pending' : 'Inactive';
                                                
                                                return `
                                                    <tr class="hover:bg-gray-50">
                                                        <td class="py-3 px-4 border-b">${student.studentName}</td>
                                                        <td class="py-3 px-4 border-b">${student.registrationNumber || student.id}</td>
                                                        <td class="py-3 px-4 border-b">
                                                            <span class="${statusClass} status-badge">${statusText}</span>
                                                        </td>
                                                        <td class="py-3 px-4 border-b">${student.phoneNumber || 'N/A'}</td>
                                                        <td class="py-3 px-4 border-b">
                                                            <div class="flex gap-2">
                                                                <button onclick="app.showStudentDetails('${student.id}')" class="page-button" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                                                                    View
                                                                </button>
                                                                <button onclick="app.showView('updatePayment'); setTimeout(() => { document.getElementById('student-registration').value='${student.registrationNumber || student.id}'; }, 100);" class="page-button" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                                                                    Payment
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                `;
                                            }).join('')}
                                        </tbody>
                                    </table>
                                </div>
                                `
                            }
                        </div>
                    </div>
                `;
                
                classDetailsHtml += '</div>';
                
                this.chatContainer.innerHTML = classDetailsHtml;
                this.updateTopBar();
            }
            
            // All other existing methods remain the same...
            // [Previous methods for renderStudents, renderAllPayments, renderNewRegistrations, 
            // renderClasses, renderSettings, renderStudentDetails, createMonthlyInvoices, 
            // updateStudentStatus, saveSettings, saveClassFeeSettings, addPayCode, 
            // deletePayCode, togglePayCodeValid, exportClassReport, generateClassFeeReport, 
            // handlePaginationClick, and helper methods]
            
            // Note: Due to character limits, I've focused on the new exam management features
            // and the payment fix. The other existing methods remain unchanged from your original code.
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new SchoolAdminApp();
        });
        
        window.app = app;
    </script>
</body>
</html>
