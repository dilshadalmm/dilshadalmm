<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimum-scale=1.0">
    <title>Mark Sheet - Student Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Roboto+Condensed:wght@700&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        /* CRITICAL: Ensure HTML and BODY are full height and non-scrollable */
        html {
            height: 100%;
            overflow: hidden !important;
        }

        /* Use the Oswald font family as default */
        body {
            font-family: 'Oswald', sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            
            /* White background */
            background-color: #ffffff !important;
            color: #000000;
            
            /* CRITICAL: Prevent the main body from scrolling at all */
            overflow: hidden !important; 
            
            user-select: none;
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none; 
            
            /* Prevents elastic scrolling on iOS */
            overscroll-behavior: none;
            
            /* Make body a fixed container occupying full screen */
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* App wrapper - uses dynamic viewport height for mobile keyboard stability */
        #app-wrapper {
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dynamic viewport height (best for mobile keyboard) */
            width: 100%;
            position: absolute; /* Relative to fixed body */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden; /* Ensures only the chat container can scroll */
            background: white !important;
        }
        
        /* Strict No-Oval/No-Round Policy */
        * {
            border-radius: 0 !important;
        }
        
        /* --- Hide Scrollbar on Chat Container --- */
        #chat-container {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        #chat-container::-webkit-scrollbar {
            display: none;
        }
        
        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white !important;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-spinner {
            border: 2px solid #f3f4f6;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Alert messages */
        .alert {
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid transparent;
            font-size: 0.9rem;
        }
        
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-color: #10b981;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #7f1d1d;
            border-color: #ef4444;
        }
        
        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border-color: #f59e0b;
        }
        
        /* ===== MARK SHEET FORM STYLES ===== */
        .form-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
            background: white;
        }
        
        .form-section {
            background: #f9fafb;
            padding: 1.5rem;
            border: 1px solid #e5e7eb;
            margin-bottom: 2rem;
        }
        
        .form-header {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
            font-size: 1.1rem;
        }
        
        .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #d1d5db;
            background: white;
            font-size: 1rem;
            font-family: 'Oswald', sans-serif;
            color: #1f2937;
            outline: none;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        
        .form-select:focus {
            border-color: #3b82f6;
        }
        
        .form-select:disabled {
            background: #f3f4f6;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .form-button {
            width: 100%;
            padding: 1rem;
            background: #3b82f6;
            color: white;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-button:hover:not(:disabled) {
            background: #2563eb;
        }
        
        .form-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        /* ===== UPDATED: TOP BAR STYLES (Single Row Alignment) ===== */
        .top-bar {
            width: 100%;
            background: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            height: 48px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            transition: transform 0.3s ease;
        }
        
        .top-bar.hidden {
            transform: translateY(-100%);
        }
        
        /* Left button container */
        #left-button-container {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
        }
        
        /* Portal Title */
        .portal-title-container {
            flex: 1;
            max-width: 600px;
            margin: 0 16px;
            position: relative;
            height: 32px;
        }
        
        .portal-title-button {
            width: 100%;
            height: 100%;
            padding: 0 16px;
            background: #000000 !important;
            color: white;
            border: none;
            font-family: 'Oswald', sans-serif !important;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .portal-title-button:hover {
            background: #333333 !important;
        }
        
        .portal-title-button:active {
            background: #666666 !important;
        }
        
        /* Profile image container */
        .profile-container {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 0 !important;
            overflow: hidden;
            background: #f3f4f6;
            border: none;
            padding: 0;
            margin: 0;
        }
        
        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Error container */
        .error-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            background: white;
        }
        
        .error-icon {
            font-size: 64px;
            color: #ef4444;
            margin-bottom: 24px;
            opacity: 0.7;
        }
        
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
        }
        
        .error-message {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 32px;
            max-width: 400px;
            line-height: 1.5;
        }
        
        /* Skeleton Loading */
        .skeleton-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }
        
        .skeleton-loading {
            text-align: center;
        }
        
        .skeleton-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        .skeleton-text {
            background: #e5e7eb;
            height: 20px;
            width: 200px;
            margin: 0.5rem auto;
        }

        /* ===== AUTH MODAL STYLES ===== */
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .auth-modal {
            background: white;
            width: 40%;
            min-width: 300px;
            max-width: 400px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: slideDown 0.3s ease-out;
            border-radius: 4px !important;
        }
        
        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .auth-header {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .auth-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
        }
        
        .auth-body {
            padding: 20px;
        }
        
        .auth-field {
            margin-bottom: 16px;
        }
        
        .auth-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }
        
        .auth-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            border-radius: 0 !important;
            font-family: 'Oswald', sans-serif;
        }
        
        .auth-input:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .auth-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        
        .auth-error.show {
            display: block;
        }
        
        .auth-button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            font-family: 'Oswald', sans-serif;
        }
        
        .auth-button:hover {
            background: #2563eb;
        }
        
        .auth-button:active {
            background: #1d4ed8;
        }
        
        .auth-button.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* ===== NEW MARK SHEET VIEW STYLES (EXACTLY AS SPECIFIED) ===== */
        :root {
            --a4-w: 297mm;
            --a4-h: 210mm;
            --border-color: #1a2a3a;
            --header-bg: #f8f9fa;
            --btn-blue: #007bff;
            --btn-black: #000000;
        }

        /* Mark Sheet Container */
        .marksheet-viewport {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar for Mark Sheet View */
        .nav-bar {
            width: 100%;
            height: 45px;
            background: #ffffff;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 100;
            flex-shrink: 0;
        }

        /* Common Button Base */
        .btn {
            border: none;
            padding: 6px 20px; 
            font-size: 13px;
            cursor: pointer;
            border-radius: 2px;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.5px;
            transition: opacity 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .back-btn {
            background-color: var(--btn-blue);
            color: white;
            text-transform: none; 
        }

        .print-btn {
            background-color: var(--btn-black);
            color: white;
            text-transform: none;
        }

        .document-container {
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            padding-bottom: 40px;
            overflow-y: auto;
        }

        /* Scaling Wrapper */
        .scaling-wrapper {
            transform: scale(min(calc(95vw / 297mm), calc(85vh / 210mm)));
            transform-origin: center top;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Mark Sheet Page */
        .page {
            background-color: white;
            width: var(--a4-w);
            height: var(--a4-h);
            padding: 8mm;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.25); 
            display: flex;
            flex-direction: column;
        }

        /* Mark Sheet Borders */
        .outer-border { 
            border: 2px solid var(--border-color); 
            height: 100%; 
            width: 100%; 
            padding: 2mm; 
            display: flex; 
        }
        
        .inner-border { 
            border: 5px double var(--border-color); 
            height: 100%; 
            width: 100%; 
            padding: 6mm; 
            display: flex; 
            flex-direction: column; 
        }

        /* Header Section */
        .header-box { 
            border: 2px solid #000; 
            background-color: var(--header-bg); 
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 4px; 
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 80px; 
        }
        
        .header-logo { 
            width: 85px; 
            height: 85px; 
            object-fit: contain; 
            flex-shrink: 0; 
        }
        
        .header-content { 
            text-align: center; 
            min-width: 450px; 
        }
        
        .inst-name { 
            font-size: 20pt; 
            font-weight: bold; 
            text-transform: uppercase; 
            color: #1a2a3a; 
            margin-bottom: 4px; 
        }
        
        .address-text { 
            font-size: 11pt; 
            font-weight: bold; 
            color: #333; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin: 4px 0; 
            display: block; 
        }
        
        .grade-sheet-title-box { 
            font-size: 18pt; 
            font-weight: 900; 
            background-color: #000; 
            color: #fff; 
            letter-spacing: 4px; 
            display: inline-block; 
            padding: 5px 40px; 
            margin-top: 8px; 
            text-transform: uppercase; 
            border-radius: 2px; 
        }

        /* Student Details */
        .student-details { 
            display: grid; 
            grid-template-columns: 1.5fr 1fr; 
            gap: 5px 40px; 
            font-size: 11.5pt; 
            margin-bottom: 15px; 
            padding: 0 10px; 
        }
        
        .detail-row { 
            display: flex; 
            align-items: baseline; 
        }
        
        .label { 
            font-weight: bold; 
            margin-right: 10px; 
            text-transform: uppercase; 
            font-size: 10pt; 
            color: #444; 
            flex-shrink: 0; 
        }
        
        .value { 
            border-bottom: 1px dotted #000; 
            flex-grow: 1; 
            font-weight: bold; 
            font-size: 11.5pt; 
            color: #000; 
        }
        
        .full-width-row { 
            grid-column: span 2; 
            margin-top: 5px; 
            display: flex; 
            align-items: baseline; 
        }

        /* Table */
        .table-container { 
            flex-grow: 1; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            border: 2px solid black; 
        }
        
        th, td { 
            border: 1px solid black; 
            padding: 4px 3px; 
            text-align: center; 
            font-size: 10.5pt; 
        }
        
        th { 
            background-color: #eee; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 9pt; 
        }
        
        .subject-col { 
            text-align: left; 
            padding-left: 10px; 
            font-weight: bold; 
        }
        
        .summary-row { 
            background: #fdfdfd; 
            font-weight: bold; 
        }

        /* Footer */
        .footer { 
            margin-top: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            font-size: 11pt; 
            padding: 0 10px; 
        }
        
        .signature-box { 
            text-align: center; 
            width: 220px; 
        }
        
        .sig-line { 
            border-top: 1.5px solid black; 
            margin-bottom: 5px; 
        }

        @media print {
            @page { 
                size: A4 landscape; 
                margin: 0; 
            }
            
            body { 
                background: none; 
                overflow: visible; 
                height: auto; 
            }
            
            .nav-bar, 
            .top-bar,
            .back-button { 
                display: none !important; 
            }
            
            .document-container { 
                padding: 0; 
                margin: 0; 
                overflow: visible; 
                height: auto; 
            }
            
            .scaling-wrapper { 
                transform: none !important; 
                width: 297mm; 
                height: 210mm; 
            }
            
            .page { 
                box-shadow: none; 
                width: 297mm; 
                height: 210mm; 
                margin: 0; 
            }
        }
    </style>
</head>

<body class="h-full">

    <!-- Mobile App Container (Flex Column) -->
    <div id="app-wrapper" class="flex flex-col overflow-hidden">
        <!-- Top bar (common for all pages) -->
        <div class="top-bar hidden">
            <!-- Left button (hamburger menu) -->
            <div id="left-button-container">
                <button class="back-button" id="hamburger-menu" style="background: #000; color: white; width: 32px; height: 32px; border: none; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <!-- Portal Title -->
            <div class="portal-title-container">
                <button class="portal-title-button" id="portal-title-button">
                    Mark Sheet Portal
                </button>
            </div>
            
            <!-- Profile image -->
            <div class="profile-container">
                <div id="profile-image-container">
                    <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#6b7280;font-weight:600;">U</div>
                </div>
            </div>
        </div>
        
        <!-- Main content area - different pages will be loaded here -->
        <main id="chat-container" class="flex-1 overflow-y-auto">
            <!-- Content will be dynamically loaded here -->
        </main>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBJ_G5o4otg7riemfJDMOcPoHoIVH7emsc",
            authDomain: "geobazarr.firebaseapp.com",
            databaseURL: "https://geobazarr-default-rtdb.firebaseio.com",
            projectId: "geobazarr",
            storageBucket: "geobazarr.firebasestorage.app",
            messagingSenderId: "679949247383",
            appId: "1:679949247383:web:036d4f32038422ebb89ad2"
        };

        // State Manager for MarkSheet App
        class MarkSheetStateManager {
            constructor() {
                this.schoolID = null;
                this.academicYearID = null;
                this.schoolData = null;
                this.classes = [];
                this.sections = [];
                this.enrollments = [];
                this.exams = [];
                this.selectedClass = null;
                this.selectedSection = null;
                this.selectedEnrollment = null;
                this.selectedExam = null;
                this.studentData = null;
                this.resultData = null;
                this.alerts = [];
            }
            
            extractURLParams() {
                const urlParams = new URLSearchParams(window.location.search);
                this.schoolID = urlParams.get('schoolID');
                this.academicYearID = urlParams.get('academicYearID');
                
                if (!this.schoolID || !this.academicYearID) {
                    throw new Error("Missing schoolID or academicYearID in URL parameters");
                }
            }
            
            getSchoolPath() {
                return `schools/${this.schoolID}`;
            }
            
            getAcademicYearPath() {
                return `${this.getSchoolPath()}/academicYears/${this.academicYearID}`;
            }
            
            getClassesPath() {
                return `${this.getSchoolPath()}/classes`;
            }
            
            getSectionsPath() {
                return `${this.getSchoolPath()}/sections`;
            }
            
            getEnrollmentsPath() {
                return `${this.getSchoolPath()}/enrollments`;
            }
            
            getExamsPath() {
                return `${this.getSchoolPath()}/exams`;
            }
            
            getStudentPath(studentID) {
                return `${this.getSchoolPath()}/students/${studentID}`;
            }
            
            getResultsPath() {
                return `${this.getSchoolPath()}/results`;
            }
            
            getSubjectPath(subjectID) {
                return `${this.getSchoolPath()}/subjects/${subjectID}`;
            }
            
            addAlert(type, message) {
                const id = Date.now();
                this.alerts.push({ id, type, message });
                setTimeout(() => {
                    this.removeAlert(id);
                }, 5000);
            }
            
            removeAlert(id) {
                this.alerts = this.alerts.filter(alert => alert.id !== id);
            }
            
            getAlerts() {
                return this.alerts;
            }
            
            clearSelections() {
                this.selectedClass = null;
                this.selectedSection = null;
                this.selectedEnrollment = null;
                this.selectedExam = null;
                this.studentData = null;
                this.resultData = null;
            }
            
            isFormComplete() {
                return this.selectedClass && this.selectedSection && 
                       this.selectedEnrollment && this.selectedExam;
            }
        }

        // Mark Sheet App
        class MarkSheetApp {
            constructor() {
                this.stateManager = new MarkSheetStateManager();
                this.db = null;
                this.auth = null;
                this.currentUser = null;
                this.isInitialized = false;
                
                this.appWrapper = document.getElementById('app-wrapper');
                this.chatContainer = document.getElementById('chat-container');
                this.topBar = document.querySelector('.top-bar');
                this.portalTitleButton = document.getElementById('portal-title-button');
                this.profileImageContainer = document.getElementById('profile-image-container');
                
                this.initialize();
            }
            
            initialize() {
                if (this.isInitialized) return;
                
                try {
                    this.showSkeletonLoading();
                    
                    // Extract URL parameters
                    this.stateManager.extractURLParams();
                    
                    firebase.initializeApp(firebaseConfig);
                    this.db = firebase.firestore();
                    this.auth = firebase.auth();
                    
                    this.db.settings({
                        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
                    });
                    
                    console.log("Firebase initialized successfully");
                    this.isInitialized = true;
                    
                    this.setupAuthListener();
                    
                } catch (error) {
                    console.error("Initialization error:", error);
                    this.hideSkeletonLoading();
                    this.showError(error.message || "Failed to initialize app. Please check URL parameters.");
                }
            }
            
            setupAuthListener() {
                this.auth.onAuthStateChanged(async (user) => {
                    console.log("Auth state changed:", user ? `User ${user.email} logged in` : "No user");
                    
                    if (user) {
                        this.currentUser = user;
                        await this.loadSchoolData();
                    } else {
                        this.currentUser = null;
                        this.hideSkeletonLoading();
                        this.showSignInPrompt();
                    }
                });
            }
            
            async loadSchoolData() {
                try {
                    const schoolPath = this.stateManager.getSchoolPath();
                    const schoolDoc = await this.db.doc(schoolPath).get();
                    
                    if (!schoolDoc.exists) {
                        throw new Error("School not found");
                    }
                    
                    this.stateManager.schoolData = schoolDoc.data();
                    console.log("School data loaded:", this.stateManager.schoolData);
                    
                    // Load classes after school data is loaded
                    await this.loadClasses();
                    
                    this.hideSkeletonLoading();
                    this.renderForm();
                    
                } catch (error) {
                    console.error("Error loading school data:", error);
                    this.showError("Failed to load school data. Please try again.");
                }
            }
            
            async loadClasses() {
                try {
                    const classesPath = this.stateManager.getClassesPath();
                    const classesSnapshot = await this.db.collection(classesPath)
                        .where('academicYear', '==', this.stateManager.academicYearID)
                        .get();
                    
                    const classes = [];
                    classesSnapshot.forEach(doc => {
                        classes.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    this.stateManager.classes = classes;
                    console.log(`Loaded ${classes.length} classes`);
                    
                    return classes;
                    
                } catch (error) {
                    console.error("Error loading classes:", error);
                    throw error;
                }
            }
            
            async loadSections(classID) {
                try {
                    const sectionsPath = this.stateManager.getSectionsPath();
                    const sectionsSnapshot = await this.db.collection(sectionsPath)
                        .where('classID', '==', classID)
                        .where('academicYear', '==', this.stateManager.academicYearID)
                        .get();
                    
                    const sections = [];
                    sectionsSnapshot.forEach(doc => {
                        sections.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    this.stateManager.sections = sections;
                    console.log(`Loaded ${sections.length} sections for class ${classID}`);
                    
                    return sections;
                    
                } catch (error) {
                    console.error("Error loading sections:", error);
                    throw error;
                }
            }
            
            async loadEnrollments(classID, sectionID) {
                try {
                    const enrollmentsPath = this.stateManager.getEnrollmentsPath();
                    const enrollmentsSnapshot = await this.db.collection(enrollmentsPath)
                        .where('academicYear', '==', this.stateManager.academicYearID)
                        .where('classID', '==', classID)
                        .where('sectionID', '==', sectionID)
                        .get();
                    
                    const enrollments = [];
                    enrollmentsSnapshot.forEach(doc => {
                        const data = doc.data();
                        enrollments.push({
                            id: doc.id,
                            ...data,
                            // Ensure studentName exists
                            studentName: data.studentName || `Student ${doc.id}`
                        });
                    });
                    
                    this.stateManager.enrollments = enrollments;
                    console.log(`Loaded ${enrollments.length} enrollments`);
                    
                    return enrollments;
                    
                } catch (error) {
                    console.error("Error loading enrollments:", error);
                    throw error;
                }
            }
            
            async loadExams(classID, sectionID) {
                try {
                    const examsPath = this.stateManager.getExamsPath();
                    const examsSnapshot = await this.db.collection(examsPath)
                        .where('academicYear', '==', this.stateManager.academicYearID)
                        .where('classID', '==', classID)
                        .where('sectionID', '==', sectionID)
                        .get();
                    
                    const exams = [];
                    examsSnapshot.forEach(doc => {
                        exams.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    this.stateManager.exams = exams;
                    console.log(`Loaded ${exams.length} exams`);
                    
                    return exams;
                    
                } catch (error) {
                    console.error("Error loading exams:", error);
                    throw error;
                }
            }
            
            async loadStudentData(studentID) {
                try {
                    const studentPath = this.stateManager.getStudentPath(studentID);
                    const studentDoc = await this.db.doc(studentPath).get();
                    
                    if (!studentDoc.exists) {
                        throw new Error("Student not found");
                    }
                    
                    this.stateManager.studentData = studentDoc.data();
                    console.log("Student data loaded:", this.stateManager.studentData);
                    
                } catch (error) {
                    console.error("Error loading student data:", error);
                    throw error;
                }
            }
            
            async loadResultData(enrollmentID, examID) {
                try {
                    const resultsPath = this.stateManager.getResultsPath();
                    const resultsSnapshot = await this.db.collection(resultsPath)
                        .where('enrollmentID', '==', enrollmentID)
                        .where('examID', '==', examID)
                        .limit(1)
                        .get();
                    
                    if (resultsSnapshot.empty) {
                        throw new Error("No result found for this student and exam");
                    }
                    
                    const resultDoc = resultsSnapshot.docs[0];
                    const resultData = resultDoc.data();
                    
                    // Load subject details for each subject
                    const subjectsWithDetails = await Promise.all(
                        resultData.subjects.map(async (subject) => {
                            try {
                                if (subject.subjectID) {
                                    const subjectPath = this.stateManager.getSubjectPath(subject.subjectID);
                                    const subjectDoc = await this.db.doc(subjectPath).get();
                                    
                                    if (subjectDoc.exists) {
                                        const subjectData = subjectDoc.data();
                                        return {
                                            ...subject,
                                            subjectName: subjectData.subjectName || subject.subjectID,
                                            creditHours: subjectData.creditHours || 0
                                        };
                                    }
                                }
                                return {
                                    ...subject,
                                    subjectName: subject.subjectID || subject.subjectName || 'Unknown Subject',
                                    creditHours: subject.creditHours || 0
                                };
                            } catch (error) {
                                console.error(`Error loading subject ${subject.subjectID}:`, error);
                                return {
                                    ...subject,
                                    subjectName: subject.subjectID || subject.subjectName || 'Unknown Subject',
                                    creditHours: subject.creditHours || 0
                                };
                            }
                        })
                    );
                    
                    this.stateManager.resultData = {
                        ...resultData,
                        subjects: subjectsWithDetails,
                        resultID: resultDoc.id
                    };
                    
                    console.log("Result data loaded:", this.stateManager.resultData);
                    
                } catch (error) {
                    console.error("Error loading result data:", error);
                    throw error;
                }
            }

                authModal.innerHTML = `
                    <div class="auth-modal">
                        <div class="auth-header">
                            <div class="auth-title">Sign In to Mark Sheet Portal</div>
                        </div>
                        <div class="auth-body">
                            <div class="auth-field">

                `;
                
                document.body.appendChild(authModal);
                this.setupAuthModalEvents(authModal);
            }
            
            setupAuthModalEvents(authModal) {
                const signInButton = document.getElementById('sign-in-button');
                const emailInput = document.getElementById('auth-email');
                const passwordInput = document.getElementById('auth-password');
                
                signInButton.addEventListener('click', async () => {
                    await this.signInWithEmail(emailInput, passwordInput, authModal);
                });
                
                emailInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        passwordInput.focus();
                    }
                });
                
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.signInWithEmail(emailInput, passwordInput, authModal);
                    }
                });
                
                authModal.addEventListener('click', (e) => {
                    if (e.target === authModal) {
                        authModal.remove();
                    }
                });
            }
            
            async signInWithEmail(emailInput, passwordInput, authModal) {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const signInButton = document.getElementById('sign-in-button');
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.textContent = '';
                emailError.classList.remove('show');
                passwordError.textContent = '';
                passwordError.classList.remove('show');
                
                if (!email) {
                    emailError.textContent = 'Please enter your email';
                    emailError.classList.add('show');
                    return;
                }
                
                if (!password) {
                    passwordError.textContent = 'Please enter your password';
                    passwordError.classList.add('show');
                    return;
                }
                
                signInButton.textContent = 'Signing In...';
                signInButton.classList.add('loading');
                
                try {
                    await this.auth.signInWithEmailAndPassword(email, password);
                    authModal.remove();
                    
                } catch (error) {
                    console.error("Sign in error:", error);
                    
                    signInButton.textContent = 'Sign In';
                    signInButton.classList.remove('loading');
                    
                    switch (error.code) {
                        case 'auth/invalid-email':
                            emailError.textContent = 'Invalid email address';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-disabled':
                            emailError.textContent = 'This account has been disabled';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-not-found':
                            emailError.textContent = 'No account found with this email';
                            emailError.classList.add('show');
                            break;
                        case 'auth/wrong-password':
                            passwordError.textContent = 'Incorrect password';
                            passwordError.classList.add('show');
                            break;
                        case 'auth/too-many-requests':
                            passwordError.textContent = 'Too many failed attempts. Try again later';
                            passwordError.classList.add('show');
                            break;
                        default:
                            passwordError.textContent = 'Failed to sign in. Please try again';
                            passwordError.classList.add('show');
                    }
                }
            }

            setupFormEventListeners() {
                // Class select change
                const classSelect = document.getElementById('class-select');
                if (classSelect) {
                    classSelect.addEventListener('change', async (e) => {
                        const value = e.target.value;
                        
                        if (!value) {
                            this.stateManager.selectedClass = null;
                            this.stateManager.sections = [];
                            this.stateManager.enrollments = [];
                            this.stateManager.exams = [];
                            this.stateManager.selectedSection = null;
                            this.stateManager.selectedEnrollment = null;
                            this.stateManager.selectedExam = null;
                            this.renderForm();
                            return;
                        }
                        
                        const selectedClass = this.stateManager.classes.find(c => c.id === value);
                        this.stateManager.selectedClass = selectedClass;
                        
                        try {
                            // Show loading state
                            const sectionSelect = document.getElementById('section-select');
                            if (sectionSelect) {
                                sectionSelect.disabled = true;
                                sectionSelect.innerHTML = '<option value="">Loading sections...</option>';
                            }
                            
                            await this.loadSections(selectedClass.id);
                            this.stateManager.selectedSection = null;
                            this.stateManager.selectedEnrollment = null;
                            this.stateManager.selectedExam = null;
                            this.stateManager.enrollments = [];
                            this.stateManager.exams = [];
                            this.renderForm();
                        } catch (error) {
                            this.stateManager.addAlert('error', 'Failed to load sections');
                            this.renderForm();
                        }
                    });
                }
                
                // Section select change
                const sectionSelect = document.getElementById('section-select');
                if (sectionSelect) {
                    sectionSelect.addEventListener('change', async (e) => {
                        const value = e.target.value;
                        
                        if (!value) {
                            this.stateManager.selectedSection = null;
                            this.stateManager.enrollments = [];
                            this.stateManager.exams = [];
                            this.stateManager.selectedEnrollment = null;
                            this.stateManager.selectedExam = null;
                            this.renderForm();
                            return;
                        }
                        
                        const selectedSection = this.stateManager.sections.find(s => s.id === value);
                        this.stateManager.selectedSection = selectedSection;
                        
                        try {
                            // Show loading state
                            const enrollmentSelect = document.getElementById('enrollment-select');
                            const examSelect = document.getElementById('exam-select');
                            
                            if (enrollmentSelect) {
                                enrollmentSelect.disabled = true;
                                enrollmentSelect.innerHTML = '<option value="">Loading students...</option>';
                            }
                            
                            if (examSelect) {
                                examSelect.disabled = true;

                            }

            renderMarkSheet() {
                const schoolData = this.stateManager.schoolData;
                const studentData = this.stateManager.studentData;
                const resultData = this.stateManager.resultData;
                const selectedClass = this.stateManager.selectedClass;
                const selectedExam = this.stateManager.selectedExam;
                
                if (!schoolData || !studentData || !resultData) {
                    this.stateManager.addAlert('error', 'Missing data for mark sheet');
                    return;
                }
                
                // Format dates
                const formatDate = (timestamp) => {
                    if (!timestamp) return '.................';
                    if (timestamp.toDate) {
                        return timestamp.toDate().toLocaleDateString();
                    }
                    if (typeof timestamp === 'string') {
                        return timestamp;
                    }
                    return '.................';
                };
                
                const startedAt = selectedExam?.startedAt ? formatDate(selectedExam.startedAt) : '.................';
                const endedAt = selectedExam?.endedAt ? formatDate(selectedExam.endedAt) : '.................';
                const issuedDate = resultData.issuedDate ? formatDate(resultData.issuedDate) : '.................';
                const dateOfBirth = studentData.dateOfBirth ? formatDate(studentData.dateOfBirth) : 'N/A';
                
                // Calculate total percentage and GPA from result data
                const percentage = resultData.percentage || '0.00';
                const gpa = resultData.GPA || '0.00';
                
                let marksheetHtml = `
                    <div class="marksheet-viewport">
                        <!-- Navigation Bar for Mark Sheet View -->

                        </div>
                        
                        <div class="document-container">
                            <div class="scaling-wrapper">

                                    <div class="outer-border">
                                        <div class="inner-border">
                                            
                                            <!-- Header -->

                                                <div class="header-content">
                                                    <div class="inst-name">${schoolData.schoolName || 'DILSHAD INSTITUTE OF SCIENCE'}</div>
                                                    <div class="address-text">${schoolData.schoolAddress || 'BIRGUNJ -04- PARSA NEPAL'}</div>
                                                    <div style="font-weight:bold; font-size:11pt; color: #555; margin-top: 3px;">
                                                        ${selectedClass?.className || selectedClass?.classTitle || 'GRADE'}
                                                    </div>
                                                    <div>
                                                        <span class="grade-sheet-title-box">GRADE-SHEET</span>
                                                    </div>
                                                </div>
                                                <img src="${studentData.studentProfile || 'https://i.postimg.cc/8cB6w9Zv/Concept_20260111_031429_0000.png'}" 
                                                     alt="Student Photo" 
                                                     class="header-logo"
                                                     onerror="this.src='https://i.postimg.cc/8cB6w9Zv/Concept_20260111_031429_0000.png'">
                                            </div>

                                            <!-- Student Details -->
                                            <div class="student-details">
                                                <div class="detail-row" style="grid-column: span 2;">
                                                    <span class="label">THE GRADE SECURED BY :</span>
                                                    <span class="value">${studentData.studentName || 'N/A'}</span>
                                                </div>
                                                <div class="detail-row">
                                                    <span class="label">DATE OF BIRTH :</span>
                                                    <span class="value">${dateOfBirth}</span>
                                                </div>
                                                <div class="detail-row">
                                                    <span class="label">DISTRICT :</span>
                                                    <span class="value">${studentData.district || 'N/A'}</span>
                                                </div>
                                                <div class="detail-row">
                                                    <span class="label">SYMBOL NO :</span>
                                                    <span class="value">${studentData.rollNo || studentData.symbolNo || 'N/A'}</span>
                                                </div>
                                                <div class="detail-row">
                                                    <span class="label">ACADEMIC YEAR :</span>
                                                    <span class="value">${this.stateManager.academicYearID || 'N/A'}</span>
                                                </div>
                                                <div class="full-width-row">
                                                    <span class="label">IN THE <strong style="color:black; font-size:10.5pt;">${selectedExam?.examTitle || 'EXAMINATION'}</strong> CONDUCTED FROM :</span>
                                                    <span class="value" style="flex-grow: 0; width: 150px; margin-right: 10px;">${startedAt}</span>
                                                    <span class="label" style="margin-right: 10px;">TO :</span>
                                                    <span class="value">${endedAt}</span>
                                                </div>
                                            </div>

                                            <!-- Marks Table -->
                                            <div class="table-container">
                                                <table>
                                                    <thead>
                                                        <tr>
                                                            <th rowspan="2" width="4%">S.N.</th>
                                                            <th rowspan="2" width="22%">SUBJECTS</th>
                                                            <th rowspan="2" width="8%">CREDIT HOURS</th>
                                                            <th colspan="2" width="12%">OBTAINED MARKS</th>
                                                            <th rowspan="2" width="10%">FINAL MARKS</th>
                                                            <th colspan="2" width="12%">OBTAINED GRADE</th>
                                                            <th rowspan="2" width="10%">FINAL GRADE</th>
                                                            <th rowspan="2" width="10%">GRADE POINT</th>
                                                        </tr>
                                                        <tr>
                                                            <th>TH</th>
                                                            <th>PR</th>
                                                            <th>TH</th>
                                                            <th>PR</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                `;
                
                // Add subjects rows
                if (resultData.subjects && resultData.subjects.length > 0) {
                    resultData.subjects.forEach((subject, index) => {
                        marksheetHtml += `
                            <tr>
                                <td>${index + 1}</td>
                                <td class="subject-col">${subject.subjectName || subject.subjectID || 'Unknown Subject'}</td>
                                <td>${subject.creditHours || '0.0'}</td>
                                <td>${subject.theoryMarks || '-'}</td>
                                <td>${subject.practicalMarks || '-'}</td>
                                <td>${subject.finalMarks || '-'}</td>
                                <td>${subject.theoryGrade || '-'}</td>
                                <td>${subject.practicalGrade || '-'}</td>
                                <td>${subject.grade || '-'}</td>
                                <td>${subject.gradePoint || '0.00'}</td>
                            </tr>
                        `;
                    });
                } else {
                    marksheetHtml += `
                        <tr>
                            <td colspan="10" style="text-align: center; padding: 20px;">
                                No subject data available
                            </td>
                        </tr>
                    `;
                }
                
                // Add summary row
                marksheetHtml += `
                    <tr class="summary-row">
                        <td colspan="3"></td>
                        <td colspan="3" style="text-align: right; padding-right: 15px;">
                            PERCENTAGE (%) = ${percentage}
                        </td>
                        <td colspan="4" style="text-align: right; padding-right: 20px;">
                            GRADE POINT AVERAGE (GPA): ${gpa}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="signature-box" style="text-align: left;">
                <div style="margin-bottom: 35px; text-transform: uppercase;">
                    DATE OF ISSUE: ${issuedDate}
                </div>
                <div>PREPARED BY: ${resultData.preparedBy || '........................'}</div>
            </div>
            <div class="signature-box">
                <div class="sig-line"></div>
                <div style="text-transform: uppercase; font-weight: bold;">
                    ${schoolData.schoolPrinciple ? schoolData.schoolPrinciple.toUpperCase() : 'SCHOOL PRINCIPAL'}
                </div>
            </div>
        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
                
                this.chatContainer.innerHTML = marksheetHtml;
                this.updateTopBar();
                
                // Add event listener for back button
                document.getElementById('back-to-form')?.addEventListener('click', () => {
                    this.renderForm();
                });
            }
            
            updateTopBar() {
                this.topBar.classList.remove('hidden');
                const portalTitle = document.getElementById('portal-title-button');
                if (portalTitle && this.stateManager.schoolData) {
                    portalTitle.textContent = this.stateManager.schoolData.schoolName || 'Mark Sheet Portal';
                }
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new MarkSheetApp();
        });
        
        // Make app available globally for debugging
        window.app = app;
    </script>
</body>
</html>
