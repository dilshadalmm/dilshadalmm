    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBJ_G5o4otg7riemfJDMOcPoHoIVH7emsc",
            authDomain: "geobazarr.firebaseapp.com",
            databaseURL: "https://geobazarr-default-rtdb.firebaseio.com",
            projectId: "geobazarr",
            storageBucket: "geobazarr.firebasestorage.app",
            messagingSenderId: "679949247383",
            appId: "1:679949247383:web:036d4f32038422ebb89ad2"
        };

        // State Manager
        class StateManager {
            constructor() {
                // Extract schoolID and academicYearID from URL
                const urlParams = new URLSearchParams(window.location.search);
                this.schoolID = urlParams.get('schoolID') || '';
                this.academicYearID = urlParams.get('academicYearID') || '';
                
                this.schoolData = null;
                this.classes = [];
                this.sections = [];
                this.enrollments = [];
                this.exams = [];
                this.selectedClass = null;
                this.selectedSection = null;
                this.selectedEnrollment = null;
                this.selectedExam = null;
                this.studentData = null;
                this.resultData = null;
                this.subjectsData = {};
                this.alerts = [];
            }
            
            getSchoolPath() {
                return `schools/${this.schoolID}`;
            }
            
            getClassesPath() {
                return `${this.getSchoolPath()}/classes`;
            }
            
            getClassPath(classId) {
                return `${this.getClassesPath()}/${classId}`;
            }
            
            getSectionsPath() {
                return `${this.getSchoolPath()}/sections`;
            }
            
            getSectionPath(sectionId) {
                return `${this.getSectionsPath()}/${sectionId}`;
            }
            
            getEnrollmentsPath() {
                return `${this.getSchoolPath()}/enrollments`;
            }
            
            getEnrollmentPath(enrollmentId) {
                return `${this.getEnrollmentsPath()}/${enrollmentId}`;
            }
            
            getExamsPath() {
                return `${this.getSchoolPath()}/exams`;
            }
            
            getExamPath(examId) {
                return `${this.getExamsPath()}/${examId}`;
            }
            
            getStudentsPath() {
                return `${this.getSchoolPath()}/students`;
            }
            
            getStudentPath(studentId) {
                return `${this.getStudentsPath()}/${studentId}`;
            }
            
            getResultsPath() {
                return `${this.getSchoolPath()}/results`;
            }
            
            getResultPath(resultId) {
                return `${this.getResultsPath()}/${resultId}`;
            }
            
            getSubjectsPath() {
                return `${this.getSchoolPath()}/subjects`;
            }
            
            getSubjectPath(subjectId) {
                return `${this.getSubjectsPath()}/${subjectId}`;
            }
            
            addAlert(type, message) {
                const id = Date.now();
                this.alerts.push({ id, type, message });
                setTimeout(() => {
                    this.removeAlert(id);
                }, 5000);
            }
            
            removeAlert(id) {
                this.alerts = this.alerts.filter(alert => alert.id !== id);
            }
            
            getAlerts() {
                return this.alerts;
            }
        }

        // MarkSheet App
        class MarkSheetApp {
            constructor() {
                this.stateManager = new StateManager();
                this.db = null;
                this.auth = null;
                this.currentUser = null;
                this.isInitialized = false;
                
                this.appWrapper = document.getElementById('app-wrapper');
                this.chatContainer = document.getElementById('chat-container');
                this.topBar = document.querySelector('.top-bar');
                this.portalTitleButton = document.getElementById('portal-title-button');
                this.profileImageContainer = document.getElementById('profile-image-container');
                
                this.initialize();
            }
            
            initialize() {
                if (this.isInitialized) return;
                
                try {
                    // Check if schoolID and academicYearID are provided
                    if (!this.stateManager.schoolID || !this.stateManager.academicYearID) {
                        this.showError("School ID or Academic Year ID not provided in URL.");
                        return;
                    }
                    
                    this.showLoading();
                    
                    firebase.initializeApp(firebaseConfig);
                    this.db = firebase.firestore();
                    this.auth = firebase.auth();
                    
                    this.db.settings({
                        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
                    });
                    
                    console.log("Firebase initialized successfully");
                    this.isInitialized = true;
                    
                    this.setupAuthListener();
                    
                } catch (error) {
                    console.error("Firebase initialization error:", error);
                    this.hideLoading();
                    this.showError("Firebase initialization failed. Please refresh the page.");
                }
            }
            
            setupAuthListener() {
                this.auth.onAuthStateChanged(async (user) => {
                    console.log("Auth state changed:", user ? `User ${user.uid} logged in` : "No user");
                    
                    if (user) {
                        this.currentUser = user;
                        await this.loadSchoolData();
                    } else {
                        this.currentUser = null;
                        this.hideLoading();
                        this.showSignInPrompt();
                    }
                });
            }
            
            async loadSchoolData() {
                try {
                    const schoolPath = this.stateManager.getSchoolPath();
                    const schoolDoc = await this.db.doc(schoolPath).get();
                    
                    if (!schoolDoc.exists) {
                        this.showError("School not found. Please check the School ID.");
                        return;
                    }
                    
                    this.stateManager.schoolData = schoolDoc.data();
                    this.renderSelectionForm();
                    this.updateTopBar();
                    this.hideLoading();
                    
                } catch (error) {
                    console.error("Error loading school data:", error);
                    this.showError("Failed to load school data. Please try again.");
                }
            }
            
            async loadClasses() {
                try {
                    const classesPath = this.stateManager.getClassesPath();
                    const classesSnapshot = await this.db.collection(classesPath)
                        .where('academicYear', '==', this.stateManager.academicYearID)
                        .get();
                    
                    this.stateManager.classes = [];
                    classesSnapshot.forEach(doc => {
                        this.stateManager.classes.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    console.log(`Loaded ${this.stateManager.classes.length} classes`);
                    
                } catch (error) {
                    console.error("Error loading classes:", error);
                    this.stateManager.addAlert('error', 'Failed to load classes.');
                }
            }
            
            async loadSections(classId) {
                try {
                    const sectionsPath = this.stateManager.getSectionsPath();
                    const sectionsSnapshot = await this.db.collection(sectionsPath)
                        .where('classID', '==', classId)
                        .where('academicYear', '==', this.stateManager.academicYearID)
                        .get();
                    
                    this.stateManager.sections = [];
                    sectionsSnapshot.forEach(doc => {
                        this.stateManager.sections.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    console.log(`Loaded ${this.stateManager.sections.length} sections for class ${classId}`);
                    
                } catch (error) {
                    console.error("Error loading sections:", error);
                    this.stateManager.addAlert('error', 'Failed to load sections.');
                }
            }
            
            async loadEnrollments(classId, sectionId) {
                try {
                    const enrollmentsPath = this.stateManager.getEnrollmentsPath();
                    const enrollmentsSnapshot = await this.db.collection(enrollmentsPath)
                        .where('academicYear', '==', this.stateManager.academicYearID)
                        .where('classID', '==', classId)
                        .where('sectionID', '==', sectionId)
                        .get();
                    
                    this.stateManager.enrollments = [];
                    enrollmentsSnapshot.forEach(doc => {
                        const data = doc.data();
                        this.stateManager.enrollments.push({
                            id: doc.id,
                            studentName: data.studentName || 'Unknown Student',
                            studentID: data.studentID || '',
                            ...data
                        });
                    });
                    
                    console.log(`Loaded ${this.stateManager.enrollments.length} enrollments`);
                    
                } catch (error) {
                    console.error("Error loading enrollments:", error);
                    this.stateManager.addAlert('error', 'Failed to load enrollments.');
                }
            }
            
            async loadExams(classId, sectionId) {
                try {
                    const examsPath = this.stateManager.getExamsPath();
                    const examsSnapshot = await this.db.collection(examsPath)
                        .where('academicYear', '==', this.stateManager.academicYearID)
                        .where('classID', '==', classId)
                        .where('sectionID', '==', sectionId)
                        .get();
                    
                    this.stateManager.exams = [];
                    examsSnapshot.forEach(doc => {
                        this.stateManager.exams.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    console.log(`Loaded ${this.stateManager.exams.length} exams`);
                    
                } catch (error) {
                    console.error("Error loading exams:", error);
                    this.stateManager.addAlert('error', 'Failed to load exams.');
                }
            }
            
            async loadStudentData(studentId) {
                try {
                    const studentPath = this.stateManager.getStudentPath(studentId);
                    const studentDoc = await this.db.doc(studentPath).get();
                    
                    if (studentDoc.exists) {
                        this.stateManager.studentData = studentDoc.data();
                        this.stateManager.studentData.id = studentId;
                    } else {
                        this.stateManager.studentData = null;
                        this.stateManager.addAlert('error', 'Student data not found.');
                    }
                    
                } catch (error) {
                    console.error("Error loading student data:", error);
                    this.stateManager.studentData = null;
                    this.stateManager.addAlert('error', 'Failed to load student data.');
                }
            }
            
            async loadResultData(enrollmentId, examId) {
                try {
                    const resultsPath = this.stateManager.getResultsPath();
                    const resultsSnapshot = await this.db.collection(resultsPath)
                        .where('enrollmentID', '==', enrollmentId)
                        .where('examID', '==', examId)
                        .get();
                    
                    if (!resultsSnapshot.empty) {
                        const resultDoc = resultsSnapshot.docs[0];
                        this.stateManager.resultData = {
                            id: resultDoc.id,
                            ...resultDoc.data()
                        };
                        
                        // Load subject details
                        await this.loadSubjectsData(this.stateManager.resultData.subjects);
                        
                        console.log("Loaded result data:", this.stateManager.resultData);
                    } else {
                        this.stateManager.resultData = null;
                        this.stateManager.addAlert('error', 'No result found for selected exam.');
                    }
                    
                } catch (error) {
                    console.error("Error loading result data:", error);
                    this.stateManager.resultData = null;
                    this.stateManager.addAlert('error', 'Failed to load result data.');
                }
            }
            
            async loadSubjectsData(subjects) {
                try {
                    for (const subject of subjects) {
                        if (subject.subjectID) {
                            const subjectPath = this.stateManager.getSubjectPath(subject.subjectID);
                            const subjectDoc = await this.db.doc(subjectPath).get();
                            
                            if (subjectDoc.exists) {
                                this.stateManager.subjectsData[subject.subjectID] = subjectDoc.data();
                            }
                        }
                    }
                } catch (error) {
                    console.error("Error loading subjects data:", error);
                }
            }
            
            showLoading() {
                const html = `
                    <div class="loading-overlay">
                        <div class="loading-spinner"></div>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                this.chatContainer.scrollTop = 0;
                this.chatContainer.style.overflowY = 'hidden';
            }
            
            hideLoading() {
                this.chatContainer.style.overflowY = 'auto';
            }
            
            updateTopBar() {
                this.topBar.classList.remove('hidden');
            }
            
            showError(message) {
                console.error(message);
                
                this.topBar.classList.add('hidden');
                
                const html = `
                    <div class="error-container">
                        <div class="error-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="error-title">Error</div>
                        <div class="error-message">
                            ${message}
                        </div>
                        <button id="retry-button" class="signin-button" style="background: #3b82f6;">
                            Retry
                        </button>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                this.chatContainer.scrollTop = 0;
                
                document.getElementById('retry-button')?.addEventListener('click', () => {
                    window.location.reload();
                });
            }
            
            showSignInPrompt() {
                this.topBar.classList.add('hidden');
                
                const html = `
                    <div class="signin-prompt-container">
                        <div class="signin-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="signin-title">Sign In to MarkSheet Portal</div>
                        <div class="signin-message">
                            You need to sign in to access the mark sheet portal.
                        </div>
                        <button id="sign-in-prompt-button" class="signin-button">
                            Sign In to Continue
                        </button>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                this.chatContainer.scrollTop = 0;
                
                document.getElementById('sign-in-prompt-button')?.addEventListener('click', () => {
                    this.showAuthModal();
                });
            }
            
            showAuthModal() {
                const authModal = document.createElement('div');
                authModal.className = 'auth-modal-overlay';
                authModal.innerHTML = `
                    <div class="auth-modal">
                        <div class="auth-header">
                            <div class="auth-title">Sign In to MarkSheet Portal</div>
                        </div>
                        <div class="auth-body">
                            <div class="auth-field">
                                <label class="auth-label">Enter Email</label>
                                <input type="email" id="auth-email" class="auth-input" placeholder="user@example.com">
                                <div id="email-error" class="auth-error"></div>
                            </div>
                            
                            <div class="auth-field">
                                <label class="auth-label">Enter Password</label>
                                <input type="password" id="auth-password" class="auth-input" placeholder="••••••••">
                                <div id="password-error" class="auth-error"></div>
                            </div>
                            
                            <button id="sign-in-button" class="auth-button">Sign In</button>
                        </div>
                        <div class="auth-footer">
                            <span>Don't have an account? <span class="signup-link" id="show-signup">Sign up</span></span>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(authModal);
                this.setupAuthModalEvents(authModal);
            }
            
            setupAuthModalEvents(authModal) {
                const signInButton = document.getElementById('sign-in-button');
                const emailInput = document.getElementById('auth-email');
                const passwordInput = document.getElementById('auth-password');
                const showSignup = document.getElementById('show-signup');
                
                signInButton.addEventListener('click', async () => {
                    await this.signInWithEmail(emailInput, passwordInput, authModal);
                });
                
                showSignup.addEventListener('click', async () => {
                    await this.signUpWithEmail(emailInput, passwordInput, authModal);
                });
                
                emailInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        passwordInput.focus();
                    }
                });
                
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.signInWithEmail(emailInput, passwordInput, authModal);
                    }
                });
                
                authModal.addEventListener('click', (e) => {
                    if (e.target === authModal) {
                        authModal.remove();
                    }
                });
            }
            
            async signInWithEmail(emailInput, passwordInput, authModal) {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const signInButton = document.getElementById('sign-in-button');
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.textContent = '';
                emailError.classList.remove('show');
                passwordError.textContent = '';
                passwordError.classList.remove('show');
                
                if (!email) {
                    emailError.textContent = 'Please enter your email';
                    emailError.classList.add('show');
                    return;
                }
                
                if (!password) {
                    passwordError.textContent = 'Please enter your password';
                    passwordError.classList.add('show');
                    return;
                }
                
                signInButton.textContent = 'Signing In...';
                signInButton.classList.add('loading');
                
                try {
                    await this.auth.signInWithEmailAndPassword(email, password);
                    authModal.remove();
                    
                } catch (error) {
                    console.error("Sign in error:", error);
                    
                    signInButton.textContent = 'Sign In';
                    signInButton.classList.remove('loading');
                    
                    switch (error.code) {
                        case 'auth/invalid-email':
                            emailError.textContent = 'Invalid email address';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-disabled':
                            emailError.textContent = 'This account has been disabled';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-not-found':
                            emailError.textContent = 'No account found with this email';
                            emailError.classList.add('show');
                            break;
                        case 'auth/wrong-password':
                            passwordError.textContent = 'Incorrect password';
                            passwordError.classList.add('show');
                            break;
                        case 'auth/too-many-requests':
                            passwordError.textContent = 'Too many failed attempts. Try again later';
                            passwordError.classList.add('show');
                            break;
                        default:
                            passwordError.textContent = 'Failed to sign in. Please try again';
                            passwordError.classList.add('show');
                    }
                }
            }
            
            async signUpWithEmail(emailInput, passwordInput, authModal) {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const signInButton = document.getElementById('sign-in-button');
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.textContent = '';
                emailError.classList.remove('show');
                passwordError.textContent = '';
                passwordError.classList.remove('show');
                
                if (!email) {
                    emailError.textContent = 'Please enter your email';
                    emailError.classList.add('show');
                    return;
                }
                
                if (!password) {
                    passwordError.textContent = 'Please enter your password';
                    passwordError.classList.add('show');
                    return;
                }
                
                if (password.length < 6) {
                    passwordError.textContent = 'Password must be at least 6 characters';
                    passwordError.classList.add('show');
                    return;
                }
                
                signInButton.textContent = 'Creating Account...';
                signInButton.classList.add('loading');
                
                try {
                    await this.auth.createUserWithEmailAndPassword(email, password);
                    authModal.remove();
                    
                } catch (error) {
                    console.error("Sign up error:", error);
                    
                    signInButton.textContent = 'Sign In';
                    signInButton.classList.remove('loading');
                    
                    switch (error.code) {
                        case 'auth/email-already-in-use':
                            emailError.textContent = 'Email already in use';
                            emailError.classList.add('show');
                            break;
                        case 'auth/invalid-email':
                            emailError.textContent = 'Invalid email address';
                            emailError.classList.add('show');
                            break;
                        case 'auth/weak-password':
                            passwordError.textContent = 'Password is too weak';
                            passwordError.classList.add('show');
                            break;
                        default:
                            passwordError.textContent = 'Failed to create account. Please try again';
                            passwordError.classList.add('show');
                    }
                }
            }
            
            renderSelectionForm() {
                await this.loadClasses();
                
                let formHtml = '<div class="portal-container">';
                
                // Display alerts
                const alerts = this.stateManager.getAlerts();
                if (alerts.length > 0) {
                    alerts.forEach(alert => {
                        formHtml += `
                            <div class="alert alert-${alert.type}">
                                ${alert.message}
                            </div>
                        `;
                    });
                }
                
                const schoolData = this.stateManager.schoolData;
                
                formHtml += `
                    <div class="portal-section">
                        <div class="section-type-header-inline">
                            <div class="header-bg">
                                <div class="connector-line">
                                    <div class="dot"></div>
                                    <div class="dot"></div>
                                </div>
                                <div class="title-box">
                                    MARK SHEET SELECTION
                                </div>
                            </div>
                        </div>
                        
                        <div class="section-header">
                            <h1 class="text-2xl font-bold text-gray-900">Mark Sheet Selection</h1>
                            <p class="text-gray-600">Select class, section, student, and exam to generate mark sheet</p>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500">
                                    School: <span class="font-bold">${schoolData?.schoolName || 'N/A'}</span> | 
                                    Academic Year: <span class="font-bold">${this.stateManager.academicYearID}</span>
                                </p>
                            </div>
                        </div>
                        
                        <div class="form-container">
                            <!-- Class Selection -->
                            <div class="form-group">
                                <label class="form-label">Select Class</label>
                                <select id="class-select" class="form-select">
                                    <option value="">-- Select Class --</option>
                                    ${this.stateManager.classes.map(cls => `
                                        <option value="${cls.id}" ${this.stateManager.selectedClass === cls.id ? 'selected' : ''}>
                                            ${cls.className || cls.id}
                                        </option>
                                    `).join('')}
                                </select>
                                <div id="class-loading" class="loading-text">Loading classes...</div>
                            </div>
                            
                            <!-- Section Selection -->
                            <div class="form-group">
                                <label class="form-label">Select Section</label>
                                <select id="section-select" class="form-select" ${!this.stateManager.selectedClass ? 'disabled' : ''}>
                                    <option value="">-- Select Section --</option>
                                    ${this.stateManager.sections.map(sec => `
                                        <option value="${sec.id}" ${this.stateManager.selectedSection === sec.id ? 'selected' : ''}>
                                            ${sec.sectionName || sec.id}
                                        </option>
                                    `).join('')}
                                </select>
                                <div id="section-loading" class="loading-text ${this.stateManager.selectedClass ? 'show' : ''}">Loading sections...</div>
                            </div>
                            
                            <!-- Enrollment Selection -->
                            <div class="form-group">
                                <label class="form-label">Select Student</label>
                                <select id="enrollment-select" class="form-select" ${!this.stateManager.selectedSection ? 'disabled' : ''}>
                                    <option value="">-- Select Student --</option>
                                    ${this.stateManager.enrollments.map(enroll => `
                                        <option value="${enroll.id}" ${this.stateManager.selectedEnrollment === enroll.id ? 'selected' : ''}>
                                            ${enroll.studentName} (${enroll.studentID || enroll.id})
                                        </option>
                                    `).join('')}
                                </select>
                                <div id="enrollment-loading" class="loading-text ${this.stateManager.selectedSection ? 'show' : ''}">Loading students...</div>
                            </div>
                            
                            <!-- Exam Selection -->
                            <div class="form-group">
                                <label class="form-label">Select Exam</label>
                                <select id="exam-select" class="form-select" ${!this.stateManager.selectedSection ? 'disabled' : ''}>
                                    <option value="">-- Select Exam --</option>
                                    ${this.stateManager.exams.map(exam => `
                                        <option value="${exam.id}" ${this.stateManager.selectedExam === exam.id ? 'selected' : ''}>
                                            ${exam.examTitle || exam.id}
                                        </option>
                                    `).join('')}
                                </select>
                                <div id="exam-loading" class="loading-text ${this.stateManager.selectedSection ? 'show' : ''}">Loading exams...</div>
                            </div>
                            
                            <button id="generate-marksheet" class="form-button" 
                                    ${!this.stateManager.selectedEnrollment || !this.stateManager.selectedExam ? 'disabled' : ''}>
                                Generate Mark Sheet
                            </button>
                            
                            <div class="mt-6">
                                <button id="logout-button" class="form-button" style="background: #ef4444;">
                                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                formHtml += '</div>';
                
                this.chatContainer.innerHTML = formHtml;
                this.updateTopBar();
                
                // Add event listeners
                this.setupFormEventListeners();
            }
            
            setupFormEventListeners() {
                // Class selection
                const classSelect = document.getElementById('class-select');
                if (classSelect) {
                    classSelect.addEventListener('change', async (e) => {
                        const classId = e.target.value;
                        this.stateManager.selectedClass = classId;
                        this.stateManager.selectedSection = null;
                        this.stateManager.selectedEnrollment = null;
                        this.stateManager.selectedExam = null;
                        
                        if (classId) {
                            document.getElementById('section-loading').classList.add('show');
                            document.getElementById('section-select').disabled = true;
                            await this.loadSections(classId);
                            this.renderSelectionForm();
                        } else {
                            this.stateManager.sections = [];
                            this.stateManager.enrollments = [];
                            this.stateManager.exams = [];
                            this.renderSelectionForm();
                        }
                    });
                }
                
                // Section selection
                const sectionSelect = document.getElementById('section-select');
                if (sectionSelect) {
                    sectionSelect.addEventListener('change', async (e) => {
                        const sectionId = e.target.value;
                        this.stateManager.selectedSection = sectionId;
                        this.stateManager.selectedEnrollment = null;
                        this.stateManager.selectedExam = null;
                        
                        if (sectionId && this.stateManager.selectedClass) {
                            document.getElementById('enrollment-loading').classList.add('show');
                            document.getElementById('exam-loading').classList.add('show');
                            document.getElementById('enrollment-select').disabled = true;
                            document.getElementById('exam-select').disabled = true;
                            
                            await Promise.all([
                                this.loadEnrollments(this.stateManager.selectedClass, sectionId),
                                this.loadExams(this.stateManager.selectedClass, sectionId)
                            ]);
                            
                            this.renderSelectionForm();
                        } else {
                            this.stateManager.enrollments = [];
                            this.stateManager.exams = [];
                            this.renderSelectionForm();
                        }
                    });
                }
                
                // Enrollment selection
                const enrollmentSelect = document.getElementById('enrollment-select');
                if (enrollmentSelect) {
                    enrollmentSelect.addEventListener('change', (e) => {
                        this.stateManager.selectedEnrollment = e.target.value;
                        this.updateGenerateButton();
                    });
                }
                
                // Exam selection
                const examSelect = document.getElementById('exam-select');
                if (examSelect) {
                    examSelect.addEventListener('change', (e) => {
                        this.stateManager.selectedExam = e.target.value;
                        this.updateGenerateButton();
                    });
                }
                
                // Generate mark sheet button
                const generateButton = document.getElementById('generate-marksheet');
                if (generateButton) {
                    generateButton.addEventListener('click', async () => {
                        await this.generateMarkSheet();
                    });
                }
                
                // Logout button
                const logoutButton = document.getElementById('logout-button');
                if (logoutButton) {
                    logoutButton.addEventListener('click', async () => {
                        try {
                            await this.auth.signOut();
                        } catch (error) {
                            console.error("Logout error:", error);
                        }
                    });
                }
            }
            
            updateGenerateButton() {
                const generateButton = document.getElementById('generate-marksheet');
                if (generateButton) {
                    generateButton.disabled = !(this.stateManager.selectedEnrollment && this.stateManager.selectedExam);
                }
            }
            
            async generateMarkSheet() {
                this.showLoading();
                
                // Find selected enrollment
                const selectedEnrollment = this.stateManager.enrollments.find(
                    e => e.id === this.stateManager.selectedEnrollment
                );
                
                if (!selectedEnrollment) {
                    this.hideLoading();
                    this.stateManager.addAlert('error', 'Selected enrollment not found.');
                    return;
                }
                
                // Find selected exam
                const selectedExam = this.stateManager.exams.find(
                    e => e.id === this.stateManager.selectedExam
                );
                
                if (!selectedExam) {
                    this.hideLoading();
                    this.stateManager.addAlert('error', 'Selected exam not found.');
                    return;
                }
                
                // Load student data
                await this.loadStudentData(selectedEnrollment.studentID);
                
                // Load result data
                await this.loadResultData(this.stateManager.selectedEnrollment, this.stateManager.selectedExam);
                
                this.hideLoading();
                
                if (this.stateManager.studentData && this.stateManager.resultData) {
                    this.renderMarkSheet(selectedExam);
                } else {
                    this.stateManager.addAlert('error', 'Could not load all required data for mark sheet.');
                }
            }
            
            renderMarkSheet(examData) {
                const schoolData = this.stateManager.schoolData;
                const studentData = this.stateManager.studentData;
                const resultData = this.stateManager.resultData;
                
                let marksheetHtml = '<div class="marksheet-container">';
                
                marksheetHtml += `
                    <div class="marksheet-nav">
                        <button class="nav-button back back-to-selection" id="back-to-selection">
                            <i class="fas fa-arrow-left mr-2"></i> Back to Selection
                        </button>
                        <button class="nav-button print" onclick="window.print()">
                            <i class="fas fa-print mr-2"></i> Save PDF / Print
                        </button>
                        <button class="nav-button" onclick="location.reload()">
                            <i class="fas fa-redo mr-2"></i> Refresh
                        </button>
                    </div>
                    
                    <div class="marksheet-page">
                        <div class="marksheet-outer-border">
                            <div class="marksheet-inner-border">
                                
                                <!-- Boxed Header Section -->
                                <div class="header-box">
                                    <!-- Left School Logo -->
                                    <img src="${schoolData?.schoolLogo || 'https://i.postimg.cc/KcVvrkz3/Concept_20251225_020546_0000.png'}" 
                                         alt="School Logo" 
                                         class="header-logo"
                                         onerror="this.src='https://i.postimg.cc/KcVvrkz3/Concept_20251225_020546_0000.png'">
                                    
                                    <!-- Center Content -->
                                    <div class="header-content">
                                        <div class="inst-name">${schoolData?.schoolName || 'DILSHAD INSTITUTE OF SCIENCE'}</div>
                                        <div class="address-text">${schoolData?.schoolAddress || 'BIRGUNJ -04- PARSA NEPAL'}</div>
                                        <div style="font-weight:bold; font-size:11pt; color: #555; margin-top: 3px;">
                                            ${this.getSelectedClassName()}
                                        </div>
                                        <div>
                                            <span class="grade-sheet-title-box">GRADE-SHEET</span>
                                        </div>
                                    </div>
    
                                    <!-- Right Student Photo -->
                                    <img src="${studentData?.studentProfile || 'https://i.postimg.cc/8cB6w9Zv/Concept_20260111_031429_0000.png'}" 
                                         alt="Student Photo" 
                                         class="header-logo"
                                         onerror="this.src='https://i.postimg.cc/8cB6w9Zv/Concept_20260111_031429_0000.png'">
                                </div>
    
                                <!-- Student Details -->
                                <div class="student-details">
                                    <div class="detail-row" style="grid-column: span 2;">
                                        <span class="detail-label">THE GRADE SECURED BY :</span>
                                        <span class="detail-value">${studentData?.studentName || 'N/A'}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">DATE OF BIRTH :</span>
                                        <span class="detail-value">${this.formatDate(studentData?.dateOfBirth) || 'N/A'}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">DISTRICT :</span>
                                        <span class="detail-value">${studentData?.district || 'N/A'}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">SYMBOL NO :</span>
                                        <span class="detail-value">${studentData?.rollNo || 'N/A'}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">ACADEMIC YEAR :</span>
                                        <span class="detail-value">${this.stateManager.academicYearID || 'N/A'}</span>
                                    </div>
                                    
                                    <!-- BOLD Exam Title and Conducted Dates -->
                                    <div class="full-width-row">
                                        <span class="detail-label">IN THE <strong style="color:black; font-size:10.5pt;">${examData?.examTitle || 'EXAMINATION'}</strong> CONDUCTED FROM :</span>
                                        <span class="detail-value" style="flex-grow: 0; width: 150px; margin-right: 10px;">
                                            ${this.formatDate(examData?.startedAt) || '.....................'}
                                        </span>
                                        <span class="detail-label" style="margin-right: 10px;">TO :</span>
                                        <span class="detail-value">
                                            ${this.formatDate(examData?.endedAt) || '.....................'}
                                        </span>
                                    </div>
                                </div>
    
                                <div class="table-container">
                                    <table class="marksheet-table">
                                        <thead>
                                            <tr>
                                                <th rowspan="2" width="4%">S.N.</th>
                                                <th rowspan="2" width="22%">SUBJECTS</th>
                                                <th rowspan="2" width="8%">CREDIT HOURS</th>
                                                <th colspan="2" width="12%">OBTAINED MARKS</th>
                                                <th rowspan="2" width="10%">FINAL MARKS</th>
                                                <th colspan="2" width="12%">OBTAINED GRADE</th>
                                                <th rowspan="2" width="10%">FINAL GRADE</th>
                                                <th rowspan="2" width="10%">GRADE POINT</th>
                                            </tr>
                                            <tr>
                                                <th>TH</th>
                                                <th>PR</th>
                                                <th>TH</th>
                                                <th>PR</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${this.renderSubjectsRows()}
                                            <tr class="summary-row">
                                                <td colspan="3"></td>
                                                <td colspan="3" style="text-align: right; padding-right: 15px;">
                                                    PERCENTAGE (%) = ${resultData?.percentage?.toFixed(2) || '0.00'}
                                                </td>
                                                <td colspan="4" style="text-align: right; padding-right: 20px;">
                                                    GRADE POINT AVERAGE (GPA): ${resultData?.GPA?.toFixed(2) || '0.00'}
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
    
                                <div class="marksheet-footer">
                                    <div class="signature-box" style="text-align: left;">
                                        <div style="margin-bottom: 35px; text-transform: uppercase;">
                                            DATE OF ISSUE: ${this.formatDate(resultData?.issuedDate) || 'N/A'}
                                        </div>
                                        <div>PREPARED BY: ${resultData?.preparedBy || '........................'}</div>
                                    </div>
                                    <div class="signature-box">
                                        <div class="sig-line"></div>
                                        <div style="text-transform: uppercase; font-weight: bold;">
                                            ${schoolData?.schoolPrinciple ? schoolData.schoolPrinciple.toUpperCase() : 'SCHOOL PRINCIPAL'}
                                        </div>
                                    </div>
                                </div>
    
                            </div>
                        </div>
                    </div>
                `;
                
                marksheetHtml += '</div>';
                
                this.chatContainer.innerHTML = marksheetHtml;
                this.chatContainer.style.overflowY = 'auto';
                
                // Add event listener for back button
                document.getElementById('back-to-selection')?.addEventListener('click', () => {
                    this.renderSelectionForm();
                });
            }
            
            getSelectedClassName() {
                if (this.stateManager.selectedClass) {
                    const selectedClass = this.stateManager.classes.find(c => c.id === this.stateManager.selectedClass);
                    return selectedClass?.className || selectedClass?.id || 'GRADE';
                }
                return 'GRADE';
            }
            
            formatDate(dateValue) {
                if (!dateValue) return '';
                
                try {
                    if (dateValue.toDate) {
                        // Firebase timestamp
                        const date = dateValue.toDate();
                        return date.toLocaleDateString();
                    } else if (typeof dateValue === 'string') {
                        // String date
                        return dateValue;
                    } else if (dateValue.seconds) {
                        // Timestamp with seconds
                        const date = new Date(dateValue.seconds * 1000);
                        return date.toLocaleDateString();
                    }
                } catch (error) {
                    console.error("Error formatting date:", error);
                }
                
                return String(dateValue);
            }
            
            renderSubjectsRows() {
                const resultData = this.stateManager.resultData;
                if (!resultData || !resultData.subjects || !Array.isArray(resultData.subjects)) {
                    return '<tr><td colspan="10" class="text-center">No subject data available</td></tr>';
                }
                
                return resultData.subjects.map((subject, index) => {
                    const subjectInfo = this.stateManager.subjectsData[subject.subjectID] || {};
                    const creditHours = subjectInfo.creditHours || 0;
                    
                    return `
                        <tr>
                            <td>${index + 1}</td>
                            <td class="subject-col">${subjectInfo.subjectName || subject.subjectID || 'N/A'}</td>
                            <td>${creditHours}</td>
                            <td>${subject.theoryMarks || '-'}</td>
                            <td>${subject.practicalMarks || '-'}</td>
                            <td>${subject.finalMarks || '-'}</td>
                            <td>${subject.theoryGrade || '-'}</td>
                            <td>${subject.practicalGrade || '-'}</td>
                            <td>${subject.grade || '-'}</td>
                            <td>${subject.gradePoint?.toFixed(2) || '-'}</td>
                        </tr>
                    `;
                }).join('');
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new MarkSheetApp();
        });
        
        // Make app available globally for debugging
        window.app = app;
    </script>
</body>
</html>
