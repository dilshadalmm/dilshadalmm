<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimum-scale=1.0">
    <title>Mark Sheet Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Roboto+Condensed:wght@700&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        /* CRITICAL: Ensure HTML and BODY are full height and non-scrollable */
        html {
            height: 100%;
            overflow: hidden !important;
        }

        /* Use the Oswald font family as default */
        body {
            font-family: 'Oswald', sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            
            /* White background */
            background-color: #ffffff !important;
            color: #000000;
            
            /* CRITICAL: Prevent the main body from scrolling at all */
            overflow: hidden !important; 
            
            user-select: none;
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none; 
            
            /* Prevents elastic scrolling on iOS */
            overscroll-behavior: none;
            
            /* Make body a fixed container occupying full screen */
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* App wrapper - uses dynamic viewport height for mobile keyboard stability */
        #app-wrapper {
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dynamic viewport height (best for mobile keyboard) */
            width: 100%;
            position: absolute; /* Relative to fixed body */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden; /* Ensures only the chat container can scroll */
            background: white !important;
        }
        
        /* Strict No-Oval/No-Round Policy */
        * {
            border-radius: 0 !important;
        }
        
        /* --- Hide Scrollbar on Chat Container --- */
        #chat-container {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        #chat-container::-webkit-scrollbar {
            display: none;
        }
        
        /* ===== SELECTION FORM STYLES ===== */
        .form-container {
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
        }
        
        .form-box {
            width: 100%;
            max-width: 500px;
            background: #f8f9fa;
            border: 2px solid #1a2a3a;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a2a3a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #d1d5db;
            background: white;
            font-size: 16px;
            font-family: 'Oswald', sans-serif;
            color: #374151;
            appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .form-select:focus {
            outline: none;
            border-color: #1a2a3a;
            box-shadow: 0 0 0 3px rgba(26, 42, 58, 0.1);
        }
        
        .form-select:disabled {
            background: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
        }
        
        .form-button {
            width: 100%;
            padding: 14px;
            background: #1a2a3a;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-family: 'Oswald', sans-serif;
            margin-top: 10px;
        }
        
        .form-button:hover {
            background: #2a3a4a;
        }
        
        .form-button:active {
            background: #0a1a2a;
        }
        
        .form-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #dc2626;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        /* ===== MARK SHEET PRINT STYLES ===== */
        .marksheet-container {
            width: 100%;
            height: 100%;
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        /* Print Navigation Bar */
        .print-nav-bar {
            width: 100%;
            max-width: 800px;
            background: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            border: 2px solid #1a2a3a;
        }
        
        .print-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .print-button:hover {
            background-color: #45a049;
        }
        
        /* Mark Sheet Document */
        .marksheet-document {
            width: 100%;
            max-width: 800px;
            background: white;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        /* Mark Sheet Content (matches provided design) */
        .marksheet-content {
            padding: 15mm;
            font-family: "Times New Roman", Times, serif;
        }
        
        .outer-border {
            border: 2px solid #1a2a3a;
            padding: 2mm;
        }
        
        .inner-border {
            border: 5px double #1a2a3a;
            padding: 6mm;
        }
        
        /* Boxed Header Section */
        .header-box {
            border: 2px solid #000;
            background-color: #f8f9fa;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 80px; 
        }
        
        .header-logo {
            width: 85px;
            height: 85px;
            object-fit: contain;
            flex-shrink: 0;
        }
        
        .header-content {
            text-align: center;
            min-width: 450px; 
        }
        
        .inst-name { 
            font-size: 20pt;
            font-weight: bold; 
            text-transform: uppercase; 
            color: #1a2a3a;
            margin-bottom: 4px;
        }
        
        .address-text {
            font-size: 11pt;
            font-weight: bold;
            color: #333;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 4px 0;
            display: block;
        }
        
        .grade-sheet-title-box {
            font-size: 18pt;
            font-weight: 900;
            background-color: #000;
            color: #fff;
            letter-spacing: 4px;
            display: inline-block;
            padding: 5px 40px;
            margin-top: 8px;
            text-transform: uppercase;
        }
        
        /* Student Details Layout */
        .student-details {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 5px 40px;
            font-size: 11.5pt;
            margin-bottom: 15px;
            padding: 0 10px;
        }
        
        .detail-row { 
            display: flex; 
            align-items: baseline; 
        }
        
        .label { 
            font-weight: bold; 
            margin-right: 10px; 
            text-transform: uppercase; 
            font-size: 10pt; 
            color: #444; 
            flex-shrink: 0; 
        }
        
        .value { 
            border-bottom: 1px dotted #000; 
            flex-grow: 1; 
            font-weight: bold; 
            font-size: 11.5pt; 
            color: #000; 
        }
        
        /* Full Width Detail Row */
        .full-width-row {
            grid-column: span 2;
            margin-top: 5px;
            display: flex;
            align-items: baseline;
        }
        
        /* Table */
        .table-container { 
            margin-top: 20px; 
        }
        
        .marksheet-table { 
            width: 100%; 
            border-collapse: collapse; 
            border: 2px solid black; 
        }
        
        .marksheet-table th, 
        .marksheet-table td { 
            border: 1px solid black; 
            padding: 4px 3px; 
            text-align: center; 
            font-size: 10.5pt; 
        }
        
        .marksheet-table th { 
            background-color: #eee; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 9pt; 
        }
        
        .subject-col { 
            text-align: left; 
            padding-left: 10px; 
            font-weight: bold; 
        }
        
        .summary-row { 
            background: #fdfdfd; 
            font-weight: bold; 
        }
        
        /* Footer */
        .footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 11pt;
            padding: 0 10px;
        }
        
        .signature-box { 
            text-align: center; 
            width: 220px; 
        }
        
        .sig-line { 
            border-top: 1.5px solid black; 
            margin-bottom: 5px; 
        }
        
        /* Print Styles */
        @media print {
            body * {
                visibility: hidden;
            }
            
            .marksheet-document,
            .marksheet-document * {
                visibility: visible;
            }
            
            .marksheet-document {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                box-shadow: none;
            }
            
            .print-nav-bar {
                display: none !important;
            }
            
            @page {
                size: A4 landscape;
                margin: 0;
            }
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-content {
            text-align: center;
            background: white;
            padding: 40px;
            border: 2px solid #1a2a3a;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        
        /* Back Button */
        .back-button {
            background: #1a2a3a;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        
        .back-button:hover {
            background: #2a3a4a;
        }
    </style>
</head>

<body class="h-full">

    <!-- Mobile App Container (Flex Column) -->
    <div id="app-wrapper" class="flex flex-col overflow-hidden">
        <!-- Main content area -->
        <main id="chat-container" class="flex-1 overflow-y-auto">
            <!-- Content will be dynamically loaded here -->
        </main>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBJ_G5o4otg7riemfJDMOcPoHoIVH7emsc",
            authDomain: "geobazarr.firebaseapp.com",
            databaseURL: "https://geobazarr-default-rtdb.firebaseio.com",
            projectId: "geobazarr",
            storageBucket: "geobazarr.firebasestorage.app",
            messagingSenderId: "679949247383",
            appId: "1:679949247383:web:036d4f32038422ebb89ad2"
        };

        // State Manager
        class StateManager {
            constructor() {
                this.schoolID = null;
                this.academicYearID = null;
                this.schoolData = null;
                this.classes = [];
                this.sections = [];
                this.enrollments = [];
                this.exams = [];
                this.selectedClassId = null;
                this.selectedSectionId = null;
                this.selectedEnrollmentId = null;
                this.selectedExamId = null;
                this.markSheetData = null;
                this.isGenerating = false;
            }
            
            // Extract parameters from URL
            extractUrlParams() {
                const urlParams = new URLSearchParams(window.location.search);
                this.schoolID = urlParams.get('schoolID');
                this.academicYearID = urlParams.get('academicYearID');
                
                return this.schoolID && this.academicYearID;
            }
            
            // Get school document path
            getSchoolPath() {
                return `schools/${this.schoolID}`;
            }
            
            // Get academic year path
            getAcademicYearPath() {
                return `schools/${this.schoolID}/academicYears/${this.academicYearID}`;
            }
            
            // Get classes collection path
            getClassesPath() {
                return `schools/${this.schoolID}/classes`;
            }
            
            // Get sections collection path
            getSectionsPath() {
                return `schools/${this.schoolID}/sections`;
            }
            
            // Get enrollments collection path
            getEnrollmentsPath() {
                return `schools/${this.schoolID}/enrollments`;
            }
            
            // Get exams collection path
            getExamsPath() {
                return `schools/${this.schoolID}/exams`;
            }
            
            // Get results collection path
            getResultsPath() {
                return `schools/${this.schoolID}/results`;
            }
            
            // Get students collection path
            getStudentsPath() {
                return `schools/${this.schoolID}/students`;
            }
            
            // Get subjects collection path
            getSubjectsPath() {
                return `schools/${this.schoolID}/subjects`;
            }
            
            // Reset selections
            resetSelections() {
                this.selectedClassId = null;
                this.selectedSectionId = null;
                this.selectedEnrollmentId = null;
                this.selectedExamId = null;
                this.sections = [];
                this.enrollments = [];
                this.exams = [];
                this.markSheetData = null;
            }
        }

        // Mark Sheet App
        class MarkSheetApp {
            constructor() {
                this.stateManager = new StateManager();
                this.db = null;
                this.auth = null;
                this.currentUser = null;
                this.isInitialized = false;
                
                this.appWrapper = document.getElementById('app-wrapper');
                this.chatContainer = document.getElementById('chat-container');
                
                this.initialize();
            }
            
            initialize() {
                if (this.isInitialized) return;
                
                try {
                    this.showLoading("Initializing Mark Sheet Generator...");
                    
                    // Check if URL parameters are present
                    if (!this.stateManager.extractUrlParams()) {
                        this.showError("Missing schoolID or academicYearID in URL. Please access this page through the correct link.");
                        return;
                    }
                    
                    firebase.initializeApp(firebaseConfig);
                    this.db = firebase.firestore();
                    this.auth = firebase.auth();
                    
                    this.db.settings({
                        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
                    });
                    
                    console.log("Firebase initialized successfully");
                    this.isInitialized = true;
                    
                    this.setupAuthListener();
                    
                } catch (error) {
                    console.error("Firebase initialization error:", error);
                    this.hideLoading();
                    this.showError("Firebase initialization failed. Please refresh the page.");
                }
            }
            
            setupAuthListener() {
                this.auth.onAuthStateChanged(async (user) => {
                    console.log("Auth state changed:", user ? `User ${user.uid} logged in` : "No user");
                    
                    if (user) {
                        this.currentUser = user;
                        await this.loadInitialData();
                    } else {
                        this.currentUser = null;
                        // Show sign-in prompt
                        this.showSignInPrompt();
                    }
                });
            }
            
            async loadInitialData() {
                try {
                    // Load school data
                    await this.loadSchoolData();
                    
                    // Load classes for this academic year
                    await this.loadClasses();
                    
                    // Show selection form
                    this.renderSelectionForm();
                    this.hideLoading();
                    
                } catch (error) {
                    console.error("Error loading initial data:", error);
                    this.hideLoading();
                    this.showError("Failed to load school data. Please try again.");
                }
            }
            
            async loadSchoolData() {
                try {
                    const schoolPath = this.stateManager.getSchoolPath();
                    const schoolDoc = await this.db.doc(schoolPath).get();
                    
                    if (!schoolDoc.exists) {
                        throw new Error("School not found");
                    }
                    
                    this.stateManager.schoolData = schoolDoc.data();
                    console.log("School data loaded:", this.stateManager.schoolData);
                    
                } catch (error) {
                    console.error("Error loading school data:", error);
                    throw error;
                }
            }
            
            async loadClasses() {
                try {
                    const classesPath = this.stateManager.getClassesPath();
                    const querySnapshot = await this.db.collection(classesPath)
                        .where("academicYear", "==", this.stateManager.academicYearID)
                        .get();
                    
                    this.stateManager.classes = [];
                    querySnapshot.forEach(doc => {
                        this.stateManager.classes.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    console.log(`Loaded ${this.stateManager.classes.length} classes`);
                    
                } catch (error) {
                    console.error("Error loading classes:", error);
                    throw error;
                }
            }
            
            async loadSections(classId) {
                try {
                    const sectionsPath = this.stateManager.getSectionsPath();
                    const querySnapshot = await this.db.collection(sectionsPath)
                        .where("classID", "==", classId)
                        .where("academicYear", "==", this.stateManager.academicYearID)
                        .get();
                    
                    this.stateManager.sections = [];
                    querySnapshot.forEach(doc => {
                        this.stateManager.sections.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    console.log(`Loaded ${this.stateManager.sections.length} sections for class ${classId}`);
                    
                } catch (error) {
                    console.error("Error loading sections:", error);
                    throw error;
                }
            }
            
            async loadEnrollments(classId, sectionId) {
                try {
                    const enrollmentsPath = this.stateManager.getEnrollmentsPath();
                    const querySnapshot = await this.db.collection(enrollmentsPath)
                        .where("academicYear", "==", this.stateManager.academicYearID)
                        .where("classID", "==", classId)
                        .where("sectionID", "==", sectionId)
                        .get();
                    
                    this.stateManager.enrollments = [];
                    querySnapshot.forEach(doc => {
                        this.stateManager.enrollments.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    console.log(`Loaded ${this.stateManager.enrollments.length} enrollments`);
                    
                } catch (error) {
                    console.error("Error loading enrollments:", error);
                    throw error;
                }
            }
            
            async loadExams(classId, sectionId) {
                try {
                    const examsPath = this.stateManager.getExamsPath();
                    const querySnapshot = await this.db.collection(examsPath)
                        .where("academicYear", "==", this.stateManager.academicYearID)
                        .where("classID", "==", classId)
                        .where("sectionID", "==", sectionId)
                        .get();
                    
                    this.stateManager.exams = [];
                    querySnapshot.forEach(doc => {
                        this.stateManager.exams.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    console.log(`Loaded ${this.stateManager.exams.length} exams`);
                    
                } catch (error) {
                    console.error("Error loading exams:", error);
                    throw error;
                }
            }
            
            async loadMarkSheetData() {
                try {
                    this.stateManager.isGenerating = true;
                    this.showLoading("Generating Mark Sheet...");
                    
                    // Get selected enrollment
                    const enrollment = this.stateManager.enrollments.find(
                        e => e.id === this.stateManager.selectedEnrollmentId
                    );
                    
                    if (!enrollment) {
                        throw new Error("Enrollment not found");
                    }
                    
                    // Get student data
                    const studentPath = `${this.stateManager.getStudentsPath()}/${enrollment.studentID}`;
                    const studentDoc = await this.db.doc(studentPath).get();
                    
                    if (!studentDoc.exists) {
                        throw new Error("Student not found");
                    }
                    
                    const studentData = studentDoc.data();
                    
                    // Get exam data
                    const exam = this.stateManager.exams.find(
                        e => e.id === this.stateManager.selectedExamId
                    );
                    
                    if (!exam) {
                        throw new Error("Exam not found");
                    }
                    
                    // Find result for this enrollment and exam
                    const resultsPath = this.stateManager.getResultsPath();
                    const resultsQuery = await this.db.collection(resultsPath)
                        .where("enrollmentID", "==", this.stateManager.selectedEnrollmentId)
                        .where("examID", "==", this.stateManager.selectedExamId)
                        .limit(1)
                        .get();
                    
                    if (resultsQuery.empty) {
                        throw new Error("No result found for this student and exam");
                    }
                    
                    let resultData = null;
                    resultsQuery.forEach(doc => {
                        resultData = {
                            id: doc.id,
                            ...doc.data()
                        };
                    });
                    
                    // Load subject details and credit hours
                    const subjectsPath = this.stateManager.getSubjectsPath();
                    const subjectsWithDetails = [];
                    
                    for (const subject of resultData.subjects) {
                        const subjectDoc = await this.db.doc(`${subjectsPath}/${subject.subjectID}`).get();
                        if (subjectDoc.exists) {
                            const subjectData = subjectDoc.data();
                            subjectsWithDetails.push({
                                ...subject,
                                subjectName: subjectData.subjectName || subject.subjectID,
                                creditHours: subjectData.creditHours || 0
                            });
                        } else {
                            subjectsWithDetails.push({
                                ...subject,
                                subjectName: subject.subjectID,
                                creditHours: 0
                            });
                        }
                    }
                    
                    // Prepare mark sheet data
                    this.stateManager.markSheetData = {
                        school: {
                            name: this.stateManager.schoolData.schoolName || "School Name",
                            address: this.stateManager.schoolData.schoolAddress || "School Address",
                            logo: this.stateManager.schoolData.schoolLogo || "",
                            principal: this.stateManager.schoolData.schoolPrinciple || "School Principal"
                        },
                        student: {
                            name: studentData.studentName || enrollment.studentName || "Student Name",
                            dateOfBirth: studentData.dateOfBirth || "",
                            district: studentData.district || "",
                            rollNo: enrollment.rollNo || "",
                            profileImage: studentData.studentProfile || "",
                            studentID: enrollment.studentID
                        },
                        class: {
                            name: this.stateManager.classes.find(c => c.id === this.stateManager.selectedClassId)?.className || "Class",
                            title: this.stateManager.classes.find(c => c.id === this.stateManager.selectedClassId)?.classTitle || ""
                        },
                        exam: {
                            title: exam.examTitle || "Exam",
                            startedAt: exam.startedAt ? this.formatDate(exam.startedAt) : "",
                            endedAt: exam.endedAt ? this.formatDate(exam.endedAt) : ""
                        },
                        academicYear: this.stateManager.academicYearID,
                        result: {
                            subjects: subjectsWithDetails,
                            percentage: resultData.percentage || 0,
                            GPA: resultData.GPA || 0,
                            preparedBy: resultData.preparedBy || "",
                            issuedDate: resultData.issuedDate || this.formatDate(new Date())
                        }
                    };
                    
                    console.log("Mark sheet data loaded:", this.stateManager.markSheetData);
                    this.hideLoading();
                    this.renderMarkSheet();
                    
                } catch (error) {
                    console.error("Error loading mark sheet data:", error);
                    this.hideLoading();
                    this.showError(error.message || "Failed to generate mark sheet. Please try again.");
                    this.stateManager.isGenerating = false;
                }
            }
            
            formatDate(dateValue) {
                try {
                    if (!dateValue) return "";
                    
                    let date;
                    if (dateValue.toDate) {
                        // Firebase Timestamp
                        date = dateValue.toDate();
                    } else if (typeof dateValue === 'string') {
                        date = new Date(dateValue);
                    } else {
                        date = dateValue;
                    }
                    
                    return date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    });
                } catch (error) {
                    console.error("Error formatting date:", error);
                    return "";
                }
            }
            
            // UI Methods
            showLoading(message = "Loading...") {
                const html = `
                    <div class="loading-overlay">
                        <div class="loading-content">
                            <div class="loading-spinner" style="width: 40px; height: 40px; border-width: 4px; margin: 0 auto 20px;"></div>
                            <div style="font-size: 18px; font-weight: 600; color: #1a2a3a;">${message}</div>
                        </div>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
            }
            
            hideLoading() {
                const loadingOverlay = document.querySelector('.loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.remove();
                }
            }
            
            showError(message) {
                const html = `
                    <div class="form-container">
                        <div class="form-box">
                            <div class="form-header">
                                <div style="font-size: 64px; color: #dc2626; margin-bottom: 20px;">
                                    <i class="fas fa-exclamation-triangle"></i>
                                </div>
                                <div class="form-title">Error</div>
                                <div class="form-subtitle" style="color: #dc2626; font-size: 18px;">
                                    ${message}
                                </div>
                            </div>
                            <div style="text-align: center; margin-top: 30px;">
                                <button id="retry-button" class="form-button" style="background: #1a2a3a; width: auto; padding: 10px 30px;">
                                    Retry
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                
                document.getElementById('retry-button')?.addEventListener('click', () => {
                    window.location.reload();
                });
            }
            
            showSignInPrompt() {
                const html = `
                    <div class="form-container">
                        <div class="form-box">
                            <div class="form-header">
                                <div style="font-size: 64px; color: #6b7280; margin-bottom: 20px;">
                                    <i class="fas fa-lock"></i>
                                </div>
                                <div class="form-title">Sign In Required</div>
                                <div class="form-subtitle">
                                    Please sign in to access the Mark Sheet Generator
                                </div>
                            </div>
                            <div style="text-align: center; margin-top: 30px;">
                                <button id="signin-button" class="form-button">
                                    Sign In with Google
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                
                document.getElementById('signin-button')?.addEventListener('click', () => {
                    this.signInWithGoogle();
                });
            }
            
            async signInWithGoogle() {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await this.auth.signInWithPopup(provider);
                } catch (error) {
                    console.error("Google sign-in error:", error);
                    this.showError("Failed to sign in with Google. Please try again.");
                }
            }
            
            renderSelectionForm() {
                const schoolName = this.stateManager.schoolData?.schoolName || "School";
                
                const html = `
                    <div class="form-container">
                        <div class="form-box">
                            <div class="form-header">
                                <div class="form-title">Mark Sheet Generator</div>
                                <div class="form-subtitle">
                                    ${schoolName} - Academic Year: ${this.stateManager.academicYearID}
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Select Class</label>
                                <select id="class-select" class="form-select">
                                    <option value="">-- Select Class --</option>
                                    ${this.stateManager.classes.map(cls => `
                                        <option value="${cls.id}">${cls.className}</option>
                                    `).join('')}
                                </select>
                                <div id="class-error" class="error-message"></div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Select Section</label>
                                <select id="section-select" class="form-select" disabled>
                                    <option value="">-- Select Class First --</option>
                                </select>
                                <div id="section-error" class="error-message"></div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Select Student</label>
                                <select id="enrollment-select" class="form-select" disabled>
                                    <option value="">-- Select Section First --</option>
                                </select>
                                <div id="enrollment-error" class="error-message"></div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Select Exam</label>
                                <select id="exam-select" class="form-select" disabled>
                                    <option value="">-- Select Section First --</option>
                                </select>
                                <div id="exam-error" class="error-message"></div>
                            </div>
                            
                            <button id="generate-button" class="form-button" disabled>
                                Generate Mark Sheet
                            </button>
                            
                            <div style="text-align: center; margin-top: 20px;">
                                <button id="logout-button" style="background: none; border: none; color: #666; cursor: pointer; font-size: 14px;">
                                    <i class="fas fa-sign-out-alt"></i> Sign Out
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                this.setupFormListeners();
            }
            
            setupFormListeners() {
                // Class select
                const classSelect = document.getElementById('class-select');
                const sectionSelect = document.getElementById('section-select');
                const enrollmentSelect = document.getElementById('enrollment-select');
                const examSelect = document.getElementById('exam-select');
                const generateButton = document.getElementById('generate-button');
                const logoutButton = document.getElementById('logout-button');
                
                classSelect.addEventListener('change', async (e) => {
                    const classId = e.target.value;
                    
                    if (!classId) {
                        this.stateManager.resetSelections();
                        sectionSelect.disabled = true;
                        enrollmentSelect.disabled = true;
                        examSelect.disabled = true;
                        generateButton.disabled = true;
                        
                        sectionSelect.innerHTML = '<option value="">-- Select Class First --</option>';
                        enrollmentSelect.innerHTML = '<option value="">-- Select Section First --</option>';
                        examSelect.innerHTML = '<option value="">-- Select Section First --</option>';
                        return;
                    }
                    
                    this.stateManager.selectedClassId = classId;
                    this.stateManager.selectedSectionId = null;
                    this.stateManager.selectedEnrollmentId = null;
                    this.stateManager.selectedExamId = null;
                    
                    sectionSelect.disabled = true;
                    enrollmentSelect.disabled = true;
                    examSelect.disabled = true;
                    generateButton.disabled = true;
                    
                    sectionSelect.innerHTML = '<option value="">Loading sections...</option>';
                    
                    try {
                        await this.loadSections(classId);
                        
                        sectionSelect.disabled = false;
                        sectionSelect.innerHTML = '<option value="">-- Select Section --</option>';
                        this.stateManager.sections.forEach(section => {
                            sectionSelect.innerHTML += `<option value="${section.id}">${section.sectionName}</option>`;
                        });
                        
                        enrollmentSelect.innerHTML = '<option value="">-- Select Section First --</option>';
                        examSelect.innerHTML = '<option value="">-- Select Section First --</option>';
                        
                    } catch (error) {
                        console.error("Error loading sections:", error);
                        sectionSelect.innerHTML = '<option value="">Error loading sections</option>';
                    }
                });
                
                // Section select
                sectionSelect.addEventListener('change', async (e) => {
                    const sectionId = e.target.value;
                    
                    if (!sectionId) {
                        this.stateManager.selectedSectionId = null;
                        this.stateManager.selectedEnrollmentId = null;
                        this.stateManager.selectedExamId = null;
                        
                        enrollmentSelect.disabled = true;
                        examSelect.disabled = true;
                        generateButton.disabled = true;
                        
                        enrollmentSelect.innerHTML = '<option value="">-- Select Section First --</option>';
                        examSelect.innerHTML = '<option value="">-- Select Section First --</option>';
                        return;
                    }
                    
                    this.stateManager.selectedSectionId = sectionId;
                    this.stateManager.selectedEnrollmentId = null;
                    this.stateManager.selectedExamId = null;
                    
                    enrollmentSelect.disabled = true;
                    examSelect.disabled = true;
                    generateButton.disabled = true;
                    
                    enrollmentSelect.innerHTML = '<option value="">Loading students...</option>';
                    examSelect.innerHTML = '<option value="">Loading exams...</option>';
                    
                    try {
                        // Load enrollments and exams in parallel
                        await Promise.all([
                            this.loadEnrollments(this.stateManager.selectedClassId, sectionId),
                            this.loadExams(this.stateManager.selectedClassId, sectionId)
                        ]);
                        
                        // Update enrollment select
                        enrollmentSelect.disabled = false;
                        enrollmentSelect.innerHTML = '<option value="">-- Select Student --</option>';
                        this.stateManager.enrollments.forEach(enrollment => {
                            enrollmentSelect.innerHTML += `<option value="${enrollment.id}">${enrollment.studentName}</option>`;
                        });
                        
                        // Update exam select
                        examSelect.disabled = false;
                        examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
                        this.stateManager.exams.forEach(exam => {
                            examSelect.innerHTML += `<option value="${exam.id}">${exam.examTitle}</option>`;
                        });
                        
                    } catch (error) {
                        console.error("Error loading data:", error);
                        enrollmentSelect.innerHTML = '<option value="">Error loading data</option>';
                        examSelect.innerHTML = '<option value="">Error loading data</option>';
                    }
                });
                
                // Enrollment select
                enrollmentSelect.addEventListener('change', (e) => {
                    this.stateManager.selectedEnrollmentId = e.target.value;
                    this.checkGenerateButton();
                });
                
                // Exam select
                examSelect.addEventListener('change', (e) => {
                    this.stateManager.selectedExamId = e.target.value;
                    this.checkGenerateButton();
                });
                
                // Generate button
                generateButton.addEventListener('click', async () => {
                    if (!this.stateManager.isGenerating) {
                        await this.loadMarkSheetData();
                    }
                });
                
                // Logout button
                logoutButton.addEventListener('click', async () => {
                    try {
                        await this.auth.signOut();
                    } catch (error) {
                        console.error("Logout error:", error);
                    }
                });
            }
            
            checkGenerateButton() {
                const generateButton = document.getElementById('generate-button');
                const isReady = this.stateManager.selectedClassId &&
                               this.stateManager.selectedSectionId &&
                               this.stateManager.selectedEnrollmentId &&
                               this.stateManager.selectedExamId;
                
                generateButton.disabled = !isReady;
            }
            
            renderMarkSheet() {
                const data = this.stateManager.markSheetData;
                
                const html = `
                    <div class="marksheet-container">
                        <div class="print-nav-bar">
                            <button class="print-button" onclick="window.print()">
                                <i class="fas fa-print"></i> Save PDF / Print
                            </button>
                            <button class="print-button" style="background: #555;" onclick="app.backToSelection()">
                                <i class="fas fa-arrow-left"></i> Back to Selection
                            </button>
                            <button class="print-button" style="background: #dc2626;" onclick="app.auth.signOut()">
                                <i class="fas fa-sign-out-alt"></i> Sign Out
                            </button>
                        </div>
                        
                        <div class="marksheet-document">
                            <div class="marksheet-content">
                                <div class="outer-border">
                                    <div class="inner-border">
                                        
                                        <!-- Boxed Header Section -->
                                        <div class="header-box">
                                            <!-- Left School Logo -->
                                            <img src="${data.school.logo || 'https://via.placeholder.com/85x85?text=LOGO'}" 
                                                 alt="School Logo" 
                                                 class="header-logo"
                                                 onerror="this.src='https://via.placeholder.com/85x85?text=LOGO'">
                                            
                                            <!-- Center Content -->
                                            <div class="header-content">
                                                <div class="inst-name">${data.school.name}</div>
                                                <div class="address-text">${data.school.address}</div>
                                                <div style="font-weight:bold; font-size:11pt; color: #555; margin-top: 3px;">
                                                    ${data.class.title || data.class.name}
                                                </div>
                                                <div>
                                                    <span class="grade-sheet-title-box">GRADE-SHEET</span>
                                                </div>
                                            </div>

                                            <!-- Right Student Photo -->
                                            <img src="${data.student.profileImage || 'https://via.placeholder.com/85x85?text=PHOTO'}" 
                                                 alt="Student Photo" 
                                                 class="header-logo"
                                                 onerror="this.src='https://via.placeholder.com/85x85?text=PHOTO'">
                                        </div>

                                        <!-- Student Details -->
                                        <div class="student-details">
                                            <div class="detail-row" style="grid-column: span 2;">
                                                <span class="label">THE GRADE SECURED BY :</span>
                                                <span class="value">${data.student.name}</span>
                                            </div>
                                            <div class="detail-row">
                                                <span class="label">DATE OF BIRTH :</span>
                                                <span class="value">${data.student.dateOfBirth}</span>
                                            </div>
                                            <div class="detail-row">
                                                <span class="label">DISTRICT :</span>
                                                <span class="value">${data.student.district}</span>
                                            </div>
                                            <div class="detail-row">
                                                <span class="label">ROLL NO :</span>
                                                <span class="value">${data.student.rollNo}</span>
                                            </div>
                                            <div class="detail-row">
                                                <span class="label">ACADEMIC YEAR :</span>
                                                <span class="value">${data.academicYear}</span>
                                            </div>
                                            
                                            <!-- Exam Title and Conducted Dates -->
                                            <div class="full-width-row">
                                                <span class="label">IN THE <strong style="color:black; font-size:10.5pt;">${data.exam.title}</strong> CONDUCTED FROM :</span>
                                                <span class="value" style="flex-grow: 0; width: 150px; margin-right: 10px;">${data.exam.startedAt}</span>
                                                <span class="label" style="margin-right: 10px;">TO :</span>
                                                <span class="value">${data.exam.endedAt}</span>
                                            </div>
                                        </div>

                                        <div class="table-container">
                                            <table class="marksheet-table">
                                                <thead>
                                                    <tr>
                                                        <th rowspan="2" width="4%">S.N.</th>
                                                        <th rowspan="2" width="22%">SUBJECTS</th>
                                                        <th rowspan="2" width="8%">CREDIT HOURS</th>
                                                        <th colspan="2" width="12%">OBTAINED MARKS</th>
                                                        <th rowspan="2" width="10%">FINAL MARKS</th>
                                                        <th colspan="2" width="12%">OBTAINED GRADE</th>
                                                        <th rowspan="2" width="10%">FINAL GRADE</th>
                                                        <th rowspan="2" width="10%">GRADE POINT</th>
                                                    </tr>
                                                    <tr>
                                                        <th>TH</th>
                                                        <th>PR</th>
                                                        <th>TH</th>
                                                        <th>PR</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    ${data.result.subjects.map((subject, index) => `
                                                        <tr>
                                                            <td>${index + 1}</td>
                                                            <td class="subject-col">${subject.subjectName}</td>
                                                            <td>${subject.creditHours}</td>
                                                            <td>${subject.theoryMarks || '-'}</td>
                                                            <td>${subject.practicalMarks || '-'}</td>
                                                            <td>${subject.finalMarks || '-'}</td>
                                                            <td>${subject.grade || '-'}</td>
                                                            <td>${subject.grade || '-'}</td>
                                                            <td>${subject.grade || '-'}</td>
                                                            <td>${subject.gradePoint || '0.00'}</td>
                                                        </tr>
                                                    `).join('')}
                                                    <tr class="summary-row">
                                                        <td colspan="3"></td>
                                                        <td colspan="3" style="text-align: right; padding-right: 15px;">
                                                            PERCENTAGE (%) = ${data.result.percentage.toFixed(2)}
                                                        </td>
                                                        <td colspan="4" style="text-align: right; padding-right: 20px;">
                                                            GRADE POINT AVERAGE (GPA): ${data.result.GPA.toFixed(2)}
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>

                                        <div class="footer">
                                            <div class="signature-box" style="text-align: left;">
                                                <div style="margin-bottom: 35px; text-transform: uppercase;">
                                                    DATE OF ISSUE: ${data.result.issuedDate}
                                                </div>
                                                <div>PREPARED BY: ${data.result.preparedBy}</div>
                                            </div>
                                            <div class="signature-box">
                                                <div class="sig-line"></div>
                                                <div style="text-transform: uppercase; font-weight: bold;">
                                                    ${data.school.principal}
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
            }
            
            backToSelection() {
                this.stateManager.isGenerating = false;
                this.renderSelectionForm();
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new MarkSheetApp();
        });
        
        // Make app available globally
        window.app = app;
    </script>
</body>
</html>
