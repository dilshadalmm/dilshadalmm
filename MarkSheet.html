    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBJ_G5o4otg7riemfJDMOcPoHoIVH7emsc",
            authDomain: "geobazarr.firebaseapp.com",
            databaseURL: "https://geobazarr-default-rtdb.firebaseio.com",
            projectId: "geobazarr",
            storageBucket: "geobazarr.firebasestorage.app",
            messagingSenderId: "679949247383",
            appId: "1:679949247383:web:036d4f32038422ebb89ad2"
        };

        // State Manager for MarkSheet App
        class StateManager {
            constructor() {
                this.schoolID = null;
                this.academicYearID = null;
                this.schoolData = null;
                this.classes = [];
                this.sections = [];
                this.enrollments = [];
                this.exams = [];
                this.students = {};
                this.results = {};
                this.subjects = {};
                
                this.selectedClassID = null;
                this.selectedSectionID = null;
                this.selectedEnrollmentID = null;
                this.selectedExamID = null;
                
                this.selectedStudentData = null;
                this.selectedResultData = null;
                this.selectedExamData = null;
                
                this.alerts = [];
            }
            
            // Extract schoolID and academicYearID from URL
            extractURLParameters() {
                const urlParams = new URLSearchParams(window.location.search);
                this.schoolID = urlParams.get('schoolID');
                this.academicYearID = urlParams.get('academicYearID');
                
                if (!this.schoolID || !this.academicYearID) {
                    console.error("Missing URL parameters. Required: schoolID and academicYearID");
                    return false;
                }
                
                console.log("Extracted URL parameters:", {
                    schoolID: this.schoolID,
                    academicYearID: this.academicYearID
                });
                
                return true;
            }
            
            // Get school path
            getSchoolPath() {
                return `schools/${this.schoolID}`;
            }
            
            // Get academic year path
            getAcademicYearPath() {
                return `${this.getSchoolPath()}/academicYears/${this.academicYearID}`;
            }
            
            // Get classes collection path
            getClassesPath() {
                return `${this.getSchoolPath()}/classes`;
            }
            
            // Get sections collection path
            getSectionsPath() {
                return `${this.getSchoolPath()}/sections`;
            }
            
            // Get enrollments collection path
            getEnrollmentsPath() {
                return `${this.getSchoolPath()}/enrollments`;
            }
            
            // Get exams collection path
            getExamsPath() {
                return `${this.getSchoolPath()}/exams`;
            }
            
            // Get students collection path
            getStudentsPath() {
                return `${this.getSchoolPath()}/students`;
            }
            
            // Get results collection path
            getResultsPath() {
                return `${this.getSchoolPath()}/results`;
            }
            
            // Get subjects collection path
            getSubjectsPath() {
                return `${this.getSchoolPath()}/subjects`;
            }
            
            // Add alert
            addAlert(type, message) {
                const id = Date.now();
                this.alerts.push({ id, type, message });
                setTimeout(() => {
                    this.removeAlert(id);
                }, 5000);
            }
            
            removeAlert(id) {
                this.alerts = this.alerts.filter(alert => alert.id !== id);
            }
            
            getAlerts() {
                return this.alerts;
            }
            
            // Clear selections
            clearSelections() {
                this.selectedClassID = null;
                this.selectedSectionID = null;
                this.selectedEnrollmentID = null;
                this.selectedExamID = null;
                this.selectedStudentData = null;
                this.selectedResultData = null;
                this.selectedExamData = null;
            }
        }

        // MarkSheet App
        class MarkSheetApp {
            constructor() {
                this.stateManager = new StateManager();
                this.db = null;
                this.auth = null;
                this.currentUser = null;
                this.isInitialized = false;
                
                this.appWrapper = document.getElementById('app-wrapper');
                this.chatContainer = document.getElementById('chat-container');
                this.topBar = document.querySelector('.top-bar');
                this.portalTitleButton = document.getElementById('portal-title-button');
                this.profileImageContainer = document.getElementById('profile-image-container');
                
                this.initialize();
            }
            
            initialize() {
                if (this.isInitialized) return;
                
                try {
                    this.showSkeletonLoading();
                    
                    // Extract URL parameters first
                    if (!this.stateManager.extractURLParameters()) {
                        this.hideSkeletonLoading();
                        this.showError("Missing required parameters. Please check the URL.");
                        return;
                    }
                    
                    firebase.initializeApp(firebaseConfig);
                    this.db = firebase.firestore();
                    this.auth = firebase.auth();
                    
                    this.db.settings({
                        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
                    });
                    
                    console.log("Firebase initialized successfully");
                    this.isInitialized = true;
                    
                    this.setupAuthListener();
                    
                } catch (error) {
                    console.error("Firebase initialization error:", error);
                    this.hideSkeletonLoading();
                    this.showError("Firebase initialization failed. Please refresh the page.");
                }
            }
            
            setupAuthListener() {
                this.auth.onAuthStateChanged(async (user) => {
                    console.log("Auth state changed:", user ? `User ${user.uid} logged in` : "No user");
                    
                    if (user) {
                        this.currentUser = user;
                        await this.checkAdminPermission();
                    } else {
                        this.currentUser = null;
                        this.hideSkeletonLoading();
                        this.showSignInPrompt();
                    }
                });
            }
            
            async checkAdminPermission() {
                try {
                    const user = this.currentUser;
                    if (!user) {
                        console.log("No user found");
                        return false;
                    }
                    
                    // Check if user has admin access to this school
                    const adminPath = `schools/${this.stateManager.schoolID}/admins/${user.uid}`;
                    const adminDoc = await this.db.doc(adminPath).get();
                    
                    if (!adminDoc.exists) {
                        console.log("Admin document does not exist for user:", user.uid);
                        this.showError("You don't have admin permissions for this school.");
                        await this.auth.signOut();
                        return false;
                    }
                    
                    const adminData = adminDoc.data();
                    if (!adminData.approved) {
                        console.log("Admin not approved for user:", user.uid);
                        this.showError("Your admin account is not approved yet.");
                        await this.auth.signOut();
                        return false;
                    }
                    
                    console.log("Admin permission verified successfully");
                    
                    // Load school data
                    await this.loadSchoolData();
                    
                    this.renderSelectionForm();
                    this.updateTopBar();
                    this.hideSkeletonLoading();
                    return true;
                    
                } catch (error) {
                    console.error("Error checking admin permission:", error);
                    this.showError("Failed to verify admin permissions. Please try again.");
                    return false;
                }
            }
            
            async loadSchoolData() {
                try {
                    const schoolPath = this.stateManager.getSchoolPath();
                    const schoolDoc = await this.db.doc(schoolPath).get();
                    
                    if (!schoolDoc.exists) {
                        throw new Error("School not found");
                    }
                    
                    this.stateManager.schoolData = schoolDoc.data();
                    console.log("School data loaded:", this.stateManager.schoolData);
                    
                } catch (error) {
                    console.error("Error loading school data:", error);
                    throw error;
                }
            }
            
            async loadClasses() {
                try {
                    const classesPath = this.stateManager.getClassesPath();
                    const classesSnapshot = await this.db.collection(classesPath)
                        .where("academicYear", "==", this.stateManager.academicYearID)
                        .get();
                    
                    const classes = [];
                    classesSnapshot.forEach(doc => {
                        classes.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    this.stateManager.classes = classes;
                    console.log(`Loaded ${classes.length} classes`);
                    return classes;
                    
                } catch (error) {
                    console.error("Error loading classes:", error);
                    throw error;
                }
            }
            
            async loadSections(classID) {
                try {
                    const sectionsPath = this.stateManager.getSectionsPath();
                    const sectionsSnapshot = await this.db.collection(sectionsPath)
                        .where("classID", "==", classID)
                        .where("academicYear", "==", this.stateManager.academicYearID)
                        .get();
                    
                    const sections = [];
                    sectionsSnapshot.forEach(doc => {
                        sections.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    this.stateManager.sections = sections;
                    console.log(`Loaded ${sections.length} sections for class ${classID}`);
                    return sections;
                    
                } catch (error) {
                    console.error("Error loading sections:", error);
                    throw error;
                }
            }
            
            async loadEnrollments(classID, sectionID) {
                try {
                    const enrollmentsPath = this.stateManager.getEnrollmentsPath();
                    const enrollmentsSnapshot = await this.db.collection(enrollmentsPath)
                        .where("academicYear", "==", this.stateManager.academicYearID)
                        .where("classID", "==", classID)
                        .where("sectionID", "==", sectionID)
                        .get();
                    
                    const enrollments = [];
                    enrollmentsSnapshot.forEach(doc => {
                        enrollments.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    this.stateManager.enrollments = enrollments;
                    console.log(`Loaded ${enrollments.length} enrollments`);
                    return enrollments;
                    
                } catch (error) {
                    console.error("Error loading enrollments:", error);
                    throw error;
                }
            }
            
            async loadExams(classID, sectionID) {
                try {
                    const examsPath = this.stateManager.getExamsPath();
                    const examsSnapshot = await this.db.collection(examsPath)
                        .where("academicYear", "==", this.stateManager.academicYearID)
                        .where("classID", "==", classID)
                        .where("sectionID", "==", sectionID)
                        .get();
                    
                    const exams = [];
                    examsSnapshot.forEach(doc => {
                        exams.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    this.stateManager.exams = exams;
                    console.log(`Loaded ${exams.length} exams`);
                    return exams;
                    
                } catch (error) {
                    console.error("Error loading exams:", error);
                    throw error;
                }
            }
            
            async loadStudentData(studentID) {
                try {
                    if (this.stateManager.students[studentID]) {
                        return this.stateManager.students[studentID];
                    }
                    
                    const studentPath = `${this.stateManager.getStudentsPath()}/${studentID}`;
                    const studentDoc = await this.db.doc(studentPath).get();
                    
                    if (!studentDoc.exists) {
                        throw new Error("Student not found");
                    }
                    
                    const studentData = {
                        id: studentID,
                        ...studentDoc.data()
                    };
                    
                    this.stateManager.students[studentID] = studentData;
                    console.log("Student data loaded:", studentData);
                    return studentData;
                    
                } catch (error) {
                    console.error("Error loading student data:", error);
                    throw error;
                }
            }
            
            async loadResultData(enrollmentID, examID) {
                try {
                    const resultsPath = this.stateManager.getResultsPath();
                    const resultsSnapshot = await this.db.collection(resultsPath)
                        .where("enrollmentID", "==", enrollmentID)
                        .where("examID", "==", examID)
                        .get();
                    
                    if (resultsSnapshot.empty) {
                        throw new Error("Result not found for this student and exam");
                    }
                    
                    // Get the first result (should be only one)
                    const resultDoc = resultsSnapshot.docs[0];
                    const resultData = {
                        id: resultDoc.id,
                        ...resultDoc.data()
                    };
                    
                    // Load subject details for each subject in result
                    if (resultData.subjects && Array.isArray(resultData.subjects)) {
                        for (let subject of resultData.subjects) {
                            if (subject.subjectID) {
                                await this.loadSubjectData(subject.subjectID);
                            }
                        }
                    }
                    
                    this.stateManager.selectedResultData = resultData;
                    console.log("Result data loaded:", resultData);
                    return resultData;
                    
                } catch (error) {
                    console.error("Error loading result data:", error);
                    throw error;
                }
            }
            
            async loadSubjectData(subjectID) {
                try {
                    if (this.stateManager.subjects[subjectID]) {
                        return this.stateManager.subjects[subjectID];
                    }
                    
                    const subjectPath = `${this.stateManager.getSubjectsPath()}/${subjectID}`;
                    const subjectDoc = await this.db.doc(subjectPath).get();
                    
                    if (!subjectDoc.exists) {
                        console.warn(`Subject ${subjectID} not found`);
                        return null;
                    }
                    
                    const subjectData = {
                        id: subjectID,
                        ...subjectDoc.data()
                    };
                    
                    this.stateManager.subjects[subjectID] = subjectData;
                    return subjectData;
                    
                } catch (error) {
                    console.error("Error loading subject data:", error);
                    return null;
                }
            }
            
            async loadExamData(examID) {
                try {
                    const examPath = `${this.stateManager.getExamsPath()}/${examID}`;
                    const examDoc = await this.db.doc(examPath).get();
                    
                    if (!examDoc.exists) {
                        throw new Error("Exam not found");
                    }
                    
                    const examData = {
                        id: examID,
                        ...examDoc.data()
                    };
                    
                    this.stateManager.selectedExamData = examData;
                    console.log("Exam data loaded:", examData);
                    return examData;
                    
                } catch (error) {
                    console.error("Error loading exam data:", error);
                    throw error;
                }
            }
            
            // Show skeleton loading screen
            showSkeletonLoading() {
                this.topBar.classList.remove('hidden');
                
                const skeletonHtml = `
                    <div class="skeleton-container">
                        <!-- Selection Form skeleton -->
                        <div class="skeleton-section skeleton-shimmer">
                            <div class="skeleton-header">
                                <div class="skeleton-title-box"></div>
                            </div>
                            
                            <div class="skeleton-form"></div>
                        </div>
                    </div>
                `;
                
                this.chatContainer.innerHTML = skeletonHtml;
                this.chatContainer.scrollTop = 0;
                
                this.chatContainer.style.overflowY = 'hidden';
            }
            
            // Hide skeleton loading
            hideSkeletonLoading() {
                this.chatContainer.style.overflowY = 'auto';
            }
            
            updateTopBar() {
                this.topBar.classList.remove('hidden');
            }
            
            showError(message) {
                console.error(message);
                
                this.topBar.classList.add('hidden');
                
                const html = `
                    <div class="error-container">
                        <div class="error-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="error-title">Error</div>
                        <div class="error-message">
                            ${message}
                        </div>
                        <button id="retry-button" class="signin-button" style="background: #3b82f6;">
                            Retry
                        </button>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                this.chatContainer.scrollTop = 0;
                
                document.getElementById('retry-button')?.addEventListener('click', () => {
                    window.location.reload();
                });
            }
            
            showSignInPrompt() {
                this.topBar.classList.add('hidden');
                
                const html = `
                    <div class="signin-prompt-container">
                        <div class="signin-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="signin-title">Sign In to MarkSheet System</div>
                        <div class="signin-message">
                            You need administrator privileges to access the mark sheet system. Please sign in with your admin credentials.
                        </div>
                        <button id="sign-in-prompt-button" class="signin-button">
                            Sign In to Continue
                        </button>
                    </div>
                `;
                
                this.chatContainer.innerHTML = html;
                this.chatContainer.scrollTop = 0;
                
                document.getElementById('sign-in-prompt-button')?.addEventListener('click', () => {
                    this.showAuthModal();
                });
            }
            
            showAuthModal() {
                const authModal = document.createElement('div');
                authModal.className = 'auth-modal-overlay';
                authModal.innerHTML = `
                    <div class="auth-modal">
                        <div class="auth-header">
                            <div class="auth-title">Sign In to MarkSheet System</div>
                        </div>
                        <div class="auth-body">
                            <div class="auth-field">
                                <label class="auth-label">Enter Email</label>
                                <input type="email" id="auth-email" class="auth-input" placeholder="admin@example.com">
                                <div id="email-error" class="auth-error"></div>
                            </div>
                            
                            <div class="auth-field">
                                <label class="auth-label">Enter Password</label>
                                <input type="password" id="auth-password" class="auth-input" placeholder="••••••••">
                                <div id="password-error" class="auth-error"></div>
                            </div>
                            
                            <button id="sign-in-button" class="auth-button">Sign In</button>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(authModal);
                this.setupAuthModalEvents(authModal);
            }
            
            setupAuthModalEvents(authModal) {
                const signInButton = document.getElementById('sign-in-button');
                const emailInput = document.getElementById('auth-email');
                const passwordInput = document.getElementById('auth-password');
                
                signInButton.addEventListener('click', async () => {
                    await this.signInWithEmail(emailInput, passwordInput, authModal);
                });
                
                emailInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        passwordInput.focus();
                    }
                });
                
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.signInWithEmail(emailInput, passwordInput, authModal);
                    }
                });
                
                authModal.addEventListener('click', (e) => {
                    if (e.target === authModal) {
                        authModal.remove();
                    }
                });
            }
            
            async signInWithEmail(emailInput, passwordInput, authModal) {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const signInButton = document.getElementById('sign-in-button');
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.textContent = '';
                emailError.classList.remove('show');
                passwordError.textContent = '';
                passwordError.classList.remove('show');
                
                if (!email) {
                    emailError.textContent = 'Please enter your email';
                    emailError.classList.add('show');
                    return;
                }
                
                if (!password) {
                    passwordError.textContent = 'Please enter your password';
                    passwordError.classList.add('show');
                    return;
                }
                
                signInButton.textContent = 'Signing In...';
                signInButton.classList.add('loading');
                
                try {
                    await this.auth.signInWithEmailAndPassword(email, password);
                    authModal.remove();
                    
                } catch (error) {
                    console.error("Sign in error:", error);
                    
                    signInButton.textContent = 'Sign In';
                    signInButton.classList.remove('loading');
                    
                    switch (error.code) {
                        case 'auth/invalid-email':
                            emailError.textContent = 'Invalid email address';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-disabled':
                            emailError.textContent = 'This account has been disabled';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-not-found':
                            emailError.textContent = 'No account found with this email';
                            emailError.classList.add('show');
                            break;
                        case 'auth/wrong-password':
                            passwordError.textContent = 'Incorrect password';
                            passwordError.classList.add('show');
                            break;
                        case 'auth/too-many-requests':
                            passwordError.textContent = 'Too many failed attempts. Try again later';
                            passwordError.classList.add('show');
                            break;
                        default:
                            passwordError.textContent = 'Failed to sign in. Please try again';
                            passwordError.classList.add('show');
                    }
                }
            }
            
            renderSelectionForm() {
                let selectionHtml = '<div class="portal-container">';
                
                // Display alerts
                const alerts = this.stateManager.getAlerts();
                if (alerts.length > 0) {
                    alerts.forEach(alert => {
                        selectionHtml += `
                            <div class="alert alert-${alert.type}">
                                ${alert.message}
                            </div>
                        `;
                    });
                }
                
                selectionHtml += `
                    <div class="portal-section">
                        <div class="section-type-header-inline">
                            <div class="header-bg">
                                <div class="connector-line">
                                    <div class="dot"></div>
                                    <div class="dot"></div>
                                </div>
                                <div class="title-box">
                                    MARK SHEET SELECTION
                                </div>
                            </div>
                        </div>
                        
                        <div class="section-header">
                            <h1 class="text-2xl font-bold text-gray-900">Generate Mark Sheet</h1>
                            <p class="text-gray-600">Select student and exam to generate mark sheet</p>
                        </div>
                        
                        <div class="selection-form">
                            <!-- School Info -->
                            <div class="form-group mb-6 p-4 bg-gray-50 border border-gray-200">
                                <h3 class="font-bold text-lg text-gray-800 mb-2">School Information</h3>
                                <p><strong>School:</strong> ${this.stateManager.schoolData?.schoolName || 'Not loaded'}</p>
                                <p><strong>Academic Year:</strong> ${this.stateManager.academicYearID}</p>
                            </div>
                            
                            <!-- Class Selection -->
                            <div class="form-group">
                                <label class="form-label">Select Class</label>
                                <select id="class-select" class="form-select">
                                    <option value="">-- Select Class --</option>
                                </select>
                            </div>
                            
                            <!-- Section Selection -->
                            <div class="form-group">
                                <label class="form-label">Select Section</label>
                                <select id="section-select" class="form-select" disabled>
                                    <option value="">-- Select Section --</option>
                                </select>
                            </div>
                            
                            <!-- Student Selection -->
                            <div class="form-group">
                                <label class="form-label">Select Student</label>
                                <select id="student-select" class="form-select" disabled>
                                    <option value="">-- Select Student --</option>
                                </select>
                            </div>
                            
                            <!-- Exam Selection -->
                            <div class="form-group">
                                <label class="form-label">Select Exam</label>
                                <select id="exam-select" class="form-select" disabled>
                                    <option value="">-- Select Exam --</option>
                                </select>
                            </div>
                            
                            <button id="generate-marksheet-button" class="form-button" disabled>
                                Generate Mark Sheet
                            </button>
                            
                            <div class="mt-6">
                                <button id="logout-button" class="form-button" style="background: #ef4444;">
                                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                selectionHtml += '</div>';
                
                this.chatContainer.innerHTML = selectionHtml;
                this.updateTopBar();
                
                // Load classes and populate dropdown
                this.populateClassDropdown();
                
                // Setup event listeners
                this.setupSelectionFormListeners();
            }
            
            async populateClassDropdown() {
                try {
                    const classSelect = document.getElementById('class-select');
                    classSelect.innerHTML = '<option value="">-- Select Class --</option>';
                    
                    const classes = await this.loadClasses();
                    
                    classes.forEach(classItem => {
                        const option = document.createElement('option');
                        option.value = classItem.id;
                        option.textContent = classItem.className || `Class ${classItem.id}`;
                        classSelect.appendChild(option);
                    });
                    
                } catch (error) {
                    console.error("Error populating class dropdown:", error);
                    this.stateManager.addAlert('error', 'Failed to load classes');
                }
            }
            
            async populateSectionDropdown(classID) {
                try {
                    const sectionSelect = document.getElementById('section-select');
                    sectionSelect.innerHTML = '<option value="">-- Select Section --</option>';
                    sectionSelect.disabled = true;
                    
                    const studentSelect = document.getElementById('student-select');
                    studentSelect.innerHTML = '<option value="">-- Select Student --</option>';
                    studentSelect.disabled = true;
                    
                    const examSelect = document.getElementById('exam-select');
                    examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
                    examSelect.disabled = true;
                    
                    const generateButton = document.getElementById('generate-marksheet-button');
                    generateButton.disabled = true;
                    
                    const sections = await this.loadSections(classID);
                    
                    sections.forEach(section => {
                        const option = document.createElement('option');
                        option.value = section.id;
                        option.textContent = section.sectionName || `Section ${section.id}`;
                        sectionSelect.appendChild(option);
                    });
                    
                    sectionSelect.disabled = false;
                    
                } catch (error) {
                    console.error("Error populating section dropdown:", error);
                    this.stateManager.addAlert('error', 'Failed to load sections');
                }
            }
            
            async populateStudentDropdown(classID, sectionID) {
                try {
                    const studentSelect = document.getElementById('student-select');
                    studentSelect.innerHTML = '<option value="">-- Select Student --</option>';
                    studentSelect.disabled = true;
                    
                    const examSelect = document.getElementById('exam-select');
                    examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
                    examSelect.disabled = true;
                    
                    const generateButton = document.getElementById('generate-marksheet-button');
                    generateButton.disabled = true;
                    
                    const enrollments = await this.loadEnrollments(classID, sectionID);
                    
                    for (let enrollment of enrollments) {
                        // Load student data for each enrollment
                        try {
                            const studentData = await this.loadStudentData(enrollment.studentID);
                            const option = document.createElement('option');
                            option.value = enrollment.id;
                            option.textContent = studentData.studentName || `Student ${enrollment.studentID}`;
                            option.dataset.studentId = enrollment.studentID;
                            studentSelect.appendChild(option);
                        } catch (error) {
                            console.error(`Error loading student ${enrollment.studentID}:`, error);
                        }
                    }
                    
                    studentSelect.disabled = false;
                    
                } catch (error) {
                    console.error("Error populating student dropdown:", error);
                    this.stateManager.addAlert('error', 'Failed to load students');
                }
            }
            
            async populateExamDropdown(classID, sectionID) {
                try {
                    const examSelect = document.getElementById('exam-select');
                    examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
                    examSelect.disabled = true;
                    
                    const generateButton = document.getElementById('generate-marksheet-button');
                    generateButton.disabled = true;
                    
                    const exams = await this.loadExams(classID, sectionID);
                    
                    exams.forEach(exam => {
                        const option = document.createElement('option');
                        option.value = exam.id;
                        option.textContent = exam.examTitle || `Exam ${exam.id}`;
                        examSelect.appendChild(option);
                    });
                    
                    examSelect.disabled = false;
                    
                } catch (error) {
                    console.error("Error populating exam dropdown:", error);
                    this.stateManager.addAlert('error', 'Failed to load exams');
                }
            }
            
            setupSelectionFormListeners() {
                // Class selection change
                const classSelect = document.getElementById('class-select');
                classSelect.addEventListener('change', async (e) => {
                    const classID = e.target.value;
                    this.stateManager.selectedClassID = classID;
                    this.stateManager.clearSelections();
                    
                    if (classID) {
                        await this.populateSectionDropdown(classID);
                    } else {
                        // Reset all dependent dropdowns
                        const sectionSelect = document.getElementById('section-select');
                        sectionSelect.innerHTML = '<option value="">-- Select Section --</option>';
                        sectionSelect.disabled = true;
                        
                        const studentSelect = document.getElementById('student-select');
                        studentSelect.innerHTML = '<option value="">-- Select Student --</option>';
                        studentSelect.disabled = true;
                        
                        const examSelect = document.getElementById('exam-select');
                        examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
                        examSelect.disabled = true;
                        
                        const generateButton = document.getElementById('generate-marksheet-button');
                        generateButton.disabled = true;
                    }
                });
                
                // Section selection change
                const sectionSelect = document.getElementById('section-select');
                sectionSelect.addEventListener('change', async (e) => {
                    const sectionID = e.target.value;
                    this.stateManager.selectedSectionID = sectionID;
                    this.stateManager.selectedEnrollmentID = null;
                    this.stateManager.selectedExamID = null;
                    
                    if (sectionID && this.stateManager.selectedClassID) {
                        await this.populateStudentDropdown(this.stateManager.selectedClassID, sectionID);
                        await this.populateExamDropdown(this.stateManager.selectedClassID, sectionID);
                    } else {
                        // Reset student and exam dropdowns
                        const studentSelect = document.getElementById('student-select');
                        studentSelect.innerHTML = '<option value="">-- Select Student --</option>';
                        studentSelect.disabled = true;
                        
                        const examSelect = document.getElementById('exam-select');
                        examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
                        examSelect.disabled = true;
                        
                        const generateButton = document.getElementById('generate-marksheet-button');
                        generateButton.disabled = true;
                    }
                });
                
                // Student selection change
                const studentSelect = document.getElementById('student-select');
                studentSelect.addEventListener('change', (e) => {
                    this.stateManager.selectedEnrollmentID = e.target.value;
                    this.checkGenerateButton();
                });
                
                // Exam selection change
                const examSelect = document.getElementById('exam-select');
                examSelect.addEventListener('change', (e) => {
                    this.stateManager.selectedExamID = e.target.value;
                    this.checkGenerateButton();
                });
                
                // Generate mark sheet button
                const generateButton = document.getElementById('generate-marksheet-button');
                generateButton.addEventListener('click', async () => {
                    await this.generateMarkSheet();
                });
                
                // Logout button
                const logoutButton = document.getElementById('logout-button');
                if (logoutButton) {
                    logoutButton.addEventListener('click', async () => {
                        try {
                            await this.auth.signOut();
                        } catch (error) {
                            console.error("Logout error:", error);
                        }
                    });
                }
            }
            
            checkGenerateButton() {
                const generateButton = document.getElementById('generate-marksheet-button');
                generateButton.disabled = !(this.stateManager.selectedEnrollmentID && this.stateManager.selectedExamID);
            }
            
            async generateMarkSheet() {
                try {
                    this.showSkeletonLoading();
                    
                    // Get selected enrollment
                    const enrollmentID = this.stateManager.selectedEnrollmentID;
                    const examID = this.stateManager.selectedExamID;
                    
                    if (!enrollmentID || !examID) {
                        throw new Error("Please select both student and exam");
                    }
                    
                    // Find enrollment data
                    const enrollment = this.stateManager.enrollments.find(e => e.id === enrollmentID);
                    if (!enrollment) {
                        throw new Error("Enrollment not found");
                    }
                    
                    // Load student data
                    const studentData = await this.loadStudentData(enrollment.studentID);
                    this.stateManager.selectedStudentData = studentData;
                    
                    // Load exam data
                    await this.loadExamData(examID);
                    
                    // Load result data
                    await this.loadResultData(enrollmentID, examID);
                    
                    // Render mark sheet
                    this.renderMarkSheet();
                    this.hideSkeletonLoading();
                    
                } catch (error) {
                    console.error("Error generating mark sheet:", error);
                    this.hideSkeletonLoading();
                    this.stateManager.addAlert('error', error.message || 'Failed to generate mark sheet');
                }
            }
            
            renderMarkSheet() {
                const schoolData = this.stateManager.schoolData;
                const studentData = this.stateManager.selectedStudentData;
                const resultData = this.stateManager.selectedResultData;
                const examData = this.stateManager.selectedExamData;
                
                if (!schoolData || !studentData || !resultData || !examData) {
                    this.stateManager.addAlert('error', 'Missing required data to display mark sheet');
                    return;
                }
                
                // Format date
                const formatDate = (timestamp) => {
                    if (!timestamp) return '';
                    if (timestamp.toDate) {
                        return timestamp.toDate().toLocaleDateString();
                    }
                    return timestamp;
                };
                
                // Format exam dates
                const startedAt = formatDate(examData.startedAt);
                const endedAt = formatDate(examData.endedAt);
                const issuedDate = formatDate(resultData.issuedDate);
                
                let marksheetHtml = `
                    <div class="marksheet-container">
                        <div class="marksheet-nav-bar">
                            <button class="marksheet-button" onclick="window.print()">
                                <i class="fas fa-print mr-2"></i> Save PDF / Print
                            </button>
                            <button class="marksheet-button" style="background:#555" onclick="app.goBackToSelection()">
                                <i class="fas fa-arrow-left mr-2"></i> Back to Selection
                            </button>
                        </div>
                        
                        <div class="marksheet-body">
                            <div class="document-viewport">
                                <div class="scaling-wrapper">
                                    <div class="page">
                                        <div class="outer-border">
                                            <div class="inner-border">
                                                
                                                <!-- Boxed Header Section -->
                                                <div class="header-box">
                                                    <!-- Left School Logo -->
                                                    <img src="${schoolData.schoolLogo || 'https://i.postimg.cc/KcVvrkz3/Concept_20251225_020546_0000.png'}" 
                                                         alt="School Logo" 
                                                         class="header-logo"
                                                         onerror="this.src='https://i.postimg.cc/KcVvrkz3/Concept_20251225_020546_0000.png'">
                                                    
                                                    <!-- Center Content -->
                                                    <div class="header-content">
                                                        <div class="inst-name">${schoolData.schoolName || 'DILSHAD INSTITUTE OF SCIENCE'}</div>
                                                        <div class="address-text">${schoolData.schoolAddress || 'BIRGUNJ -04- PARSA NEPAL'}</div>
                                                        <div style="font-weight:bold; font-size:11pt; color: #555; margin-top: 3px;">${examData.classTitle || 'GRADE 10'}</div>
                                                        <div>
                                                            <span class="grade-sheet-title-box">GRADE-SHEET</span>
                                                        </div>
                                                    </div>

                                                    <!-- Right Student Photo -->
                                                    <img src="${studentData.studentProfile || 'https://i.postimg.cc/8cB6w9Zv/Concept_20260111_031429_0000.png'}" 
                                                         alt="Student Photo" 
                                                         class="header-logo"
                                                         onerror="this.src='https://i.postimg.cc/8cB6w9Zv/Concept_20260111_031429_0000.png'">
                                                </div>

                                                <!-- Student Details -->
                                                <div class="student-details">
                                                    <div class="detail-row" style="grid-column: span 2;">
                                                        <span class="label">THE GRADE SECURED BY :</span>
                                                        <span class="value">${studentData.studentName || 'N/A'}</span>
                                                    </div>
                                                    <div class="detail-row">
                                                        <span class="label">DATE OF BIRTH :</span>
                                                        <span class="value">${formatDate(studentData.dateOfBirth)}</span>
                                                    </div>
                                                    <div class="detail-row">
                                                        <span class="label">DISTRICT :</span>
                                                        <span class="value">${studentData.district || 'N/A'}</span>
                                                    </div>
                                                    <div class="detail-row">
                                                        <span class="label">SYMBOL NO :</span>
                                                        <span class="value">${studentData.rollNo || 'N/A'}</span>
                                                    </div>
                                                    <div class="detail-row">
                                                        <span class="label">ACADEMIC YEAR :</span>
                                                        <span class="value">${examData.academicYear || this.stateManager.academicYearID}</span>
                                                    </div>
                                                    
                                                    <!-- BOLD Exam Title and Conducted Dates -->
                                                    <div class="full-width-row">
                                                        <span class="label">IN THE <strong style="color:black; font-size:10.5pt;">${examData.examTitle || 'EXAMINATION'}</strong> CONDUCTED FROM :</span>
                                                        <span class="value" style="flex-grow: 0; width: 150px; margin-right: 10px;">${startedAt || '.....................'}</span>
                                                        <span class="label" style="margin-right: 10px;">TO :</span>
                                                        <span class="value">${endedAt || '.....................'}</span>
                                                    </div>
                                                </div>

                                                <div class="table-container">
                                                    <table>
                                                        <thead>
                                                            <tr>
                                                                <th rowspan="2" width="4%">S.N.</th>
                                                                <th rowspan="2" width="22%">SUBJECTS</th>
                                                                <th rowspan="2" width="8%">CREDIT HOURS</th>
                                                                <th colspan="2" width="12%">OBTAINED MARKS</th>
                                                                <th rowspan="2" width="10%">FINAL MARKS</th>
                                                                <th colspan="2" width="12%">OBTAINED GRADE</th>
                                                                <th rowspan="2" width="10%">FINAL GRADE</th>
                                                                <th rowspan="2" width="10%">GRADE POINT</th>
                                                            </tr>
                                                            <tr>
                                                                <th>TH</th>
                                                                <th>PR</th>
                                                                <th>TH</th>
                                                                <th>PR</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                `;
                
                // Add subject rows
                if (resultData.subjects && Array.isArray(resultData.subjects)) {
                    resultData.subjects.forEach((subject, index) => {
                        const subjectInfo = this.stateManager.subjects[subject.subjectID] || {};
                        const creditHours = subjectInfo.creditHours || 0;
                        
                        marksheetHtml += `
                            <tr>
                                <td>${index + 1}</td>
                                <td class="subject-col">${subjectInfo.subjectName || `Subject ${index + 1}`}</td>
                                <td>${creditHours.toFixed(1)}</td>
                                <td>${subject.theoryMarks || 0}</td>
                                <td>${subject.practicalMarks || 0}</td>
                                <td>${subject.finalMarks || 0}</td>
                                <td>${subject.theoryGrade || '-'}</td>
                                <td>${subject.practicalGrade || '-'}</td>
                                <td>${subject.grade || '-'}</td>
                                <td>${subject.gradePoint ? subject.gradePoint.toFixed(2) : '0.00'}</td>
                            </tr>
                        `;
                    });
                }
                
                // Add summary row
                marksheetHtml += `
                            <tr class="summary-row">
                                <td colspan="3"></td>
                                <td colspan="3" style="text-align: right; padding-right: 15px;">PERCENTAGE (%) = ${resultData.percentage ? resultData.percentage.toFixed(2) : '0.00'}</td>
                                <td colspan="4" style="text-align: right; padding-right: 20px;">GRADE POINT AVERAGE (GPA): ${resultData.GPA ? resultData.GPA.toFixed(2) : '0.00'}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="footer">
                    <div class="signature-box" style="text-align: left;">
                        <div style="margin-bottom: 35px; text-transform: uppercase;">DATE OF ISSUE: ${issuedDate || '.....................'}</div>
                        <div>PREPARED BY: ${resultData.preparedBy || '........................'}</div>
                    </div>
                    <div class="signature-box">
                        <div class="sig-line"></div>
                        <div style="text-transform: uppercase; font-weight: bold;">${schoolData.schoolPrinciple || 'SCHOOL PRINCIPAL'}</div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</div>
</div>
</div>
                `;
                
                this.chatContainer.innerHTML = marksheetHtml;
            }
            
            goBackToSelection() {
                this.renderSelectionForm();
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new MarkSheetApp();
        });
        
        // Make app available globally for debugging
        window.app = app;
    </script>
</body>
</html>
