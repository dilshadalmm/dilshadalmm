<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimum-scale=1.0">
    <title>Marks Entry Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        body {
            font-family: 'Oswald', sans-serif;
            background-color: #f0f2f5;
            letter-spacing: 0.01em;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .table-container {
            background: #ffffff;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            height: 306px;
            overflow-y: auto;
            overflow-x: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 11px;
            text-transform: uppercase;
            table-layout: auto;
        }

        th {
            background-color: #1a2a3a;
            color: white;
            padding: 8px 12px;
            text-align: center;
            font-weight: 500;
            white-space: nowrap;
            border: 0.5px solid #2c3e50;
            position: sticky;
            z-index: 30;
        }

        thead tr:first-child th { top: 0; }
        thead tr:last-child th { top: 33px; }

        thead tr:first-child th:first-child {
            left: 0;
            z-index: 40;
        }

        tbody td:first-child {
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: inherit;
            border-right: 1px solid #cbd5e1;
        }

        td {
            border: 0.5px solid #e2e8f0;
            padding: 0 8px;
            white-space: nowrap;
            height: 40px;
        }

        tbody tr:nth-child(even) { background-color: #f8fafc; }
        tbody tr:nth-child(odd) { background-color: #ffffff; }
        tr:hover { background-color: #f1f5f9 !important; }

        .table-input {
            background: transparent;
            border: 1px solid transparent;
            padding: 4px;
            font-weight: 600;
            color: #334155;
            outline: none;
            border-radius: 2px;
            text-align: inherit;
            pointer-events: none;
            font-family: 'Oswald', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            width: 100%;
        }

        tr.editing .editable {
            background: white;
            border-color: #3b82f6;
            pointer-events: auto;
        }

        .header-field {
            border: none;
            border-bottom: 1px solid #94a3b8;
            background: transparent;
            font-weight: 600;
            font-size: 12px;
            padding: 0 4px;
            outline: none;
            text-transform: uppercase;
            color: #1e293b;
            font-family: 'Oswald', sans-serif;
        }

        .action-btn {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
            font-family: 'Oswald', sans-serif;
            border: none;
            cursor: pointer;
        }

        .name-cell-input { min-width: 150px; }
        .subject-cell-input { min-width: 160px; }

        /* Notification */
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #10b981;
            color: white;
            padding: 16px 24px;
            border-radius: 4px;
            font-weight: 600;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .notification.show {
            display: block;
            animation: fadeInOut 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }

        /* Loading and Auth Modal styles */
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .auth-modal {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .auth-header {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .auth-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
        }
        
        .auth-body {
            padding: 20px;
        }
        
        .auth-field {
            margin-bottom: 16px;
        }
        
        .auth-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }
        
        .auth-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            font-family: 'Oswald', sans-serif;
            border-radius: 4px;
        }
        
        .auth-input:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .auth-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        
        .auth-error.show {
            display: block;
        }
        
        .auth-button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            font-family: 'Oswald', sans-serif;
            border-radius: 4px;
        }
        
        .auth-button:hover {
            background: #2563eb;
        }
        
        .auth-button:active {
            background: #1d4ed8;
        }
        
        .auth-button.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Skeleton Loading */
        .skeleton-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }
        
        .skeleton-loading {
            text-align: center;
        }
        
        .skeleton-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        .skeleton-text {
            background: #e5e7eb;
            height: 20px;
            width: 200px;
            margin: 0.5rem auto;
            border-radius: 4px;
        }

        /* Error container */
        .error-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            background: white;
        }
        
        .error-icon {
            font-size: 64px;
            color: #ef4444;
            margin-bottom: 24px;
            opacity: 0.7;
        }
        
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
        }
        
        .error-message {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 32px;
            max-width: 400px;
            line-height: 1.5;
        }

        /* Main container */
        .main-container {
            width: 98%;
            margin: 0 auto;
            padding: 8px 4px;
        }

        /* Hide scrollbar */
        .table-container::-webkit-scrollbar {
            display: none;
        }
        
        .table-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .table-container { border: none; height: auto; overflow: visible; }
            th { background-color: #000 !important; color: white !important; border: 1px solid #333; position: static; }
            td { border: 1px solid #ccc; position: static !important; }
        }
    </style>
</head>

<body class="h-full">
    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- App Container -->
    <div id="app-container" class="h-full">
        <!-- Content will be dynamically loaded here -->
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBJ_G5o4otg7riemfJDMOcPoHoIVH7emsc",
            authDomain: "geobazarr.firebaseapp.com",
            databaseURL: "https://geobazarr-default-rtdb.firebaseio.com",
            projectId: "geobazarr",
            storageBucket: "geobazarr.firebasestorage.app",
            messagingSenderId: "679949247383",
            appId: "1:679949247383:web:036d4f32038422ebb89ad2"
        };

        // State Manager
        class MarksEntryStateManager {
            constructor() {
                this.schoolID = null;
                this.examID = null;
                this.subjectID = null;
                this.teacherID = null;
                this.examData = null;
                this.classID = null;
                this.sectionID = null;
                this.academicYearID = null;
                this.subjectData = null;
                this.teacherData = null;
                this.schoolData = null;
                this.enrollments = [];
                this.studentsData = {};
                this.resultsData = {};
                this.editedRows = new Set();
            }
            
            extractURLParams() {
                const urlParams = new URLSearchParams(window.location.search);
                this.schoolID = urlParams.get('schoolID');
                this.examID = urlParams.get('examID');
                this.subjectID = urlParams.get('subjectID');
                
                if (!this.schoolID || !this.examID || !this.subjectID) {
                    throw new Error('Missing required URL parameters: schoolID, examID, subjectID');
                }
            }
            
            getSchoolPath() {
                return `schools/${this.schoolID}`;
            }
            
            getExamPath() {
                return `${this.getSchoolPath()}/exams/${this.examID}`;
            }
            
            getSubjectPath() {
                return `${this.getSchoolPath()}/subjects/${this.subjectID}`;
            }
            
            getTeacherPath(teacherID) {
                return `${this.getSchoolPath()}/teachers/${teacherID}`;
            }
            
            getClassSubjectsPath() {
                return `${this.getSchoolPath()}/classSubjects`;
            }
            
            getEnrollmentsPath() {
                return `${this.getSchoolPath()}/enrollments`;
            }
            
            getStudentsPath() {
                return `${this.getSchoolPath()}/students`;
            }
            
            getResultsPath() {
                return `${this.getSchoolPath()}/results`;
            }
            
            getStudentResultSubjectPath(resultID) {
                return `${this.getSchoolPath()}/results/${resultID}/subjects/${this.subjectID}`;
            }
            
            markRowEdited(rowIndex) {
                this.editedRows.add(rowIndex);
            }
            
            clearEditedRows() {
                this.editedRows.clear();
            }
            
            hasEditedRows() {
                return this.editedRows.size > 0;
            }
        }

        // Marks Entry App
        class MarksEntryApp {
            constructor() {
                this.stateManager = new MarksEntryStateManager();
                this.db = null;
                this.auth = null;
                this.currentUser = null;
                this.appContainer = document.getElementById('app-container');
                this.notification = document.getElementById('notification');
                
                this.initialize();
            }
            
            initialize() {
                try {
                    this.showSkeletonLoading();
                    
                    // Extract URL parameters
                    this.stateManager.extractURLParams();
                    
                    // Initialize Firebase
                    firebase.initializeApp(firebaseConfig);
                    this.db = firebase.firestore();
                    this.auth = firebase.auth();
                    
                    this.setupAuthListener();
                    
                } catch (error) {
                    console.error("Initialization error:", error);
                    this.showError(error.message);
                }
            }
            
            setupAuthListener() {
                this.auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        this.currentUser = user;
                        this.stateManager.teacherID = user.uid;
                        await this.loadAllData();
                    } else {
                        this.showSignInPrompt();
                    }
                });
            }
            
            async loadAllData() {
                try {
                    // Load exam data first
                    await this.loadExamData();
                    
                    // Load school data
                    await this.loadSchoolData();
                    
                    // Verify teacher permission
                    await this.verifyTeacherPermission();
                    
                    // Load subject data
                    await this.loadSubjectData();
                    
                    // Load teacher data
                    await this.loadTeacherData();
                    
                    // Load enrollments
                    await this.loadEnrollments();
                    
                    // Load student data
                    await this.loadAllStudentsData();
                    
                    // Load or create results
                    await this.loadOrCreateAllResults();
                    
                    this.renderMarksEntryUI();
                    
                } catch (error) {
                    console.error("Error loading all data:", error);
                    this.showError(error.message);
                }
            }
            
            async loadSchoolData() {
                try {
                    const schoolDoc = await this.db.doc(this.stateManager.getSchoolPath()).get();
                    if (schoolDoc.exists) {
                        this.stateManager.schoolData = schoolDoc.data();
                    } else {
                        this.stateManager.schoolData = { schoolName: 'School' };
                    }
                } catch (error) {
                    console.error("Error loading school data:", error);
                    this.stateManager.schoolData = { schoolName: 'School' };
                }
            }
            
            async loadExamData() {
                try {
                    const examDoc = await this.db.doc(this.stateManager.getExamPath()).get();
                    
                    if (!examDoc.exists) {
                        throw new Error(`Exam not found with ID: ${this.stateManager.examID}`);
                    }
                    
                    this.stateManager.examData = examDoc.data();
                    
                    // Extract required fields
                    this.stateManager.classID = this.stateManager.examData.classID || this.stateManager.examData.classId || this.stateManager.examData.class_id;
                    this.stateManager.sectionID = this.stateManager.examData.sectionID || this.stateManager.examData.sectionId || this.stateManager.examData.section_id;
                    this.stateManager.academicYearID = this.stateManager.examData.academicYearID || this.stateManager.examData.academicYearId || this.stateManager.examData.academic_year_id;
                    
                    if (!this.stateManager.classID || !this.stateManager.sectionID || !this.stateManager.academicYearID) {
                        throw new Error("Exam data is missing required fields (classID, sectionID, academicYearID)");
                    }
                    
                } catch (error) {
                    console.error("Error loading exam data:", error);
                    throw error;
                }
            }
            
            async verifyTeacherPermission() {
                try {
                    const queryParams = {
                        teacherID: this.stateManager.teacherID,
                        subjectID: this.stateManager.subjectID,
                        classID: this.stateManager.classID,
                        sectionID: this.stateManager.sectionID,
                        academicYearID: this.stateManager.academicYearID
                    };
                    
                    // Try multiple query patterns
                    const classSubjectsPath = this.stateManager.getClassSubjectsPath();
                    
                    // Pattern 1: Query by teacherID only (single field)
                    const snapshot = await this.db.collection(classSubjectsPath)
                        .where('teacherID', '==', queryParams.teacherID)
                        .get();
                    
                    if (!snapshot.empty) {
                        const matchingDoc = snapshot.docs.find(doc => {
                            const data = doc.data();
                            return data.subjectID === queryParams.subjectID &&
                                   data.classID === queryParams.classID &&
                                   data.sectionID === queryParams.sectionID &&
                                   data.academicYearID === queryParams.academicYearID;
                        });
                        
                        if (matchingDoc) {
                            return true;
                        }
                    }
                    
                    throw new Error("You don't have permission to enter marks for this subject.");
                    
                } catch (error) {
                    console.error("Error verifying teacher permission:", error);
                    throw error;
                }
            }
            
            async loadSubjectData() {
                try {
                    const subjectDoc = await this.db.doc(this.stateManager.getSubjectPath()).get();
                    if (subjectDoc.exists) {
                        this.stateManager.subjectData = subjectDoc.data();
                    } else {
                        this.stateManager.subjectData = { subjectName: this.stateManager.subjectID };
                    }
                } catch (error) {
                    console.error("Error loading subject data:", error);
                    this.stateManager.subjectData = { subjectName: this.stateManager.subjectID };
                }
            }
            
            async loadTeacherData() {
                try {
                    const teacherDoc = await this.db.doc(this.stateManager.getTeacherPath(this.stateManager.teacherID)).get();
                    if (teacherDoc.exists) {
                        this.stateManager.teacherData = teacherDoc.data();
                    } else {
                        this.stateManager.teacherData = { teacherName: this.currentUser.email };
                    }
                } catch (error) {
                    console.error("Error loading teacher data:", error);
                    this.stateManager.teacherData = { teacherName: this.currentUser.email };
                }
            }
            
            async loadEnrollments() {
                try {
                    const enrollmentsPath = this.stateManager.getEnrollmentsPath();
                    
                    let querySnapshot;
                    try {
                        querySnapshot = await this.db.collection(enrollmentsPath)
                            .where('classID', '==', this.stateManager.classID)
                            .where('sectionID', '==', this.stateManager.sectionID)
                            .where('academicYearID', '==', this.stateManager.academicYearID)
                            .where('active', '==', true)
                            .orderBy('rollNumber')
                            .get();
                    } catch (error) {
                        // Fallback without ordering
                        querySnapshot = await this.db.collection(enrollmentsPath)
                            .where('classID', '==', this.stateManager.classID)
                            .where('sectionID', '==', this.stateManager.sectionID)
                            .where('academicYearID', '==', this.stateManager.academicYearID)
                            .where('active', '==', true)
                            .get();
                    }
                    
                    if (querySnapshot.empty) {
                        throw new Error("No active enrollments found for this class-section");
                    }
                    
                    this.stateManager.enrollments = querySnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Sort by rollNumber if not already sorted
                    this.stateManager.enrollments.sort((a, b) => {
                        return (a.rollNumber || 0) - (b.rollNumber || 0);
                    });
                    
                } catch (error) {
                    console.error("Error loading enrollments:", error);
                    throw error;
                }
            }
            
            async loadAllStudentsData() {
                try {
                    const studentsPath = this.stateManager.getStudentsPath();
                    
                    for (const enrollment of this.stateManager.enrollments) {
                        try {
                            const studentDoc = await this.db.doc(`${studentsPath}/${enrollment.studentID}`).get();
                            if (studentDoc.exists) {
                                this.stateManager.studentsData[enrollment.studentID] = studentDoc.data();
                            } else {
                                this.stateManager.studentsData[enrollment.studentID] = {
                                    studentName: `Student ${enrollment.studentID}`,
                                    registrationNo: enrollment.studentID
                                };
                            }
                        } catch (error) {
                            console.error(`Error loading student ${enrollment.studentID}:`, error);
                        }
                    }
                } catch (error) {
                    console.error("Error loading students data:", error);
                }
            }
            
            async loadOrCreateAllResults() {
                try {
                    const resultsPath = this.stateManager.getResultsPath();
                    
                    for (const enrollment of this.stateManager.enrollments) {
                        const studentID = enrollment.studentID;
                        const resultID = `${this.stateManager.examID}_${studentID}`;
                        
                        try {
                            const resultDoc = await this.db.doc(`${resultsPath}/${resultID}`).get();
                            
                            if (!resultDoc.exists) {
                                // Create result document
                                await this.db.doc(`${resultsPath}/${resultID}`).set({
                                    examID: this.stateManager.examID,
                                    studentID: studentID,
                                    enrollmentID: enrollment.id,
                                    GPA: 0,
                                    percentage: 0,
                                    locked: false,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                
                                this.stateManager.resultsData[studentID] = {
                                    id: resultID,
                                    examID: this.stateManager.examID,
                                    studentID: studentID,
                                    enrollmentID: enrollment.id,
                                    GPA: 0,
                                    percentage: 0,
                                    locked: false
                                };
                            } else {
                                this.stateManager.resultsData[studentID] = {
                                    id: resultID,
                                    ...resultDoc.data()
                                };
                            }
                            
                            // Load subject marks
                            await this.loadSubjectMarks(resultID, studentID);
                            
                        } catch (error) {
                            console.error(`Error processing result for student ${studentID}:`, error);
                        }
                    }
                } catch (error) {
                    console.error("Error loading/creating results:", error);
                }
            }
            
            async loadSubjectMarks(resultID, studentID) {
                try {
                    if (!this.stateManager.resultsData[studentID]) {
                        this.stateManager.resultsData[studentID] = {};
                    }
                    
                    if (!this.stateManager.resultsData[studentID].subjects) {
                        this.stateManager.resultsData[studentID].subjects = {};
                    }
                    
                    const subjectDoc = await this.db.doc(this.stateManager.getStudentResultSubjectPath(resultID)).get();
                    
                    if (subjectDoc.exists) {
                        this.stateManager.resultsData[studentID].subjects[this.stateManager.subjectID] = subjectDoc.data();
                    } else {
                        this.stateManager.resultsData[studentID].subjects[this.stateManager.subjectID] = {
                            theoryMarks: '',
                            practicalMarks: '',
                            theoryGrade: '',
                            practicalGrade: '',
                            finalMarks: '',
                            finalGrade: '',
                            gradePoint: '',
                            enteredBy: '',
                            updatedAt: null
                        };
                    }
                } catch (error) {
                    console.error(`Error loading subject marks for student ${studentID}:`, error);
                }
            }
            
            // UI Methods
            showSkeletonLoading() {
                const skeletonHtml = `
                    <div class="skeleton-container">
                        <div class="skeleton-loading">
                            <div class="skeleton-spinner"></div>
                            <div class="skeleton-text"></div>
                            <div class="skeleton-text" style="width: 150px;"></div>
                        </div>
                    </div>
                `;
                this.appContainer.innerHTML = skeletonHtml;
            }
            
            showError(message) {
                const errorHtml = `
                    <div class="error-container">
                        <div class="error-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="error-title">Error</div>
                        <div class="error-message">
                            ${message}
                        </div>
                        <button id="retry-button" class="auth-button mt-6" style="background: #3b82f6;">
                            Retry
                        </button>
                    </div>
                `;
                this.appContainer.innerHTML = errorHtml;
                
                document.getElementById('retry-button')?.addEventListener('click', () => {
                    window.location.reload();
                });
            }
            
            showSignInPrompt() {
                const html = `
                    <div class="error-container">
                        <div class="error-icon">
                            <i class="fas fa-sign-in-alt"></i>
                        </div>
                        <div class="error-title">Sign In Required</div>
                        <div class="error-message">
                            You need to sign in to access the Marks Entry Portal.
                        </div>
                        <button id="sign-in-prompt-button" class="auth-button">
                            Sign In to Continue
                        </button>
                    </div>
                `;
                
                this.appContainer.innerHTML = html;
                
                document.getElementById('sign-in-prompt-button')?.addEventListener('click', () => {
                    this.showAuthModal();
                });
            }
            
            showAuthModal() {
                const authModal = document.createElement('div');
                authModal.className = 'auth-modal-overlay';
                authModal.innerHTML = `
                    <div class="auth-modal">
                        <div class="auth-header">
                            <div class="auth-title">Sign In to Marks Entry Portal</div>
                        </div>
                        <div class="auth-body">
                            <div class="auth-field">
                                <label class="auth-label">Enter Email</label>
                                <input type="email" id="auth-email" class="auth-input" placeholder="teacher@example.com">
                                <div id="email-error" class="auth-error"></div>
                            </div>
                            
                            <div class="auth-field">
                                <label class="auth-label">Enter Password</label>
                                <input type="password" id="auth-password" class="auth-input" placeholder="••••••••">
                                <div id="password-error" class="auth-error"></div>
                            </div>
                            
                            <button id="sign-in-button" class="auth-button">Sign In</button>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(authModal);
                this.setupAuthModalEvents(authModal);
            }
            
            setupAuthModalEvents(authModal) {
                const signInButton = document.getElementById('sign-in-button');
                const emailInput = document.getElementById('auth-email');
                const passwordInput = document.getElementById('auth-password');
                
                signInButton.addEventListener('click', async () => {
                    await this.signInWithEmail(emailInput, passwordInput, authModal);
                });
                
                emailInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        passwordInput.focus();
                    }
                });
                
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.signInWithEmail(emailInput, passwordInput, authModal);
                    }
                });
                
                authModal.addEventListener('click', (e) => {
                    if (e.target === authModal) {
                        authModal.remove();
                    }
                });
            }
            
            async signInWithEmail(emailInput, passwordInput, authModal) {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const signInButton = document.getElementById('sign-in-button');
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.textContent = '';
                emailError.classList.remove('show');
                passwordError.textContent = '';
                passwordError.classList.remove('show');
                
                if (!email) {
                    emailError.textContent = 'Please enter your email';
                    emailError.classList.add('show');
                    return;
                }
                
                if (!password) {
                    passwordError.textContent = 'Please enter your password';
                    passwordError.classList.add('show');
                    return;
                }
                
                signInButton.textContent = 'Signing In...';
                signInButton.classList.add('loading');
                
                try {
                    await this.auth.signInWithEmailAndPassword(email, password);
                    authModal.remove();
                } catch (error) {
                    signInButton.textContent = 'Sign In';
                    signInButton.classList.remove('loading');
                    
                    switch (error.code) {
                        case 'auth/invalid-email':
                            emailError.textContent = 'Invalid email address';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-disabled':
                            emailError.textContent = 'This account has been disabled';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-not-found':
                            emailError.textContent = 'No account found with this email';
                            emailError.classList.add('show');
                            break;
                        case 'auth/wrong-password':
                            passwordError.textContent = 'Incorrect password';
                            passwordError.classList.add('show');
                            break;
                        case 'auth/too-many-requests':
                            passwordError.textContent = 'Too many failed attempts. Try again later';
                            passwordError.classList.add('show');
                            break;
                        default:
                            passwordError.textContent = 'Failed to sign in. Please try again';
                            passwordError.classList.add('show');
                    }
                }
            }
            
            showNotification(message) {
                this.notification.textContent = message;
                this.notification.classList.add('show');
                setTimeout(() => {
                    this.notification.classList.remove('show');
                }, 2000);
            }
            
            toggleEditMode(rowIndex) {
                const rows = document.querySelectorAll('#dataTable tbody tr');
                const row = rows[rowIndex];
                const isEditing = row.classList.toggle('editing');
                
                const editButton = row.querySelector('.edit-trigger');
                if (editButton) {
                    editButton.textContent = isEditing ? 'LOCK' : 'EDIT';
                    editButton.classList.toggle('bg-orange-500', isEditing);
                    editButton.classList.toggle('bg-blue-100', !isEditing);
                    editButton.classList.toggle('text-white', isEditing);
                }
                
                if (isEditing) {
                    this.stateManager.markRowEdited(rowIndex);
                }
            }
            
            async saveRow(rowIndex) {
                try {
                    const enrollment = this.stateManager.enrollments[rowIndex];
                    if (!enrollment) {
                        throw new Error("Student not found");
                    }
                    
                    const studentID = enrollment.studentID;
                    const resultID = this.stateManager.resultsData[studentID]?.id;
                    
                    if (!resultID) {
                        throw new Error("Result not found for student");
                    }
                    
                    // Get the row element
                    const rows = document.querySelectorAll('#dataTable tbody tr');
                    const row = rows[rowIndex];
                    
                    // Collect data from editable inputs only
                    const theoryMarks = row.querySelector('td:nth-child(8) input').value.trim();
                    const practicalMarks = row.querySelector('td:nth-child(9) input').value.trim();
                    const finalMarks = row.querySelector('td:nth-child(10) input').value.trim();
                    const theoryGrade = row.querySelector('td:nth-child(11) input').value.trim();
                    const practicalGrade = row.querySelector('td:nth-child(12) input').value.trim();
                    const finalGrade = row.querySelector('td:nth-child(13) input').value.trim();
                    const gradePoint = row.querySelector('td:nth-child(14) input').value.trim();
                    
                    // Prepare update data - keep exactly what teacher entered
                    const updateData = {
                        theoryMarks: theoryMarks,
                        practicalMarks: practicalMarks,
                        finalMarks: finalMarks,
                        theoryGrade: theoryGrade,
                        practicalGrade: practicalGrade,
                        finalGrade: finalGrade,
                        gradePoint: gradePoint,
                        enteredBy: this.stateManager.teacherID,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Update in Firestore
                    const subjectPath = this.stateManager.getStudentResultSubjectPath(resultID);
                    await this.db.doc(subjectPath).set(updateData, { merge: true });
                    
                    // Update local state
                    if (!this.stateManager.resultsData[studentID].subjects) {
                        this.stateManager.resultsData[studentID].subjects = {};
                    }
                    this.stateManager.resultsData[studentID].subjects[this.stateManager.subjectID] = updateData;
                    
                    // Remove from edited rows
                    this.stateManager.editedRows.delete(rowIndex);
                    
                    // Show success notification
                    this.showNotification('Marks updated successfully!');
                    
                    // Exit edit mode
                    this.toggleEditMode(rowIndex);
                    
                } catch (error) {
                    console.error("Error saving row:", error);
                    this.showNotification('Failed to save marks');
                }
            }
            
            async saveAllRows() {
                try {
                    const editedRows = Array.from(this.stateManager.editedRows);
                    if (editedRows.length === 0) {
                        this.showNotification('No changes to save');
                        return;
                    }
                    
                    // Save each edited row
                    for (const rowIndex of editedRows) {
                        await this.saveRow(rowIndex);
                    }
                    
                    this.stateManager.clearEditedRows();
                    this.showNotification('All marks saved successfully!');
                    
                } catch (error) {
                    console.error("Error saving all rows:", error);
                    this.showNotification('Failed to save all marks');
                }
            }
            
            renderMarksEntryUI() {
                const examData = this.stateManager.examData;
                const subjectData = this.stateManager.subjectData;
                const teacherData = this.stateManager.teacherData;
                const schoolData = this.stateManager.schoolData;
                const enrollments = this.stateManager.enrollments;
                
                if (!enrollments || enrollments.length === 0) {
                    this.showError("No students found for this class-section");
                    return;
                }
                
                // Generate table rows
                let tableRowsHtml = '';
                
                enrollments.forEach((enrollment, index) => {
                    const studentID = enrollment.studentID;
                    const studentData = this.stateManager.studentsData[studentID] || {};
                    const resultData = this.stateManager.resultsData[studentID] || {};
                    const subjectMarks = resultData.subjects?.[this.stateManager.subjectID] || {};
                    
                    // Format date of birth
                    let dateOfBirth = '';
                    if (studentData.dateOfBirth) {
                        if (studentData.dateOfBirth.toDate) {
                            dateOfBirth = studentData.dateOfBirth.toDate().toISOString().split('T')[0];
                        } else if (typeof studentData.dateOfBirth === 'string') {
                            dateOfBirth = studentData.dateOfBirth;
                        }
                    }
                    
                    tableRowsHtml += `
                        <tr>
                            <td class="text-center font-bold">${index + 1}</td>
                            <td class="no-print text-center">
                                <button onclick="app.toggleEditMode(${index})" class="edit-trigger action-btn bg-blue-100 text-blue-700 hover:bg-blue-200">
                                    EDIT
                                </button>
                            </td>
                            <td><input type="text" class="table-input name-cell-input" value="${studentData.studentName || ''}" readonly></td>
                            <td><input type="text" class="table-input" value="${studentData.registrationNo || studentID}" readonly></td>
                            <td><input type="text" class="table-input w-12 text-center" value="${enrollment.rollNumber || ''}" readonly></td>
                            <td><input type="text" class="table-input w-24 text-center" value="${dateOfBirth}" readonly></td>
                            <td><input type="text" class="table-input subject-cell-input" value="${subjectData.subjectName || this.stateManager.subjectID}" readonly></td>
                            <td><input type="text" class="table-input w-16 text-center" value="${subjectData.creditHours || ''}" readonly></td>
                            <td><input type="number" min="0" max="100" class="table-input w-12 text-center editable" 
                                   value="${subjectMarks.theoryMarks || ''}"></td>
                            <td><input type="number" min="0" max="100" class="table-input w-12 text-center editable" 
                                   value="${subjectMarks.practicalMarks || ''}"></td>
                            <td><input type="number" min="0" max="200" class="table-input w-16 text-center font-bold editable" 
                                   value="${subjectMarks.finalMarks || ''}"></td>
                            <td><input type="text" class="table-input w-12 text-center editable" value="${subjectMarks.theoryGrade || ''}"></td>
                            <td><input type="text" class="table-input w-12 text-center editable" value="${subjectMarks.practicalGrade || ''}"></td>
                            <td><input type="text" class="table-input w-16 text-center text-blue-700 font-bold editable" value="${subjectMarks.finalGrade || ''}"></td>
                            <td><input type="text" class="table-input w-16 text-center editable" value="${subjectMarks.gradePoint || ''}"></td>
                            <td class="no-print text-center">
                                <button onclick="app.saveRow(${index})" class="action-btn bg-gray-200 text-gray-700 hover:bg-green-600 hover:text-white">
                                    UPDATE
                                </button>
                            </td>
                        </tr>
                    `;
                });
                
                const html = `
                    <main class="main-container space-y-4">
                        <!-- Header Area -->
                        <div class="bg-white p-4 shadow-sm border-t-4 border-[#1a2a3a] rounded-sm space-y-4">
                            <div class="flex flex-wrap justify-between items-center gap-3">
                                <div class="flex items-center gap-4">
                                    <img src="https://i.postimg.cc/KcVvrkz3/Concept_20251225_020546_0000.png" class="w-10 h-10 border p-1 rounded-sm" alt="Logo">
                                    <div>
                                        <h1 class="text-xl font-bold text-gray-800 leading-none">${schoolData.schoolName || 'DILSHAD INSTITUTE'}</h1>
                                        <p class="text-[10px] tracking-widest text-gray-500 font-medium uppercase">Detailed Academic Record Editor</p>
                                    </div>
                                </div>

                                <div class="flex flex-wrap gap-x-6 gap-y-2 text-[11px] font-bold text-gray-600 bg-gray-50 p-3 rounded-sm border border-gray-100 flex-grow max-w-4xl mx-4">
                                    <div class="flex items-center">CLASS: <input type="text" class="header-field w-24" value="${this.stateManager.classID || ''}" readonly></div>
                                    <div class="flex items-center">SUBJECT: <input type="text" class="header-field w-28" value="${subjectData.subjectName || this.stateManager.subjectID}" readonly></div>
                                    <div class="flex items-center">ACADEMIC YEAR: <input type="text" class="header-field w-32" value="${this.stateManager.academicYearID || ''}" readonly></div>
                                    <div class="flex items-center">EXAM: <input type="text" class="header-field w-40" value="${examData?.examTitle || this.stateManager.examID}" readonly></div>
                                    <div class="flex items-center">PREPARED BY: <input type="text" class="header-field w-40" value="${teacherData.teacherName || this.currentUser?.email || ''}" readonly></div>
                                </div>
                                
                                <div class="flex items-center gap-2 no-print">
                                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-sm text-[10px] font-bold tracking-widest uppercase flex items-center gap-2 transition-all">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                                        Print Record
                                    </button>
                                    <button onclick="app.saveAllRows()" class="bg-[#1a2a3a] hover:bg-black text-white px-4 py-2 rounded-sm text-[10px] font-bold tracking-widest uppercase flex items-center gap-2 transition-all">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
                                        Update Record
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="table-container shadow-sm border-b-2 border-gray-300">
                            <table id="dataTable">
                                <thead>
                                    <tr>
                                        <th rowspan="2">S.N.</th>
                                        <th rowspan="2" class="no-print">ACTION</th>
                                        <th rowspan="2">Student Name</th>
                                        <th rowspan="2">Student ID</th>
                                        <th rowspan="2">Roll No</th>
                                        <th rowspan="2">Date of Birth</th>
                                        <th rowspan="2">Subjects</th>
                                        <th rowspan="2">Credit Hours</th>
                                        <th colspan="2">Obtained Marks</th>
                                        <th rowspan="2">Final Mark</th>
                                        <th colspan="2">Obtained Grade</th>
                                        <th rowspan="2">Final Grade</th>
                                        <th rowspan="2">Grade Point</th>
                                        <th rowspan="2" class="no-print">ACTION</th>
                                    </tr>
                                    <tr>
                                        <th class="bg-[#243447]">TH</th>
                                        <th class="bg-[#243447]">PR</th>
                                        <th class="bg-[#243447]">TH</th>
                                        <th class="bg-[#243447]">PR</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRowsHtml}
                                </tbody>
                            </table>
                        </div>

                        <div class="flex justify-between items-center no-print px-1 py-4">
                            <p class="text-[10px] text-gray-400 font-medium uppercase tracking-widest">Dilshad Management System v2.0 • Showing ${enrollments.length} Entries</p>
                            <button onclick="app.auth.signOut()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-sm text-[10px] font-bold tracking-widest uppercase shadow-md transition-all flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                                LOGOUT
                            </button>
                        </div>
                    </main>
                `;
                
                this.appContainer.innerHTML = html;
            }
        }
        
        // Initialize app
        let app;
        window.addEventListener('load', () => {
            app = new MarksEntryApp();
            window.app = app;
        });
    </script>
</body>
</html>
