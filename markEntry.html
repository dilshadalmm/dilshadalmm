<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimum-scale=1.0">
    <title>Student Data Management</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        /* CRITICAL: Ensure HTML and BODY are full height and non-scrollable */
        html {
            height: 100%;
            overflow: hidden !important;
        }

        /* Use Oswald font family as default */
        body {
            font-family: 'Oswald', sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            
            /* Light background */
            background-color: #f0f2f5 !important;
            color: #000000;
            letter-spacing: 0.01em;
            
            /* CRITICAL: Prevent the main body from scrolling at all */
            overflow: hidden !important; 
            
            user-select: none;
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none; 
            
            /* Prevents elastic scrolling on iOS */
            overscroll-behavior: none;
            
            /* Make body a fixed container occupying full screen */
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* App wrapper */
        #app-wrapper {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: auto;
            background: #f0f2f5 !important;
        }
        
        /* Rounded corners for containers */
        .rounded-container {
            border-radius: 4px !important;
        }
        
        /* --- Table Styles --- */
        .table-container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            max-height: 280px;
            overflow: hidden;
            position: relative;
            border-radius: 4px;
        }

        /* Hide scrollbars on table container */
        .table-container {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;     /* Firefox */
        }
        
        .table-container::-webkit-scrollbar {
            display: none;  /* Chrome, Safari, Opera */
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 11px;
            text-transform: uppercase;
            table-layout: auto;
        }

        /* Fixed Headers */
        th {
            background-color: #1a2a3a;
            color: white;
            padding: 8px 12px;
            text-align: center;
            font-weight: 500;
            white-space: nowrap;
            border: 0.5px solid #2c3e50;
            position: sticky;
            z-index: 30;
        }

        thead tr:first-child th { top: 0; }
        thead tr:last-child th { top: 33px; }

        /* FIXED S.N. COLUMN LOGIC */
        thead tr:first-child th:first-child {
            left: 0;
            z-index: 40;
        }

        thead tr:first-child th:nth-child(2) {
            left: 40px;
            z-index: 40;
        }

        tbody td:first-child {
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: inherit;
            border-right: 2px solid #cbd5e1;
        }

        tbody td:nth-child(2) {
            position: sticky;
            left: 40px;
            z-index: 10;
            background-color: inherit;
            border-right: 2px solid #cbd5e1;
        }

        td {
            border: 0.5px solid #e2e8f0;
            padding: 4px 8px;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }
        
        tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        tr:hover {
            background-color: #f1f5f9 !important;
        }

        .table-input {
            background: transparent;
            border: 1px solid transparent;
            padding: 4px;
            font-weight: 600;
            color: #334155;
            outline: none;
            text-align: inherit;
            width: 100%;
            font-family: 'Oswald', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
        }

        .table-input:focus {
            background: white;
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.1);
        }

        .table-input[readonly] {
            background: transparent;
            color: #64748b;
            cursor: default;
        }

        .table-input.editable:focus {
            background: white;
            border-color: #3b82f6;
        }

        .header-field {
            border: none;
            border-bottom: 1px solid #94a3b8;
            background: transparent;
            font-weight: 600;
            font-size: 12px;
            padding: 0 4px;
            outline: none;
            text-transform: uppercase;
            color: #1e293b;
            font-family: 'Oswald', sans-serif;
        }

        .header-field:focus {
            border-bottom-color: #3b82f6;
        }

        .name-cell-input { min-width: 180px; }
        .subject-cell-input { min-width: 200px; }
        .remark-cell-input { min-width: 150px; }
        
        /* Action buttons */
        .action-btn {
            font-size: 9px;
            padding: 4px 8px;
            border-radius: 2px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
            font-family: 'Oswald', sans-serif;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        
        /* Notification System */
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 30px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
            display: none;
            border-radius: 4px;
        }
        
        .notification.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }
        
        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white !important;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-spinner {
            border: 2px solid #f3f4f6;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Skeleton Loading */
        .skeleton-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
        }
        
        .skeleton-loading {
            text-align: center;
        }
        
        .skeleton-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        .skeleton-text {
            background: #e5e7eb;
            height: 20px;
            width: 200px;
            margin: 0.5rem auto;
        }

        /* Error container */
        .error-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            background: #f0f2f5;
            border-radius: 4px;
        }
        
        .error-icon {
            font-size: 64px;
            color: #ef4444;
            margin-bottom: 24px;
            opacity: 0.7;
        }
        
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
        }
        
        .error-message {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 32px;
            max-width: 400px;
            line-height: 1.5;
        }
        
        /* Index Error Specific Styles */
        .index-error-box {
            background: #fffbeb;
            border: 1px solid #fbbf24;
            padding: 16px;
            margin: 20px 0;
            text-align: left;
            max-width: 600px;
            overflow: auto;
            font-family: monospace;
            font-size: 14px;
            color: #78350f;
            border-left: 4px solid #f59e0b;
            border-radius: 4px;
        }
        
        .index-instructions {
            background: #f0f9ff;
            border: 1px solid #7dd3fc;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            border-radius: 4px;
        }
        
        /* Auth Modal */
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .auth-modal {
            background: white;
            width: 40%;
            min-width: 300px;
            max-width: 400px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        
        .auth-header {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .auth-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
        }
        
        .auth-body {
            padding: 20px;
        }
        
        .auth-field {
            margin-bottom: 16px;
        }
        
        .auth-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }
        
        .auth-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            font-family: 'Oswald', sans-serif;
            border-radius: 4px;
        }
        
        .auth-input:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .auth-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        
        .auth-error.show {
            display: block;
        }
        
        .auth-button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            font-family: 'Oswald', sans-serif;
            border-radius: 4px;
        }
        
        .auth-button:hover {
            background: #2563eb;
        }
        
        .auth-button.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .table-container { border: none; max-height: none; overflow: visible; }
            th { background-color: #000 !important; color: white !important; border: 1px solid #333; position: static; }
            td { border: 1px solid #ccc; position: static !important; }
            tbody tr:nth-child(even) { background-color: #f9f9f9 !important; }
        }
    </style>
</head>

<body class="h-full">

    <!-- Notification Center -->
    <div id="notification" class="notification">
        <div id="notification-message"></div>
    </div>

    <!-- Main App Container -->
    <div id="app-wrapper" class="overflow-auto">
        <!-- Content will be dynamically loaded here -->
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBJ_G5o4otg7riemfJDMOcPoHoIVH7emsc",
            authDomain: "geobazarr.firebaseapp.com",
            databaseURL: "https://geobazarr-default-rtdb.firebaseio.com",
            projectId: "geobazarr",
            storageBucket: "geobazarr.firebasestorage.app",
            messagingSenderId: "679949247383",
            appId: "1:679949247383:web:036d4f32038422ebb89ad2"
        };

        // State Manager for Marks Entry App
        class MarksEntryStateManager {
            constructor() {
                this.schoolID = null;
                this.examID = null;
                this.subjectID = null;
                this.teacherID = null;
                this.examData = null;
                this.classID = null;
                this.sectionID = null;
                this.academicYearID = null;
                this.subjectData = null;
                this.teacherData = null;
                this.schoolData = null;
                this.enrollments = [];
                this.studentsData = {};
                this.resultsData = {};
                this.editedRows = new Set();
            }
            
            extractURLParams() {
                const urlParams = new URLSearchParams(window.location.search);
                this.schoolID = urlParams.get('schoolID');
                this.examID = urlParams.get('examID');
                this.subjectID = urlParams.get('subjectID');
                
                console.log("URL Parameters:", {
                    schoolID: this.schoolID,
                    examID: this.examID,
                    subjectID: this.subjectID
                });
                
                // Check if all required parameters are present
                const requiredParams = ['schoolID', 'examID', 'subjectID'];
                const missingParams = requiredParams.filter(param => !this[param]);
                
                if (missingParams.length > 0) {
                    throw new Error(`Missing required URL parameters: ${missingParams.join(', ')}. Please check the URL and try again.`);
                }
            }
            
            getSchoolPath() {
                return `schools/${this.schoolID}`;
            }
            
            getExamPath() {
                return `${this.getSchoolPath()}/exams/${this.examID}`;
            }
            
            getSubjectPath() {
                return `${this.getSchoolPath()}/subjects/${this.subjectID}`;
            }
            
            getTeacherPath(teacherID) {
                return `${this.getSchoolPath()}/teachers/${teacherID}`;
            }
            
            getClassSubjectsPath() {
                return `${this.getSchoolPath()}/classSubjects`;
            }
            
            getEnrollmentsPath() {
                return `${this.getSchoolPath()}/enrollments`;
            }
            
            getStudentsPath() {
                return `${this.getSchoolPath()}/students`;
            }
            
            getResultsPath() {
                return `${this.getSchoolPath()}/results`;
            }
            
            getStudentResultSubjectPath(resultID) {
                return `${this.getSchoolPath()}/results/${resultID}/subjects/${this.subjectID}`;
            }
            
            markRowEdited(rowIndex) {
                this.editedRows.add(rowIndex);
            }
            
            clearEditedRows() {
                this.editedRows.clear();
            }
            
            hasEditedRows() {
                return this.editedRows.size > 0;
            }
            
            getEditedRows() {
                return Array.from(this.editedRows);
            }
        }

        // Marks Entry App
        class MarksEntryApp {
            constructor() {
                this.stateManager = new MarksEntryStateManager();
                this.db = null;
                this.auth = null;
                this.currentUser = null;
                this.isInitialized = false;
                
                this.appWrapper = document.getElementById('app-wrapper');
                this.notification = document.getElementById('notification');
                this.notificationMessage = document.getElementById('notification-message');
                
                this.initialize();
            }
            
            initialize() {
                if (this.isInitialized) return;
                
                try {
                    this.showSkeletonLoading();
                    
                    // Extract URL parameters
                    this.stateManager.extractURLParams();
                    
                    firebase.initializeApp(firebaseConfig);
                    this.db = firebase.firestore();
                    this.auth = firebase.auth();
                    
                    this.db.settings({
                        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
                    });
                    
                    console.log("Firebase initialized successfully");
                    this.isInitialized = true;
                    
                    this.setupAuthListener();
                    
                } catch (error) {
                    console.error("Initialization error:", error);
                    this.hideSkeletonLoading();
                    this.showError(error.message || "Failed to initialize app. Please check URL parameters.");
                }
            }
            
            setupAuthListener() {
                this.auth.onAuthStateChanged(async (user) => {
                    console.log("Auth state changed:", user ? `User ${user.email} logged in` : "No user");
                    
                    if (user) {
                        this.currentUser = user;
                        this.stateManager.teacherID = user.uid;
                        await this.loadAllData();
                    } else {
                        this.currentUser = null;
                        this.hideSkeletonLoading();
                        this.showSignInPrompt();
                    }
                });
            }
            
            async loadAllData() {
                try {
                    console.log("Starting to load all data...");
                    
                    // Load school data first
                    await this.loadSchoolData();
                    
                    // Load exam data
                    await this.loadExamData();
                    
                    // Verify teacher permission with index workaround
                    await this.verifyTeacherPermission();
                    
                    // Load subject data
                    await this.loadSubjectData();
                    
                    // Load teacher data
                    await this.loadTeacherData();
                    
                    // Load all enrollments for the class-section-academicYear
                    await this.loadEnrollments();
                    
                    // Load student data for each enrollment
                    await this.loadAllStudentsData();
                    
                    // Load or create results for each student
                    await this.loadOrCreateAllResults();
                    
                    this.hideSkeletonLoading();
                    this.renderMarksEntryTable();
                    
                } catch (error) {
                    console.error("Error loading all data:", error);
                    this.showError(error.message || "Failed to load data. Please try again.");
                }
            }
            
            async loadSchoolData() {
                try {
                    console.log("Loading school data...");
                    const schoolPath = this.stateManager.getSchoolPath();
                    const schoolDoc = await this.db.doc(schoolPath).get();
                    
                    if (schoolDoc.exists) {
                        this.stateManager.schoolData = schoolDoc.data();
                        console.log("School data loaded:", this.stateManager.schoolData);
                    } else {
                        console.warn("School document not found");
                        this.stateManager.schoolData = { schoolName: "DILSHAD INSTITUTE" };
                    }
                    
                } catch (error) {
                    console.error("Error loading school data:", error);
                    this.stateManager.schoolData = { schoolName: "DILSHAD INSTITUTE" };
                }
            }
            
            async loadExamData() {
                try {
                    console.log("Loading exam data...");
                    const examPath = this.stateManager.getExamPath();
                    
                    const examDoc = await this.db.doc(examPath).get();
                    
                    if (!examDoc.exists) {
                        throw new Error(`Exam not found with ID: ${this.stateManager.examID}`);
                    }
                    
                    this.stateManager.examData = examDoc.data();
                    console.log("Full Exam data object:", this.stateManager.examData);
                    
                    // Handle different field name variations
                    const examData = this.stateManager.examData;
                    
                    this.stateManager.classID = examData.classID || examData.classId || examData.class_id;
                    this.stateManager.sectionID = examData.sectionID || examData.sectionId || examData.section_id;
                    this.stateManager.academicYearID = examData.academicYearID || examData.academicYearId || examData.academicYear_id || 
                                                      examData.academicYearId || examData.academic_year_id;
                    
                    console.log("Extracted exam context after mapping:", {
                        classID: this.stateManager.classID,
                        sectionID: this.stateManager.sectionID,
                        academicYearID: this.stateManager.academicYearID
                    });
                    
                    // Validate required fields
                    if (!this.stateManager.classID) {
                        throw new Error("Exam document is missing class identification field.");
                    }
                    
                    if (!this.stateManager.sectionID) {
                        throw new Error("Exam document is missing section identification field.");
                    }
                    
                    if (!this.stateManager.academicYearID) {
                        throw new Error("Exam document is missing academic year identification field.");
                    }
                    
                    return this.stateManager.examData;
                    
                } catch (error) {
                    console.error("Error loading exam data:", error);
                    throw error;
                }
            }
            
            async verifyTeacherPermission() {
                try {
                    console.log("Verifying teacher permission...");
                    
                    const queryParams = {
                        teacherID: this.stateManager.teacherID,
                        subjectID: this.stateManager.subjectID,
                        classID: this.stateManager.classID,
                        sectionID: this.stateManager.sectionID,
                        academicYearID: this.stateManager.academicYearID
                    };
                    
                    // Validate all values are present
                    for (const [key, value] of Object.entries(queryParams)) {
                        if (value === undefined || value === null || value === '') {
                            throw new Error(`Cannot verify teacher permission: ${key} is undefined or empty.`);
                        }
                    }
                    
                    const classSubjectsPath = this.stateManager.getClassSubjectsPath();
                    
                    // Try multiple query patterns to avoid index requirements
                    let patterns = [
                        // Pattern 1: teacherID + subjectID
                        async () => {
                            const query1 = this.db.collection(classSubjectsPath)
                                .where('teacherID', '==', queryParams.teacherID)
                                .where('subjectID', '==', queryParams.subjectID);
                            return await query1.get();
                        },
                        // Pattern 2: classID + sectionID
                        async () => {
                            const query2 = this.db.collection(classSubjectsPath)
                                .where('classID', '==', queryParams.classID)
                                .where('sectionID', '==', queryParams.sectionID);
                            return await query2.get();
                        },
                        // Pattern 3: teacherID only
                        async () => {
                            const query3 = this.db.collection(classSubjectsPath)
                                .where('teacherID', '==', queryParams.teacherID);
                            return await query3.get();
                        },
                        // Pattern 4: Get all and filter client-side
                        async () => {
                            return await this.db.collection(classSubjectsPath).get();
                        }
                    ];
                    
                    for (let i = 0; i < patterns.length; i++) {
                        try {
                            const snapshot = await patterns[i]();
                            
                            if (!snapshot.empty) {
                                const matchingDoc = snapshot.docs.find(doc => {
                                    const data = doc.data();
                                    return data.teacherID === queryParams.teacherID &&
                                           data.subjectID === queryParams.subjectID &&
                                           data.classID === queryParams.classID &&
                                           data.sectionID === queryParams.sectionID &&
                                           data.academicYearID === queryParams.academicYearID;
                                });
                                
                                if (matchingDoc) {
                                    console.log(`Pattern ${i + 1} successful: Teacher permission verified`);
                                    return true;
                                }
                            }
                        } catch (error) {
                            console.log(`Pattern ${i + 1} failed:`, error.message);
                            continue;
                        }
                    }
                    
                    throw new Error("Teacher is not assigned to this subject-class-section combination.");
                    
                } catch (error) {
                    console.error("Error verifying teacher permission:", error);
                    
                    if (error.message && (error.message.includes('index') || error.code === 'failed-precondition')) {
                        const indexError = `
                            FIREBASE FIRESTORE INDEX REQUIRED
                            
                            STEP-BY-STEP INSTRUCTIONS:
                            1. Go to: https://console.firebase.google.com/
                            2. Select project: "geobazarr"
                            3. Click "Firestore Database" in left menu
                            4. Click "Indexes" tab at top
                            5. Click "Create Composite Index"
                            6. Collection ID: "classSubjects"
                            7. Add the following fields in order:
                               • teacherID (Ascending)
                               • subjectID (Ascending)

            async loadEnrollments() {
                try {
                    console.log("Loading enrollments...");
                    const enrollmentsPath = this.stateManager.getEnrollmentsPath();
                    
                    if (!this.stateManager.classID || !this.stateManager.sectionID || !this.stateManager.academicYearID) {
                        throw new Error("Cannot load enrollments: Missing required fields");
                    }
                    
                    console.log("Enrollment query criteria:", {
                        classID: this.stateManager.classID,
                        sectionID: this.stateManager.sectionID,
                        academicYearID: this.stateManager.academicYearID
                    });
                    
                    let querySnapshot;
                    
                    try {
                        querySnapshot = await this.db.collection(enrollmentsPath)
                            .where('classID', '==', this.stateManager.classID)
                            .where('sectionID', '==', this.stateManager.sectionID)
                            .where('academicYearID', '==', this.stateManager.academicYearID)
                            .where('active', '==', true)
                            .orderBy('rollNumber')
                            .get();
                    } catch (error) {
                        console.log("Standard enrollment query failed, trying alternative:", error.message);
                        querySnapshot = await this.db.collection(enrollmentsPath)
                            .where('classID', '==', this.stateManager.classID)
                            .where('sectionID', '==', this.stateManager.sectionID)
                            .where('academicYearID', '==', this.stateManager.academicYearID)
                            .where('active', '==', true)
                            .get();
                    }
                    
                    if (querySnapshot.empty) {
                        console.warn("No active enrollments found for this class-section");
                        this.stateManager.enrollments = [];
                        return [];
                    }
                    
                    this.stateManager.enrollments = querySnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Sort by rollNumber manually if needed
                    if (!this.stateManager.enrollments[0]?.rollNumber) {
                        this.stateManager.enrollments.sort((a, b) => {
                            const rollA = a.rollNumber || 0;
                            const rollB = b.rollNumber || 0;
                            return rollA - rollB;
                        });
                    }
                    
                    console.log("Enrollments loaded:", this.stateManager.enrollments.length, "students");
                    return this.stateManager.enrollments;
                    
                } catch (error) {
                    console.error("Error loading enrollments:", error);
                    throw error;
                }
            }

            setupAuthModalEvents(authModal) {
                const signInButton = document.getElementById('sign-in-button');
                const emailInput = document.getElementById('auth-email');
                const passwordInput = document.getElementById('auth-password');
                
                signInButton.addEventListener('click', async () => {
                    await this.signInWithEmail(emailInput, passwordInput, authModal);
                });
                
                emailInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        passwordInput.focus();
                    }
                });
                
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.signInWithEmail(emailInput, passwordInput, authModal);
                    }
                });
                
                authModal.addEventListener('click', (e) => {
                    if (e.target === authModal) {
                        authModal.remove();
                    }
                });
            }
            
            async signInWithEmail(emailInput, passwordInput, authModal) {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const signInButton = document.getElementById('sign-in-button');
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.textContent = '';
                emailError.classList.remove('show');
                passwordError.textContent = '';
                passwordError.classList.remove('show');
                
                if (!email) {
                    emailError.textContent = 'Please enter your email';
                    emailError.classList.add('show');
                    return;
                }
                
                if (!password) {
                    passwordError.textContent = 'Please enter your password';
                    passwordError.classList.add('show');
                    return;
                }
                
                signInButton.textContent = 'Signing In...';
                signInButton.classList.add('loading');
                
                try {
                    await this.auth.signInWithEmailAndPassword(email, password);
                    authModal.remove();
                    
                } catch (error) {
                    console.error("Sign in error:", error);
                    
                    signInButton.textContent = 'Sign In';
                    signInButton.classList.remove('loading');
                    
                    switch (error.code) {
                        case 'auth/invalid-email':
                            emailError.textContent = 'Invalid email address';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-disabled':
                            emailError.textContent = 'This account has been disabled';
                            emailError.classList.add('show');
                            break;
                        case 'auth/user-not-found':
                            emailError.textContent = 'No account found with this email';
                            emailError.classList.add('show');
                            break;
                        case 'auth/wrong-password':
                            passwordError.textContent = 'Incorrect password';
                            passwordError.classList.add('show');
                            break;
                        case 'auth/too-many-requests':
                            passwordError.textContent = 'Too many failed attempts. Try again later';
                            passwordError.classList.add('show');
                            break;
                        default:
                            passwordError.textContent = 'Failed to sign in. Please try again';
                            passwordError.classList.add('show');
                    }
                }
            }

            toggleEditMode(rowIndex) {
                const rows = document.querySelectorAll('#dataTable tbody tr');
                const row = rows[rowIndex];
                const isEditing = row.classList.toggle('editing');
                
                const editButton = row.querySelector('.edit-trigger');
                if (editButton) {
                    editButton.textContent = isEditing ? 'LOCK' : 'EDIT';
                    editButton.classList.toggle('bg-orange-500', isEditing);
                    editButton.classList.toggle('bg-blue-100', !isEditing);
                    editButton.classList.toggle('text-blue-700', !isEditing);
                    editButton.classList.toggle('text-white', isEditing);
                }
                
                // Toggle editable fields
                const editableInputs = row.querySelectorAll('td:nth-child(9) input, td:nth-child(10) input, td:nth-child(11) input, td:nth-child(12) input, td:nth-child(13) input, td:nth-child(14) input, td:nth-child(15) input, td:nth-child(16) input');
                
                editableInputs.forEach(input => {
                    if (isEditing) {
                        input.removeAttribute('readonly');
                        input.classList.add('editable');
                    } else {
                        input.setAttribute('readonly', true);
                        input.classList.remove('editable');
                    }
                });
                
                // Mark as edited if entering edit mode
                if (isEditing) {
                    this.stateManager.markRowEdited(rowIndex);
                }
            }
            
            async saveRow(rowIndex) {
                try {
                    const enrollment = this.stateManager.enrollments[rowIndex];
                    if (!enrollment) {
                        throw new Error("Student not found");
                    }
                    
                    const studentID = enrollment.studentID;
                    const resultID = this.stateManager.resultsData[studentID]?.id;
                    
                    if (!resultID) {
                        throw new Error("Result not found for student");
                    }
                    
                    // Get the row element
                    const rows = document.querySelectorAll('#dataTable tbody tr');
                    const row = rows[rowIndex];
                    
                    // Collect data from inputs - NO AUTO CALCULATION
                    const theoryMarks = row.querySelector('td:nth-child(9) input').value.trim();
                    const practicalMarks = row.querySelector('td:nth-child(10) input').value.trim();
                    const finalMarks = row.querySelector('td:nth-child(11) input').value.trim();
                    const theoryGrade = row.querySelector('td:nth-child(12) input').value.trim();
                    const practicalGrade = row.querySelector('td:nth-child(13) input').value.trim();
                    const finalGrade = row.querySelector('td:nth-child(14) input').value.trim();
                    const gradePoint = row.querySelector('td:nth-child(15) input').value.trim();
                    const remark = row.querySelector('td:nth-child(16) input').value.trim();
                    
                    // Prepare update data - preserve exact values
                    const updateData = {
                        theoryMarks: theoryMarks,
                        practicalMarks: practicalMarks,
                        finalMarks: finalMarks,
                        theoryGrade: theoryGrade,
                        practicalGrade: practicalGrade,
                        finalGrade: finalGrade,
                        gradePoint: gradePoint,
                        remark: remark,
                        enteredBy: this.stateManager.teacherID,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Update in Firestore
                    const subjectPath = this.stateManager.getStudentResultSubjectPath(resultID);
                    await this.db.doc(subjectPath).set(updateData, { merge: true });
                    
                    // Update local state
                    if (!this.stateManager.resultsData[studentID].subjects) {
                        this.stateManager.resultsData[studentID].subjects = {};
                    }
                    this.stateManager.resultsData[studentID].subjects[this.stateManager.subjectID] = updateData;
                    
                    // Remove from edited rows
                    this.stateManager.editedRows.delete(rowIndex);
                    
                    // Show notification
                    this.showNotification('Marks saved successfully!');
                    
                    // Exit edit mode
                    this.toggleEditMode(rowIndex);
                    
                    console.log(`Saved marks for student ${studentID}`);
                    
                } catch (error) {
                    console.error("Error saving row:", error);
                    this.showNotification('Failed to save marks. Please try again.');
                }
            }
            
            async saveAllEditedRows() {
                try {
                    const editedRows = this.stateManager.getEditedRows();
                    if (editedRows.length === 0) {
                        this.showNotification('No changes to save.');
                        return;
                    }
                    
                    this.showNotification(`Saving ${editedRows.length} student(s)...`);
                    
                    // Save each edited row
                    for (const rowIndex of editedRows) {
                        await this.saveRow(rowIndex);
                    }
                    
                    this.stateManager.clearEditedRows();
                    this.showNotification('All marks saved successfully!');
                    
                } catch (error) {
                    console.error("Error saving all rows:", error);
                    this.showNotification('Failed to save all marks. Please try again.');
                }
            }

                                    <img src="https://i.postimg.cc/KcVvrkz3/Concept_20251225_020546_0000.png" class="w-10 h-10 border p-1" alt="Logo">
                                    <div>
                                        <h1 class="text-xl font-bold text-gray-800 leading-none">${schoolData?.schoolName || 'DILSHAD INSTITUTE'}</h1>
                                        <p class="text-[10px] tracking-widest text-gray-500 font-medium uppercase">Detailed Academic Record Editor</p>
                                    </div>
                                </div>

                                <div class="flex flex-wrap gap-x-6 gap-y-2 text-[11px] font-bold text-gray-600 bg-gray-50 p-3 rounded-container border border-gray-100 flex-grow max-w-4xl mx-4">
                                    <div class="flex items-center gap-2">
                                        CLASS: <input type="text" class="header-field w-24" value="${this.stateManager.classID || ''}" readonly>
                                        &nbsp;&nbsp;&nbsp;SUBJECT: <input type="text" class="header-field w-40" value="${subjectData.subjectName || this.stateManager.subjectID}" readonly>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        ACADEMIC YEAR: <input type="text" class="header-field w-28" value="${this.stateManager.academicYearID || ''}" readonly>
                                        &nbsp;&nbsp;&nbsp;EXAM: <input type="text" class="header-field w-32" value="${examData?.examTitle || this.stateManager.examID}" readonly>
                                        &nbsp;&nbsp;&nbsp;PREPARED BY: <input type="text" class="header-field w-40" value="${teacherData.teacherName || this.currentUser?.email || ''}" readonly>
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-2 no-print">
                                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 text-[10px] font-bold tracking-widest uppercase flex items-center gap-2 transition-all rounded-container">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                                        Print Record
                                    </button>
                                    <button id="update-all-button" class="bg-[#1a2a3a] hover:bg-black text-white px-4 py-2 text-[10px] font-bold tracking-widest uppercase flex items-center gap-2 transition-all rounded-container">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
                                        Update All Records
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="table-container shadow-sm border-b-2 border-gray-300">
                            <table id="dataTable">
                                <thead>
                                    <tr>
                                        <th rowspan="2">S.N.</th>
                                        <th rowspan="2" class="no-print">ACTION</th>
                                        <th rowspan="2">Student Name</th>
                                        <th rowspan="2">Student ID</th>
                                        <th rowspan="2">Roll No</th>
                                        <th rowspan="2">Date of Birth</th>
                                        <th rowspan="2">Subjects</th>
                                        <th rowspan="2">Credit Hours</th>
                                        <th colspan="2">Obtained Marks</th>
                                        <th rowspan="2">Final Mark</th>
                                        <th colspan="2">Obtained Grade</th>
                                        <th rowspan="2">Final Grade</th>
                                        <th rowspan="2">Grade Point</th>
                                        <th rowspan="2">Remark</th>
                                        <th rowspan="2" class="no-print">ACTION</th>
                                    </tr>
                                    <tr>
                                        <th class="bg-[#243447]">TH</th>
                                        <th class="bg-[#243447]">PR</th>
                                        <th class="bg-[#243447]">TH</th>
                                        <th class="bg-[#243447]">PR</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRowsHtml}
                                </tbody>
                            </table>
                        </div>

                        <div class="flex justify-between items-center no-print px-1 py-4">
                            <p class="text-[10px] text-gray-400 font-medium uppercase tracking-widest">Dilshad Management System v2.0 • Showing ${enrollments.length} Entries</p>
                            <div class="flex items-center gap-2">
                                <span id="edited-count" class="text-[10px] font-bold ${this.stateManager.hasEditedRows() ? 'text-orange-600' : 'text-green-600'}">
                                    ${this.stateManager.hasEditedRows() ? `${this.stateManager.editedRows.size} unsaved changes` : ''}
                                </span>
                                <button id="logout-button" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 text-[10px] font-bold tracking-widest uppercase shadow-md transition-all flex items-center gap-2 rounded-container">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                                    LOGOUT
                                </button>
                            </div>
                        </div>
                    </main>
                `;
                
                this.appWrapper.innerHTML = marksEntryHtml;
                this.appWrapper.scrollTop = 0;
                
                // Add event listeners
                document.getElementById('update-all-button')?.addEventListener('click', () => {
                    this.saveAllEditedRows();
                });
                
                document.getElementById('logout-button')?.addEventListener('click', () => {
                    this.auth.signOut();
                });
                
                // Update edited count display
                const updateEditedCount = () => {
                    const editedCount = document.getElementById('edited-count');
                    if (editedCount) {
                        if (this.stateManager.hasEditedRows()) {
                            editedCount.textContent = `${this.stateManager.editedRows.size} unsaved changes`;
                            editedCount.className = 'text-[10px] font-bold text-orange-600';
                        } else {
                            editedCount.textContent = '';
                            editedCount.className = 'text-[10px] font-bold text-green-600';
                        }
                    }
                };
                
                // Update edited count display periodically
                setInterval(updateEditedCount, 1000);
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new MarksEntryApp();
        });
        
        // Make app available globally for debugging
        window.app = app;
    </script>
</body>
</html>
