            async processPayCodePayment() {
                const payCode = document.getElementById('pay-code').value.trim();
                const statusDiv = document.getElementById('payment-status');
                const payBtn = document.getElementById('pay-btn');
                const invoice = this.stateManager.getSelectedInvoice();
                const hostellerData = this.stateManager.getHostellerData();
                
                if (!invoice) {
                    statusDiv.innerText = "Invoice not found.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                if (!payCode) {
                    statusDiv.innerText = "Please enter a valid PayCode to proceed.";
                    statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    statusDiv.classList.remove('hidden');
                    return;
                }
                
                // Check if PayCode exists in database
                const payCodePath = `${this.stateManager.getPayCodesPath()}/${payCode}`;
                
                payBtn.disabled = true;
                payBtn.innerText = "Processing...";
                statusDiv.innerText = "Verifying PayCode...";
                statusDiv.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-200');
                statusDiv.classList.add('bg-blue-50', 'text-blue-800', 'border-blue-200');
                statusDiv.classList.remove('hidden');
                
                try {
                    const payCodeDoc = await this.db.doc(payCodePath).get();
                    
                    if (!payCodeDoc.exists) {
                        statusDiv.innerText = "Invalid PayCode. Please check and try again.";
                        statusDiv.classList.remove('bg-blue-50', 'text-blue-800', 'border-blue-200');
                        statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                        payBtn.disabled = false;
                        payBtn.innerText = "Proceed to Payment";
                        return;
                    }
                    
                    const payCodeData = payCodeDoc.data();
                    
                    if (!payCodeData.valid) {
                        statusDiv.innerText = "This PayCode has already been used or is invalid.";
                        statusDiv.classList.remove('bg-blue-50', 'text-blue-800', 'border-blue-200');
                        statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                        payBtn.disabled = false;
                        payBtn.innerText = "Proceed to Payment";
                        return;
                    }
                    
                    const payAmount = payCodeData.value || 0;
                    const balance = invoice.totalAmount - (invoice.paidAmount || 0);
                    
                    if (payAmount > balance) {
                        statusDiv.innerText = `PayCode amount (Rs. ${payAmount.toLocaleString()}) exceeds balance (Rs. ${balance.toLocaleString()}).`;
                        statusDiv.classList.remove('bg-blue-50', 'text-blue-800', 'border-blue-200');
                        statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                        payBtn.disabled = false;
                        payBtn.innerText = "Proceed to Payment";
                        return;
                    }
                    
                    // Update payment status
                    statusDiv.innerText = "Processing payment...";
                    
                    const user = this.authManager.currentUser;
                    const newPaidAmount = (invoice.paidAmount || 0) + payAmount;
                    const newStatus = newPaidAmount >= invoice.totalAmount ? 'paid' : 'partially_paid';
                    
                    // Update invoice in Firestore
                    const invoicePath = `${this.stateManager.getInvoicesPath(user.uid)}/${invoice.id}`;
                    await this.db.doc(invoicePath).update({
                        paidAmount: newPaidAmount,
                        status: newStatus,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Create payment record with hostellerId
                    const paymentData = {
                        amountPaid: payAmount,
                        dateTime: firebase.firestore.FieldValue.serverTimestamp(),
                        invoiceId: invoice.id,
                        invoiceMonth: `${invoice.month}, ${invoice.year}`,
                        paymentMethod: 'PayCode',
                        transactionCode: payCode,
                        hostellerId: hostellerData?.hostellerId || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    const paymentsPath = this.stateManager.getPaymentsPath(user.uid);
                    await this.db.collection(paymentsPath).add(paymentData);
                    
                    // Mark PayCode as used
                    await this.db.doc(payCodePath).update({
                        valid: false,
                        usedBy: user.uid,
                        usedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        usedForInvoice: invoice.id,
                        usedByHostellerId: hostellerData?.hostellerId || ''
                    });
                    
                    // Update local state
                    const updatedInvoice = {
                        ...invoice,
                        paidAmount: newPaidAmount,
                        status: newStatus
                    };
                    
                    this.stateManager.setSelectedInvoice(updatedInvoice);
                    
                    // Update invoices list
                    const invoices = this.stateManager.getInvoices();
                    const updatedInvoices = invoices.map(inv => 
                        inv.id === invoice.id ? updatedInvoice : inv
                    );
                    this.stateManager.setInvoices(updatedInvoices);
                    
                    // Update payments list
                    const payments = this.stateManager.getPayments();
                    payments.unshift({
                        id: Date.now().toString(),
                        ...paymentData
                    });
                    this.stateManager.setPayments(payments);
                    
                    // Show success message
                    statusDiv.innerHTML = `
                        <div class="flex items-center justify-center gap-2">
                            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                            <span>Payment Successful! Rs. ${payAmount.toLocaleString()} paid using PayCode: ${payCode}</span>
                        </div>
                    `;
                    statusDiv.classList.remove('bg-blue-50', 'text-blue-800', 'border-blue-200');
                    statusDiv.classList.add('bg-green-50', 'text-green-800', 'border-green-200');
                    
                    // Update UI
                    setTimeout(() => {
                        this.renderInvoiceDetail();
                    }, 2000);
                    
                } catch (error) {
                    console.error("Payment processing error:", error);
                    statusDiv.innerText = "Payment failed. Please try again or contact support.";
                    statusDiv.classList.remove('bg-blue-50', 'text-blue-800', 'border-blue-200');
                    statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                    payBtn.disabled = false;
                    payBtn.innerText = "Proceed to Payment";
                }
            }
            
            async submitRegistration() {
                const user = this.authManager.currentUser;
                if (!user || !this.db) {
                    this.showError("User not authenticated");
                    return;
                }
                
                const hostellerId = document.getElementById('reg-hosteller-id').value.trim();
                const name = document.getElementById('reg-name').value.trim();
                const phone = document.getElementById('reg-phone').value.trim();
                const address = document.getElementById('reg-address').value.trim();
                const dob = document.getElementById('reg-dob').value;
                const gender = document.getElementById('reg-gender').value;
                const joining = document.getElementById('reg-joining').value;
                const block = document.getElementById('reg-block').value;
                const room = document.getElementById('reg-room').value.trim();
                const bed = document.getElementById('reg-bed').value.trim();
                const image = document.getElementById('reg-image').value.trim();
                
                // Validate required fields
                if (!hostellerId || !name || !phone || !address) {
                    this.stateManager.addAlert('error', 'Please fill in all required fields (Hosteller ID, Name, Phone, Address)');
                    this.renderDashboard();
                    return;
                }
                
                // Validate hosteller ID uniqueness
                if (!this.stateManager.isHostellerIdAvailable(hostellerId)) {
                    this.stateManager.addAlert('error', 'Hosteller ID already taken. Please choose another one.');
                    this.renderRegistrationForm();
                    return;
                }
                
                try {
                    const registrationData = {
                        hostellerId,
                        name,
                        phoneNumber: phone,
                        address,
                        dateOfBirth: dob ? firebase.firestore.Timestamp.fromDate(new Date(dob)) : null,
                        gender,
                        dateOfJoining: joining ? firebase.firestore.Timestamp.fromDate(new Date(joining)) : firebase.firestore.Timestamp.now(),
                        blockId: block,
                        roomId: room,
                        bedId: bed,
                        profileImageUrl: image || 'https://via.placeholder.com/150x180?text=PHOTO',
                        status: 'pending',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Save to Firestore
                    const hostellerPath = this.stateManager.getHostellerPath(user.uid);
                    await this.db.doc(hostellerPath).set(registrationData);
                    
                    // Update hosteller IDs list
                    const hostellerIdsPath = this.stateManager.getHostellerIdsPath();
                    const idsDoc = await this.db.doc(hostellerIdsPath).get();
                    let currentIds = [];
                    if (idsDoc.exists) {
                        const idsData = idsDoc.data();
                        currentIds = idsData.hostellerId || [];
                    }
                    
                    // Add new hosteller ID to the list
                    currentIds.push(hostellerId);
                    await this.db.doc(hostellerIdsPath).set({
                        hostellerId: currentIds,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    
                    // Update cache and state
                    this.cacheManager.setHosteller(this.stateManager.currentYear, user.uid, registrationData);
                    this.stateManager.setHostellerData(registrationData);
                    
                    // Update available hosteller IDs in state
                    const updatedIds = new Set(this.stateManager.getAvailableHostellerIds());
                    updatedIds.add(hostellerId);
                    this.stateManager.setAvailableHostellerIds(Array.from(updatedIds));
                    
                    // Update cache
                    this.cacheManager.setHostellerIds(Array.from(updatedIds));
                    
                    // Show success message
                    this.stateManager.addAlert('success', 'Registration submitted successfully! Your application is pending warden approval.');
                    
                    // Show dashboard
                    this.renderDashboard();
                    
                } catch (error) {
                    console.error("Error submitting registration:", error);
                    this.stateManager.addAlert('error', 'Failed to submit registration. Please try again.');
                    this.renderDashboard();
                }
            }

            async processPayment() {
                const invoiceId = document.querySelector('.pay-invoice-button')?.dataset.invoiceId;
                const invoices = this.stateManager.getInvoices();
                const invoice = invoices.find(inv => inv.id === invoiceId);
                const hostellerData = this.stateManager.getHostellerData();

                    return;
                }
                
                const user = this.authManager.currentUser;
                if (!user || !this.db) {
                    this.showError("User not authenticated");
                    return;

                const amount = parseFloat(document.getElementById('payment-amount').value);
                const method = document.getElementById('payment-method').value;
                const transactionCode = document.getElementById('transaction-code').value.trim();
                const senderName = document.getElementById('sender-name').value.trim() || invoice.hostellerName;
                const paymentDate = document.getElementById('payment-date').value;
                
                // Validate inputs
                if (!amount || amount <= 0) {
                    this.stateManager.addAlert('error', 'Please enter a valid amount');
                    this.showPaymentForm(invoiceId);
                    return;
                }
                
                if (!method) {
                    this.stateManager.addAlert('error', 'Please select a payment method');
                    this.showPaymentForm(invoiceId);
                    return;
                }
                
                if (!transactionCode) {
                    this.stateManager.addAlert('error', 'Please enter a transaction code');
                    this.showPaymentForm(invoiceId);
                    return;
                }
                
                const balance = invoice.totalAmount - (invoice.paidAmount || 0);
                if (amount > balance) {
                    this.stateManager.addAlert('error', `Amount cannot exceed balance due (Rs. ${balance.toLocaleString()})`);
                    this.showPaymentForm(invoiceId);
                    return;
                }
                
                try {
                    // Create payment record with hostellerId
                    const paymentData = {
                        hostellerName: invoice.hostellerName,
                        hostellerId: hostellerData?.hostellerId || '',
                        phoneNumber: invoice.phoneNumber,
                        amountPaid: amount,
                        dateTime: paymentDate ? firebase.firestore.Timestamp.fromDate(new Date(paymentDate)) : firebase.firestore.Timestamp.now(),
                        senderName,
                        transactionCode,
                        invoiceMonth: `${invoice.month}, ${invoice.year}`,
                        paymentMethod: method,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Add payment to Firestore
                    const paymentsPath = this.stateManager.getPaymentsPath(user.uid);
                    await this.db.collection(paymentsPath).add(paymentData);
                    
                    // Update invoice
                    const newPaidAmount = (invoice.paidAmount || 0) + amount;
                    const newStatus = newPaidAmount === invoice.totalAmount ? 'paid' : 
                                     newPaidAmount > 0 ? 'partially_paid' : 'unpaid';
                    
                    const invoicePath = `${this.stateManager.getInvoicesPath(user.uid)}/${invoiceId}`;
                    await this.db.doc(invoicePath).update({
                        paidAmount: newPaidAmount,
                        status: newStatus,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Update cache
                    const updatedInvoice = { ...invoice, paidAmount: newPaidAmount, status: newStatus };
                    const updatedInvoices = invoices.map(inv => inv.id === invoiceId ? updatedInvoice : inv);
                    this.stateManager.setInvoices(updatedInvoices);
                    
                    // Add payment to cache
                    const payments = this.stateManager.getPayments();
                    payments.push({ id: Date.now().toString(), ...paymentData });
                    this.stateManager.setPayments(payments);
                    
                    // Show success message
                    this.stateManager.addAlert('success', `Payment of Rs. ${amount.toLocaleString()} processed successfully!`);
                    
                    // Return to invoices
                    this.renderInvoices();
                    
                } catch (error) {
                    console.error("Error processing payment:", error);
                    this.stateManager.addAlert('error', 'Failed to process payment. Please try again.');
                    this.showPaymentForm(invoiceId);
                }
            }
            
            handlePageNumberClick(page) {
                this.stateManager.currentInvoicePage = page;
                this.renderInvoices();
            }
            
            handleInvoicePaginationClick(direction) {
                if (direction === 'prev') {
                    if (this.stateManager.currentInvoicePage > 0) {
                        this.stateManager.currentInvoicePage--;
                        this.renderInvoices();
                    }
                } else if (direction === 'next') {
                    const totalPages = Math.ceil(this.stateManager.getInvoices().length / this.stateManager.itemsPerPage);
                    if (this.stateManager.currentInvoicePage < totalPages - 1) {
                        this.stateManager.currentInvoicePage++;
                        this.renderInvoices();
                    }
                }
            }
            
            handlePaymentPaginationClick(direction) {
                if (direction === 'prev') {
                    if (this.stateManager.currentPaymentPage > 0) {
                        this.stateManager.currentPaymentPage--;
                        this.renderPayments();
                    }
                } else if (direction === 'next') {
                    const totalPages = Math.ceil(this.stateManager.getPayments().length / this.stateManager.itemsPerPage);
                    if (this.stateManager.currentPaymentPage < totalPages - 1) {
                        this.stateManager.currentPaymentPage++;
                        this.renderPayments();
                    }
                }
            }
        }
        
        // ===== INITIALIZE APP =====
        let app;
        
        window.addEventListener('load', () => {
            app = new HostellerApp();
        });
        
        window.app = app;
    </script>
</body>
</html>
